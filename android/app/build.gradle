plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gius.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.gius.app"   // ⛔ אין לשנות — מזהה אחר הוא אפליקציה אחרת
        minSdk 21
        targetSdk 34
        // ⛔ versionCode לעולם אינו יורד — מספר נמוך ממה
        // שמותקן במכשיר חוסם את העדכון.
        // ⛔ קדם בכל שינוי ב-`android/` — ⚠️ השער אוכף את הקידום מול
        // קומיט הקידום האחרון, ⭐ וההיסטוריה ב-git ⛔ ולא כאן.
        versionCode 20
        versionName "16.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No dependencies, on purpose: yoman's shell needs androidx.webkit + androidx.core for
// its origin-restricted share bridge (navigator.share → FileProvider). gius's
// page has no navigator.share, the bridge is omitted entirely, and nothing androidx
// is used. See MainActivity.java.
