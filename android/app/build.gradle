plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gius.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.gius.app"   // must stay identical to the PWABuilder TWA it replaces
        minSdk 21
        targetSdk 34
        // The TWA that PWABuilder built is versionCode 1. Anything installing
        // over it has to be higher.
        // 3 = סבב 40 — המעטפת הוקשחה (setAllowFileAccess/setAllowContentAccess)
        // ויושרה ל-javadoc של שלוש האחיות. ⛔ כל שינוי תחת android/ מחייב
        // קידום כאן, ו-tools/test_round40_gradle.mjs אוכף זאת מול origin/main.
        versionCode 3
        versionName "3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
