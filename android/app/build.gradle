plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gius.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.gius.app"   // ⛔ אין לשנות (סבב 46ב) — מזהה אחר הוא אפליקציה אחרת
        minSdk 21
        targetSdk 34
        // ⛔ versionCode לעולם אינו יורד (סבב 46ב) — מספר נמוך ממה
        // שמותקן במכשיר חוסם את העדכון.
        // 3 = סבב 40 — המעטפת הוקשחה (setAllowFileAccess/setAllowContentAccess)
        // ויושרה ל-javadoc של שלוש האחיות.
        // 4 = סבב 41 — הסרת ה-FileProvider היתום וחילוץ המעטפת לתבנית משותפת.
        // ⛔ כל שינוי תחת android/ מחייב קידום כאן, ו-tools/test_round40_gradle.mjs
        // אוכף זאת מול origin/main.
        // 5 = סבב 45 — יישור `AndroidManifest.xml` (`configChanges` לסופרסט, והסרת ה-`<queries>` היתום)
        // ואכיפת חתימה על החלק המשותף של המניפסט ושל קובץ הבנייה.
        // 6 = סבב 46ב — היפוך ברירת המחדל בקובצי התצורה: חתימה חסרת-גשר
        // על המניפסט ועל קובץ הבנייה, וחתימה אחת לשני ה-workflows.
        versionCode 10
        versionName "10.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No dependencies, on purpose: yoman's shell needs androidx.webkit + androidx.core for
// its origin-restricted share bridge (navigator.share → FileProvider). gius's
// page has no navigator.share, the bridge is omitted entirely, and nothing androidx
// is used. See MainActivity.java.
