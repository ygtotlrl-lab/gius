name: Build APK

# Builds the native WebView shell in android/ (NOT a TWA — see CLAUDE.md) and
# signs it with the project's permanent key, signing/pwabuilder.keystore, which
# lives in the repo. No secret, no manual input: there is no way to accidentally
# produce an APK signed with a different key.
#
# Signing runs through signing/sign-apk.sh — the same script used by hand — so
# the fingerprint gate exists in exactly one place.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Build release APK (unsigned)
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Sign with the permanent key
        run: |
          # zipalign + apksigner live in build-tools, which is not on PATH by default.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          echo "$BT" >> "$GITHUB_PATH"
          export PATH="$BT:$PATH"
          ./signing/sign-apk.sh \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            gius.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: gius-apk
          path: gius.apk
          if-no-files-found: error
