name: Build APK

# Builds the native WebView shell in android/ (NOT a TWA — see CLAUDE.md) and
# signs it with the project's permanent key, signing/gius.keystore, which lives
# in the repo. No secret, no manual input: there is no way to accidentally
# produce an APK signed with a different key.
#
# ⚠️ המפתח הוחלף ב-2026-08-19 (סבב 39). APK שנבנה כאן ⛔ אינו מתקין על גבי
# התקנה שנחתמה במפתח הישן (pwabuilder.keystore) — נדרשת הסרה והתקנה מחדש.
#
# Signing runs through signing/sign-apk.sh — the same script used by hand — so
# the fingerprint gate exists in exactly one place.

on:
  workflow_dispatch:
  # Also build whenever the shell itself changes. Web-only changes (index.html,
  # sw.js, …) do NOT need a new APK — the app loads the live site — so those
  # paths are deliberately not listed here.
  #
  # This trigger is also what makes the workflow runnable before it reaches the
  # default branch: GitHub only offers "Run workflow" for files that already
  # exist on the default branch, while push events fire from any branch.
  push:
    paths:
      - 'android/**'
      - 'signing/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Build release APK (unsigned)
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Sign with the permanent key
        run: |
          # zipalign + apksigner live in build-tools, which is not on PATH by default.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          echo "$BT" >> "$GITHUB_PATH"
          export PATH="$BT:$PATH"
          ./signing/sign-apk.sh \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            gius.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: gius-apk
          path: gius.apk
          if-no-files-found: error
