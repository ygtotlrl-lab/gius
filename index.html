<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="ניהול תורמים, התחייבויות, תנועות ומשימות גיוס כספים.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="גיוס">
<title></title>
<script>
// חייב לרוץ לפני שכל כתובת יחסית מפוענחת — ה-SW מגיש את הקליפה גם בנתיבים עמוקים, וכל href יחסי נפתר עמוק מדי.
// בלי <base> בשורש, manifest.json, sw.js והאייקונים מחזירים 404 וה-worker נרשם ב-scope שגוי.
(function () {
  var p = location.pathname;
  var m = p.match(/^(.*?\/gius\/)/);
  var b = document.createElement('base');
  b.href = m ? m[1] : p.replace(/[^/]*$/, '');
  document.head.appendChild(b);
})();
</script>
<link rel="manifest" href="manifest.json">
<script src="app.config.js"></script>
<script src="core/boot.js"></script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.18a62cb8.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.ecf2e766.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.b2c47599.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="core/ui.css">
<link rel="stylesheet" href="core/chart.css">
<link rel="stylesheet" href="app/style.css">
</head>
<body>

<!-- המסגרת מתחילה חשופה ונחשפת רק עם מסך שמשתמש בה — לא בטעינה, בכניסה ובשגיאה. -->
<div id="app" class="is-bare">
  <header class="topbar"></header>
  <main id="view"><div class="view-loading" role="status" aria-label="טוען"><span class="view-spin"></span></div></main>
</div>

<div id="modal" class="veil">
  <div class="sheet ksave" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="sheet-hd">
      <h3 id="modal-title"></h3>
      <button class="x" data-act="modal-close" aria-label="סגירה">✕</button>
    </div>
    <div class="sheet-bd" id="modal-body"></div>
    <div class="sheet-ft" id="modal-foot"></div>
  </div>
</div>

<div id="ask" class="veil">
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="ask-title">
    <div class="sheet-hd"><h3 id="ask-title"></h3></div>
    <div class="sheet-bd" id="ask-body"></div>
    <div class="sheet-ft">
      <button data-act="ask-no">ביטול</button>
      <button class="danger" data-act="ask-yes" id="ask-yes">אישור</button>
    </div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>

<div id="updater">
  <div class="in">
    <span>🔄 גרסה חדשה זמינה</span>
    <button data-act="sw-apply">עדכן עכשיו</button>
    <button class="x" data-act="sw-dismiss" aria-label="סגור">✕</button>
  </div>
</div>

<script type="module" src="app/main.js"></script>
</body>
</html>
