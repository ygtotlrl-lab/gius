/* ══════════════════════════════════════════════════════════════════════════
   טביעת סיסמה — PBKDF2-SHA256 (סבב 23)
   ══════════════════════════════════════════════════════════════════════════
   **הבעיה שהסבב הזה בא לפתור.** `g_users` יורדת למראה המקומית בלי עמודת
   `password` (`strip`) — נכון ובטוח, ובדיוק בגללו **לא הייתה כאן כניסה
   אופליין כלל**: אין מול מה לאמת. מי שכבר נכנס פעם אחת המשיך לעבוד דרך
   `gius.session`, אבל מכשיר שמישהו אחר נכנס בו אחרון פשוט נעל בחוץ את
   כל השאר.

   **הפתרון — אותו מנגנון של hanhala-ruchanit (סבב 22 שם).** לכל משתמש
   נשמרים `pass_salt` + `pass_fp`: טביעת PBKDF2-SHA256 ב-`G_PASS_ITER` סיבובים,
   עם **מלח אקראי פר-משתמש**. הטביעה יורדת למכשיר; הסיסמה — לעולם לא.
   מכשיר שאבד חושף טביעות, לא סיסמאות, וההשהיה של 100k היא מה שהופך
   ניחוש-בכוח על העותק שבדיסק ליקר גם מול סיסמה בת שש ספרות (סבב 19).

   ⚠️ **`password` בענן נשאר טקסט גלוי — במכוון.** המנהל חייב לראות
   ולנהל סיסמאות מתוך «ניהול משתמשים», וזו החלטה מתועדת (כלל ברזל 9;
   ר' «מודל הסיסמאות» ב-CLAUDE.md). הטביעה **אינה מחליפה** אותו — היא
   נוספת לצידו, ותפקידה היחיד הוא האימות המקומי. ⛔ **אין לגזור מכאן
   מסקנה שהמסד עבר להצפנה.**

   ⛔ **`password` לעולם לא נכתב ל-localStorage.** `strip: ['password']`
   נאכף עכשיו בשלוש נקודות ולא באחת: במשיכה (`syncPull`), בכל כתיבה
   מקומית (`upsertLocal`), ובשער הדיסק עצמו (`mirrorSave`). ר' `stripCols`.
   ══════════════════════════════════════════════════════════════════════════ */
var G_PASS_ITER = 100000;
// המלח הנשמר הוא אקראי פר-משתמש; הקידומת מוסיפה הפרדת-הקשר, כך שטבלה
// מחושבת מראש עבור אפליקציה אחרת על אותו origin אינה תקפה כאן. ה-origin
// `ygtotlrl-lab.github.io` משותף לארבע האפליקציות — זו לא הערה תיאורטית.
var G_PASS_CTX = 'gius/g_users/v1/';

// 16 בתים אקראיים כ-hex. מחזירה null כשאין crypto — והקורא **נכשל סגור**:
// לא נשמרת טביעה, ו**גם לא נשארת טביעה ישנה** (ר' `passFields`).
function gRandSalt() {
  try {
    if (typeof crypto === 'undefined' || !crypto || !crypto.getRandomValues) return null;
    var b = new Uint8Array(16);
    crypto.getRandomValues(b);
    var h = '';
    for (var i = 0; i < b.length; i++) h += (b[i] + 0x100).toString(16).slice(1);
    return h;
  } catch (e) { return null; }
}

// PBKDF2-SHA256 → hex בן 64 תווים. מחזירה null כשאין `crypto.subtle`
// (הקשר לא-מאובטח / WebView ישן) — וגם כאן הקורא נכשל סגור.
function gPassFp(pass, salt) {
  try {
    if (!salt) return Promise.resolve(null);
    if (typeof crypto === 'undefined' || !crypto || !crypto.subtle || !crypto.subtle.importKey) {
      return Promise.resolve(null);
    }
    var enc = new TextEncoder();
    return Promise.resolve(
      crypto.subtle.importKey('raw', enc.encode(String(pass == null ? '' : pass)), 'PBKDF2', false, ['deriveBits'])
    ).then(function (key) {
      return crypto.subtle.deriveBits(
        { name: 'PBKDF2', salt: enc.encode(G_PASS_CTX + String(salt)), iterations: G_PASS_ITER, hash: 'SHA-256' },
        key, 256);
    }).then(function (bits) {
      var b = new Uint8Array(bits), h = '';
      for (var i = 0; i < b.length; i++) h += (b[i] + 0x100).toString(16).slice(1);
      return h;
    }, function (e) { console.warn('[pass] גזירת טביעה נכשלה', e); return null; });
  } catch (e) { console.warn('[pass] גזירת טביעה נכשלה', e); return Promise.resolve(null); }
}

// גוזרת מלח+טביעה לסיסמה חדשה. מחזירה Promise של {salt, fp} או null בכישלון.
function gMakePassFp(pass) {
  var salt = gRandSalt();
  if (!salt) return Promise.resolve(null);
  return gPassFp(pass, salt).then(function (fp) { return fp ? { salt: salt, fp: fp } : null; });
}

// זיהוי תשובת שרת שאומרת "העמודות עדיין לא קיימות" — כלומר `0003_pass_fp.sql`
// טרם הורצה. ⚠️ בלי הבדיקה הזו כל שמירת משתמש הייתה **נכשלת לגמרי** בחלון
// שבין דחיפת הקוד להרצת המיגרציה. ר' הנפילה-חזרה ב-`writeUser`.
function gIsMissingFpCol(err) {
  var m = ((err && (err.message || err.details || err.hint || err.code || '')) + '').toLowerCase();
  return m.indexOf('pass_fp') !== -1 || m.indexOf('pass_salt') !== -1;
}

/* ---- כניסה אופליין: אימות מול הטביעה שבמראה ---- */
// ⚠️ שלוש הודעות **פרטיות ל-gius**, ובכוונה מחוץ לבלוק ההודעות המשותף
// (`MSG_OFFLINE`/`MSG_SAVED`/`MSG_BAD_LOGIN`/`MSG_SYNC_BACK`): הבלוק ההוא
// מוכרז זהה בארבעת הפרויקטים, והוספת קבוע אליו כאן בלבד הייתה יוצרת בדיוק
// את הסחיפה שכלל ברזל 8 בא למנוע. אותו שיקול בדיוק כמו `MSG_PASS_SIX` (סבב 19).
//
// ⛔ **אין לאחד אותן עם `MSG_BAD_LOGIN`.** «סיסמה שגויה» על מצב שאינו סיסמה
// שגויה הוא כשל שקט: הוא מוביל את המשתמש להקליד שוב ושוב סיסמה נכונה
// לחלוטין, במקום לומר לו את הדבר היחיד שיפתור — חיבור אחד.
var MSG_OFF_UNKNOWN   = '📴 אין חיבור — המשתמש הזה אינו בעותק המקומי שבמכשיר. נדרש חיבור לאינטרנט פעם אחת';
var MSG_OFF_NO_FP     = '📴 אין חיבור — המשתמש הזה טרם הוכן לכניסה ללא רשת. נדרש חיבור לאינטרנט פעם אחת';
var MSG_OFF_NO_CRYPTO = '❌ הדפדפן אינו תומך בהצפנה הנדרשת לכניסה ללא רשת';
// ⚠️ כתיבת משתמש היא החריג היחיד לכתיבה מקומית-תחילה (כלל ברזל 6, סעיף 3):
// היא חייבת להגיע לענן, אחרת הטביעה לא תגיע לשאר המכשירים והמשתמש החדש לא
// יוכל להיכנס בהם — לא אופליין, ואפילו לא אונליין. ר' `writeUser`.
var MSG_OFF_USER_WRITE = '📴 אין חיבור — ניהול משתמשים דורש חיבור לאינטרנט';

// אימות אופליין מול הטביעה. מחזירה Promise של אחת מארבע:
// 'ok' · 'bad' (סיסמה שגויה או משתמש מושבת) · 'no-fp' (אין טביעה לרשומה)
// · 'no-crypto' (הדפדפן לא תומך). ⚠️ שלושת הכישלונות **אינם** אותו דבר,
// ולכן אינם מקבלים אותה הודעה — ר' ההערה שמעל ההודעות.
function gVerifyOffline(cu, pass) {
  if (!cu || cu.active !== true) return Promise.resolve('bad');
  if (!cu.pass_salt || !cu.pass_fp) return Promise.resolve('no-fp');
  return gPassFp(pass, cu.pass_salt).then(function (fp) {
    if (!fp) return 'no-crypto';
    return (fp === cu.pass_fp) ? 'ok' : 'bad';
  });
}

// המשתמש מהמראה לפי שם משתמש. המראה מחזיקה גם משתמשים מושבתים (היא עותק
// מלא של הטבלה), ולכן `active` נבדק ב-`gVerifyOffline` ולא כאן.
function mirrorUserByName(username) {
  var arr = MIRROR.g_users || [];
  for (var i = 0; i < arr.length; i++) {
    if (arr[i] && String(arr[i].username) === String(username)) return arr[i];
  }
  return null;
}

/* ---- השלמת טביעות למשתמשים קיימים (מסלול חד-פעמי) ---- */
// רץ **רק** בכניסה מקוונת של **בעלים**; אחרת מדלג בשקט. מנהל לא יריץ עדכון
// על שורות של אחרים, ומכשיר אופליין לא ינסה בכלל. אין כאן יצירת סוד — רק
// גזירת טביעה מהסיסמה שכבר יושבת בענן.
// ⚠️ טבלה בלי העמודות (המיגרציה טרם הורצה) מחזירה שגיאה שנבלעת — זהו אחד
// ממסלולי הדילוג השקטים המכוונים.
// ---- ⛔ השלמת הטביעות הוסרה (סבב 40) ----
// `gBackfillPassFp` גזרה טביעה למשתמש שאין לו אחת, מתוך הסיסמה הגלויה
// שבענן. ⛔ היא הוסרה מפני ש**אין לה עוד מה לעשות**, וזה נמדד ולא הונח:
// המשתמש היחיד ב-`g_users` מחזיק `pass_salt` ו-`pass_fp` באורך 64 (נמדד
// ב-`SELECT` בלבד, 2026-08-19). ⛔ ומעבר לכך היא הייתה **הקורא האחרון של
// הסיסמה הגלויה לצורך גזירה** — המסלול היחיד שהיה נשבר ברגע שהעמודה
// תימחק. משתמש חדש מקבל טביעה ב-`writeUser`, ליד הסיסמה.

function markSVG(cls) {
  return '<svg class="' + cls + '" viewBox="0 0 100 100" aria-hidden="true">' +
    '<rect x="2" y="2" width="96" height="96" rx="24" fill="var(--brand)"/>' +
    '<circle cx="50" cy="50" r="26" fill="none" stroke="#fff" stroke-width="8"/>' +
    '<circle cx="50" cy="50" r="10" fill="#fff"/></svg>';
}

function renderLogin() {
  $('#app').innerHTML =
    '<div class="auth"><form class="auth-card" id="login-form">' +
      markSVG('mark') +
      '<h1>גיוס</h1>' +
      '<div class="sub">ניהול גיוס כספים</div>' +
      '<label class="fld"><span>שם משתמש</span>' +
        '<input class="inp" id="lg-user" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>' +
      '<label class="fld"><span>סיסמה</span>' +
        '<input class="inp" id="lg-pass" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" required></label>' +
      '<button class="btn block" type="submit" id="lg-btn">כניסה</button>' +
      '<div class="auth-err" id="lg-err"></div>' +
    '</form></div>';

  $('#login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    doLogin();
  });
  var u = $('#lg-user');
  if (u) u.focus();
}

function loginError(msg) {
  var el = $('#lg-err');
  el.textContent = msg;
  el.classList.add('show');
}

function doLogin() {
  var username = val('lg-user');
  var password = $('#lg-pass') ? $('#lg-pass').value : '';
  var btn = $('#lg-btn');
  $('#lg-err').classList.remove('show');
  if (!username || !password) { loginError('נא למלא שם משתמש וסיסמה'); return; }

  // ⚠️ **בלי רשת — אימות מול הטביעה שבמראה** (סבב 23). עד הסבב הזה השורה
  //    הזו החזירה `MSG_OFFLINE` וזהו: המראה לא החזיקה סיסמאות ולא היה מול
  //    מה לאמת, ולכן מכשיר שמישהו אחר נכנס בו אחרון נעל בחוץ את כל השאר.
  //    ⛔ הסיסמה עצמה עדיין **אינה** יורדת לדיסק — רק `pass_salt`+`pass_fp`.
  if (!navigator.onLine) { doLoginOffline(username, password, btn); return; }
  busy(btn, true);
  withTimeout(sb.from('g_users').select('*').eq('username', username).limit(1))
    .then(ok)
    .then(function (rows) {
      var u = rows && rows[0];
      if (!u) throw new Error('bad');
      if (!u.active) throw new Error('inactive');
      // ⭐ סבב 40 — ההשוואה היא מול **הטביעה** ולא מול הטקסט הגלוי. עד
      // הסבב הזה ישב כאן `String(u.password) !== String(password)`, כלומר
      // `g_users.password` הייתה **המפתח שפותח את הכניסה** — וה-RLS כאן
      // הוא `using (true)` ומפתח ה-anon יושב ב-`index.html` הציבורי.
      // ⛔ ההחלטה «סיסמה גלויה בענן» בוטלה ב-2026-08-19 בהחלטת המנהל.
      return gVerifyOffline(u, password).then(function (v) {
        if (v === 'no-crypto') throw new Error('no-crypto');
        if (v !== 'ok') throw new Error('bad');
        return u;
      });
    })
    .then(function (u) {
      state.user = { id: u.id, username: u.username, full_name: u.full_name, role: u.role };
      // ⭐ סבב 26 — הנתיב החלקי. השורה הזו כבר בידינו מהכניסה, ולכן אין
      // סיבה שהחלפת משתמש במכשיר תמתין למשיכה מלאה מהענן כדי שהוא ייכנס
      // למראה. ⚠️ **אחרי `state.user`, לא לפניו** — התיקון של סבב 23:
      // רענון שקודם לקביעת המשתמש הפעיל עובד על מצב שעוד לא השתנה.
      // ⛔ `u` מכיל `password` (ה-`select` הוא `*`) — `usersCacheSave`
      // מסננת אותו, וזו בדיוק הסיבה שהיא הנתיב היחיד.
      try { usersCacheSave(u); } catch (e) { console.warn('[users] cache', e); }
      return boot();
    })
    .catch(function (e) {
      busy(btn, false);
      if (e && e.message === 'bad') loginError(MSG_BAD_LOGIN);
      else if (e && e.message === 'inactive') loginError('המשתמש מושבת. פנו לבעלים.');
      else loginError(isNetErr(e) ? MSG_OFFLINE : ('שגיאת התחברות: ' + ((e && e.message) || 'לא ידוע')));
    });
}

/* כניסה ללא רשת — אימות מול `pass_fp` שבמראה (סבב 23).
   ⚠️ **ארבעה מצבים, ארבע הודעות שונות.** «המשתמש אינו בעותק המקומי»
   ו«אין לו טביעה» **אינם** אומרים שהסיסמה שגויה — הם אומרים שאין כאן במה
   לאמת אותה. הודעת «שם משתמש או סיסמה שגויים» במצבים האלה היא שקר שמוביל
   את המשתמש לנסות שוב ושוב סיסמה נכונה לחלוטין. */
function doLoginOffline(username, password, btn) {
  var cu = mirrorUserByName(username);
  if (!cu) { loginError(MSG_OFF_UNKNOWN); return Promise.resolve(); }
  busy(btn, true);
  // מחזירה את ה-Promise — הכניסה אסינכרונית (גזירת PBKDF2), והבדיקות
  // חייבות משהו להמתין לו. אף קורא בקוד אינו נשען על הערך המוחזר.
  return gVerifyOffline(cu, password).then(function (verdict) {
    busy(btn, false);
    if (verdict === 'no-fp')     { loginError(MSG_OFF_NO_FP); return; }
    if (verdict === 'no-crypto') { loginError(MSG_OFF_NO_CRYPTO); return; }
    if (verdict !== 'ok')        { loginError(MSG_BAD_LOGIN); return; }
    state.user = { id: cu.id, username: cu.username, full_name: cu.full_name, role: cu.role };
    boot();
    toast('📴 כניסה במצב אופליין — הנתונים יסונכרנו כשהרשת תחזור', 'ok');
  }, function (e) {
    busy(btn, false);
    console.warn('[login] אימות אופליין נכשל', e);
    loginError(MSG_OFF_NO_CRYPTO);
  });
}

function logout() {
  lkStop();
  sessClear();
  state.screen = 'home';
  state.donorId = null;
  renderLogin();
}

/* ══════════════════════════════════════════════════════════════════════════
   מעטפת המסך — טאבים, רינדור ראשי וניווט
   ══════════════════════════════════════════════════════════════════════════ */
var TABS = [
  { id: 'home', ic: '🏠', label: 'בית' },
  { id: 'donors', ic: '🙋', label: 'תורמים' },
  { id: 'pledges', ic: '🤝', label: 'התחייבויות' },
  { id: 'tasks', ic: '🗂️', label: 'משימות' },
  { id: 'settings', ic: '⚙️', label: 'הגדרות' }
];

function renderShell() {
  var tabs = TABS.map(function (t) {
    return '<button data-act="tab" data-tab="' + t.id + '" class="' + (state.screen === t.id ? 'on' : '') + '">' +
      '<span class="ic">' + t.ic + '</span><span>' + t.label + '</span></button>';
  }).join('');

  $('#app').innerHTML =
    '<header class="topbar">' +
      '<div class="brand">' + markSVG('') + '<span>גיוס<small> · ניהול גיוס כספים</small></span></div>' +
      '<nav class="tabbar">' + tabs + '</nav>' +
      '<div class="who"><div style="text-align:end"><div class="nm">' + esc(state.user.full_name) + '</div>' +
        '<span class="role">' + (isOwner() ? 'בעלים' : 'מנהל') + '</span></div>' +
        '<button class="btn ghost sm" data-act="my-pass" title="שינוי סיסמה">🔑</button>' +
        '<button class="btn ghost sm" data-act="logout">יציאה</button></div>' +
    '</header>' +
    '<main id="view"></main>' +
    (state.screen === 'settings' ? '' : '<button class="fab" data-act="fab" aria-label="הוספה">＋</button>');
}

function render() {
  if (!state.user) { renderLogin(); return; }
  renderShell();
  var view = $('#view');
  if (state.screen === 'home') view.innerHTML = viewHome();
  else if (state.screen === 'donors') view.innerHTML = state.donorId ? viewDonorCard() : viewDonors();
  else if (state.screen === 'pledges') view.innerHTML = viewPledges();
  else if (state.screen === 'tasks') { view.innerHTML = viewTasks(); wireKanban(); }
  else if (state.screen === 'settings') { view.innerHTML = viewSettings(); statusAreaMount(); bkStatusMount(); hwRestoreMount(); }

  // Only jump to the top when the user actually moved somewhere. Re-rendering
  // in place (a saved row, a dragged task) must not throw away their scroll.
  // ⚠️ זה אינו שיפור נוחות בלבד — `render()` נקראת גם מ-`syncNow` (כל 5
  // שניות) ומ-`pendDrawFlush` (סבב 16), כלומר בלי המפתח הזה המסך היה קופץ
  // לראש מעצמו באמצע עבודה, בלי שהמשתמש נגע בכלום.
  // ⛔ אין להחליף ב-scroll ללא תנאי.
  var key = state.screen + '/' + (state.donorId || '');
  if (key !== lastViewKey) { window.scrollTo(0, 0); lastViewKey = key; }
}
var lastViewKey = '';

// ⛔ **כפתור ההגדרות מוצג לכולם, וזו החלטת מדיניות — לא באג.** מנהל שלוחץ
// מקבל טוסט «אין הרשאה» ואינו מנווט. כפתור שנעלם משאיר את איש הצוות בלי
// לדעת שהמסך קיים, ולכן גם בלי לדעת שאפשר לבקש גישה. ⛔ אין «לתקן» את זה
// ע"י הסתרת הטאב ב-`TABS`. **האכיפה אינה נחלשת:** היא כאן, והיא חוזרת
// כשכבה שנייה ב-`viewSettings()` עצמה למקרה שמגיעים למסך בדרך אחרת.
// אותה החלטה בדיוק תועדה ב-hanhala-ruchanit (סבב 6 שם).
function go(screen) {
  if (screen === 'settings' && !isOwner()) {
    toast('אין הרשאה — מסך ההגדרות פתוח לבעלים בלבד', 'bad');
    return;
  }
  state.screen = screen;
  state.donorId = null;
  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   מסך הבית — יעד החודש, פילוחים, ו«מה שלי היום»
   ══════════════════════════════════════════════════════════════════════════
   כל המספרים כאן נגזרים בזמן ריצה מ-`state.txns` ומ-`state.targets` (ר'
   פרק הנגזרות למעלה). ⚠️ הסף בהודעת המומנטום הוא «גדול או שווה» — הטבלה
   ב-CLAUDE.md היא מקור האמת, ושינוי כאן מחייב עדכון שם.
   ══════════════════════════════════════════════════════════════════════════ */
function momentumMsg(pct) {
  if (pct >= 100) return '🏆 עמדנו ביעד!';
  if (pct >= 75) return '⚡ כמעט שם — דחיפה אחרונה!';
  if (pct >= 50) return '🔥 מעל המחצית — ממשיכים!';
  if (pct >= 25) return '💪 רבע דרך — מומנטום!';
  return '🚀 מתחילים!';
}

function ringHTML(pct) {
  var R = 52, C = 2 * Math.PI * R;
  var dash = C * Math.max(0, Math.min(100, pct)) / 100;
  return '<div class="ring-wrap">' +
    '<svg class="ring" viewBox="0 0 120 120">' +
      '<circle class="bg" cx="60" cy="60" r="' + R + '"></circle>' +
      '<circle class="fg" cx="60" cy="60" r="' + R + '" stroke-dasharray="' + dash.toFixed(1) + ' ' + C.toFixed(1) + '"></circle>' +
    '</svg>' +
    '<div class="ring-val"><b>' + Math.round(pct) + '%</b><span>מהיעד</span></div>' +
  '</div>';
}

function breakdownTable(rows, label, total) {
  if (!rows.length) return emptyBox('📊', 'אין תנועות בחודש זה');
  var h = '<div class="tw"><table><thead><tr><th>' + esc(label) + '</th><th class="num">תנועות</th>' +
    '<th class="num">סכום</th><th class="num">חלק</th></tr></thead><tbody>';
  rows.forEach(function (r) {
    var share = total > 0 ? (r.total / total * 100) : 0;
    h += '<tr><td>' + esc(r.key) + '</td>' +
      '<td class="num">' + r.count + '</td>' +
      '<td class="num">' + ils(r.total) + '</td>' +
      '<td class="num" style="min-width:76px"><div class="bar"><i style="width:' + share.toFixed(1) + '%"></i></div>' +
      '<small style="color:var(--muted)">' + share.toFixed(0) + '%</small></td></tr>';
  });
  h += '</tbody><tfoot><tr><td>סה"כ</td><td class="num">' + sum(rows, function (r) { return r.count; }) +
    '</td><td class="num">' + ils(total) + '</td><td></td></tr></tfoot></table></div>';
  return h;
}

function groupBy(list, pick, fallback) {
  var map = {}, order = [];
  list.forEach(function (item) {
    var k = String(pick(item) || '').trim() || fallback;
    if (!map[k]) { map[k] = { key: k, total: 0, count: 0 }; order.push(k); }
    map[k].total += num(item.amount);
    map[k].count++;
  });
  return order.map(function (k) { return map[k]; })
    .sort(function (a, b) { return b.total - a.total; });
}

function viewHome() {
  var m = state.month;
  var txns = monthTxns(m);
  var collected = sum(txns, function (t) { return t.amount; });
  var target = targetFor(m);
  var remaining = Math.max(0, target - collected);
  var pct = target > 0 ? (collected / target * 100) : 0;

  var h = '';

  /* ---- month state card ---- */
  h += '<section class="card">' +
    '<div class="monthnav">' +
      '<button class="btn ghost sm" data-act="month" data-d="-1" aria-label="חודש קודם">›</button>' +
      '<b>' + esc(monthLabel(m)) + '</b>' +
      '<button class="btn ghost sm" data-act="month" data-d="1" aria-label="חודש הבא">‹</button>' +
      '<span class="grow"></span>' +
      (isOwner() ? '<button class="btn soft sm" data-act="target-set" data-month="' + m + '">קביעת יעד</button>' : '') +
    '</div>' +
    '<div class="hero">' + ringHTML(pct) +
      '<div class="hero-stats">' +
        '<div class="stat"><span>יעד החודש</span><b>' + (target > 0 ? ils(target) : '— לא הוגדר —') + '</b></div>' +
        '<div class="stat ok"><span>נגבה</span><b>' + ils(collected) + '</b></div>' +
        '<div class="stat warn"><span>נותר</span><b>' + (target > 0 ? ils(remaining) : '—') + '</b></div>' +
        '<div class="stat"><span>תנועות</span><b>' + txns.length + '</b></div>' +
      '</div>' +
    '</div>' +
    '<div class="momentum">' + momentumMsg(target > 0 ? pct : 0) + '</div>' +
  '</section>';

  /* ---- breakdowns ---- */
  h += '<div class="grid2">' +
    '<section class="card"><h2>📊 פילוח לפי סעיף</h2>' +
      breakdownTable(groupBy(txns, function (t) { return t.category; }, 'ללא סעיף'), 'סעיף', collected) +
    '</section>' +
    '<section class="card"><h2>🎖️ פילוח לפי שגריר</h2>' +
      breakdownTable(groupBy(txns, function (t) { return t.agent; }, 'ללא שגריר'), 'שגריר', collected) +
    '</section>' +
  '</div>';

  /* ---- my day ---- */
  var me = state.user.full_name;
  var myTasks = state.tasks.filter(function (t) { return t.assignee === me && t.stage !== 'השלמה'; });
  var myPledges = state.pledges.filter(function (p) {
    return p.agent === me && collectedForPledge(p.id) + EPS < num(p.amount);
  });

  h += '<section class="card"><h2>☀️ מה שלי היום<span class="cnt">' + (myTasks.length + myPledges.length) + '</span></h2>';
  if (!myTasks.length && !myPledges.length) {
    h += emptyBox('✨', 'אין משימות פתוחות או התחייבויות ממתינות על שמך');
  } else {
    if (myTasks.length) {
      h += '<div style="font-size:12.5px;font-weight:700;color:var(--muted);margin:2px 0 4px">משימות פתוחות</div>';
      myTasks.forEach(function (t) {
        var late = t.due_date && t.due_date < todayISO();
        h += '<div class="row" data-act="task-open" data-id="' + t.id + '">' +
          '<div class="av">🗂️</div><div class="main"><b>' + esc(t.title) + '</b>' +
          '<small>' + esc(t.domain || 'ללא תחום') + ' · ' + esc(t.stage) + '</small></div>' +
          '<div class="end"><span class="badge ' + (late ? 'bad' : '') + '">' + heDate(t.due_date) + '</span></div></div>';
      });
    }
    if (myPledges.length) {
      h += '<div style="font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 4px">התחייבויות שטרם נגבו במלואן</div>';
      myPledges.forEach(function (p) {
        var c = collectedForPledge(p.id);
        var left = Math.max(0, num(p.amount) - c);
        h += '<div class="row" data-act="donor-open" data-id="' + p.donor_id + '">' +
          '<div class="av">🤝</div><div class="main"><b>' + esc(donorName(p.donor_id)) + '</b>' +
          '<small>' + esc(p.cause || 'ללא עילה') + ' · ' + ils(p.amount) + '</small></div>' +
          '<div class="end">' + ils(left) + '<small>נותר</small></div></div>';
      });
    }
  }
  h += '</section>';
  return h;
}

/* ══════════════════════════════════════════════════════════════════════════
   תורמים — רשימה, חיפוש וכרטיס תורם
   ══════════════════════════════════════════════════════════════════════════ */
// החיפוש הוא על שם, טלפון ושגריר. ⚠️ הטלפון **אינו** מומר לאותיות קטנות —
// זו השוואת ספרות, ו-`toLowerCase` עליה רק מבזבז.
function donorMatches(q) {
  q = String(q || '').trim().toLowerCase();
  var list = state.donors.slice().sort(byName);
  if (!q) return list;
  return list.filter(function (d) {
    return String(d.name || '').toLowerCase().indexOf(q) >= 0 ||
      String(d.phone || '').indexOf(q) >= 0 ||
      String(d.agent || '').toLowerCase().indexOf(q) >= 0;
  });
}

function donorRowsHTML(list) {
  if (!list.length) return emptyBox('🙋', state.donors.length ? 'אין תורם התואם את החיפוש' : 'עדיין אין תורמים');
  return list.map(function (d) {
    var given = sum(txnsOfDonor(d.id), function (t) { return t.amount; });
    return '<div class="row" data-act="donor-open" data-id="' + d.id + '">' +
      '<div class="av' + (d.is_vip ? ' vip' : '') + '">' + esc(initials(d.name)) + '</div>' +
      '<div class="main"><b>' + esc(d.name) + (d.is_vip ? ' <span class="badge gold">VIP</span>' : '') + pendTag(pendRowKey('g_donors', d.id)) + '</b>' +
      '<small>' + esc(d.phone || 'ללא טלפון') + (d.agent ? ' · ' + esc(d.agent) : '') + '</small></div>' +
      '<div class="end">' + ils(given) + '<small>נתן</small></div></div>';
  }).join('');
}

function viewDonors() {
  var list = donorMatches(state.donorSearch);
  return '<section class="card">' +
    '<div class="addrow" style="margin:0 0 10px">' +
      '<input class="inp" id="donor-q" data-inp="donor-q" placeholder="חיפוש לפי שם, טלפון או שגריר…" value="' + esc(state.donorSearch) + '">' +

/* ══════════════════════════════════════════════════════════════════════════
   התחייבויות — מסננים, טבלה וסיכומים
   ══════════════════════════════════════════════════════════════════════════ */
function filteredPledges() {
  var f = state.pf;
  return state.pledges.filter(function (p) {
    if (f.agent && p.agent !== f.agent) return false;
    if (f.cause && p.cause !== f.cause) return false;
    if (f.status && pledgeStatus(p) !== f.status) return false;
    if (f.from && (!p.due_date || p.due_date < f.from)) return false;
    if (f.to && (!p.due_date || p.due_date > f.to)) return false;
    return true;
  });
}

function pledgeTableHTML(list) {
  if (!list.length) return emptyBox('🤝', state.pledges.length ? 'אין התחייבות התואמת את המסננים' : 'עדיין אין התחייבויות');
  var h = '<div class="tw"><table><thead><tr><th>תורם</th><th>עילה</th><th>שגריר</th>' +
    '<th class="num">סכום</th><th class="num">נגבה</th><th class="num">נותר</th>' +
    '<th>תאריך יעד</th><th>סטטוס</th><th></th></tr></thead><tbody>';
  list.forEach(function (p) {
    var c = collectedForPledge(p.id), st = pledgeStatus(p);
    var late = p.due_date && p.due_date < todayISO() && st !== 'בוצע';
    h += '<tr class="click" data-act="donor-open" data-id="' + p.donor_id + '">' +
      '<td><b>' + esc(donorName(p.donor_id)) + '</b>' + pendTag(pendRowKey('g_pledges', p.id)) + '</td>' +
      '<td>' + esc(p.cause || '—') + '</td>' +
      '<td>' + esc(p.agent || '—') + '</td>' +
      '<td class="num">' + ils(p.amount) + '</td>' +
      '<td class="num">' + ils(c) + '</td>' +
      '<td class="num">' + ils(Math.max(0, num(p.amount) - c)) + '</td>' +
      '<td>' + (late ? '<span class="badge bad">' + heDate(p.due_date) + '</span>' : heDate(p.due_date)) + '</td>' +
      '<td><span class="badge ' + statusClass(st) + '">' + st + '</span></td>' +
      '<td><button class="btn ghost xs" data-act="pledge-edit" data-id="' + p.id + '">עריכה</button> ' +
        '<button class="btn danger xs" data-act="pledge-del" data-id="' + p.id + '">מחיקה</button></td></tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

function pledgeTotalsHTML(list) {

    '<div class="stat"><span>סה"כ התחייבויות</span><b>' + ils(pledged) + '</b></div>' +
    '<div class="stat ok"><span>נגבה</span><b>' + ils(got) + '</b></div>' +
    '<div class="stat warn"><span>נותר</span><b>' + ils(Math.max(0, pledged - got)) + '</b></div>' +
    '<div class="stat"><span>מספר התחייבויות</span><b>' + list.length + '</b></div>' +
  '</div>';
}

// ⚠️ **רינדור חלקי במכוון — לא `render()`.** המסננים הם אלמנטים חיים במסך,

// בחירה. מוחלפים רק שני האזורים שהמסננים משפיעים עליהם.

/* ══════════════════════════════════════════════════════════════════════════
   משימות — לוח קנבן עם גרירה
   ══════════════════════════════════════════════════════════════════════════
   ⚠️ `wireKanban()` נקראת מ-`render()` **אחרי** הזרקת ה-HTML, כי המאזינים
   נקשרים לאלמנטים שנוצרו זה עתה. כל רינדור מחדש מחייב קריאה חוזרת — ר'
   הענף של `'tasks'` ב-`render()`.
   ⛔ אין להעביר את הקשירה לטעינת הדף (נרשם בסבב 27) — ה-HTML של הלוח
   נוצר מחדש בכל רינדור, ולכן מאזין שנקשר פעם אחת בטעינה מאבד את היעד.
   ══════════════════════════════════════════════════════════════════════════ */
function viewTasks() {
  var h = '<section class="card" style="margin-bottom:14px">' +
    '<h2>🗂️ משימות<span class="cnt">' + state.tasks.length + '</span>' +
    '<span class="sp"><button class="btn sm" data-act="task-new">＋ משימה</button></span></h2>' +
    '<div style="color:var(--muted);font-size:13px">גררו כרטיס בין העמודות, או שנו שלב בבורר שבתוך הכרטיס.</div>' +
  '</section><div class="kb">';

  STAGES.forEach(function (st) {
    var list = state.tasks.filter(function (t) { return t.stage === st; });
    h += '<div class="kcol" data-stage="' + esc(st) + '">' +
      '<h3><span class="dot" style="background:' + STAGE_COLOR[st] + '"></span>' + esc(st) +
      '<span class="cnt">' + list.length + '</span></h3>';
    if (!list.length) h += '<div class="empty" style="padding:14px 6px;font-size:13px">אין משימות</div>';
    list.forEach(function (t) {
      var late = t.due_date && t.due_date < todayISO() && t.stage !== 'השלמה';
      h += '<div class="kcard" data-id="' + t.id + '">' +
        '<b>' + esc(t.title) + '</b>' + pendTag(pendRowKey('g_tasks', t.id)) +
        '<div class="meta">' +
          (t.assignee ? '<span class="badge brand">' + esc(t.assignee) + '</span>' : '') +
          (t.domain ? '<span class="badge">' + esc(t.domain) + '</span>' : '') +
          (t.due_date ? '<span class="badge ' + (late ? 'bad' : '') + '">' + heDate(t.due_date) + '</span>' : '') +
          (t.log ? '<span class="logdot" title="יש רישום ביומן">✎</span>' : '') +
        '</div>' +
        '<div class="ft">' +
          '<select data-inp="stage" data-id="' + t.id + '">' +
            STAGES.map(function (s) {
              return '<option value="' + esc(s) + '"' + (s === t.stage ? ' selected' : '') + '>' + esc(s) + '</option>';
            }).join('') +
          '</select>' +
          '<button class="btn ghost xs" data-act="task-open" data-id="' + t.id + '">פתיחה</button>' +
        '</div>' +
      '</div>';
    });
    h += '</div>';
  });
  return h + '</div>';
}

function wireKanban() {
  $$('.kcard').forEach(function (c) {
    c.draggable = true;
    c.addEventListener('dragstart', function (e) {
      e.dataTransfer.setData('text/plain', c.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      c.classList.add('dragging');
    });
    c.addEventListener('dragend', function () { c.classList.remove('dragging'); });
  });
  $$('.kcol').forEach(function (col) {
    col.addEventListener('dragover', function (e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('over');
    });
    col.addEventListener('dragleave', function () { col.classList.remove('over'); });
    col.addEventListener('drop', function (e) {
      e.preventDefault();
      col.classList.remove('over');
      var id = e.dataTransfer.getData('text/plain');
      if (id) moveTask(id, col.dataset.stage);
    });
  });
}

// עדכון אופטימי עם החזרה אחורה: הכרטיס זז מיד (גרירה שמחכה לשמירה נראית
// תקועה), ואם השמירה נכשלה השלב חוזר לערכו הקודם והמסך מצויר מחדש.
// ⚠️ ההחזרה אינה מיותרת דווקא מפני שהכתיבה מקומית: `update` נכשלת רק כשגם
// הכתיבה המקומית נכשלה (אחסון מלא) — כלומר בדיוק במצב שבו הכרטיס על המסך
// היה משקר על משהו ששום שכבה לא שמרה.
function moveTask(id, stage) {
  var t = null;
  for (var i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === id) t = state.tasks[i];
  if (!t || t.stage === stage) return;
  var prev = t.stage;
  t.stage = stage;
  render();
  // update() כבר לא נכשלת ברשת (היא מקומית-תחילה) — היא נכשלת רק כשהכתיבה
  // המקומית או התור נכשלו, וזה בדיוק המצב שבו הגרירה חייבת לחזור אחורה.
  Promise.resolve().then(function () { return update('g_tasks', id, { stage: stage }); })
    .then(function () { schedulePush(); })
    .catch(function (e) { t.stage = prev; render(); errToast(e); });
}

/* ====================================================================== */
/* ⛔⛔ אזור ההגדרות — הערת הגנה משותפת לארבע האפליקציות (סבב 26)
   ⛔ **אין להוסיף שער סיסמה נפרד מעל מסך ההגדרות.** ההרשאה נגזרת
   מהמשתמש המחובר בלבד, ואין שכבה שנייה מעליה.

   **הרקע — וזו אינה זהירות תיאורטית.** ב-schar-limud היה שער כזה בדיוק
   (`admin_pass` ב-`sl_settings`) עד סבב 26, והוא הוסר משתי סיבות שכל
   אחת מהן מספיקה לבדה:
   1. הוא יצר **שכבת הרשאה כפולה** שלא הייתה קיימת באף אחת
      מהאחרות — מנגנון שני עם מסך משלו, מסלול שינוי משלו ותחזוקה
      משלו, לאותו אדם.
   2. **בהתקנה טרייה הוא נפל חזרה למחרוזת `'admin'`** — כלומר השער
      נפתח לכל מי שהקליד «admin». מה שעמד בין ההתקנה לשער
      הפתוח היה שורת זריעה בקובץ הסכימה; הגנה שתלויה בכך
      שמישהו הריץ קובץ אינה הגנה.

   ⛔ **ואין לזרוע ערך ברירת מחדל לסיסמה או לתפקיד בשום מקום** — לא
   בסכימה, לא במיגרציה, לא בקוד ולא בקובץ בדיקה. ברירת מחדל
   לסיסמה היא חשבון שסיסמתו ידועה לכל העולם (כלל ברזל 8, סעיף 7);
   ברירת מחדל לתפקיד היא הרשאה שניתנת למי שאיש לא החליט
   להעניק לו אותה. תפקיד נכתב **במפורש** ביצירת המשתמש.

   ⚠️ **הערה זו זהה בית-לבית בארבע האפליקציות** פרט לשורת «כאן:» שבסופה.
   לקח אבטחתי שנלמד באפליקציה אחת נרשם בארבעתן — גם כשהמנגנון עצמו
   רלוונטי רק לאחת (כלל ברזל 9). הערה שיושבת במקום אחד אינה
   מגינה על הארגון.

   כאן: `viewSettings` / `isOwner` — ההרשאה נגזרת מ-`g_users.role` (`owner` מול
   `manager`), והעמודה היא `text not null` **בלי DEFAULT** (0001). שלוש
   טבלאות המשתמשים בארגון מיושרות בנקודה הזו, ובשלושתן **יצירת משתמש בלי
   `role` נכשלת במסד**. ⚠️ הערכים עצמם אינם משותפים ואין ליישר אותם:
   `owner`/`manager` כאן, `admin`/`user` ב-schar, `admin`/`senior`/`junior`
   בהנהלה. ⚠️ הנפילה-חזרה `val('us-role') || 'manager'` ב-`saveUser`
   **נשארת** — היא שכבת הגנה בטופס (התפקיד הנמוך), לא ברירת מחדל במסד.
   ═════════════════════════════════════════════════════════════════════ */
function viewSettings() {
  // שכבת ההגנה השנייה. `go()` כבר חוסם את הניווט, אבל מסך שמרנדר את עצמו
  // ללא תלות בהרשאה הוא מסך שנפתח לכל מי שהגיע אליו בדרך אחרת (רינדור
  // ישיר, `state.screen` שנקבע במקום אחר). ⛔ אין להסיר את הבדיקה הזו (נרשם בסבב 27) —
  // «כי `go` כבר בודק» — שתי השכבות נועדו בדיוק זו לזו.
  if (!isOwner()) {
    return '<section class="card">' + emptyBox('🔒', 'אין הרשאה — מסך ההגדרות פתוח לבעלים בלבד') + '</section>';
  }

  var h = '';

  /* users */
  h += '<section class="card"><h2>👥 ניהול משתמשים<span class="cnt">' + state.users.length + '</span>' +

/* ══════════════════════════════════════════════════════════════════════════
   בורר התורם — חיפוש תוך כדי הקלדה + יצירה מיידית
   ══════════════════════════════════════════════════════════════════════════
   הרכיב קיים כדי שרישום תנועה לתורם חדש לא יחייב לצאת מהטופס, ליצור תורם
   במסך אחר, ולחזור. הערך הנבחר יושב ב-`dataset.value` של השורש ונקרא
   ב-`pickerValue(id)` — **לא** ב-`<select>`, כי הרשימה נבנית מחדש בכל
   הקלדה ובורר עם מאות אפשרויות אינו שמיש במובייל.
   ⚠️ היצירה המיידית עוברת ב-`insert` הרגיל, כלומר מקומית-תחילה: תורם חדש
   נוצר גם בלי רשת, ומסומן ⏳ עד שיעלה.
   ══════════════════════════════════════════════════════════════════════════ */
function pickerHTML(id, donorId) {
  var d = donorId ? donorById(donorId) : null;
  return '<div class="picker" id="' + id + '" data-value="' + esc(d ? d.id : '') + '">' +
    '<div class="dp-chosen' + (d ? '' : ' hidden') + '">' +
      '<span class="dp-name">' + esc(d ? d.name : '') + '</span>' +
      '<button type="button" class="dp-clear" aria-label="ניקוי">✕</button>' +
    '</div>' +
    '<input class="inp dp-q' + (d ? ' hidden' : '') + '" placeholder="חיפוש תורם לפי שם או טלפון…" autocomplete="off">' +
    '<div class="dp-results hidden"></div>' +
    '<div class="dp-new hidden">' +
      '<div style="font-weight:700;font-size:13px;margin-bottom:8px">תורם חדש</div>' +
      '<div class="f2">' +
        '<label class="fld"><span>שם התורם</span><input class="inp dp-n-name"></label>' +
        '<label class="fld"><span>טלפון</span><input class="inp dp-n-phone" inputmode="tel"></label>' +
      '</div>' +
      '<div class="btnrow"><button type="button" class="btn sm dp-n-save">שמירה ובחירה</button>' +
      '<button type="button" class="btn ghost sm dp-n-cancel">ביטול</button></div>' +
    '</div>' +
  '</div>';
}

function pickerValue(id) { var el = $('#' + id); return el ? el.dataset.value : ''; }

function wirePicker(id, onChange) {
  var root = $('#' + id);
  if (!root) return;
  var q = $('.dp-q', root), res = $('.dp-results', root), box = $('.dp-new', root);
  var chosen = $('.dp-chosen', root);

  function setDonor(d) {
    root.dataset.value = d ? d.id : '';
    $('.dp-name', chosen).textContent = d ? d.name : '';
    chosen.classList.toggle('hidden', !d);
    q.classList.toggle('hidden', !!d);
    res.classList.add('hidden');
    box.classList.add('hidden');
    if (!d) { q.value = ''; q.focus(); }
    if (onChange) onChange(d);
  }

  function paint() {
    var term = q.value.trim();
    var list = donorMatches(term).slice(0, 30);
    var h = '';
    list.forEach(function (d) {
      h += '<button type="button" data-id="' + d.id + '">' + esc(d.name) +
        '<small>' + esc(d.phone || 'ללא טלפון') + '</small></button>';
    });
    h += '<button type="button" class="mk" data-new="1">＋ צור תורם חדש' +
      (term ? ' — "' + esc(term) + '"' : '') + '</button>';
    res.innerHTML = h;
    res.classList.remove('hidden');
  }

  q.addEventListener('focus', paint);
  q.addEventListener('input', paint);

  res.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.new) {
      res.classList.add('hidden');
      box.classList.remove('hidden');
      $('.dp-n-name', box).value = q.value.trim();
      $('.dp-n-name', box).focus();
      return;
    }
    setDonor(donorById(b.dataset.id));
  });

  $('.dp-clear', chosen).addEventListener('click', function () { setDonor(null); });
  $('.dp-n-cancel', box).addEventListener('click', function () {
    box.classList.add('hidden');
    q.focus();
  });
  $('.dp-n-save', box).addEventListener('click', function () {
    var btn = this;
    var name = $('.dp-n-name', box).value.trim();
    var phone = $('.dp-n-phone', box).value.trim();
    if (!name) { toast('נא למלא שם תורם', 'bad'); return; }
    busy(btn, true);
    insert('g_donors', { name: name, phone: phone || null })
      .then(function (d) {
        state.donors.push(d);
        busy(btn, false);
        $('.dp-n-name', box).value = '';
        $('.dp-n-phone', box).value = '';
        setDonor(d);
        toast('התורם נוצר', 'ok');
      })
      .catch(function (e) { busy(btn, false); errToast(e); });
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   טפסים — בנייה (`form*`) ושמירה (`save*`)
   ══════════════════════════════════════════════════════════════════════════
   הזוג קבוע: `formX` פותח מודאל, `saveX` קורא את השדות ומחזיר Promise.
   ⚠️ **`saveX` שמחזירה `Promise.resolve()` — כלומר `undefined` — היא
   ולידציה שעצרה**, ו-`runSave` מזהה זאת ואינה סוגרת את המודאל.
   ⛔ אין להחזיר משם ערך «בשביל האחידות» (נרשם בסבב 27) —
   זה היה סוגר את הטופס ומציג «נשמר» על
   קלט שנדחה.
   ══════════════════════════════════════════════════════════════════════════ */
function pledgeOptionsFor(donorId) {
  var list = donorId ? pledgesOfDonor(donorId) : [];
  var h = '<option value="">— ללא שיוך —</option>';
  list.forEach(function (p) {
    var left = Math.max(0, num(p.amount) - collectedForPledge(p.id));
    h += '<option value="' + p.id + '">' + esc(p.cause || 'התחייבות') + ' · ' + ils(p.amount) +
      ' (נותר ' + ils(left) + ')</option>';
  });
  return h;
}

  var name = val('dn-name');
  if (!name) { toast('נא למלא שם', 'bad'); return Promise.resolve(); }
  var tags = val('dn-tags').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  var row = {
    name: name,
    phone: nullable(val('dn-phone')),
    agent: nullable(val('dn-agent')),
    tags: tags,
    is_vip: checked('dn-vip'),
    notes: nullable(val('dn-notes'))
  };
  return id ? update('g_donors', id, row) : insert('g_donors', row);
}

// סבב 19: סיסמה בת שש ספרות בדיוק. ⛔ נאכף **רק במסלולי יצירה/שינוי**
// (`saveUser` על משתמש חדש, ו-`pass-save`) — ולא במסלול הכניסה. שם רק
// משווים מול הסיסמה השמורה, ואכיפת פורמט הייתה נועלת בחוץ כל משתמש
// שסיסמתו נקבעה לפני הסבב הזה.
var PASS_SIX_RE = /^[0-9]{6}$/;
var MSG_PASS_SIX = 'הסיסמה חייבת להיות שש ספרות';

function formUser(existing) {
  var u = existing || {};
  var body =
    '<div class="f2">' +
      '<label class="fld"><span>שם מלא *</span><input class="inp" id="us-full" value="' + esc(u.full_name || '') + '"></label>' +
      '<label class="fld"><span>שם משתמש *</span><input class="inp" id="us-name" autocapitalize="off" spellcheck="false" value="' + esc(u.username || '') + '"></label>' +
    '</div>' +
    (u.id ? '' : '<label class="fld"><span>סיסמה *</span><input class="inp" id="us-pass" type="text" inputmode="numeric" maxlength="6"></label>') +
    '<div class="f2">' +
      '<label class="fld"><span>תפקיד</span><select class="inp" id="us-role">' +
        '<option value="manager"' + (u.role === 'manager' || !u.role ? ' selected' : '') + '>מנהל</option>' +
        '<option value="owner"' + (u.role === 'owner' ? ' selected' : '') + '>בעלים</option></select></label>' +
      '<label class="fld chk" style="margin-top:22px"><input type="checkbox" id="us-active"' +
        (u.id ? (u.active ? ' checked' : '') : ' checked') + '><span>משתמש פעיל</span></label>' +
    '</div>';
  var foot = '<button class="btn ghost" data-act="modal-close">ביטול</button>' +
    '<button class="btn" data-act="user-save" data-id="' + (u.id || '') + '">שמירה</button>';
  openModal(u.id ? 'עריכת משתמש' : '👤 משתמש חדש', body, foot);
}

function saveUser(id) {
  var full = val('us-full'), uname = val('us-name');
  if (!full || !uname) { toast('נא למלא שם מלא ושם משתמש', 'bad'); return Promise.resolve(); }
  var row = {
    full_name: full, username: uname,
    role: val('us-role') || 'manager',
    active: checked('us-active')
  };
  // סבב 23: כתיבת משתמש דורשת רשת (`writeUser`), כי היא חייבת להגיע לענן
  // כדי שהטביעה תגיע לשאר המכשירים. בלי רשת — נכשל ברעש.
  if (!navigator.onLine) { toast(MSG_OFF_USER_WRITE, 'bad'); return Promise.resolve(); }
  if (!id) {
    var p = $('#us-pass') ? $('#us-pass').value : '';
    if (!p) { toast('נא להזין סיסמה', 'bad'); return Promise.resolve(); }
    if (!PASS_SIX_RE.test(p)) { toast(MSG_PASS_SIX, 'bad'); return Promise.resolve(); }
    return passFields(p).then(function (pf) {
      return writeUser(null, Object.assign({}, row, pf)).then(warnIfNoFp);
    });
  }
  // עריכת משתמש קיים אינה נוגעת בסיסמה, ולכן גם לא בטביעה.
  return writeUser(id, row);
}

// ⚠️ שמירה שהצליחה **בלי** טביעה אינה «נשמר בהצלחה»: המשתמש נשמר, אבל
// הכניסה האופליין שלו לא תעבוד. אומרים את זה, לא בולעים.
function warnIfNoFp(r) {
  if (r && r.noFp) toast('⚠️ נשמר — אך ללא הכנה לכניסה ללא רשת', 'bad');
  return r;
}

function formPassword(u) {
  openModal('שינוי סיסמה — ' + u.full_name,
    '<label class="fld"><span>סיסמה חדשה *</span><input class="inp" id="pw-new" type="text" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>',
    '<button class="btn ghost" data-act="modal-close">ביטול</button>' +
    '<button class="btn" data-act="pass-save" data-id="' + u.id + '">שמירה</button>');
  var el = $('#pw-new'); if (el) el.focus();
}

// ⭐ סבב 35: החלפת סיסמה עצמית — לכל משתמש מחובר, מתוך המסך (כפתור 🔑
//    בכותרת). הסיסמה הנוכחית מאומתת מול הענן ואינה נשמרת בשום מקום;
//    הכתיבה עוברת ב-`passFields`+`writeUser` — אותו מסלול בדיוק כמו
//    שינוי סיסמה ע"י הבעלים, כולל גזירת הטביעה מחדש.
// ⚠️ הסיסמה **הנוכחית** אינה נבדקת מול תבנית שש-הספרות — בדיוק כמו
//    במסלול הכניסה: אכיפה שם הייתה נועלת בחוץ סיסמה ותיקה ותקפה.
function formMyPassword() {
  openModal('🔑 שינוי הסיסמה שלי',
    '<label class="fld"><span>סיסמה נוכחית *</span><input class="inp" id="mp-cur" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></label>' +
    '<label class="fld"><span>סיסמה חדשה *</span><input class="inp" id="mp-new" type="text" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>' +
    '<label class="fld"><span>אימות סיסמה חדשה *</span><input class="inp" id="mp-new2" type="text" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>',
    '<button class="btn ghost" data-act="modal-close">ביטול</button>' +
    '<button class="btn" data-act="my-pass-save">שמירה</button>');
  var el = $('#mp-cur'); if (el) el.focus();
}

function formTarget(month) {
  var m = month || state.month;
  var cur = 0;
  for (var i = 0; i < state.targets.length; i++) if (state.targets[i].month === m) cur = num(state.targets[i].amount);
  openModal('🎯 יעד חודשי',
    '<div class="f2">' +
      '<label class="fld"><span>חודש *</span><input class="inp" type="month" id="tg-month" value="' + esc(m) + '"></label>' +
      '<label class="fld"><span>סכום יעד *</span><input class="inp" id="tg-amount" inputmode="decimal" value="' + (cur || '') + '"></label>' +
    '</div>',
    '<button class="btn ghost" data-act="modal-close">ביטול</button>' +
    '<button class="btn" data-act="target-save">שמירה</button>');
}

function saveTarget() {
  var m = val('tg-month');
  if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(m)) { toast('נא לבחור חודש תקין', 'bad'); return Promise.resolve(); }
  var amount = num(val('tg-amount'));
  return upsertBy('g_targets', 'month', { month: m, amount: amount });
}

/* ══════════════════════════════════════════════════════════════════════════
   פעולות — מפת `data-act` אחת, האזנה מואצלת אחת
   ══════════════════════════════════════════════════════════════════════════
   כל כפתור באפליקציה נושא `data-act="<שם>"`, ומאזין יחיד על `document`
   מוצא את הפונקציה ב-`ACTIONS`. ⛔ **אין `onclick` עם קוד JS בתוך מאפיין
   HTML** — כל המסכים נבנים כמחרוזות, וקוד בתוך מאפיין נשבר מכל גרש בשם
   תורם והופך הזרקה לביצוע. אותו לקח נמדד ותוקן ב-schar-limud (סבב 6)
   וב-hanhala-ruchanit (סבב 8). ערכים נמסרים ב-`data-*` ונקראים מ-`dataset`.
   ══════════════════════════════════════════════════════════════════════════ */
// מקומי-תחילה: הכתיבה כבר במראה ובתור, ולכן אין שום סיבה להמתין לרשת לפני
// שמרעננים את המסך. הסנכרון רץ ברקע ומרנדר שוב כשהוא מביא משהו חדש.
function afterSave(msg) {
  closeModal();
  applyMirrorToState();
  render();
  syncBarRender();
  // בלי רשת ההודעה חייבת לומר את האמת: נשמר **במכשיר**, לא בענן.
  if (msg) toast(navigator.onLine ? msg : MSG_SAVED_LOCAL, 'ok');
  schedulePush();
  return Promise.resolve();
}

// עוטף אחיד לכל שמירה מטופס: ספינר, הרצה, וסגירה+רענון בהצלחה.
// ⚠️ `r === undefined` = ולידציה עצרה (ר' הפרק שמעל הטפסים) — משחררים את
// הכפתור **בלי** לסגור את המודאל, כדי שהמשתמש יתקן את מה שחסר.
function runSave(btn, fn, msg) {
  busy(btn, true);
  Promise.resolve()
    .then(fn)
    .then(function (r) {
      if (r === undefined) { busy(btn, false); return; }   // validation stopped it
      return afterSave(msg);
    })
    .catch(function (e) { busy(btn, false); errToast(e); });
}

function findUser(id) {
  for (var i = 0; i < state.users.length; i++) if (state.users[i].id === id) return state.users[i];
  return null;
}
function findTask(id) {
  for (var i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === id) return state.tasks[i];
  return null;
}

var ACTIONS = {
  'tab': function (el) { go(el.dataset.tab); },
  'logout': function () { logout(); },
  'modal-close': function () { closeModal(); },
  'ask-yes': function () { closeAsk(true); },
  'ask-no': function () { closeAsk(false); },

  'month': function (el) { state.month = shiftMonth(state.month, +el.dataset.d); render(); },

  'fab': function () {
    openModal('מה מוסיפים?',
      '<div class="chooser">' +
        '<button data-act="txn-new"><span class="ic">💰</span><span>תנועה<small>רישום כסף שנכנס</small></span></button>' +
        '<button data-act="task-new"><span class="ic">📋</span><span>משימה<small>מטלה לקנבן</small></span></button>' +
        '<button data-act="pledge-new"><span class="ic">🤝</span><span>התחייבות<small>הבטחת תרומה</small></span></button>' +
      '</div>', '');
    $('#modal-body').style.padding = '0';
  },

  /* donors */
  'donor-new': function () { formDonor(null); },
  'donor-edit': function (el) { formDonor(donorById(el.dataset.id)); },
  'donor-save': function (el) { runSave(el, function () { return saveDonor(el.dataset.id); }, 'נשמר'); },
  'donor-open': function (el) {
    state.screen = 'donors';
    state.donorId = el.dataset.id;
    render();
  },
  'donor-back': function () { state.donorId = null; render(); },
  'vip-toggle': function (el) {
    var d = donorById(el.dataset.id);
    if (!d) return;
    update('g_donors', d.id, { is_vip: !d.is_vip })
      .then(function () { d.is_vip = !d.is_vip; render(); })
      .catch(errToast);
  },
  'notes-save': function (el) {
    var notes = $('#donor-notes') ? $('#donor-notes').value : '';
    busy(el, true);
    update('g_donors', el.dataset.id, { notes: notes || null })
      .then(function () {
        var d = donorById(el.dataset.id);
        if (d) d.notes = notes;
        busy(el, false);
        toast('ההערות נשמרו', 'ok');
      })
      .catch(function (e) { busy(el, false); errToast(e); });
  },
  'donor-del': function (el) {
    var d = donorById(el.dataset.id);
    if (!d) return;
    var hasData = pledgesOfDonor(d.id).length || txnsOfDonor(d.id).length;
    ask('מחיקת תורם',
      hasData
        ? 'לתורם יש התחייבויות או תנועות. המחיקה היא רכה — הרשומות יישמרו במסד ולא יוצגו.'
        : 'למחוק את "' + d.name + '"? המחיקה רכה וניתנת לשחזור במסד.',
      'מחיקה'
    ).then(function (yes) {
      if (!yes) return;
      softDelete('g_donors', d.id)
        .then(function () { state.donorId = null; return afterSave('התורם נמחק'); })
        .catch(errToast);
    });
  },

  /* transactions */
  'txn-new': function (el) { formTxn(null, el.dataset.donor || ''); },
  'txn-edit': function (el) {
    var t = null;
    for (var i = 0; i < state.txns.length; i++) if (state.txns[i].id === el.dataset.id) t = state.txns[i];
    if (t) formTxn(t);
  },
  'txn-save': function (el) { runSave(el, function () { return saveTxn(el.dataset.id); }, 'התנועה נשמרה'); },
  'txn-del': function (el) {
    ask('מחיקת תנועה', 'למחוק את התנועה? המחיקה רכה.', 'מחיקה').then(function (yes) {
      if (!yes) return;
      softDelete('g_txns', el.dataset.id).then(function () { return afterSave('נמחק'); }).catch(errToast);
    });
  },

  /* pledges */
  'pledge-new': function (el) { formPledge(null, el.dataset.donor || ''); },
  'pledge-edit': function (el) { formPledge(pledgeById(el.dataset.id)); },
  'pledge-save': function (el) { runSave(el, function () { return savePledge(el.dataset.id); }, 'ההתחייבות נשמרה'); },
  'pledge-del': function (el) {
    ask('מחיקת התחייבות', 'למחוק את ההתחייבות? המחיקה רכה.', 'מחיקה').then(function (yes) {
      if (!yes) return;
      softDelete('g_pledges', el.dataset.id).then(function () { return afterSave('נמחק'); }).catch(errToast);
    });
  },
  'pf-clear': function () {
    state.pf = { agent: '', status: '', cause: '', from: '', to: '' };
    render();
  },

  /* tasks */
  'task-new': function () { formTask(null); },
  'task-open': function (el) { formTask(findTask(el.dataset.id)); },
  'task-save': function (el) { runSave(el, function () { return saveTask(el.dataset.id); }, 'המשימה נשמרה'); },
  'task-del': function (el) {
    ask('מחיקת משימה', 'למחוק את המשימה? המחיקה רכה.', 'מחיקה').then(function (yes) {
      if (!yes) return;
      softDelete('g_tasks', el.dataset.id).then(function () { return afterSave('נמחק'); }).catch(errToast);
    });
  },

  /* settings — users */
  'user-new': function () { formUser(null); },
  'user-edit': function (el) { formUser(findUser(el.dataset.id)); },
  'user-save': function (el) { runSave(el, function () { return saveUser(el.dataset.id); }, 'המשתמש נשמר'); },
  'user-pass': function (el) { var u = findUser(el.dataset.id); if (u) formPassword(u); },
  'pass-save': function (el) {
    var p = $('#pw-new') ? $('#pw-new').value : '';
    if (!p) { toast('נא להזין סיסמה', 'bad'); return; }
    if (!PASS_SIX_RE.test(p)) { toast(MSG_PASS_SIX, 'bad'); return; }
    if (!navigator.onLine) { toast(MSG_OFF_USER_WRITE, 'bad'); return; }
    // סבב 23: הטביעה נגזרת בכל שינוי סיסמה, לצד הסיסמה עצמה.
    runSave(el, function () {
      return passFields(p).then(function (pf) {
        return writeUser(el.dataset.id, pf).then(warnIfNoFp);
      });
    }, 'הסיסמה עודכנה');
  },
  'my-pass': function () { formMyPassword(); },
  'my-pass-save': function (el) {
    var cur = $('#mp-cur') ? $('#mp-cur').value : '';
    var p1 = $('#mp-new') ? $('#mp-new').value : '';
    var p2 = $('#mp-new2') ? $('#mp-new2').value : '';
    if (!cur || !p1 || !p2) { toast('נא למלא את כל השדות', 'bad'); return; }
    if (!PASS_SIX_RE.test(p1)) { toast(MSG_PASS_SIX, 'bad'); return; }
    if (p1 !== p2) { toast('הסיסמאות החדשות אינן זהות', 'bad'); return; }
    if (!sb || !navigator.onLine) { toast(MSG_OFF_USER_WRITE, 'bad'); return; }
    // ⚠️ האימות הוא מול הענן, רגעי בלבד — הסיסמה הנוכחית אינה נכתבת לשום
    //    מקום, וכשל רשת באמצע נכשל ברעש (writeUser ממילא דורש רשת).
    runSave(el, function () {
      // ⭐ סבב 40 — אימות הסיסמה הנוכחית מול הטביעה; הטקסט הגלוי אינו נשלף.
      return withTimeout(sb.from('g_users').select('id,active,pass_salt,pass_fp').eq('id', state.user.id).limit(1))
        .then(function (res) {
          if (res && res.error) throw res.error;
          var u = res && Array.isArray(res.data) && res.data[0];
          if (!u) throw new Error('הסיסמה הנוכחית שגויה');
          return gVerifyOffline(u, cur).then(function (v) {
            if (v !== 'ok') throw new Error('הסיסמה הנוכחית שגויה');
            return passFields(p1);
          });
        })
        .then(function (pf) { return writeUser(state.user.id, pf).then(warnIfNoFp); });
    }, 'הסיסמה עודכנה');
  },
  'user-toggle': function (el) {
    var u = findUser(el.dataset.id);
    if (!u) return;
    if (u.id === state.user.id && u.active) { toast('אי אפשר להשבית את המשתמש המחובר', 'bad'); return; }
    if (!navigator.onLine) { toast(MSG_OFF_USER_WRITE, 'bad'); return; }
    // ⚠️ ההשבתה חייבת להגיע לענן: משתמש שהושבת ונשאר במראה של מכשיר אחר
    //    היה נשאר בר-כניסה אופליין. המשיכה הבאה מורידה אותו משם.
    writeUser(u.id, { active: !u.active })
      .then(function () { render(); toast('עודכן', 'ok'); })
      .catch(errToast);
  },

  /* settings — lists */
  'cfg-add': function (el) {
    var key = el.dataset.key;
    var input = $('#cfg-add-' + key);
    var v = input ? input.value.trim() : '';
    if (!v) { toast('נא להזין ערך', 'bad'); return; }
    var list = (state.config[key] || []).slice();
    if (list.indexOf(v) >= 0) { toast('הערך כבר קיים', 'bad'); return; }
    list.push(v);
    runSave(el, function () { return saveConfigList(key, list); }, 'נוסף');
  },
  'cfg-edit': function (el) {
    var key = el.dataset.key, i = +el.dataset.i;
    var list = (state.config[key] || []).slice();
    openModal('עריכת ערך',
      '<label class="fld"><span>ערך</span><input class="inp" id="cfg-v" value="' + esc(list[i] || '') + '"></label>' +
      '<div style="color:var(--muted);font-size:12.5px">שינוי הערך אינו משנה רשומות קיימות שכבר משתמשות בערך הישן.</div>',
      '<button class="btn ghost" data-act="modal-close">ביטול</button>' +
      '<button class="btn" data-act="cfg-edit-save" data-key="' + key + '" data-i="' + i + '">שמירה</button>');
  },
  'cfg-edit-save': function (el) {
    var key = el.dataset.key, i = +el.dataset.i;
    var v = val('cfg-v');
    if (!v) { toast('נא להזין ערך', 'bad'); return; }
    var list = (state.config[key] || []).slice();
    list[i] = v;
    runSave(el, function () { return saveConfigList(key, list); }, 'נשמר');
  },
  'cfg-del': function (el) {
    var key = el.dataset.key, i = +el.dataset.i;
    var list = (state.config[key] || []).slice();
    ask('הסרת ערך', 'להסיר את "' + list[i] + '" מהרשימה? רשומות קיימות שמשתמשות בערך יישארו כמות שהן.', 'הסרה')
      .then(function (yes) {
        if (!yes) return;
        list.splice(i, 1);
        saveConfigList(key, list).then(function () { return afterSave('הוסר'); }).catch(errToast);
      });
  },

  /* settings — targets */
  'target-set': function (el) { formTarget(el.dataset.month || state.month); },
  'target-save': function (el) { runSave(el, saveTarget, 'היעד נשמר'); }
};

/* ── מאזינים גלובליים ──────────────────────────────────────────────────────
   ⚠️ **האצלה על `document`, ולא קשירה לאלמנטים.** המסכים נבנים מחדש בכל
   `render()`, ומאזין שנקשר לכפתור מת עם הכפתור. יוצא הדופן היחיד הוא
   `wireKanban()` — הגרירה דורשת מאזינים על הכרטיס עצמו — ולכן היא נקראת
   מחדש בכל רינדור של מסך המשימות.
   ⚠️ `if (el.tagName === 'A') return;` בקליק אינו קישוט: `<a>` שיושב בתוך
   אזור עם `data-act` מקבל `preventDefault` ומאבד את הניווט הטבעי שלו,
   כלומר הופך לקישור שאינו עושה כלום. ⛔ אין למחוק את השורה כשאין `<a>`
   כזה בקוד (סבב 58) — היא הגנה שנכשלת-סגור, והעלות שלה אפס. */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') return;
  e.preventDefault();
  fn(el);
});

// ⚠️ חיפוש התורמים מרנדר **רק את הרשימה ואת המונה**, ולא את המסך. רינדור
// מלא היה בונה מחדש את שדה החיפוש עצמו ומאבד את הפוקוס אחרי כל תו — אותו
// שיקול כמו ב-`refreshPledges`.
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.id === 'donor-q') {
    state.donorSearch = el.value;
    var box = $('#donor-list');
    if (box) box.innerHTML = donorRowsHTML(donorMatches(state.donorSearch));
    var cnt = $('#view .card > h2 .cnt');
    if (cnt) cnt.textContent = donorMatches(state.donorSearch).length;
  }
});

document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.dataset && el.dataset.inp === 'stage') {
    moveTask(el.dataset.id, el.value);
    return;
  }
  var map = { 'pf-agent': 'agent', 'pf-status': 'status', 'pf-cause': 'cause', 'pf-from': 'from', 'pf-to': 'to' };
  if (el.id && map[el.id]) {
    state.pf[map[el.id]] = el.value;
    refreshPledges();
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if ($('#ask').classList.contains('open')) closeAsk(false);
  else if ($('#modal').classList.contains('open')) closeModal();
});

$('#modal').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
$('#ask').addEventListener('click', function (e) { if (e.target === this) closeAsk(false); });

/* ══════════════════════════════════════════════════════════════════════════
   עלייה — סדר הפעולות, וכל אחת מהן במקומה מסיבה
   ══════════════════════════════════════════════════════════════════════════
   `start()` הוא נקודת הכניסה: אחסון ← מראה ← סימוני ⏳ ← מיגרציות ← סשן.
   `boot()` הוא מה שרץ אחרי שיש משתמש: מציג מהעותק המקומי, ואז מסנכרן.
   ⛔ **אין להזיז את `mirrorLoad()` אחרי הסנכרון הראשון** (סבב 11) — כל הרעיון הוא
   שהמסך עולה מהדיסק לפני שנגעו ברשת (כלל ברזל 6, סעיף 2).
   ══════════════════════════════════════════════════════════════════════════ */
function boot() {
  // נעילת חוסר-פעילות (סבב 52) — נקודת הדריכה מחדש אחרי כניסה מוצלחת;
  // שני מסלולי הכניסה (מקוון ואופליין) מגיעים לכאן, ולכן זו נקודה אחת.
  try { lkReset(); } catch (e) { console.warn('[lk] lkReset', e); }
  $('#app').innerHTML = '<div id="boot"><span class="spin"></span></div>';
  // ⭐ קריאה מהעותק המקומי **ראשונה**, לפני כל נגיעה ברשת. זה כל ההבדל
  //    בין אפליקציה שעובדת אופליין לאחת שרק מציגה ספינר.
  applyMirrorToState();
  syncBarRender();
  startSync();

  if (mirrorHasData()) {
    render();                 // המשתמש רואה נתונים מיד — גם בלי רשת
    syncNow();                // ורענון ברקע
    return Promise.resolve();
  }

  // אין עותק מקומי כלל (התקנה ראשונה / משתמש חדש) — כאן רשת היא חובה.
  return syncNow().then(function (okPull) {
    if (okPull || mirrorHasData()) { render(); return; }
    $('#app').innerHTML = '<div class="auth"><div class="auth-card">' +
      '<h1>שגיאת טעינה</h1><div class="sub">אין עדיין עותק מקומי של הנתונים, ולא הצלחנו לטעון מהשרת. ' +
      'התחברו לרשת פעם אחת — מכאן והלאה האפליקציה תעבוד גם בלעדיה.</div>' +
      '<button class="btn block" style="margin-top:14px" onclick="location.reload()">רענון</button>' +
      '</div></div>';
  });
}

function start() {
  if (!window.supabase || !window.supabase.createClient) {
    $('#app').innerHTML = '<div class="auth"><div class="auth-card"><h1>שגיאת טעינה</h1>' +
      '<div class="sub">ספריית Supabase לא נטענה. בדקו את החיבור לאינטרנט ורעננו.</div>' +
      '<button class="btn block" onclick="location.reload()">רענון</button></div></div>';
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false }
  });

  // עמידות אחסון (סבב 11): מדידה + פינוי יזום, ואז טעינת המראה — בסדר הזה,
  // כדי שהמשיכה שאחריה תכתוב לאחסון שכבר יש בו מקום.
  try { lsBoot(); } catch (e) { console.warn('[ls] lsBoot', e); }
  // מודל הסשן (סבב 53) — נקודת ההפעלה היחידה של המודול.
  try { sessBoot(); } catch (e) { console.warn('[sess] sessBoot', e); }
  mirrorLoad();
  // סימוני "ממתין לסנכרון" (סבב 12) — נטענים מהדיסק לפני הרינדור הראשון,
  // כך שפעולה שלא עלתה בסשן הקודם מוצגת כממתינה מיד.
  try { pendBoot(); } catch (e) { console.warn('[pend] pendBoot', e); }
  // סבב 23: ניקוי סימוני ⏳ על `g_users` שנוצרו לפני `writeUser` ולא היה
  // מי שידחוף אותם — ר' ההערה על `migrateUserPend`.
  try { migrateUserPend(); } catch (e) { console.warn('[users] pend migrate', e); }
  // גיבוי יומי ויומן פעולות (סבב 30) — נקודת ההפעלה היחידה של המודול.
  // ⛔ אין להחזיר אותה ל-`syncPull` (סבב 30, השלמה) — שם היא רצה רק אחרי
  //    משיכה מלאה שהצליחה, כלומר תלויה בפעילות סנכרון. זו הצורה שהשביתה
  //    את הגיבוי של הנהלה ל-25 יום בלי שאיש ידע.
  try { bkBoot(); } catch (e) { console.warn('[bk] bkBoot', e); }
  // ניסיון חוזר בסנכרון (סבב 44) — נקודת ההפעלה היחידה של המודול.
  try { rtyBoot(); } catch (e) { console.warn('[rty] rtyBoot', e); }
  // מנגנון המשיכה (סבב 51) — נקודת ההפעלה היחידה של המודול.
  try { plBoot(); } catch (e) { console.warn('[pl] plBoot', e); }
  try { hwBoot(); } catch (e) { console.warn('[hw] hwBoot', e); }
  // נעילת חוסר-פעילות (סבב 52) — נקודת ההפעלה היחידה של המודול.
  try { lkBoot(); } catch (e) { console.warn('[lk] lkBoot', e); }

  // ⛔ **אין כאן שחזור סשן (סבב 53)** — כל עלייה מתחילה במסך הכניסה, גם
  //    כשהמשתמש נכנס לפני דקה. עד הסבב הזה `gius.session` שוחזר
  //    מ-localStorage **בלי תפוגה**, כלומר מי שנכנס פעם אחת נשאר מחובר
  //    לנצח על אותו מכשיר. ⛔ אין להחזיר (סבב 53): על מכשיר משותף זו
  //    כניסה קבועה, והסשן הוריד לדיסק גם את **ההרשאה** (`role`).
  //    ⚠️ הכניסה האופליין לא נפגעה — היא מוכרעת ב-`gVerifyOffline` מול
  //    `pass_fp` שבמראה, ולא מול הסשן.
  // ⛔ `revalidateSession` ירדה איתו (סבב 53) — היא רצה **רק** מכאן,
  //    ותפקידה היה לאמת סשן משוחזר. אין סשן משוחזר, אין מה לאמת:
  //    הכניסה עצמה כבר קוראת את השורה מהענן ומרעננת את המראה.
  renderLogin();
}

/* ── service worker + באנר העדכון ──────────────────────────────────────────
   ⛔ **אין `skipWaiting()` ב-install** (נרשם בסבב 27, כללי ה-SW ב-CLAUDE.md סעיף 8) —
   החלפת עובד מתחת לדף פתוח מרעננת אותו באמצע טופס. הדף מציג באנר, ורק
   לחיצה של המשתמש שולחת `SKIP_WAITING`.
   ⚠️ ובלי `updateRequested`, ה-`controllerchange` של **העובד הראשון**
   (שקורא `clients.claim()`) היה מרענן מבקר ראשון באמצע עבודה. */
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  var updater = $('#updater');
  var btn = $('#updater-btn');
  var waiting = null;
  var updateRequested = false;

  function showUpdate(sw) {
    waiting = sw;
    updater.classList.add('show');
  }

  btn.addEventListener('click', function () {
    updateRequested = true;
    if (!waiting) { location.reload(); return; }
    btn.disabled = true;
    btn.textContent = 'מעדכן…';
    waiting.postMessage({ type: 'SKIP_WAITING' });
  });

  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    // The very first worker fires this when it calls clients.claim(). Reloading
    // then would yank the page out from under a first-time visitor, mid-form.
    // Only an update the user actually asked for may reload.
    if (!updateRequested || reloading) return;
    reloading = true;
    location.reload();
  });

  navigator.serviceWorker.register('sw.js').then(function (reg) {
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
    reg.addEventListener('updatefound', function () {
      var nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', function () {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdate(nw);
      });
    });

    // ⭐ בדיקת עדכון תקופתית (סבב 53) — `reg.update()` כל חצי שעה, בדיוק
    //    כמו בשלוש האחיות. ⚠️ **בלעדיה לשונית שנשארת פתוחה אינה לומדת
    //    לעולם שיצאה גרסה חדשה**, מפני שהדפדפן בודק את `sw.js` בניווט
    //    בלבד — והבאנר שקיים כאן פשוט לא היה מוצג.
    // ⛔ אין בכך שינוי להכרעה של gius שאין `skipWaiting` (סבב 27): הבדיקה
    //    רק **מגלה** גרסה חדשה ומציגה את הבאנר; המשתמש עדיין מחליט מתי.
    function checkForUpdate() {
      try { reg.update().catch(function () {}); } catch (e) {}
    }
    checkForUpdate();
    setInterval(checkForUpdate, 30 * 60 * 1000);
  }).catch(function (e) { console.warn('SW registration failed', e); });
}

window.addEventListener('load', registerSW);
start();

})();
</script>
