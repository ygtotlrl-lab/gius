<script>
// חייב לרוץ לפני שכל כתובת יחסית מפוענחת — ה-SW מגיש את הקליפה גם בנתיבים עמוקים, וכל href יחסי נפתר עמוק מדי.
// בלי <base> בשורש, manifest.json, sw.js והאייקונים מחזירים 404 וה-worker נרשם ב-scope שגוי.
(function () {
  var p = location.pathname;
  var m = p.match(/^(.*?\/gius\/)/);
  var b = document.createElement('base');
  b.href = m ? m[1] : p.replace(/[^/]*$/, '');
  document.head.appendChild(b);
})();
</script>

  tables: function () { return TABLES.map(function (m) { return m.t; }); },

// הכתיבה נכנסת למראה בלי pendMark — מה שכבר בענן אינו ממתין, וסימון עליו היה גובר במיזוג ומסתיר את השורה שבענן.

// ── דחיפת-מצב ──
// דחיפת-מצב ולא תור יוצא — בתור, כשל תוכן אחד חוסם את כל מה שאחריו; כאן כל רשומה עומדת בפני עצמה.

    var k = String(l[m.key]);
    if (k === 'undefined' || k === 'null') return false;

}


// ── משיכה ──
// מחזירה {ok, remote} — מפת הענן היא מה שמאפשר לדחיפה שאחריה לדעת מה מקומי וחדש יותר.
function syncPull() {
  if (_pulling || !sb) return Promise.resolve({ ok: false, remote: {} });
  _pulling = true;
  // ההקשר נלכד בכניסה ונבדק לפני המיזוג — המשתמש יכול להתחלף בין המשיכה לכתיבה.
  var _ep = ctxEpoch();
  var remoteMaps = {};
  return Promise.all(TABLES.map(function (m) {
    // בלי סינון deleted — בלי ה-tombstones מחיקה ממכשיר אחר לא תגיע לכאן לעולם.
    // העימוד חובה: select('*') בבקשה אחת נחתך בשקט בתקרת db-max-rows.
    // הסדר לפי m.key ולא m.order — m.order הוא סדר תצוגה שעשוי להיות ריק, והעימוד דורש מפתח יציב וייחודי.
    return _rowsPaged(function () {
      return sb.from(m.t).select('*');
    }, m.key, null)
      .then(function (rows) { return { m: m, res: rows ? { data: rows, error: null }
                                                       : { data: null, error: { message: 'rows:' + m.t } } }; },
            function (e) { return { m: m, res: { error: e } }; });
  })).then(function (list) {
    if (ctxStale(_ep)) return { ok: false, remote: {} };
    var errs = [];
    list.forEach(function (x) {
      if (!x.res || x.res.error || !Array.isArray(x.res.data)) { errs.push(x.m.t); return; }
      var rows = stripRows(x.m.t, x.res.data);
      hwNoteCloud(mirrorKey(x.m.t), rows); // ראיה עננית לשער הדיסק
      var map = {};
      rows.forEach(function (r) { map[String(r[x.m.key])] = r; });
      remoteMaps[x.m.t] = map;
      var merged = mergeRows(MIRROR[x.m.t], rows, x.m.key,
        function (k) { return pendHas(pendRowKey(x.m.t, k)); });
      // מראת המשתמשים נשמרת דרך הנתיב המלא של המודול שלה, שמסנן בדיוק כמו הנתיב החלקי.
      if (x.m.t === authUsersTable()) usersSaveAll(merged);
      else { MIRROR[x.m.t] = merged; mirrorSave(x.m.t); }
    });
    applyMirrorToState();
    if (!errs.length) {
      _lastPullOk = Date.now();
      // הגיבוי היומי ותור היומן אינם תלויים במשיכה שהצליחה — אחרת כל יום בלי סנכרון מדולג.
      // אין כאן כתיבת עד פינוי — משיכה אומרת «ראיתי את הענן» ולא «מה שאצלי עלה»; העד נכתב בסוף הדחיפה.
      if (!_gPullLogged) { _gPullLogged = true; gSyncLog('pull', null, null); }
      if (_netWarned) { _netWarned = false; toast(MSG_SYNC_BACK, null, 'good'); }
    } else {
      console.warn('[sync] נכשלו:', errs.join(', '));
      if (!_netWarned) {
        _netWarned = true;
        toast(MSG_LOAD_FAIL_PRE + errs.join(', ') + MSG_MAYBE_STALE, null, 'bad');
      }
    }
    return { ok: !errs.length, remote: remoteMaps };
  }).catch(function (e) {
    console.warn('[sync]', e);
    return { ok: false, remote: {} };
  }).then(function (r) { _pulling = false; pendRender(); return r; });
}

// משיכה קודמת לדחיפה — בלי מצב הענן אין לדעת מה מקומי וחדש יותר, ודחיפה עיוורת מחייה רשומה שנמחקה במכשיר אחר.
// אין לרשום כל מחזור סנכרון — הפולינג רץ כל שלוש שניות, ו-sh_sync_log היא insert בלבד ואי-אפשר לדלל אותה.
function gSyncLog(action, key, recordCount, details) {
  try { logAction(action, key, recordCount, details); } catch (e) { }
}
var _gPullLogged = false;
function syncNow() {
  var t0 = Date.now();
  // הדחיפה נבדקת מול ההקשר שנלכד לפני המשיכה — res.remote נמדד עבורו.
  var _ep = ctxEpoch();
  return syncPull().then(function (res) {
    if (!res.ok || ctxStale(_ep)) { pullRender(render); return false; }
    // שער הרשת כאן ולא בשכבת הדחיפה — הוא תלוי בלקוח, ומעבר ריק היה מסמן עד פינוי בלי ראיה מהענן.
    var p = (!sb || !navigator.onLine) ? Promise.resolve({ still: [] })
                                       : pushDirty(res.remote);
    return p.then(function (r) {
      if (ctxStale(_ep)) { pullRender(render); return false; }
      pendReconcile(r.still, t0);
      if (r && r.n) gSyncLog('push', null, r.n);
      pullRender(render);
      return true;
    });
  });
}
// הסימונים מחושבים מחדש רק אחרי משיכה שהצליחה; מה שנכתב אחרי t0 לא נבדק מול הענן ולכן אינו מנוקה.
function pendReconcile(still, t0) {
  var want = {};
  (still || []).forEach(function (k) { want[k] = 1; });
  pendMarkMany(Object.keys(want));
  var m = pendAll(), gone = [];
  Object.keys(m).forEach(function (k) { if (!want[k] && m[k] < t0) gone.push(k); });
  pendClearMany(gone);
}
// ── נגזרות ──
// כל סכום כסף מחושב בכל קריאה מ-state.txns — סכום שמור מתיישן בכל תנועה שנרשמה במכשיר אחר.
function donorById(id) {
  for (var i = 0; i < state.donors.length; i++) if (idEq(state.donors[i].client_id, id)) return state.donors[i];
  return null;
}
// מציין מקום ולא מחרוזת ריקה — שורת תנועה בלי שם נראית כבאג ומסתירה שהכסף עדיין רשום ומחושב.
function donorName(id) { var d = donorById(id); return d ? d.name : '— תורם שנמחק —'; }
function pledgeById(id) {
  for (var i = 0; i < state.pledges.length; i++) if (idEq(state.pledges[i].client_id, id)) return state.pledges[i];
  return null;
}
function txnsOfDonor(id) { return state.txns.filter(function (t) { return t.donor_client_id === id; }); }
function pledgesOfDonor(id) { return state.pledges.filter(function (p) { return p.donor_client_id === id; }); }
function collectedForPledge(pid) {
  return sum(state.txns.filter(function (t) { return t.pledge_client_id === pid; }), function (t) { return t.amount; });
}
// הסכומים numeric(14,2) חוזרים כ-float — בלי EPS התחייבות שנגבתה במלואה מוצגת «חלקי» בגלל שגיאת ייצוג.
function pledgeStatus(p) {
  var c = collectedForPledge(p.client_id);
  if (c <= EPS) return 'לא בוצע';
  if (c + EPS < num(p.amount)) return 'חלקי';
  return 'בוצע';
}

  for (var i = 0; i < state.targets.length; i++) if (state.targets[i].month === m) return num(state.targets[i].amount);
  return 0;
}
// השגריר, המנהל והאחראי הם טקסט חופשי ולא מפתח זר — הרשימה כוללת גם ערכים שכבר נרשמו, כדי ששם ישן לא ייעלם מהבורר.

  return uniqSorted(
    state.users.map(function (u) { return u.full_name; })
      .concat(state.donors.map(function (d) { return d.agent; }))
      .concat(state.pledges.map(function (p) { return p.agent; }))

function loginError(msg) {

function doLogin() {
  var username = val('lg-user');
  var password = $('#lg-pass') ? $('#lg-pass').value : '';
  $('#lg-err').classList.remove('show');
  if (!username || !password) { loginError(MSG_FILL_LOGIN); return; }

  // בלי רשת — אימות מול הטביעה שבמראה ולא MSG_OFFLINE: אחרת רק מי שנכנס אחרון במכשיר יכול להיכנס.
  if (!navigator.onLine) { return doLoginOffline(username, password); }
  return withTimeout(sb.from(authUsersTable()).select(AUTH_USER_COLS.join(',')).eq('username', username).limit(1))
    .then(ok)
    .then(function (rows) {
      var u = rows && rows[0];
      if (!u) throw new Error('bad');
      if (!u.active) throw new Error('inactive');
      // ההשוואה מול הטביעה ולא מול סיסמה — ה-RLS פתוח ומפתח ה-anon ציבורי, ועמודת סיסמה הייתה מפתח לכניסה.
      return authVerify(u, password).then(function (v) {
        if (v === 'no-crypto') throw new Error('no-crypto');
        if (v !== 'ok') throw new Error('bad');

    })
    .then(function (u) {
      ctxSwitch();
      state.user = { client_id: u.client_id, username: u.username, full_name: u.full_name, role: u.role };
      authLog(true, 'online', username);

      try { usersSaveOne(u); } catch (e) { console.warn('[users] cache', e); }

      var m = e && e.message;
      authLog(false, m === 'bad' ? 'wrong_credentials_online' : m === 'inactive' ? 'inactive_online'
                   : m === 'no-crypto' ? 'no_crypto_online' : isNetErr(e) ? 'net_error' : 'server_error',
              username);
      if (e && e.message === 'bad') loginError(MSG_BAD_LOGIN);
      else if (e && e.message === 'inactive') loginError(MSG_USER_INACTIVE);

    });
}

// ארבעה מצבים וארבע הודעות — משתמש שאינו במראה או בלי טביעה אינו סיסמה שגויה, והודעה כזו מובילה לנסות שוב סיסמה נכונה.
function doLoginOffline(username, password) {

  // מחזירה Promise בשביל הבדיקות — אף קורא בקוד אינו נשען על הערך המוחזר.
  return authVerify(cu, password).then(function (verdict) {
    if (verdict === 'no-fp')     { authLog(false, 'no_fp_offline', username); loginError(MSG_OFF_NO_FP); return; }
    if (verdict === 'no-crypto') { authLog(false, 'no_crypto_offline', username); loginError(MSG_OFF_NO_CRYPTO); return; }
    if (verdict !== 'ok')        { authLog(false, 'wrong_credentials_offline', username); loginError(MSG_BAD_LOGIN); return; }
    ctxSwitch();
    state.user = { client_id: cu.client_id, username: cu.username, full_name: cu.full_name, role: cu.role };
    authLog(true, 'offline', username);
    boot();
    toast(MSG_OFFLINE_LOGIN, null, 'bad');
  }, function (e) {
    console.warn('[login] אימות אופליין נכשל', e);
    authLog(false, 'no_crypto_offline', username);
    loginError(MSG_OFF_NO_CRYPTO);
  });
}

// כפתור ההגדרות מוצג לכולם בכוונה — מי שאינו מורשה מקבל טוסט, ואין להסתיר את הטאב; האכיפה חוזרת גם ב-viewSettings.
function go(screen) {
  if (screen === 'settings' && !isAdmin()) {
    toast(MSG_OWNER_ONLY, null, 'bad');
    return;
  }
  state.screen = screen;
  state.donorId = null;
  // הבית נפתח בחודש של היום — אחרת מי שחוזר לבית רואה יעד של חודש שדופדף אליו.
  if (screen === 'home') state.month = monthKeyOf(dayToday());
  render();
}

// ── מסך הבית ──
// הסף בהודעת המומנטום הוא «גדול או שווה» — «גדול» משנה בשקט את ההודעה בקצה הטווח.
function momentumMsg(pct) {
  if (pct >= 100) return '🏆 עמדנו ביעד!';
  if (pct >= 75) return '⚡ כמעט שם — דחיפה אחרונה!';
  if (pct >= 50) return '🔥 מעל המחצית — ממשיכים!';
  if (pct >= 25) return '💪 רבע דרך — מומנטום!';
  return '🚀 מתחילים!';
}

function ringHTML(pct) {
  var R = 52, C = 2 * Math.PI * R;
  var dash = C * Math.max(0, Math.min(100, pct)) / 100;
  return '<div class="ring-wrap">' +
    '<svg class="ring" viewBox="0 0 120 120">' +
      '<circle class="bg" cx="60" cy="60" r="' + R + '"></circle>' +
      '<circle class="fg" cx="60" cy="60" r="' + R + '" stroke-dasharray="' + dash.toFixed(1) + ' ' + C.toFixed(1) + '"></circle>' +
    '</svg>' +
    '<div class="ring-val"><b>' + Math.round(pct) + '%</b><span>מהיעד</span></div>' +
  '</div>';
}

function breakdownTable(rows, label, total) {
  if (!rows.length) return emptyBox('📊', 'אין תנועות בחודש זה');
  var h = '<div class="tw"><table><thead><tr><th>' + esc(label) + '</th><th class="num">תנועות</th>' +
    '<th class="num">סכום</th><th class="num">חלק</th></tr></thead><tbody>';
  rows.forEach(function (r) {
    var share = total > 0 ? (r.total / total * 100) : 0;
    h += '<tr><td>' + esc(r.key) + '</td>' +
      '<td class="num">' + r.count + '</td>' +
      '<td class="num">' + ils(r.total) + '</td>' +
      '<td class="share-cell num">' + bar(share.toFixed(1)) +
      '<small class="share-pct">' + share.toFixed(0) + '%</small></td></tr>';
  });
  h += '</tbody><tfoot><tr><td>סה"כ</td><td class="num">' + sum(rows, function (r) { return r.count; }) +
    '</td><td class="num">' + ils(total) + '</td><td></td></tr></tfoot></table></div>';
  return h;
}

function groupBy(list, pick, fallback) {
  var map = {}, order = [];
  list.forEach(function (item) {
    var k = String(pick(item) || '').trim() || fallback;
    if (!map[k]) { map[k] = { key: k, total: 0, count: 0 }; order.push(k); }
    map[k].total += num(item.amount);
    map[k].count++;
  });
  return order.map(function (k) { return map[k]; })
    .sort(function (a, b) { return b.total - a.total; });
}

function viewHome() {
  var m = state.month;
  var txns = monthTxns(m);
  var collected = sum(txns, function (t) { return t.amount; });
  var target = targetFor(m);
  var remaining = Math.max(0, target - collected);

  var h = '';

  // ── מצב החודש ──
  h += '<section class="card">' +
    '<div class="monthnav">' +
      '<button class="btn ghost sm" data-act="month" data-d="-1" aria-label="חודש קודם">›</button>' +

      '<button class="btn ghost sm" data-act="month" data-d="1" aria-label="חודש הבא">‹</button>' +
      '<span class="grow"></span>' +
      (isAdmin() ? '<button class="btn soft sm" data-act="target-set" data-month="' + m + '">קביעת יעד</button>' : '') +
    '</div>' +
    '<div class="hero">' + ringHTML(pct) +
      '<div class="hero-stats">' +
        '<div class="stat"><span>יעד החודש</span><b>' + (target > 0 ? ils(target) : '— לא הוגדר —') + '</b></div>' +
        '<div class="stat ok"><span>נגבה</span><b>' + ils(collected) + '</b></div>' +
        '<div class="stat warn"><span>נותר</span><b>' + (target > 0 ? ils(remaining) : '—') + '</b></div>' +
        '<div class="stat"><span>תנועות</span><b>' + txns.length + '</b></div>' +
      '</div>' +
    '</div>' +
    '<div class="momentum">' + momentumMsg(target > 0 ? pct : 0) + '</div>' +
  '</section>';

  // ── פילוחים ──
  h += '<div class="grid2">' +
    '<section class="card"><h2>📊 פילוח לפי סעיף</h2>' +
      breakdownTable(groupBy(txns, function (t) { return t.category; }, 'ללא סעיף'), 'סעיף', collected) +
    '</section>' +
    '<section class="card"><h2>🎖️ פילוח לפי שגריר</h2>' +
      breakdownTable(groupBy(txns, function (t) { return t.agent; }, 'ללא שגריר'), 'שגריר', collected) +
    '</section>' +

  // ── היום שלי ──
  var me = state.user.full_name;
  var myTasks = state.tasks.filter(function (t) { return t.assignee === me && t.stage !== 'השלמה'; });
  var myPledges = state.pledges.filter(function (p) {
    return p.agent === me && collectedForPledge(p.client_id) + EPS < num(p.amount);
  });

  h += '<section class="card"><h2>☀️ מה שלי היום<span class="cnt">' + (myTasks.length + myPledges.length) + '</span></h2>';
  if (!myTasks.length && !myPledges.length) {
    h += emptyBox('✨', 'אין משימות פתוחות או התחייבויות ממתינות על שמך');
  } else {
    if (myTasks.length) {
      h += '<div class="today-head">משימות פתוחות</div>';
      myTasks.forEach(function (t) {
        var late = t.due_date && t.due_date < dayToday();
        h += '<div class="row" data-act="task-open" data-id="' + t.client_id + '">' +
          '<div class="av">🗂️</div><div class="main"><b>' + esc(t.title) + '</b>' +
          '<small>' + esc(t.domain || 'ללא תחום') + ' · ' + esc(t.stage) + '</small></div>' +
          '<div class="end"><span class="badge ' + (late ? 'bad' : '') + '">' + esc(dmyDate(t.due_date)) + '</span></div></div>';
      });
    }
    if (myPledges.length) {
      h += '<div class="today-head-next">התחייבויות שטרם נגבו במלואן</div>';
      myPledges.forEach(function (p) {
        var c = collectedForPledge(p.client_id);
        var left = Math.max(0, num(p.amount) - c);
        h += '<div class="row" data-act="donor-open" data-id="' + p.donor_client_id + '">' +
          '<div class="av">🤝</div><div class="main"><b>' + esc(donorName(p.donor_client_id)) + '</b>' +
          '<small>' + esc(p.cause || 'ללא עילה') + ' · ' + ils(p.amount) + '</small></div>' +

  var list = state.donors.slice().sort(byName);

  return list.filter(function (d) {
    return String(d.name || '').toLowerCase().indexOf(q) >= 0 ||
      String(d.phone || '').indexOf(q) >= 0 ||
      String(d.agent || '').toLowerCase().indexOf(q) >= 0;

}

// ── התחייבויות ──
function filteredPledges() {
  var f = state.pf;
  return state.pledges.filter(function (p) {
    if (f.agent && p.agent !== f.agent) return false;
    if (f.cause && p.cause !== f.cause) return false;
    if (f.status && pledgeStatus(p) !== f.status) return false;
    if (f.from && (!p.due_date || p.due_date < f.from)) return false;
    if (f.to && (!p.due_date || p.due_date > f.to)) return false;
    return true;
  });
}

// גרירה על אירועי מצביע — dragstart, dragover ו-drop אינם נורים במגע.
// הגרירה מתחילה מהידית בלבד — כרטיס שכולו נגרר חוטף את גלילת המסך.
// הגרירה היא העברת שלב ולא שינוי סדר — הנמדד הוא העמודה שמתחת לשחרור.
var KDRAG = { el: null, col: null };

function kdragCol(x, y) {
  var over = document.elementFromPoint(x, y);
  return over && over.closest ? over.closest('.kcol') : null;
}
document.addEventListener('pointerdown', function (e) {
  var g = e.target && e.target.closest ? e.target.closest('.kcard > .grip') : null;
  if (!g) return;
  KDRAG.el = g.closest('.kcard');
  KDRAG.col = null;
  KDRAG.el.classList.add('dragging');
  // המצביע נלכד על הידית — בלעדיו אצבע שיוצאת מגבול הכרטיס מפסיקה לשדר והגרירה נתקעת.
  try { g.setPointerCapture(e.pointerId); } catch (e1) {}
  e.preventDefault();
});
document.addEventListener('pointermove', function (e) {
  if (!KDRAG.el) return;
  e.preventDefault();
  var col = kdragCol(e.clientX, e.clientY);
  if (col === KDRAG.col) return;
  if (KDRAG.col) KDRAG.col.classList.remove('over');
  KDRAG.col = col;
  if (col) col.classList.add('over');
});
document.addEventListener('pointerup', function (e) {
  if (!KDRAG.el) return;
  var el = KDRAG.el, col = kdragCol(e.clientX, e.clientY);
  if (KDRAG.col) KDRAG.col.classList.remove('over');
  KDRAG.el = null; KDRAG.col = null;
  el.classList.remove('dragging');
  if (col && col.dataset.stage) moveTask(el.dataset.id, col.dataset.stage);
});

// עדכון אופטימי עם החזרה — update נכשלת רק כשהכתיבה המקומית נכשלה, ואז הכרטיס שעל המסך משקר.
function moveTask(id, stage) {
  var t = null;
  for (var i = 0; i < state.tasks.length; i++) if (idEq(state.tasks[i].id, id)) t = state.tasks[i];
  if (!t || t.stage === stage) return;
  var prev = t.stage;
  t.stage = stage;
  render();
  Promise.resolve().then(function () { return update('g_tasks', id, { stage: stage }); })
    .then(function () { schedulePush(); })
    .catch(function (e) { t.stage = prev; render(); errToast(e); });
}

function pickerValue(id) { var el = $('#' + id); return el ? el.dataset.value : ''; }

function pickerClear(root) {
  var res = $('.dp-results', root);
  res.innerHTML = '';
  res.classList.add('hidden');
}

// התלות של #txn-pledge בתורם יושבת כאן ולא בסגור שנמסר בכל פתיחת מודאל — סגור פר-פתיחה מתיישן כשהרכיב משתנה.
function pickerSet(root, d) {
  var chosen = $('.dp-chosen', root), q = $('.dp-q', root);
  root.dataset.value = d ? d.client_id : '';
  $('.dp-name', chosen).textContent = d ? d.name : '';
  chosen.classList.toggle('hidden', !d);
  q.classList.toggle('hidden', !!d);
  pickerClear(root);
  $('.dp-new', root).classList.add('hidden');
  if (!d) { q.value = ''; q.focus(); }
  if (root.id === 'txn-donor') {
    var sel = $('#txn-pledge');
    if (sel) sel.innerHTML = pledgeOptionsFor(d ? d.client_id : '');
  }
}

// ההתאמה הראשונה נושאת את data-ksave, ובלי התאמות — כפתור «צור תורם חדש»: המקש עושה את מה שהעין רואה ראשון.
function pickerPaint(root) {
  var q = $('.dp-q', root), res = $('.dp-results', root);
  var term = q.value.trim();
  var list = donorMatches(term).slice(0, 30);
  var h = '';
  list.forEach(function (d, i) {
    h += '<button type="button" data-act="dp-pick"' + (i ? '' : ' data-ksave') +
      ' data-id="' + d.client_id + '">' + esc(d.name) +
      '<small>' + esc(d.phone || 'ללא טלפון') + '</small></button>';
  });
  h += '<button type="button" class="mk" data-act="dp-new"' + (list.length ? '' : ' data-ksave') +
    '>＋ צור תורם חדש' + (term ? ' — "' + esc(term) + '"' : '') + '</button>';
  res.innerHTML = h;
  res.classList.remove('hidden');
}

function pickerNew(root) {
  var box = $('.dp-new', root);
  pickerClear(root);
  box.classList.remove('hidden');
  $('.dp-n-name', box).value = $('.dp-q', root).value.trim();
  $('.dp-n-name', box).focus();
}

function pickerSave(root) {
  var box = $('.dp-new', root);

  var phone = $('.dp-n-phone', box).value.trim();
  if (!name) { toast(MSG_NEED_DONOR_NAME, null, 'bad'); return; }

  var foot = '<button class="btn ghost" data-act="modal-close">ביטול</button>' +
    (t.client_id ? '<button class="btn danger" data-act="task-del" data-id="' + t.client_id + '">מחיקה</button>' : '') +
    '<button class="btn" data-act="task-save" data-ksave data-id="' + (t.client_id || '') + '">שמירה</button>';

  openModal(t.client_id ? MSG_EDIT_TASK : MSG_NEW_TASK, body, foot);
  var titleEl = $('#tk-title');
  if (titleEl && !t.client_id) titleEl.focus();
}

function saveTask(id) {
  var title = val('tk-title');
  if (!title) { toast(MSG_NEED_TITLE, null, 'bad'); return Promise.resolve(); }
  var existing = null;
  for (var i = 0; i < state.tasks.length; i++) if (idEq(state.tasks[i].id, id)) existing = state.tasks[i];

  var row = {
    title: title,
    stage: val('tk-stage') || 'הכנה',
    assignee: nullable(val('tk-assignee')),
    domain: nullable(val('tk-domain')),
    due_date: nullable(val('tk-due'))
  };
  // היומן מצטבר ולא נדרס — row.log = entry היה מוחק את כל היסטוריית הטיפול, ואין גרסאות לשחזר ממנה.
  var entry = val('tk-log');
  if (entry) {
    var stamp = '[' + dmyDate(dayToday()) + ' · ' + state.user.full_name + ']';
    var prev = (existing && existing.log) ? existing.log + '\n' : '';
    row.log = prev + stamp + ' ' + entry;
  }
  return id ? update('g_tasks', id, row) : insert('g_tasks', row);
}

function saveDonor(id) {

  if (!name) { toast(MSG_NEED_NAME, null, 'bad'); return Promise.resolve(); }

// נאכפת ביצירה ובשינוי בלבד — אכיפה במסלול הכניסה נועלת בחוץ סיסמה תקפה שנקבעה לפני התקן
var PASS_SIX_RE = /^[0-9]{6}$/;

function formUser(existing) {
  var u = existing || {};
  var body =
    '<div class="f2">' +
      '<label class="fld"><span>שם מלא *</span><input class="inp" id="us-full" value="' + esc(u.full_name || '') + '"></label>' +
      '<label class="fld"><span>שם משתמש *</span><input class="inp" id="us-name" autocapitalize="off" spellcheck="false" value="' + esc(u.username || '') + '"></label>' +
    '</div>' +
    (u.client_id ? '' : '<label class="fld"><span>סיסמה *</span><input class="inp" id="us-pass" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"><button type="button" class="pass-eye btn ghost sm" data-act="pass-eye" data-id="us-pass" title="הצג/הסתר סיסמה">👁</button></label>') +
    '<div class="f2">' +
      '<label class="fld"><span>תפקיד</span><select class="inp" id="us-role">' +
        '<option value="manager"' + (isAdminOf(u) ? '' : ' selected') + '>מנהל</option>' +
        '<option value="admin"' + (isAdminOf(u) ? ' selected' : '') + '>בעלים</option></select></label>' +
      '<label class="active-chk fld chk"><input type="checkbox" id="us-active"' +
        (u.client_id ? (u.active ? ' checked' : '') : ' checked') + '><span>משתמש פעיל</span></label>' +
    '</div>';
  var foot = '<button class="btn ghost" data-act="modal-close">ביטול</button>' +
    '<button class="btn" data-act="user-save" data-ksave data-id="' + (u.client_id || '') + '">שמירה</button>';
  openModal(u.client_id ? MSG_EDIT_USER : MSG_NEW_USER, body, foot);
}

function saveUser(id) {
  var full = val('us-full'), uname = val('us-name');
  if (!full || !uname) { toast(MSG_NEED_FULL_AND_USER, null, 'bad'); return Promise.resolve(); }
  var row = {
    full_name: full, username: uname,
    role: val('us-role') || 'manager',
    active: checked('us-active')
  };
  // כתיבת משתמש חייבת להגיע לענן כדי שהטביעה תגיע לשאר המכשירים — בלי רשת היא נכשלת ברעש.
  if (!navigator.onLine) { toast(MSG_OFF_USER_WRITE, null, 'bad'); return Promise.resolve(); }
  if (!id) {
    var p = $('#us-pass') ? $('#us-pass').value : '';
    if (!p) { toast(MSG_NEED_PASS, null, 'bad'); return Promise.resolve(); }
    if (!PASS_SIX_RE.test(p)) { toast(MSG_PASS_SIX, null, 'bad'); return Promise.resolve(); }
    return authPassFields(p).then(function (pf) {
      return writeUser(null, Object.assign({}, row, pf)).then(warnIfNoFp)
        .then(function (r) { if (r && !r.error) plTouch(); return r; });
    });
  }
  // עריכת משתמש קיים אינה נוגעת בסיסמה ולכן גם לא בטביעה.
  // כתיבה שהצליחה מקדמת את אות הפולינג — g_users נמשכת כמו כל טבלה, ובלי הקידום השינוי אינו נראה במכשיר אחר.
  return writeUser(id, row).then(function (r) { if (r && !r.error) plTouch(); return r; });
}

// שמירה בלי טביעה אינה «נשמר בהצלחה» — הכניסה האופליין של המשתמש לא תעבוד, ואומרים את זה.
function warnIfNoFp(r) {
  if (r && r.noFp) toast(MSG_SAVED_NO_FP, null, 'bad');
  return r;
}

function formPassword(u) {
  openModal(MSG_PASS_CHANGE_FOR + u.full_name,
    '<label class="fld"><span>סיסמה חדשה *</span><input class="inp" id="pw-new" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"><button type="button" class="pass-eye btn ghost sm" data-act="pass-eye" data-id="pw-new" title="הצג/הסתר סיסמה">👁</button></label>',
    '<button class="btn ghost" data-act="modal-close">ביטול</button>' +
    '<button class="btn" data-act="pass-save" data-ksave data-id="' + u.client_id + '">שמירה</button>');
  var el = $('#pw-new'); if (el) el.focus();
}

// הסיסמה הנוכחית אינה נבדקת מול תבנית שש-הספרות — אכיפה כאן הייתה נועלת בחוץ סיסמה ותיקה ותקפה.
function formMyPassword() {
  openModal(MSG_MY_PASS_TITLE,
    '<label class="fld"><span>סיסמה נוכחית *</span><input class="inp" id="mp-cur" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></label>' +
    '<label class="fld"><span>סיסמה חדשה *</span><input class="inp" id="mp-new" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>' +
    '<label class="fld"><span>אימות סיסמה חדשה *</span><input class="inp" id="mp-new2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>',
    '<button class="btn ghost" data-act="modal-close">ביטול</button>' +
    '<button class="btn" data-act="my-pass-save" data-ksave>שמירה</button>');
  var el = $('#mp-cur'); if (el) el.focus();
}

function formSaveMyPassword() {
  var c1 = $('#mp-cur'), n1 = $('#mp-new'), n2 = $('#mp-new2');
  if (!c1 || !n1 || !n2) { uiNoDialog('formSaveMyPassword', 'mp-cur'); return; }
  var cur = c1.value.trim(), p1 = n1.value.trim(), p2 = n2.value.trim();
  if (!cur || !p1 || !p2) { toast(MSG_FILL_ALL, null, 'bad'); return; }
  if (!PASS_SIX_RE.test(p1)) { toast(MSG_PASS_SIX, null, 'bad'); return; }
  if (p1 !== p2) { toast(MSG_PASS_MISMATCH, null, 'bad'); return; }
  if (!sb || !navigator.onLine) { toast(MSG_OFF_USER_WRITE, null, 'bad'); return; }
  // האימות מול הענן רגעי בלבד — הסיסמה הנוכחית אינה נכתבת לשום מקום.
  return runSave(function () {
    // האימות מול הטביעה; הטקסט הגלוי אינו נשלף.
    return withTimeout(sb.from(authUsersTable()).select('client_id,active,pass_salt,pass_fp').eq('client_id', state.user.client_id).limit(1))
      .then(function (res) {
        if (res && res.error) throw res.error;
        var u = res && Array.isArray(res.data) && res.data[0];
        if (!u) throw new Error('הסיסמה הנוכחית שגויה');
        return authVerify(u, cur).then(function (v) {
          if (v !== 'ok') throw new Error('הסיסמה הנוכחית שגויה');
          return authPassFields(p1);
        });
      })
      .then(function (pf) { return writeUser(state.user.client_id, pf).then(warnIfNoFp)
        .then(function (r) { if (r && !r.error) plTouch(); return r; }); });
  }, 'הסיסמה עודכנה');
}

// ── החלפת משתמש ──
// האימות הוא authVerify, אותה הכרעה של הכניסה — מסלול שני היה בודק active או טביעה אחרת.
// אין החלפה בלי סיסמה — אחרת כל מכשיר פתוח הוא מעבר חופשי לכל זהות שבמראה.
function formSwitchUser() {
  var others = usersGet().filter(function (u) {
    return u && u.active !== false && String(u.client_id) !== String(state.user.client_id);
  });
  if (!others.length) { toast(MSG_NO_OTHER_USER_LOCAL, null, 'bad'); return; }
  openModal(MSG_SWITCH_USER,
    '<label class="fld"><span>משתמש</span><select class="inp" id="sw-user" aria-label="המשתמש שאליו עוברים">' +
      others.map(function (u) {
        return '<option value="' + esc(u.client_id) + '">' + esc(u.full_name || u.username) + '</option>';
      }).join('') +
    '</select></label>' +
    '<label class="fld"><span>סיסמה *</span><input class="inp" id="sw-pass" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></label>',
    '<button class="btn ghost" data-act="modal-close">ביטול</button>' +
    '<button class="btn" data-act="switch-confirm" data-ksave>כניסה</button>');
  var el = $('#sw-pass'); if (el) el.focus();
}

function formTarget(month) {
  var m = month || state.month;
  var cur = 0;
  for (var i = 0; i < state.targets.length; i++) if (state.targets[i].month === m) cur = num(state.targets[i].amount);
  openModal(MSG_MONTH_GOAL,
    '<div class="f2">' +
      '<label class="fld"><span>חודש *</span><input class="inp" type="month" id="tg-month" value="' + esc(m) + '"></label>' +
      '<label class="fld"><span>סכום יעד *</span><input class="inp" id="tg-amount" inputmode="decimal" value="' + (cur || '') + '"></label>' +
    '</div>',
    '<button class="btn ghost" data-act="modal-close">ביטול</button>' +
    '<button class="btn" data-act="target-save" data-ksave>שמירה</button>');
}

function saveTarget() {
  var m = val('tg-month');
  if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(m)) { toast(MSG_PICK_VALID_MONTH, null, 'bad'); return Promise.resolve(); }
  var amount = num(val('tg-amount'));
  return upsertBy('g_targets', 'month', { month: m, amount: amount });
}

// ── פעולות ──
// אין onclick עם קוד בתוך מאפיין — המסכים נבנים כמחרוזות, וגרש בשם תורם שובר את הקוד והופך הזרקה לביצוע.
// saveRefresh אינה ממתינה לרשת — הכתיבה כבר במראה ובתור, והסנכרון מרנדר שוב ברקע.
function saveRefresh() {
  applyMirrorToState();
  render();
  pendRender();
}
function findUser(id) {
  for (var i = 0; i < state.users.length; i++) if (idEq(state.users[i].client_id, id)) return state.users[i];
  return null;
}
function findTask(id) {
  for (var i = 0; i < state.tasks.length; i++) if (idEq(state.tasks[i].id, id)) return state.tasks[i];
  return null;
}

var DOM_ACTIONS = {
  'sw-apply':            function (el) { swApply(el); },
  'sw-dismiss':          function () { swHideUpdate(); },
  // התראות התשתית מנותבות במפה — הכפתור נבנה ב-JS, ומאזין ישיר עליו היה מחוץ למנגנון.
  'ls-alert-close':      function () { var el = document.getElementById('ls-alert'); if (el) el.remove(); },
  'pend-alert-ok':       function () { pendAlertDismiss(); },
  'lk-stay':             function () { lkReset(); },
  'tab': function (el) { go(el.dataset.tab); },
  'switch-user': function () { formSwitchUser(); },
  'switch-confirm': function (el) {
    var id = $('#sw-user') ? $('#sw-user').value : '';
    var p  = $('#sw-pass') ? $('#sw-pass').value : '';
    if (!id || !p) { toast(MSG_PICK_USER_AND_PASS, null, 'bad'); return; }
    var cu = null, arr = usersGet();
    for (var i = 0; i < arr.length; i++) if (arr[i] && String(arr[i].client_id) === String(id)) cu = arr[i];
    // ההודעות נשארות נבדלות — «אין במה לאמת» אינו «סיסמה שגויה», והודעה מאוחדת שולחת להקליד שוב סיסמה נכונה.
    if (!cu) { authLog(false, 'switch_unknown_user_offline', String(id)); toast(MSG_OFF_UNKNOWN, null, 'bad'); return; }
    return authVerify(cu, p).then(function (v) {
      if (v === 'no-fp')     { authLog(false, 'switch_no_fp_offline', cu.username); toast(MSG_OFF_NO_FP, null, 'bad'); return; }
      if (v === 'no-crypto') { authLog(false, 'switch_no_crypto_offline', cu.username); toast(MSG_OFF_NO_CRYPTO, null, 'bad'); return; }
      if (v !== 'ok')        { authLog(false, 'switch_wrong_credentials_offline', cu.username); toast(MSG_BAD_LOGIN, null, 'bad'); return; }
      closeModal();
      ctxSwitch();
      state.user = { client_id: cu.client_id, username: cu.username, full_name: cu.full_name, role: cu.role };
      authLog(true, 'switch_offline', cu.username);
      state.screen = 'home';
      state.donorId = null;
      boot();
      toast(MSG_SWITCHED_TO + (cu.full_name || cu.username), null, 'good');
    }, function (e) { console.warn('[switch]', e); authLog(false, 'switch_no_crypto_offline', cu.username); toast(MSG_OFF_NO_CRYPTO, null, 'bad'); });
  },
  'logout': function () { doLogout(); },
  'modal-close': function () { closeModal(); },
  'ask-yes': function () { closeAsk(true); },
  'ask-no': function () { closeAsk(false); },

  'month': function (el) { state.month = shiftMonth(state.month, +el.dataset.d); render(); },

  'fab': function () {
    openModal(MSG_WHAT_TO_ADD,
      '<div class="chooser">' +
        '<button data-act="txn-new"><span class="ic">💰</span><span>תנועה<small>רישום כסף שנכנס</small></span></button>' +
        '<button data-act="task-new"><span class="ic">📋</span><span>משימה<small>מטלה לקנבן</small></span></button>' +
        '<button data-act="pledge-new"><span class="ic">🤝</span><span>התחייבות<small>הבטחת תרומה</small></span></button>' +
      '</div>', '');
  },

  // ── תורמים ──
  'donor-new': function () { formDonor(null); },
  'donor-edit': function (el) { formDonor(donorById(el.dataset.id)); },
  'donor-save': function (el) { return runSave(function () { return saveDonor(el.dataset.id); }, 'נשמר'); },
  'donor-open': function (el) {
    state.screen = 'donors';
    state.donorId = el.dataset.id;
    render();
  },
  'donor-back': function () { state.donorId = null; render(); },
  'vip-toggle': function (el) {
    var d = donorById(el.dataset.id);
    if (!d) return;
    return update('g_donors', d.client_id, { is_vip: !d.is_vip })
      .then(function () { d.is_vip = !d.is_vip; render(); })
      .catch(errToast);
  },
  'notes-save': function (el) {
    var notes = $('#donor-notes') ? $('#donor-notes').value : '';
    return update('g_donors', el.dataset.id, { notes: notes || null })
      .then(function () {
        var d = donorById(el.dataset.id);
        if (d) d.notes = notes;
        toast(MSG_NOTES_SAVED, null, 'good');
      })
      .catch(errToast);
  },
  'donor-del': function (el) {
    var d = donorById(el.dataset.id);
    if (!d) return;
    var hasData = pledgesOfDonor(d.client_id).length || txnsOfDonor(d.client_id).length;
    return ask(MSG_DEL_DONOR_TITLE,
      hasData
        ? MSG_DEL_DONOR_LINKED
        : MSG_DEL_QUOTE_PRE + d.name + MSG_DEL_QUOTE_POST,
      MSG_DELETE_ACT
    ).then(function (yes) {
      if (!yes) return;
      softDelete('g_donors', d.client_id)
        .then(function () { state.donorId = null; return afterSave('התורם נמחק'); })
        .catch(errToast);
    });
  },

  // ── תנועות התורם ──
  'txn-new': function (el) { formTxn(null, el.dataset.donor || ''); },
  'txn-edit': function (el) {
    var t = null;
    for (var i = 0; i < state.txns.length; i++) if (idEq(state.txns[i].id, el.dataset.id)) t = state.txns[i];
    if (t) formTxn(t);
  },
  'txn-save': function (el) { return runSave(function () { return saveTxn(el.dataset.id); }, 'התנועה נשמרה'); },
  'txn-del': function (el) {
    return ask(MSG_DEL_TXN_TITLE, MSG_DEL_TXN_BODY, MSG_DELETE_ACT).then(function (yes) {
      if (!yes) return;
      softDelete('g_txns', el.dataset.id).then(function () { return afterSave('נמחק'); }).catch(errToast);

  },

  'pledge-del': function (el) {
    return ask(MSG_DEL_PLEDGE_TITLE, MSG_DEL_PLEDGE_BODY, MSG_DELETE_ACT).then(function (yes) {
      if (!yes) return;
      softDelete('g_pledges', el.dataset.id).then(function () { return afterSave('נמחק'); }).catch(errToast);
    });
  },
  'pf-clear': function () {

  // ── משימות ──
  'task-new': function () { formTask(null); },
  'task-open': function (el) { formTask(findTask(el.dataset.id)); },
  'task-save': function (el) { return runSave(function () { return saveTask(el.dataset.id); }, 'המשימה נשמרה'); },
  'task-del': function (el) {
    return ask(MSG_DEL_TASK_TITLE, MSG_DEL_TASK_BODY, MSG_DELETE_ACT).then(function (yes) {
      if (!yes) return;
      softDelete('g_tasks', el.dataset.id).then(function () { return afterSave('נמחק'); }).catch(errToast);
    });
  },

  // ── הגדרות: משתמשים ──
  'user-new': function () { formUser(null); },
  'user-edit': function (el) { formUser(findUser(el.dataset.id)); },
  'user-save': function (el) { return runSave(function () { return saveUser(el.dataset.id); }, 'המשתמש נשמר'); },
  'user-pass': function (el) { var u = findUser(el.dataset.id); if (u) formPassword(u); },
  'pass-save': function (el) {
    var p = $('#pw-new') ? $('#pw-new').value : '';
    if (!p) { toast(MSG_NEED_PASS, null, 'bad'); return; }
    if (!PASS_SIX_RE.test(p)) { toast(MSG_PASS_SIX, null, 'bad'); return; }
    if (!navigator.onLine) { toast(MSG_OFF_USER_WRITE, null, 'bad'); return; }
    return runSave(function () {
      return authPassFields(p).then(function (pf) {
        return writeUser(el.dataset.id, pf).then(warnIfNoFp);
      });
    }, 'הסיסמה עודכנה');
  },
  'my-pass': function () { formMyPassword(); },
  // הצגת הסיסמה — לשדות שבהם הבעלים קובע סיסמה לאדם אחר אין שדה אימות, והסתרה בלי דרך לראות הייתה נועלת בחוץ בשקט.
  'pass-eye': function (el) {
    var f = $('#' + el.dataset.id);
    if (f) f.type = (f.type === 'password' ? 'text' : 'password');
  },
  'my-pass-save': function () { return formSaveMyPassword(); },
  'user-toggle': function (el) {
    var u = findUser(el.dataset.id);
    if (!u) return;
    if (idEq(u.client_id, state.user.client_id) && u.active) { toast(MSG_NO_SELF_DISABLE, null, 'bad'); return; }
    if (!navigator.onLine) { toast(MSG_OFF_USER_WRITE, null, 'bad'); return; }
    // ההשבתה חייבת להגיע לענן — משתמש מושבת שנשאר במראה של מכשיר אחר נשאר בר-כניסה אופליין.
    return writeUser(u.client_id, { active: !u.active })
      .then(function () { render(); toast(MSG_UPDATED, null, 'good'); })
      .catch(errToast);
  },

  // ── הגדרות: רשימות ──
  'cfg-add': function (el) {
    var key = el.dataset.key;
    var input = $('#cfg-add-' + key);
    var v = input ? input.value.trim() : '';
    if (!v) { toast(MSG_NEED_VALUE, null, 'bad'); return; }
    var list = (state.config[key] || []).slice();
    if (uniqHas(list, v)) { toast(MSG_VALUE_EXISTS2, null, 'bad'); return; }
    list.push(v);
    return runSave(function () { return saveConfigList(key, list); }, 'נוסף');
  },
  'cfg-edit': function (el) {
    var key = el.dataset.key, i = +el.dataset.i;
    var list = (state.config[key] || []).slice();
    openModal(MSG_EDIT_VALUE,
      '<label class="fld"><span>ערך</span><input class="inp" id="cfg-v" value="' + esc(list[i] || '') + '"></label>' +
      '<div class="note">שינוי הערך אינו משנה רשומות קיימות שכבר משתמשות בערך הישן.</div>',
      '<button class="btn ghost" data-act="modal-close">ביטול</button>' +
      '<button class="btn" data-act="cfg-edit-save" data-ksave data-key="' + key + '" data-i="' + i + '">שמירה</button>');
  },
  'cfg-edit-save': function (el) {
    var key = el.dataset.key, i = +el.dataset.i;
    var v = val('cfg-v');
    if (!v) { toast(MSG_NEED_VALUE, null, 'bad'); return; }
    var list = (state.config[key] || []).slice();
    list[i] = v;
    return runSave(function () { return saveConfigList(key, list); }, 'נשמר');
  },
  'cfg-del': function (el) {
    var key = el.dataset.key, i = +el.dataset.i;
    var list = (state.config[key] || []).slice();
    return ask(MSG_REMOVE_VALUE_TITLE, MSG_REMOVE_QUOTE_PRE + list[i] + MSG_REMOVE_QUOTE_POST, MSG_REMOVE_ACT)
      .then(function (yes) {
        if (!yes) return;
        list.splice(i, 1);
        saveConfigList(key, list).then(function () { return afterSave('הוסר'); }).catch(errToast);
      });
  },

  // ── הגדרות: יעדים ──
  'target-set': function (el) { formTarget(el.dataset.month || state.month); },
  'target-save': function () { return runSave(saveTarget, 'היעד נשמר'); },
  'reload':            function () { location.reload(); },
  'login':             function () { return doLogin(); },
  'dp-pick':           function (el) { pickerSet(el.closest('.picker'), donorById(el.dataset.id)); },
  'dp-new':            function (el) { pickerNew(el.closest('.picker')); },
  'dp-clear':          function (el) { pickerSet(el.closest('.picker'), null); },
  'dp-n-cancel':       function (el) { var r = el.closest('.picker');
                                       $('.dp-new', r).classList.add('hidden'); $('.dp-q', r).focus(); },
  'dp-n-save':         function (el) { return pickerSave(el.closest('.picker')); },
};

// ── מאזינים גלובליים ──
// if (el.tagName === 'A') return אינו קישוט — אחרת קישור בתוך אזור data-act מקבל preventDefault; אין למחוק גם כשאין קישור כזה.
// סגירת הרקע קודמת לניתוב — לחיצה על הרקע אינה נושאת data-act.
document.addEventListener('click', function (e) {
  if (modalBackdrop(e)) return;
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fn = DOM_ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') return;
  e.preventDefault();
  actRun(el, fn);
});

// שמירה בשדה עריכה קודמת לסגירת המודאל — אחרת Escape בשדה שבתוך מודאל היה סוגר אותו במקום לבטל את השדה.
document.addEventListener('keydown', function (e) {
  if (ksKey(e)) return;
  modalEsc(e);
});

// החיפוש מרנדר רק את הרשימה והמונה — רינדור מלא בונה מחדש את השדה ומאבד את הפוקוס אחרי כל תו.
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.id === 'donor-q') {
    state.donorSearch = el.value;
    var box = $('#donor-list');
    if (box) box.innerHTML = donorRowsHTML(donorMatches(state.donorSearch));
    var cnt = $('#view .card > h2 .cnt');
    if (cnt) cnt.textContent = donorMatches(state.donorSearch).length;
    return;
  }
  if (el.classList && el.classList.contains('dp-q')) pickerPaint(el.closest('.picker'));
});

document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.dataset && el.dataset.inp === 'stage') {
    moveTask(el.dataset.id, el.value);
    return;
  }
  var map = { 'pf-agent': 'agent', 'pf-status': 'status', 'pf-cause': 'cause', 'pf-from': 'from', 'pf-to': 'to' };
  if (el.id && map[el.id]) {
    state.pf[map[el.id]] = el.value;
    refreshPledges();
  }
});

// focusin ולא focus — focus אינו עולה בעץ, ומאזין על השדה עצמו מת עם המודאל שנבנה מחדש.
document.addEventListener('focusin', function (e) {
  if (e.target.classList && e.target.classList.contains('dp-q')) pickerPaint(e.target.closest('.picker'));
});


// ── עלייה ──
// אין להזיז את mirrorLoad אחרי הסנכרון הראשון — המסך עולה מהדיסק לפני שנוגעים ברשת.
function boot() {
  // שני מסלולי הכניסה, המקוון והאופליין, מגיעים לכאן — ולכן זו נקודת הדריכה האחת של הנעילה.
  try { lkReset(); } catch (e) { console.warn('[lk] lkReset', e); }
  viewBare(VIEW_LOADING);
  // קריאה מהעותק המקומי לפני כל נגיעה ברשת — זה ההבדל בין עבודה אופליין לספינר.
  applyMirrorToState();
  pendRender();

  if (mirrorHasData()) {
    render();
    syncNow();
    return Promise.resolve();
  }

  // אין עותק מקומי כלל — כאן רשת היא חובה.
  return syncNow().then(function (okPull) {
    if (okPull || mirrorHasData()) { render(); return; }
    viewBare('<div class="auth"><div class="auth-card">' +
      '<h1>שגיאת טעינה</h1><div class="sub">אין עדיין עותק מקומי של הנתונים, ולא הצלחנו לטעון מהשרת. ' +
      'התחברו לרשת פעם אחת — מכאן והלאה האפליקציה תעבוד גם בלעדיה.</div>' +
      '<button class="reload-btn btn block" data-act="reload">רענון</button>' +
      '</div></div>');
  });
}

function start() {
  if (!window.supabase || !window.supabase.createClient) {
    viewBare('<div class="auth"><div class="auth-card"><h1>שגיאת טעינה</h1>' +
      '<div class="sub">ספריית Supabase לא נטענה. בדקו את החיבור לאינטרנט ורעננו.</div>' +
      '<button class="btn block" data-act="reload">רענון</button></div></div>');
    return;
  }
  sb = sbWatch(window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false }
  }));

  // מדידה ופינוי יזום לפני טעינת המראה — כדי שהמשיכה שאחריה תכתוב לאחסון שכבר יש בו מקום.
  try { lsBoot(); } catch (e) { console.warn('[ls] lsBoot', e); }
  mirrorBoot();
  // סימוני ההמתנה נטענים לפני הרינדור הראשון — כך שפעולה שלא עלתה בסשן הקודם מוצגת כממתינה מיד.
  try { pendBoot(); } catch (e) { console.warn('[pend] pendBoot', e); }
  try { tombBoot(); } catch (e) { console.warn('[tomb] tombBoot', e); }
  try { eraKick(); } catch (e) { console.warn('[era] eraKick', e); }
  // הגיבוי מופעל בעלייה ולא אחרי משיכה שהצליחה — אחרת בתקופה בלי סנכרון הוא מושבת בלי שאיש יודע.
  try { bkBoot(); } catch (e) { console.warn('[bk] bkBoot', e); }
  try { rtyBoot(); } catch (e) { console.warn('[rty] rtyBoot', e); }
  try { plBoot(); } catch (e) { console.warn('[pl] plBoot', e); }
  try { hwBoot(); } catch (e) { console.warn('[hw] hwBoot', e); }
  try { lkBoot(); } catch (e) { console.warn('[lk] lkBoot', e); }

  // אין שחזור סשן — סשן מ-localStorage בלי תפוגה משאיר מחובר לנצח במכשיר משותף ומוריד את role לדיסק.
  // הכניסה האופליין אינה תלויה בסשן — היא מוכרעת ב-authVerify מול pass_fp שבמראה.
  renderLogin();
}

start();
bootOk();

})();
</script>
</body>
</html>
