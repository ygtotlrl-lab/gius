<script>
// ⛔ חייב לרוץ לפני שכל כתובת יחסית מפוענחת —
// ה-service worker מגיש נתיבים עמוקים (/gius/anything/here) עם אותה קליפה,
// ובכתובת כזו כל href יחסי היה נפתר רמה או שתיים עמוק מדי: manifest.json,
// sw.js והאייקונים היו מחזירים 404, וה-worker היה נרשם ב-scope שגוי.
// לכן מקבעים <base> בשורש האפליקציה.
(function () {
  var p = location.pathname;
  var m = p.match(/^(.*?\/gius\/)/);
  var b = document.createElement('base');
  b.href = m ? m[1] : p.replace(/[^/]*$/, '');
  document.head.appendChild(b);
})();
</script>

/* ══════════════════════════════════════════════════════════════════════════
   המראה — טעינה מהדיסק, סינון סודות, מיזוג ותצוגה
   ══════════════════════════════════════════════════════════════════════════
   ⚠️ «מראה» הוא העותק המקומי המלא של כל שבע הטבלאות, כולל tombstones —
   ולא מטמון מהירות. `applyMirrorToState` היא הדרך היחידה למלא את `state`

// ⭐ המשיכה מנקה את מה שבא מהענן, וכתיבה מקומית עוקפת אותה — ⛔ ושער הדיסק
// הוא שמונע גם מנתיב חדש להדליף.

  if (t === KV_TABLE) rows = (rows || []).filter(function (r) { return !(r && String(r.key) === G_STAMP_KEY); });

/* ═══ מראת המשתמשים — שני נתיבי כתיבה, מסנן אחד ══════════════════════════

   נכנס למראה רק בסנכרון הבא: ⭐ החלפת משתמש הייתה תלויה במשיכה מלאה
   מהענן, ⛔ בזמן שהשורה שלו כבר יושבת בזיכרון מהכניסה עצמה.

   ⛔⛔ **שני הנתיבים עוברים דרך `usersSanitize` — ואין שלישי.** זו הנקודה

// הנתיב החלקי — משתמש **בודד**, בלי לגעת בשאר. ⚠️ מיזוג שדות ולא החלפת

/* ------------------------------------------------- API כתיבה (מקומי-תחילה) */

  if (full[m.key] == null) full[m.key] = newClientId();
  if (!full.created_at) full.created_at = nowISO();
  full.updated_at = Date.now();
  if (m.soft) { if (full.deleted == null) full.deleted = false; if (full.deleted_at === undefined) full.deleted_at = null; }
  // ה-insert נשלח כ-upsert על המפתח הראשי: ניסיון חוזר אחרי תשובה שאבדה
  // ברשת לא ייכשל על מפתח כפול, ולכן ריקון התור אידמפוטנטי.
  var saved = upsertLocal(table, full);
  markLocal(table, full[m.key]);
  applyMirrorToState();
  return Promise.resolve(saved);
}

function update(table, id, patch) {
  var m = tableMeta(table);
  var p = Object.assign({}, patch, { updated_at: Date.now() });
  var row = Object.assign({}, p);
  row[m.key] = id;
  var saved = upsertLocal(table, row);
  markLocal(table, id);
  applyMirrorToState();
  return Promise.resolve(saved);
}


/*  ⛔ בן יורש את מחיקת האב — ⚠️ **מה נכנס**: שורת האב שנמחקה רכות ושורת
 *  הבן החיה; ⛔ **ומה מפיל**: בן שנשאר חי אחרי מחיקת האב, ⛔ ובן שנושא
 *  חותמת מחיקה משלו. ⭐ **ולמה המבנה קיים**: מחיקת האב והבן היא **אירוע
 *  אחד**, ⚠️ ושתי חותמות לאותה מחיקה הן שתי הכרעות במנוע המיזוג.
 *  ⛔ אל תחליף את החותמת ב-`Date.now()` — ⚠️ הבן היה נושא רגע שני,
 *  ⭐ ומכשיר שממזג היה מכריע עליו בנפרד מהאב. */
function pcChildKill(parent, kid) {
  return Object.assign({}, kid, {
    deleted: !!parent.deleted,
    deleted_at: (parent.deleted_at === undefined) ? null : parent.deleted_at,
    deleted_by: (parent.deleted_by === undefined) ? null : parent.deleted_by,
    updated_at: parent.updated_at
  });
}

/*  ⛔ מפת האב-ובן — ⚠️ **מה נכנס**: שם טבלת האב, בניה ועמודת המפתח שבהם;
 *  ⛔ **ומה מפיל**: בן שיש לו מפתח אב במסד ואינו כאן. ⭐ **ולמה המבנה
 *  קיים**: לתנועה **שני** אבות — התורם חובה וההתחייבות אופציונלית,
 *  ⚠️ והתורם נשאל ראשון: ⛔ מחיקתו מפילה את התנועה בכל מקרה. */
var PC_CHILDREN = {
  g_donors: [{ t: 'g_pledges', fk: 'donor_client_id' }, { t: 'g_txns', fk: 'donor_client_id' }],
  g_pledges: [{ t: 'g_txns', fk: 'pledge_client_id' }]
};

/*  ⛔ מחיקת האב מגיעה לבניו באותה נשימה — ⚠️ הכתיבה עוברת ב-`upsertLocal`
 *  ⛔ ולא ב-`update`: ⭐ הוא חותם `Date.now()` על כל שורה, ⛔ וזה בדיוק
 *  מה שהיה מבטל את ירושת החותמת. */
function pcCascadeDelete(table, parent) {
  var kids = PC_CHILDREN[table] || [], pid = parent[tableMeta(table).key], n = 0;
  for (var i = 0; i < kids.length; i++) {
    var k = kids[i], km = tableMeta(k.t), arr = MIRROR[k.t] || [];
    for (var j = 0; j < arr.length; j++) {
      if (arr[j].deleted || !idEq(arr[j][k.fk], pid)) continue;
      var kid = pcChildKill(parent, arr[j]);
      upsertLocal(k.t, kid);
      markLocal(k.t, kid[km.key]);
      n++;
    }
  }
  if (n) applyMirrorToState();
  return n;
}

function softDelete(table, id) {
  return update(table, id, { deleted: true, deleted_at: nowISO() })
    .then(function (row) { pcCascadeDelete(table, row); return row; });
}

// upsert לפי עמודה שאינה המפתח הראשי (חודש ביעדים, key ברשימות).
function upsertBy(table, conflict, row) {
  var m = tableMeta(table);
  var full = Object.assign({}, row, { updated_at: Date.now() });
  var arr = MIRROR[table] || (MIRROR[table] = []);
  var cur = findRow(arr, conflict, full[conflict]);
  if (cur && cur[m.key] != null) full[m.key] = cur[m.key];
  else if (full[m.key] == null && m.key !== conflict) full[m.key] = newClientId();
  if (cur) Object.keys(full).forEach(function (k) { cur[k] = full[k]; });
  else arr.push(full);
  markLocal(table, full[m.key]);
  applyMirrorToState();
  return Promise.resolve(cur || full);
}

function saveConfigList(key, list) {
  return upsertBy(KV_TABLE, 'key', { key: key, value: JSON.stringify(list) });
}

/*  ⛔ הדבר היחיד שנבדל בין שלוש האפליקציות שיש בהן כניסה — ⚠️ הלקוח,
 *  שם הטבלה, הודעת הניתוק, ומה נעשה **אחרי** שהתשובה חזרה: ⭐ הכתיבה
 *  עצמה זהה בית-לבית.
 *  ⚠️ **וכאן `after` עושה את העבודה הכבדה** — ⛔ הכתיבה נכנסת למראה
 *  **בלי `pendMark`**: ⭐ מה שכבר בענן אינו ממתין לכלום, ⛔ וסימון ⏳ עליו
 *  היה נותן לו לנצח במיזוג ולהסתיר את השורה האמיתית שבענן. */
var USER_CFG = {
  ready: function () { return !!sb && navigator.onLine; },
  /*  ⛔ ההודעה נקראת בזמן הקריאה ⛔ ולא בזמן ההשמה — ⚠️ הקבוע מוצהר
   *  **מתחת** לבלוק הזה, ⭐ וקריאה בהשמה הייתה נותנת `undefined`. */
  offMsg: function () { return MSG_OFF_USER_WRITE; },
  from: function () { return sb.from('g_users'); },
  run: function (q) { return withTimeout(q); },
  missingFp: gIsMissingFpCol,
  after: function (res, body) {
    /*  ⛔ הכשל נזרק כאן ⛔ ולא בבלוק — ⚠️ שלושת הקוראים כאן עובדים
     *  ב-`catch`, ⭐ ובשתי האחיות הקוראים בודקים `res.error`. */
    if (!res || res.error) throw ((res && res.error) || new Error(MSG_SERVER_ERR));
    var saved = (Array.isArray(res.data) && res.data[0]) || body;
    usersCacheSave(saved);
    /*  ⛔ העֵד נכתב כאן ⛔ ולא במשיכה — ⚠️ זו כתיבה לענן שחזרה `ok`,
     *  ⭐ ומשיכה אינה ראיה שהשורה שלנו עלתה. */
    _gMarkPushed('g_users');
    applyMirrorToState();
    /*  ⭐ `g_users` היא אחת משבע הטבלאות שנמשכות, ⛔ ולכן גם כתיבה אליה
     *  מקדמת את החותמת — ⚠️ אחרת משתמש חדש לא היה מגיע למכשיר אחר עד
     *  לשינוי נתונים אחר לגמרי. */
    plTouch();
    /*  ⛔ «ללא טביעה» משני מקורות: ⚠️ העמודות טרם קיימות, ⛔ או שהגזירה
     *  עצמה נכשלה ולכן `pass_fp` נכתב ריק לצד סיסמה חדשה. ⭐ הסימן הוא
     *  **נוכחות השדה** — ⚠️ הוא נכנס ל-`body` אך ורק כשנמסרה סיסמה. */
    return { noFp: !!res._noFp ||
      (Object.prototype.hasOwnProperty.call(body, 'pass_fp') && !body.pass_fp) };
  }
};

// גוזרת טביעה לסיסמה חדשה ומחזירה את שדות הכתיבה.
// ⛔ **כישלון גזירה מאפס את שני השדות ולא רק מדלג על הכתיבה** — טביעה ישנה
//    שנשארת הייתה ממשיכה לפתוח את הכניסה האופליין עם הסיסמה **הקודמת**,
//    לנצח — כלומר שינוי סיסמה שאינו משנה כלום מבחינת מי שמחזיק את המכשיר.
/* ⛔ **צעד ב — הכתיבה לטקסט הגלוי ירדה בהחלטת המנהל** ⚠️ ואין להחזירה:
   `g_users.password` הייתה קריאה לכל מי שהחזיק את מפתח ה-anon שב-`index.html`
   הציבורי, וה-RLS כאן פתוח בכוונה. ⛔ הפונקציה מחזירה שני שדות בלבד,
   ⭐ והם היחידים שהאימות נשען עליהם. */
function passFields(pass) {
  return gMakePassFp(pass).then(function (made) {
    return made ? { pass_salt: made.salt, pass_fp: made.fp }
                : { pass_salt: null, pass_fp: null };
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   דחיפת-מצב — מה שמקומי-וחדש-יותר עולה לענן
   ══════════════════════════════════════════════════════════════════════════
   התור היוצא הוחלף בדחיפת-מצב, השיטה המוכחת בשלוש האחיות. היא פשוטה יותר
   וחסינה יותר: **אין פריט שיכול "להיתקע" לבדו.** בתור, פעולה אחת שנכשלה
   כשל תוכן חסמה את כל מה שאחריה (FIFO) או הפכה ל-`dead` ונשארה תלויה;
   בדחיפת-מצב כל רשומה עומדת בפני עצמה, וכל סנכרון מתקן את מה שחסר.
   ══════════════════════════════════════════════════════════════════════════ */
function rowPendingKey(t, row) { return pendRowKey(t, row[tableMeta(t).key]); }

// מה צריך לעלות: אין מקבילה בענן, מקומי חדש יותר, **או עדיין מסומן ⏳**.
// ⛔ אין להסיר את הסעיף השלישי — ר' ההערה ב-mergeRows על חותמת שווה.
function dirtyRows(t, remoteByKey) {
  var m = tableMeta(t);
  return (MIRROR[t] || []).filter(function (l) {
    var k = String(l[m.key]);
    if (k === 'undefined' || k === 'null') return false;
    var r = remoteByKey[k];
    return !r || rowTs(l) > rowTs(r) || pendHas(pendRowKey(t, l[m.key]));
  });
}


/* ------------------------------------------------------------- משיכה */
// מחזירה `{ok, remote}` — `remote` היא מפת הענן פר-טבלה, והיא מה שמאפשר
// לדחיפה שאחריה לדעת מה מקומי-וחדש-יותר.
function syncPull() {
  if (_pulling || !sb) return Promise.resolve({ ok: false, remote: {} });
  _pulling = true;
  /*  ⛔ ההקשר נלכד בכניסה ⛔ ונבדק לפני המיזוג — ⚠️ המחזור מושך, ממזג
   *  וכותב, ⭐ והמשתמש יכול להתחלף בין המשיכה לכתיבה: ⛔ מה שנמזג עבור
   *  הקודם היה יורד לדיסק אחרי שהחדש כבר נכנס. */
  var _ep = ctxEpoch();
  var remoteMaps = {};
  return Promise.all(TABLES.map(function (m) {
    // ⚠️ בלי `.eq('deleted', false)` — חייבים גם את ה-tombstones, אחרת מחיקה
    //    שנעשתה במכשיר אחר לא תגיע לכאן לעולם. הסינון ב-`liveRows()`.
    /*  ⛔ המשיכה **מלאה** ⛔ ואין לה חלון — ⚠️ מנוע ההכרעה חייב את כל
     *  הרשומות, ⭐ ורשומה שלא נמשכה נקראת «נמחקה». ⚠️ מה שכן נוסף הוא
     *  **העימוד** — ⛔ עד כאן `select('*')` הביא את הטבלה בבקשה אחת,
     *  ⭐ וביום ש-`db-max-rows` יוגדר היא הייתה נחתכת **בשקט**.
     *  ⛔ והסדר הוא `m.key` ⛔ ולא `m.order` — ⚠️ `m.order` הוא סדר
     *  **תצוגה** שעשוי להיות ריק, ⭐ והעימוד דורש מפתח יציב וייחודי. */
    return _rowsPaged(function () {
      return sb.from(m.t).select('*');
    }, m.key, null)
      .then(function (rows) { return { m: m, res: rows ? { data: rows, error: null }
                                                       : { data: null, error: { message: 'rows:' + m.t } } }; },
            function (e) { return { m: m, res: { error: e } }; });
  })).then(function (list) {
    if (ctxStale(_ep)) return { ok: false, remote: {} };
    var errs = [];
    list.forEach(function (x) {
      if (!x.res || x.res.error || !Array.isArray(x.res.data)) { errs.push(x.m.t); return; }
      var rows = stripRows(x.m.t, x.res.data);
      hwNoteCloud(mirrorKey(x.m.t), rows);   // ראיה עננית לשער הדיסק
      var map = {};
      rows.forEach(function (r) { map[String(r[x.m.key])] = r; });
      remoteMaps[x.m.t] = map;
      var merged = mergeRows(MIRROR[x.m.t], rows, x.m.key,
        function (k) { return pendHas(pendRowKey(x.m.t, k)); });
      // ⚠️ מראת המשתמשים נשמרת דרך **הנתיב המלא** של המודול שלה,
      // אותו מסנן בדיוק שמשמש את הנתיב החלקי. ר' `usersSanitize`.
      if (x.m.t === 'g_users') usersCacheSaveAll(merged);
      else { MIRROR[x.m.t] = merged; mirrorSave(x.m.t); }
    });
    applyMirrorToState();
    if (!errs.length) {
      _lastPullOk = Date.now();
      // ⛔ הגיבוי היומי **אינו** נתלה כאן — הניסוח הראשון
      //    תלה אותו במשיכה מלאה שהצליחה, כלומר בפעילות סנכרון. נקודת
      //    ההפעלה היא `bkBoot()` ב-`start()`. ⚠️ ריקון תור היומן כן נשאר:
      //    הוא ריקון חוזר, וכאן יש ראיה טרייה שהרשת עובדת.
      try { logFlush(); } catch (eB) { }
      /* ⛔ **אין כאן כתיבת עֵד פינוי** — ⚠️ עד כאן נכתבה מכאן
       *  `g_synced_at`, והיא חותמת **משיכה**: «ראיתי את מצב הענן» אינו
       *  «מה שאצלי עלה לשם». ⭐ העֵד הוא `_gPushedAt` פר-טבלה, והוא
       *  מסומן בסוף מעבר הדחיפה של אותה טבלה. */
      if (!_gPullLogged) { _gPullLogged = true; gSyncLog('pull', null, null); }
      if (_netWarned) { _netWarned = false; toast(MSG_SYNC_BACK, null, 'good'); }
    } else {
      console.warn('[sync] נכשלו:', errs.join(', '));
      if (!_netWarned) {
        _netWarned = true;
        toast(MSG_LOAD_FAIL_PRE + errs.join(', ') + MSG_MAYBE_STALE, null, 'bad');
      }
    }
    return { ok: !errs.length, remote: remoteMaps };
  }).catch(function (e) {
    console.warn('[sync]', e);
    return { ok: false, remote: {} };
  }).then(function (r) { _pulling = false; pendRender(); return r; });
}

// ⚠️ **משיכה קודמת לדחיפה** — הפוך מהסדר של התור. בדחיפת-מצב אי אפשר לדעת
// מה "מקומי וחדש יותר" בלי לראות קודם מה יש בענן, ודחיפה עיוורת הייתה
// מחזירה לחיים רשומה שנמחקה במכשיר אחר. `t0` נלקח לפני המשיכה: רשומה
// שנכתבה תוך כדי הסנכרון לא נבדקה ולא נדחפה, ולכן הסימון שלה חייב להישאר.
/* ⭐ יומן הפעולות של הסנכרון — דחיפה
   שהעלתה שורות נרשמת עם מספרן, ומשיכה מלאה נרשמת פעם אחת בסשן. הרישום
   דרך `logAction` שבמודול הגיבוי — fire-and-forget, לעולם אינו חוסם.
   ⛔ אין לרשום כל מחזור סנכרון — הפולינג רץ כל שלוש שניות,
   ו-`sh_sync_log` היא יומן ראיות ב-insert בלבד שאי-אפשר לדלל. */
function gSyncLog(action, key, recordCount, details) {
  try { logAction(action, key, recordCount, details); } catch (e) { }
}
var _gPullLogged = false;
function syncNow() {
  var t0 = Date.now();
  /*  ⛔ הדחיפה נבדקת מול ההקשר שנלכד לפני המשיכה — ⚠️ `res.remote` נמדד
   *  עבורו, ⭐ ודחיפה מולו אחרי החלפה זוקפת לחדש מה שנמזג לקודם. */
  var _ep = ctxEpoch();
  return syncPull().then(function (res) {
    if (!res.ok || ctxStale(_ep)) { render(); return false; }
    /*  ⛔ שער הרשת יושב כאן ⛔ ולא בשכבת הדחיפה — ⚠️ הוא תלוי בלקוח של
     *  האפליקציה, ⭐ ומעבר ריק היה מסמן את עֵד הפינוי בלי ראיה מהענן. */
    var p = (!sb || !navigator.onLine) ? Promise.resolve({ still: [] })
                                       : pushDirty(res.remote);
    return p.then(function (r) {
      if (ctxStale(_ep)) { render(); return false; }
      pendReconcile(r.still, t0);
      if (r && r.n) gSyncLog('push', null, r.n);
      render();
      return true;
    });
  });
}
// הסימונים מחושבים מחדש **רק אחרי משיכה שהצליחה**: זו ראיה ישירה ולא הסקה.
// מה שנכתב אחרי `t0` לא נבדק מול הענן ולכן אינו מנוקה.
function pendReconcile(still, t0) {
  var want = {};
  (still || []).forEach(function (k) { want[k] = 1; });
  pendMarkMany(Object.keys(want));
  var m = pendAll(), gone = [];
  Object.keys(m).forEach(function (k) { if (!want[k] && m[k] < t0) gone.push(k); });
  pendClearMany(gone);
}
// ⛔ **אין כאן יותר פולינג שדוחף ואין משיכה מלאה תקופתית** — עד
//    כאן רץ `setInterval` שמשך את שבע הטבלאות כל עשרים שניות ודחף בכל
//    פעם שהיה משהו ממתין, בלי שום ראיה שמשהו בענן השתנה.
//    מה שמכסה את זה במלואו: הדחיפה **מונעת-האירוע** (`schedulePush()`
//    אחרי כל כתיבה מקומית), מודול הניסיון החוזר שנדרך
//    מ-`rtyNote()` ורץ רק כשהתור אינו ריק, והמשיכה המותנית של `plBoot()`
//    — שקוראת שורה אחת ומושכת רק כשהיא התקדמה, כל שלוש שניות.
/* ══════════════════════════════════════════════════════════════════════════
   נגזרות — כל חישובי הכסף, בזמן ריצה בלבד
   ══════════════════════════════════════════════════════════════════════════
   ⛔ **אין כאן שום סכום שמור, ואין להוסיף.** «נגבה», «נותר» וסטטוס
   התחייבות מחושבים בכל קריאה מ-`state.txns` — אין עמודות `collected` /
   `balance` / `status` בסכימה. סכום שמור נשמר
   ברגע אחד ומתיישן בכל תנועה שנרשמה במכשיר אחר; החישוב בזמן ריצה תמיד
   מסכים עם הנתונים שעל המסך.
   ══════════════════════════════════════════════════════════════════════════ */
function donorById(id) {
  for (var i = 0; i < state.donors.length; i++) if (idEq(state.donors[i].client_id, id)) return state.donors[i];
  return null;
}
// תורם שאינו במצב החי — נמחק רכות, או טרם הגיע במשיכה. מציגים מציין מקום
// ולא מחרוזת ריקה: שורת תנועה בלי שם נראית כמו באג תצוגה, ומסתירה את העובדה
// שהכסף עדיין רשום ומחושב.
function donorName(id) { var d = donorById(id); return d ? d.name : '— תורם שנמחק —'; }
function pledgeById(id) {
  for (var i = 0; i < state.pledges.length; i++) if (idEq(state.pledges[i].client_id, id)) return state.pledges[i];
  return null;
}
function txnsOfDonor(id) { return state.txns.filter(function (t) { return t.donor_client_id === id; }); }
function pledgesOfDonor(id) { return state.pledges.filter(function (p) { return p.donor_client_id === id; }); }
function collectedForPledge(pid) {
  return sum(state.txns.filter(function (t) { return t.pledge_client_id === pid; }), function (t) { return t.amount; });
}
// ⚠️ **`EPS` אינו קישוט.** הסכומים הם `numeric(14,2)` שחוזרים כ-float, וסכום
// של כמה תנועות מצטבר לשגיאת ייצוג זעירה. בלי הסבילות, התחייבות שנגבתה
// במלואה הייתה מוצגת «חלקי» בהפרש של אגורה שאינו קיים בכסף עצמו.
function pledgeStatus(p) {
  var c = collectedForPledge(p.client_id);
  if (c <= EPS) return 'לא בוצע';
  if (c + EPS < num(p.amount)) return 'חלקי';
  return 'בוצע';
}
function statusClass(s) { return s === 'בוצע' ? 'ok' : s === 'חלקי' ? 'warn' : ''; }
function monthTxns(m) { return state.txns.filter(function (t) { return monthKeyOf(t.txn_date) === m; }); }
function targetFor(m) {
  for (var i = 0; i < state.targets.length; i++) if (state.targets[i].month === m) return num(state.targets[i].amount);
  return 0;
}
// ⚠️ **השגריר/המנהל/האחראי הם טקסט חופשי, לא מפתח זר** — הקישור לרשומות
// הוא `g_users.full_name`. לכן הרשימה נבנית
// מהמשתמשים **ומהערכים שכבר נרשמו בפועל**: שינוי שם מלא של משתמש אינו
// משנה רשומות היסטוריות, והשם הישן חייב להישאר בורר כדי שלא ייעלם ממנו.
function agentPool() {
  return uniqSorted(
    state.users.map(function (u) { return u.full_name; })
      .concat(state.donors.map(function (d) { return d.agent; }))
      .concat(state.pledges.map(function (p) { return p.agent; }))
      .concat(state.txns.map(function (t) { return t.agent; }))
  );
}

/* ══════════════════════════════════════════════════════════════════════════
   רכיבי ממשק בסיסיים — טוסט, מודאל, אישור, שדות
   ══════════════════════════════════════════════════════════════════════════ */
/*  ⚠️ המשך התצוגה נבדל ביניהן — ⭐ והוא ערך פרטי, ⛔ לא מנגנון. */
var TOAST_DEFAULT_MS = 2600;
// ⛔ גם ה-`value` וגם הטקסט עוברים `esc` — ערכי הרשימות (טבלת ההגדרות) נקבעים
//    ע"י המשתמש במסך ההגדרות, ולכן הם נתוני משתמש לכל דבר.
function selectHTML(name, options, value, placeholder) {
  // ⛔ שם נגיש לכל בורר — ה-id נגזר מהקורא ואין לו `<label>`
  //    צמוד, ולכן ה-placeholder הוא מה שמתאר אותו למי שאינו רואה אותו.
  var h = '<select class="inp" aria-label="' + esc(placeholder || 'בחירה') + '" id="' + name + '">';
  h += '<option value="">' + esc(placeholder || '— ללא —') + '</option>';
  for (var i = 0; i < options.length; i++) {
    var o = options[i];
    h += '<option value="' + esc(o) + '"' + (String(o) === String(value == null ? '' : value) ? ' selected' : '') + '>' + esc(o) + '</option>';
  }
  return h + '</select>';
}
function datalistHTML(id, options) {
  var h = '<datalist id="' + id + '">';
  for (var i = 0; i < options.length; i++) h += '<option value="' + esc(options[i]) + '"></option>';
  return h + '</datalist>';
}
function val(id) { var el = $('#' + id); return el ? String(el.value).trim() : ''; }
function checked(id) { var el = $('#' + id); return !!(el && el.checked); }
function nullable(v) { return v === '' ? null : v; }

function emptyBox(icon, text) {
  return '<div class="empty"><span class="big">' + icon + '</span>' + esc(text) + '</div>';
}

/* ====================================================================== */
/*  כניסה                                                                  */
/* ====================================================================== */

/* ══════════════════════════════════════════════════════════════════════════
   טביעת סיסמה — PBKDF2-SHA256
   ══════════════════════════════════════════════════════════════════════════
   **למה טביעה.** `g_users` יורדת למראה המקומית בלי עמודת `password`
   (`strip`) — נכון ובטוח, ⚠️ ובלי טביעה **אין כניסה אופליין כלל**: אין
   מול מה לאמת, ⛔ ומכשיר שמישהו אחר נכנס בו אחרון נועל בחוץ את כל השאר.

   **הפתרון — אותו מנגנון בדיוק.** לכל משתמש
   נשמרים `pass_salt` + `pass_fp`: טביעת PBKDF2-SHA256 ב-`G_PASS_ITER` סיבובים,
   עם **מלח אקראי פר-משתמש**. הטביעה יורדת למכשיר; הסיסמה — לעולם לא.
   מכשיר שאבד חושף טביעות, לא סיסמאות, וההשהיה של 100k היא מה שהופך
   ניחוש-בכוח על העותק שבדיסק ליקר גם מול סיסמה בת שש ספרות.

   ⭐ **`password` ירדה בהחלטת המנהל (צעד ב)** — ⛔ אין בקוד אף מסלול
   שכותב אליה ואף מסלול שקורא אותה, ⛔ ואין להחזיר לא זה ולא זה.

   ⛔ **`strip: ['password']` נשאר, ⚠️ והוא אינו שריד** — המחיקה במסד היא
   פעולת מנהל שטרם רצה, ומכשיר מותקן עלול להחזיק מראה שנושאת את העמודה:
   ⭐ הסינון הוא מה שמנקה אותה, ⛔ והוא נאכף בשלוש נקודות ולא באחת —
   במשיכה (`syncPull`), בכל כתיבה מקומית (`upsertLocal`), ובשער הדיסק
   עצמו (`mirrorSave`). ר' `stripCols`.
   ══════════════════════════════════════════════════════════════════════════ */
var G_PASS_ITER = 100000;
// המלח הנשמר הוא אקראי פר-משתמש; הקידומת מוסיפה הפרדת-הקשר, כך שטבלה
// מחושבת מראש עבור אפליקציה אחרת על אותו origin אינה תקפה כאן. ה-origin
// `ygtotlrl-lab.github.io` משותף לכל האפליקציות — זו לא הערה תיאורטית.
var G_PASS_CTX = 'gius/g_users/v1/';

// 16 בתים אקראיים כ-hex. מחזירה null כשאין crypto — והקורא **נכשל סגור**:
// לא נשמרת טביעה, ו**גם לא נשארת טביעה ישנה** (ר' `passFields`).
function gRandSalt() {
  try {
    if (typeof crypto === 'undefined' || !crypto || !crypto.getRandomValues) return null;
    var b = new Uint8Array(16);
    crypto.getRandomValues(b);
    var h = '';
    for (var i = 0; i < b.length; i++) h += (b[i] + 0x100).toString(16).slice(1);
    return h;
  } catch (e) { return null; }
}

// PBKDF2-SHA256 → hex בן 64 תווים. מחזירה null כשאין `crypto.subtle`
// (הקשר לא-מאובטח / WebView ישן) — וגם כאן הקורא נכשל סגור.
function gPassFp(pass, salt) {
  try {
    if (!salt) return Promise.resolve(null);
    if (typeof crypto === 'undefined' || !crypto || !crypto.subtle || !crypto.subtle.importKey) {
      return Promise.resolve(null);
    }
    var enc = new TextEncoder();
    return Promise.resolve(
      crypto.subtle.importKey('raw', enc.encode(String(pass == null ? '' : pass)), 'PBKDF2', false, ['deriveBits'])
    ).then(function (key) {
      return crypto.subtle.deriveBits(
        { name: 'PBKDF2', salt: enc.encode(G_PASS_CTX + String(salt)), iterations: G_PASS_ITER, hash: 'SHA-256' },
        key, 256);
    }).then(function (bits) {
      var b = new Uint8Array(bits), h = '';
      for (var i = 0; i < b.length; i++) h += (b[i] + 0x100).toString(16).slice(1);
      return h;
    }, function (e) { console.warn('[pass] גזירת טביעה נכשלה', e); return null; });
  } catch (e) { console.warn('[pass] גזירת טביעה נכשלה', e); return Promise.resolve(null); }
}

// גוזרת מלח+טביעה לסיסמה חדשה. מחזירה Promise של {salt, fp} או null בכישלון.
function gMakePassFp(pass) {
  var salt = gRandSalt();
  if (!salt) return Promise.resolve(null);
  return gPassFp(pass, salt).then(function (fp) { return fp ? { salt: salt, fp: fp } : null; });
}

// זיהוי תשובת שרת שאומרת "העמודות עדיין לא קיימות" — כלומר `002_pass_fp.sql`
// טרם הורצה. ⚠️ בלי הבדיקה הזו כל שמירת משתמש הייתה **נכשלת לגמרי** בחלון
// שבין דחיפת הקוד להרצת המיגרציה. ר' הנפילה-חזרה ב-`writeUser`.
function gIsMissingFpCol(err) {
  var m = ((err && (err.message || err.details || err.hint || err.code || '')) + '').toLowerCase();
  return m.indexOf('pass_fp') !== -1 || m.indexOf('pass_salt') !== -1;
}

/* ---- כניסה אופליין: אימות מול הטביעה שבמראה ---- */
// ⚠️ שלוש הודעות **פרטיות ל-gius**, ובכוונה מחוץ לבלוק ההודעות המשותף
// (`MSG_OFFLINE`/`MSG_SAVED`/`MSG_BAD_LOGIN`/`MSG_SYNC_BACK`): הבלוק ההוא
// מוכרז זהה בכל הפרויקטים, והוספת קבוע אליו כאן בלבד הייתה יוצרת בדיוק
// את הסחיפה שהבלוק המשותף בא למנוע. אותו שיקול בדיוק כמו `MSG_PASS_SIX`.
//
// ⛔ **אין לאחד אותן עם `MSG_BAD_LOGIN`.** «סיסמה שגויה» על מצב שאינו סיסמה
// שגויה הוא כשל שקט: הוא מוביל את המשתמש להקליד שוב ושוב סיסמה נכונה
// לחלוטין, במקום לומר לו את הדבר היחיד שיפתור — חיבור אחד.
// ⚠️ כתיבת משתמש היא החריג היחיד לכתיבה מקומית-תחילה:
// היא חייבת להגיע לענן, אחרת הטביעה לא תגיע לשאר המכשירים והמשתמש החדש לא
// יוכל להיכנס בהם — לא אופליין, ואפילו לא אונליין.

// אימות אופליין מול הטביעה. מחזירה Promise של אחת מארבע:
// 'ok' · 'bad' (סיסמה שגויה או משתמש מושבת) · 'no-fp' (אין טביעה לרשומה)
// · 'no-crypto' (הדפדפן לא תומך). ⚠️ שלושת הכישלונות **אינם** אותו דבר,
// ולכן אינם מקבלים אותה הודעה — ר' ההערה שמעל ההודעות.
function gVerifyOffline(cu, pass) {
  if (!cu || cu.active !== true) return Promise.resolve('bad');
  if (!cu.pass_salt || !cu.pass_fp) return Promise.resolve('no-fp');
  return gPassFp(pass, cu.pass_salt).then(function (fp) {
    if (!fp) return 'no-crypto';
    return (fp === cu.pass_fp) ? 'ok' : 'bad';
  });
}

// המשתמש מהמראה לפי שם משתמש. המראה מחזיקה גם משתמשים מושבתים (היא עותק
// מלא של הטבלה), ולכן `active` נבדק ב-`gVerifyOffline` ולא כאן.
function mirrorUserByName(username) {
  var arr = MIRROR.g_users || [];
  for (var i = 0; i < arr.length; i++) {
    if (arr[i] && String(arr[i].username) === String(username)) return arr[i];
  }
  return null;
}

/* ---- השלמת טביעות למשתמשים קיימים (מסלול חד-פעמי) ---- */
// רץ **רק** בכניסה מקוונת של **בעלים**; אחרת מדלג בשקט. מנהל לא יריץ עדכון
// על שורות של אחרים, ומכשיר אופליין לא ינסה בכלל. אין כאן יצירת סוד — רק
// גזירת טביעה מהסיסמה שכבר יושבת בענן.
// ⚠️ טבלה בלי העמודות (המיגרציה טרם הורצה) מחזירה שגיאה שנבלעת — זהו אחד
// ממסלולי הדילוג השקטים המכוונים.
function markSVG(cls) {
  return '<svg class="' + cls + '" viewBox="0 0 100 100" aria-hidden="true">' +
    '<rect x="2" y="2" width="96" height="96" rx="24" fill="var(--brand-fill)"/>' +
    '<circle cx="50" cy="50" r="26" fill="none" stroke="#fff" stroke-width="8"/>' +
    '<circle cx="50" cy="50" r="10" fill="#fff"/></svg>';
}

function renderLogin() {
  $('#app').innerHTML =
    '<div class="auth"><div class="auth-card ksave">' +
      markSVG('mark') +
      '<h1>גיוס</h1>' +
      '<div class="sub">ניהול גיוס כספים</div>' +
      '<label class="fld"><span>שם משתמש</span>' +
        '<input class="inp" id="lg-user" autocomplete="username" autocapitalize="off" spellcheck="false"></label>' +
      '<label class="fld"><span>סיסמה</span>' +
        '<input class="inp" id="lg-pass" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></label>' +
      '<button class="btn block" data-act="login" data-busy="⏳ בודק…" data-ksave id="lg-btn">כניסה</button>' +
      '<div class="auth-err" id="lg-err"></div>' +
    '</div></div>';

  var u = $('#lg-user');
  if (u) u.focus();
}

function loginError(msg) {
  var el = $('#lg-err');
  el.textContent = msg;
  el.classList.add('show');
}

function doLogin() {
  var username = val('lg-user');
  var password = $('#lg-pass') ? $('#lg-pass').value : '';
  $('#lg-err').classList.remove('show');
  if (!username || !password) { loginError(MSG_FILL_LOGIN); return; }

  // ⚠️ **בלי רשת — אימות מול הטביעה שבמראה**, ⛔ ולא `MSG_OFFLINE`:
  //    ⭐ מכשיר שמישהו אחר נכנס בו אחרון היה נועל בחוץ את כל השאר.
  //    ⛔ הסיסמה עצמה עדיין **אינה** יורדת לדיסק — רק `pass_salt`+`pass_fp`.
  if (!navigator.onLine) { return doLoginOffline(username, password); }
  return withTimeout(sb.from('g_users').select('*').eq('username', username).limit(1))
    .then(ok)
    .then(function (rows) {
      var u = rows && rows[0];
      if (!u) throw new Error('bad');
      if (!u.active) throw new Error('inactive');
      // ⭐ ההשוואה היא מול **הטביעה** ולא מול הטקסט הגלוי — ⛔ השוואה
      // מול `g_users.password` הופכת אותה **למפתח שפותח את הכניסה**, ⚠️ וה-RLS
      // כאן הוא `using (true)` ומפתח ה-anon יושב ב-`index.html` הציבורי.
      // ⛔ ההחלטה «סיסמה גלויה בענן» בוטלה ב-2026-08-19 בהחלטת המנהל.
      return gVerifyOffline(u, password).then(function (v) {
        if (v === 'no-crypto') throw new Error('no-crypto');
        if (v !== 'ok') throw new Error('bad');
        return u;
      });
    })
    .then(function (u) {
      ctxSwitch();
      state.user = { client_id: u.client_id, username: u.username, full_name: u.full_name, role: u.role };
      // ⭐ הנתיב החלקי. השורה הזו כבר בידינו מהכניסה, ולכן אין
      // סיבה שהחלפת משתמש במכשיר תמתין למשיכה מלאה מהענן כדי שהוא ייכנס
      // למראה. ⚠️ **אחרי `state.user`, לא לפניו** — התיקון:
      // רענון שקודם לקביעת המשתמש הפעיל עובד על מצב שעוד לא השתנה.
      // ⛔ `u` מכיל `password` (ה-`select` הוא `*`) — `usersCacheSave`
      // מסננת אותו, וזו בדיוק הסיבה שהיא הנתיב היחיד.
      try { usersCacheSave(u); } catch (e) { console.warn('[users] cache', e); }
      return boot();
    })
    .catch(function (e) {
      if (e && e.message === 'bad') loginError(MSG_BAD_LOGIN);
      else if (e && e.message === 'inactive') loginError(MSG_USER_INACTIVE);
      /*  ⛔ כשל מערכת אינו יושב על משטח המשתמש — ⚠️ `.auth-err` שמור למה
       *  שהמשתמש יכול לתקן בהקלדה: ⭐ סיסמה שגויה, משתמש שאינו קיים,
       *  ושדה ריק; ⛔ ורשת שנפלה ושגיאת שרת אינן מהן. */
      else if (isNetErr(e)) toast(MSG_OFFLINE, null, 'bad');
      else toast(MSG_LOGIN_ERR + ((e && e.message) || MSG_SERVER_ERR), null, 'bad');
    });
}

/* כניסה ללא רשת — אימות מול `pass_fp` שבמראה.
   ⚠️ **ארבעה מצבים, ארבע הודעות שונות.** «המשתמש אינו בעותק המקומי»
   ו«אין לו טביעה» **אינם** אומרים שהסיסמה שגויה — הם אומרים שאין כאן במה
   לאמת אותה. הודעת «שם משתמש או סיסמה שגויים» במצבים האלה היא שקר שמוביל
   את המשתמש לנסות שוב ושוב סיסמה נכונה לחלוטין. */
function doLoginOffline(username, password) {
  var cu = mirrorUserByName(username);
  if (!cu) { loginError(MSG_OFF_UNKNOWN); return Promise.resolve(); }
  // מחזירה את ה-Promise — הכניסה אסינכרונית (גזירת PBKDF2), והבדיקות
  // חייבות משהו להמתין לו. אף קורא בקוד אינו נשען על הערך המוחזר.
  return gVerifyOffline(cu, password).then(function (verdict) {
    if (verdict === 'no-fp')     { loginError(MSG_OFF_NO_FP); return; }
    if (verdict === 'no-crypto') { loginError(MSG_OFF_NO_CRYPTO); return; }
    if (verdict !== 'ok')        { loginError(MSG_BAD_LOGIN); return; }
    ctxSwitch();
    state.user = { client_id: cu.client_id, username: cu.username, full_name: cu.full_name, role: cu.role };
    boot();
    toast(MSG_OFFLINE_LOGIN, null, 'bad');
  }, function (e) {
    console.warn('[login] אימות אופליין נכשל', e);
    loginError(MSG_OFF_NO_CRYPTO);
  });
}

function doLogout() {
  lkStop();
  ctxSwitch();
  sessClear();
  state.screen = 'home';
  state.donorId = null;
  renderLogin();
}

/* ══════════════════════════════════════════════════════════════════════════
   מעטפת המסך — טאבים, רינדור ראשי וניווט
   ══════════════════════════════════════════════════════════════════════════ */
var TABS = [
  { id: 'home', ic: '🏠', label: 'בית' },
  { id: 'donors', ic: '🙋', label: 'תורמים' },
  { id: 'pledges', ic: '🤝', label: 'התחייבויות' },
  { id: 'tasks', ic: '🗂️', label: 'משימות' },
  { id: 'settings', ic: '⚙️', label: 'הגדרות' }
];

function renderShell() {
  var tabs = TABS.map(function (t) {
    return '<button data-act="tab" data-tab="' + t.id + '" class="' + (state.screen === t.id ? 'on' : '') + '">' +
      '<span class="ic">' + t.ic + '</span><span>' + t.label + '</span></button>';
  }).join('');

  $('#app').innerHTML =
    '<header class="topbar">' +
      '<div class="brand">' + markSVG('') + '<span>גיוס<small> · ניהול גיוס כספים</small></span></div>' +
      '<nav class="tabbar">' + tabs + '</nav>' +
      '<div class="who"><div class="u-ta-e"><div class="nm">' + esc(state.user.full_name) + '</div>' +
        '<span class="role">' + (isAdmin() ? 'בעלים' : 'מנהל') + '</span></div>' +
        '<button class="btn ghost sm" data-act="switch-user" title="החלפת משתמש">👥</button>' +
        '<button class="btn ghost sm" data-act="my-pass" title="שינוי סיסמה">🔑</button>' +
        '<button class="btn ghost sm" data-act="logout">יציאה</button></div>' +
    '</header>' +
    '<main id="view"></main>' +
    (state.screen === 'settings' ? '' : '<button class="fab" data-act="fab" aria-label="הוספה">＋</button>');
}

function render() {
  if (!state.user) { renderLogin(); return; }
  renderShell();
  var view = $('#view');
  if (state.screen === 'home') view.innerHTML = viewHome();
  else if (state.screen === 'donors') view.innerHTML = state.donorId ? viewDonorCard() : viewDonors();
  else if (state.screen === 'pledges') view.innerHTML = viewPledges();
  else if (state.screen === 'tasks') { view.innerHTML = viewTasks(); }
  else if (state.screen === 'settings') { view.innerHTML = viewSettings(); }

  // Only jump to the top when the user actually moved somewhere. Re-rendering
  // in place (a saved row, a dragged task) must not throw away their scroll.
  // ⚠️ זה אינו שיפור נוחות בלבד — `render()` נקראת גם מ-`syncNow` (כל 5
  // שניות) ומ-`pendDrawFlush`, כלומר בלי המפתח הזה המסך היה קופץ
  // לראש מעצמו באמצע עבודה, בלי שהמשתמש נגע בכלום.
  // ⛔ אין להחליף ב-scroll ללא תנאי.
  var key = state.screen + '/' + (state.donorId || '');
  if (key !== lastViewKey) { window.scrollTo(0, 0); lastViewKey = key; }
}
var lastViewKey = '';

// ⛔ **כפתור ההגדרות מוצג לכולם, וזו החלטת מדיניות — לא באג.** מנהל שלוחץ
// מקבל טוסט «אין הרשאה» ואינו מנווט. כפתור שנעלם משאיר את איש הצוות בלי
// לדעת שהמסך קיים, ולכן גם בלי לדעת שאפשר לבקש גישה. ⛔ אין «לתקן» את זה
// ע"י הסתרת הטאב ב-`TABS`. **האכיפה אינה נחלשת:** היא כאן, והיא חוזרת
// כשכבה שנייה ב-`viewSettings()` עצמה למקרה שמגיעים למסך בדרך אחרת.
// אותה החלטה בדיוק תועדה באחות שיש בה ניהול משתמשים מלא.
function go(screen) {
  if (screen === 'settings' && !isAdmin()) {
    toast(MSG_OWNER_ONLY, null, 'bad');
    return;
  }
  state.screen = screen;
  state.donorId = null;
  /*  ⛔ הבית נפתח בחודש של היום — ⚠️ חודש שדופדף אליו נשאר אחרי מעבר
   *  לשונית, ⭐ ומי שחוזר לבית רואה יעד של חודש אחר בלי שביקש. */
  if (screen === 'home') state.month = monthKeyOf(dayToday());
  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   מסך הבית — יעד החודש, פילוחים, ו«מה שלי היום»
   ══════════════════════════════════════════════════════════════════════════
   כל המספרים כאן נגזרים בזמן ריצה מ-`state.txns` ומ-`state.targets` (ר'
   פרק הנגזרות למעלה). ⚠️ הסף בהודעת המומנטום הוא «גדול או שווה».
   ⛔ אל תהפוך אותו ל«גדול» — ההודעה בקצה הטווח משתנה בשקט.
   ══════════════════════════════════════════════════════════════════════════ */
function momentumMsg(pct) {
  if (pct >= 100) return '🏆 עמדנו ביעד!';
  if (pct >= 75) return '⚡ כמעט שם — דחיפה אחרונה!';
  if (pct >= 50) return '🔥 מעל המחצית — ממשיכים!';
  if (pct >= 25) return '💪 רבע דרך — מומנטום!';
  return '🚀 מתחילים!';
}

function ringHTML(pct) {
  var R = 52, C = 2 * Math.PI * R;
  var dash = C * Math.max(0, Math.min(100, pct)) / 100;
  return '<div class="ring-wrap">' +
    '<svg class="ring" viewBox="0 0 120 120">' +
      '<circle class="bg" cx="60" cy="60" r="' + R + '"></circle>' +
      '<circle class="fg" cx="60" cy="60" r="' + R + '" stroke-dasharray="' + dash.toFixed(1) + ' ' + C.toFixed(1) + '"></circle>' +
    '</svg>' +
    '<div class="ring-val"><b>' + Math.round(pct) + '%</b><span>מהיעד</span></div>' +
  '</div>';
}

function breakdownTable(rows, label, total) {
  if (!rows.length) return emptyBox('📊', 'אין תנועות בחודש זה');
  var h = '<div class="tw"><table><thead><tr><th>' + esc(label) + '</th><th class="num">תנועות</th>' +
    '<th class="num">סכום</th><th class="num">חלק</th></tr></thead><tbody>';
  rows.forEach(function (r) {
    var share = total > 0 ? (r.total / total * 100) : 0;
    h += '<tr><td>' + esc(r.key) + '</td>' +
      '<td class="num">' + r.count + '</td>' +
      '<td class="num">' + ils(r.total) + '</td>' +
      '<td class="u-minw-76 num">' + bar(share.toFixed(1)) +
      '<small class="u-c-text3">' + share.toFixed(0) + '%</small></td></tr>';
  });
  h += '</tbody><tfoot><tr><td>סה"כ</td><td class="num">' + sum(rows, function (r) { return r.count; }) +
    '</td><td class="num">' + ils(total) + '</td><td></td></tr></tfoot></table></div>';
  return h;
}

function groupBy(list, pick, fallback) {
  var map = {}, order = [];
  list.forEach(function (item) {
    var k = String(pick(item) || '').trim() || fallback;
    if (!map[k]) { map[k] = { key: k, total: 0, count: 0 }; order.push(k); }
    map[k].total += num(item.amount);
    map[k].count++;
  });
  return order.map(function (k) { return map[k]; })
    .sort(function (a, b) { return b.total - a.total; });
}

function viewHome() {
  var m = state.month;
  var txns = monthTxns(m);
  var collected = sum(txns, function (t) { return t.amount; });
  var target = targetFor(m);
  var remaining = Math.max(0, target - collected);
  var pct = target > 0 ? (collected / target * 100) : 0;

  var h = '';

  /* ---- כרטיס מצב החודש ---- */
  h += '<section class="card">' +
    '<div class="monthnav">' +
      '<button class="btn ghost sm" data-act="month" data-d="-1" aria-label="חודש קודם">›</button>' +
      '<b>' + esc(monthLabel(m)) + '</b>' +
      '<button class="btn ghost sm" data-act="month" data-d="1" aria-label="חודש הבא">‹</button>' +
      '<span class="grow"></span>' +
      (isAdmin() ? '<button class="btn soft sm" data-act="target-set" data-month="' + m + '">קביעת יעד</button>' : '') +
    '</div>' +
    '<div class="hero">' + ringHTML(pct) +
      '<div class="hero-stats">' +
        '<div class="stat"><span>יעד החודש</span><b>' + (target > 0 ? ils(target) : '— לא הוגדר —') + '</b></div>' +
        '<div class="stat ok"><span>נגבה</span><b>' + ils(collected) + '</b></div>' +
        '<div class="stat warn"><span>נותר</span><b>' + (target > 0 ? ils(remaining) : '—') + '</b></div>' +
        '<div class="stat"><span>תנועות</span><b>' + txns.length + '</b></div>' +
      '</div>' +
    '</div>' +
    '<div class="momentum">' + momentumMsg(target > 0 ? pct : 0) + '</div>' +
  '</section>';

  /* ---- פילוחים ---- */
  h += '<div class="grid2">' +
    '<section class="card"><h2>📊 פילוח לפי סעיף</h2>' +
      breakdownTable(groupBy(txns, function (t) { return t.category; }, 'ללא סעיף'), 'סעיף', collected) +
    '</section>' +
    '<section class="card"><h2>🎖️ פילוח לפי שגריר</h2>' +
      breakdownTable(groupBy(txns, function (t) { return t.agent; }, 'ללא שגריר'), 'שגריר', collected) +
    '</section>' +
  '</div>';

  /* ---- היום שלי ---- */
  var me = state.user.full_name;
  var myTasks = state.tasks.filter(function (t) { return t.assignee === me && t.stage !== 'השלמה'; });
  var myPledges = state.pledges.filter(function (p) {
    return p.agent === me && collectedForPledge(p.client_id) + EPS < num(p.amount);
  });

  h += '<section class="card"><h2>☀️ מה שלי היום<span class="cnt">' + (myTasks.length + myPledges.length) + '</span></h2>';
  if (!myTasks.length && !myPledges.length) {
    h += emptyBox('✨', 'אין משימות פתוחות או התחייבויות ממתינות על שמך');
  } else {
    if (myTasks.length) {
      h += '<div class="u-fs-2 u-fw-700 u-c-text3 u-m-1-0-2">משימות פתוחות</div>';
      myTasks.forEach(function (t) {
        var late = t.due_date && t.due_date < dayToday();
        h += '<div class="row" data-act="task-open" data-id="' + t.client_id + '">' +
          '<div class="av">🗂️</div><div class="main"><b>' + esc(t.title) + '</b>' +
          '<small>' + esc(t.domain || 'ללא תחום') + ' · ' + esc(t.stage) + '</small></div>' +
          '<div class="end"><span class="badge ' + (late ? 'bad' : '') + '">' + dmyDate(t.due_date) + '</span></div></div>';
      });
    }
    if (myPledges.length) {
      h += '<div class="u-fs-2 u-fw-700 u-c-text3 u-m-5-0-2">התחייבויות שטרם נגבו במלואן</div>';
      myPledges.forEach(function (p) {
        var c = collectedForPledge(p.client_id);
        var left = Math.max(0, num(p.amount) - c);
        h += '<div class="row" data-act="donor-open" data-id="' + p.donor_client_id + '">' +
          '<div class="av">🤝</div><div class="main"><b>' + esc(donorName(p.donor_client_id)) + '</b>' +
          '<small>' + esc(p.cause || 'ללא עילה') + ' · ' + ils(p.amount) + '</small></div>' +
          '<div class="end">' + ils(left) + '<small>נותר</small></div></div>';
      });
    }
  }
  h += '</section>';
  return h;
}

/* ══════════════════════════════════════════════════════════════════════════
   תורמים — רשימה, חיפוש וכרטיס תורם
   ══════════════════════════════════════════════════════════════════════════ */
// החיפוש הוא על שם, טלפון ושגריר. ⚠️ הטלפון **אינו** מומר לאותיות קטנות —
// זו השוואת ספרות, ו-`toLowerCase` עליה רק מבזבז.
function donorMatches(q) {
  q = String(q || '').trim().toLowerCase();
  var list = state.donors.slice().sort(byName);
  if (!q) return list;
  return list.filter(function (d) {
    return String(d.name || '').toLowerCase().indexOf(q) >= 0 ||
      String(d.phone || '').indexOf(q) >= 0 ||
      String(d.agent || '').toLowerCase().indexOf(q) >= 0;
  });
}

function donorRowsHTML(list) {
  if (!list.length) return emptyBox('🙋', state.donors.length ? 'אין תורם התואם את החיפוש' : 'עדיין אין תורמים');
  return list.map(function (d) {
    var given = sum(txnsOfDonor(d.client_id), function (t) { return t.amount; });
    return '<div class="row" data-act="donor-open" data-id="' + d.client_id + '">' +
      '<div class="av' + (d.is_vip ? ' vip' : '') + '">' + esc(initials(d.name)) + '</div>' +
      '<div class="main"><b>' + esc(d.name) + (d.is_vip ? ' <span class="badge gold">VIP</span>' : '') + pendTag(pendRowKey('g_donors', d.client_id)) + '</b>' +
      '<small>' + esc(d.phone || 'ללא טלפון') + (d.agent ? ' · ' + esc(d.agent) : '') + '</small></div>' +
      '<div class="end">' + ils(given) + '<small>נתן</small></div></div>';
  }).join('');
}

function viewDonors() {
  var list = donorMatches(state.donorSearch);
  return '<section class="card">' +
    '<div class="u-m-0-0-5 addrow">' +
      '<input aria-label="חיפוש לפי שם, טלפון או שגריר" class="inp" id="donor-q" data-inp="donor-q" placeholder="חיפוש לפי שם, טלפון או שגריר…" value="' + esc(state.donorSearch) + '">' +
      '<button class="btn" data-act="donor-new">＋ תורם</button>' +
    '</div>' +
    '<h2>🙋 תורמים<span class="cnt">' + list.length + '</span></h2>' +
    '<div id="donor-list">' + donorRowsHTML(list) + '</div>' +
  '</section>';
}

function viewDonorCard() {
  var d = donorById(state.donorId);
  if (!d) { state.donorId = null; return viewDonors(); }

  var pl = pledgesOfDonor(d.client_id);
  var tx = txnsOfDonor(d.client_id).slice().sort(function (a, b) { return HE.compare(b.txn_date, a.txn_date); });
  var pledged = sum(pl, function (p) { return p.amount; });
  var given = sum(tx, function (t) { return t.amount; });
  var left = Math.max(0, pledged - given);

  var h = '<button class="back" data-act="donor-back">› חזרה לרשימת התורמים</button>';

  h += '<section class="card">' +
    '<div class="u-d-flex u-ai-fs u-g-5 u-mb-5">' +
      '<div class="u-w-52 u-h-52 u-r-5 u-fs-5 av' + (d.is_vip ? ' vip' : '') + '">' +
        esc(initials(d.name)) + '</div>' +
      '<div class="u-fx-1 u-minw-0"><h2 class="u-fs-5 u-m-0">' + esc(d.name) +
        (d.is_vip ? ' <span class="badge gold">VIP</span>' : '') + '</h2>' +
        '<div class="u-c-text3 u-fs-3">' + esc(d.phone || 'ללא טלפון') + '</div></div>' +
    '</div>' +
    '<div class="u-mb-5 btnrow">' +
      '<button class="btn sm" data-act="donor-edit" data-id="' + d.client_id + '">עריכה</button>' +
      '<button class="btn soft sm" data-act="vip-toggle" data-id="' + d.client_id + '">' +
        (d.is_vip ? '☆ הסרת VIP' : '★ סימון VIP') + '</button>' +
      '<button class="btn ghost sm" data-act="txn-new" data-donor="' + d.client_id + '">＋ תנועה</button>' +
      '<button class="btn ghost sm" data-act="pledge-new" data-donor="' + d.client_id + '">＋ התחייבות</button>' +
      '<button class="btn danger sm" data-act="donor-del" data-id="' + d.client_id + '">מחיקה</button>' +
    '</div>' +
    '<div class="u-gtc-repeat-3-1fr hero-stats">' +
      '<div class="stat"><span>סה"כ התחייב</span><b>' + ils(pledged) + '</b></div>' +
      '<div class="stat ok"><span>סה"כ נתן</span><b>' + ils(given) + '</b></div>' +
      '<div class="stat warn"><span>נותר</span><b>' + ils(left) + '</b></div>' +
    '</div>' +
    '<div class="u-mt-5">' +
      '<div class="kv"><span>שגריר</span><b>' + esc(d.agent || '—') + '</b></div>' +
      '<div class="kv"><span>תגיות</span><b>' + ((d.tags && d.tags.length) ? d.tags.map(function (t) { return '<span class="badge">' + esc(t) + '</span>'; }).join(' ') : '—') + '</b></div>' +
    '</div>' +
    '<label class="u-mt-5 fld"><span>הערות</span>' +
      '<textarea aria-label="הערות חופשיות על התורם" class="inp" id="donor-notes" placeholder="הערות חופשיות על התורם…">' + esc(d.notes || '') + '</textarea></label>' +
    '<button class="btn sm" data-act="notes-save" data-id="' + d.client_id + '">שמירת הערות</button>' +
  '</section>';

  /* התחייבויות */
  h += '<section class="card"><h2>🤝 התחייבויות<span class="cnt">' + pl.length + '</span></h2>';
  if (!pl.length) h += emptyBox('🤝', 'אין התחייבויות לתורם זה');
  else {
    h += '<div class="tw"><table><thead><tr><th>עילה</th><th class="num">סכום</th><th class="num">נגבה</th>' +
      '<th class="num">נותר</th><th>תאריך יעד</th><th>סטטוס</th><th></th></tr></thead><tbody>';
    pl.forEach(function (p) {
      var c = collectedForPledge(p.client_id), st = pledgeStatus(p);
      h += '<tr><td>' + esc(p.cause || '—') + pendTag(pendRowKey('g_pledges', p.client_id)) + '</td>' +
        '<td class="num">' + ils(p.amount) + '</td>' +
        '<td class="num">' + ils(c) + '</td>' +
        '<td class="num">' + ils(Math.max(0, num(p.amount) - c)) + '</td>' +
        '<td>' + dmyDate(p.due_date) + '</td>' +
        '<td><span class="badge ' + statusClass(st) + '">' + st + '</span></td>' +
        '<td><button class="btn ghost xs" data-act="pledge-edit" data-id="' + p.client_id + '">עריכה</button></td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</section>';

  /* תנועות */
  h += '<section class="card"><h2>💰 תנועות<span class="cnt">' + tx.length + '</span></h2>';
  if (!tx.length) h += emptyBox('💰', 'אין תנועות לתורם זה');
  else {
    h += '<div class="tw"><table><thead><tr><th>תאריך</th><th class="num">סכום</th><th>סעיף</th>' +
      '<th>שגריר</th><th>מנהל</th><th>נפרע</th><th></th></tr></thead><tbody>';
    tx.forEach(function (t) {
      h += '<tr><td>' + dmyDate(t.txn_date) + pendTag(pendRowKey('g_txns', t.client_id)) + '</td>' +
        '<td class="num">' + ils(t.amount) + '</td>' +
        '<td>' + esc(t.category || '—') + '</td>' +
        '<td>' + esc(t.agent || '—') + '</td>' +
        '<td>' + esc(t.manager || '—') + '</td>' +
        '<td><span class="badge ' + (t.cleared ? 'ok' : 'warn') + '">' + (t.cleared ? 'נפרע' : 'ממתין') + '</span></td>' +
        '<td><button class="btn ghost xs" data-act="txn-edit" data-id="' + t.client_id + '">עריכה</button></td></tr>';
    });
    h += '</tbody></table></div>';
    /*  ⛔ גרף על נתון אחד אינו גרף — ⚠️ `barChart` מחזירה מחרוזת ריקה
     *  מתחת לשתי נקודות, ⭐ והמסך נשאר עם הטבלה בלבד. */
    h += barChart(state.targets.map(function (t) {
      var got = sum(monthTxns(t.month), function (x) { return x.amount; });
      var tg = num(t.amount);
      return { lab: t.month, val: got, tgt: tg,
               end: (tg > 0 ? Math.round(got / tg * 100) : 0) + '%',
               txt: monthLabel(t.month) + ': נגבה ' + ils(got) + ' מתוך יעד ' + ils(tg) };
    }), 'גבייה חודשית מול היעד');
  }
  h += '</section>';
  return h;
}

/* ══════════════════════════════════════════════════════════════════════════
   התחייבויות — מסננים, טבלה וסיכומים
   ══════════════════════════════════════════════════════════════════════════ */
function filteredPledges() {
  var f = state.pf;
  return state.pledges.filter(function (p) {
    if (f.agent && p.agent !== f.agent) return false;
    if (f.cause && p.cause !== f.cause) return false;
    if (f.status && pledgeStatus(p) !== f.status) return false;
    if (f.from && (!p.due_date || p.due_date < f.from)) return false;
    if (f.to && (!p.due_date || p.due_date > f.to)) return false;
    return true;
  });
}

function pledgeTableHTML(list) {
  if (!list.length) return emptyBox('🤝', state.pledges.length ? 'אין התחייבות התואמת את המסננים' : 'עדיין אין התחייבויות');
  var h = '<div class="tw"><table><thead><tr><th>תורם</th><th>עילה</th><th>שגריר</th>' +
    '<th class="num">סכום</th><th class="num">נגבה</th><th class="num">נותר</th>' +
    '<th>תאריך יעד</th><th>סטטוס</th><th></th></tr></thead><tbody>';
  list.forEach(function (p) {
    var c = collectedForPledge(p.client_id), st = pledgeStatus(p);
    var late = p.due_date && p.due_date < dayToday() && st !== 'בוצע';
    h += '<tr class="click" data-act="donor-open" data-id="' + p.donor_client_id + '">' +
      '<td><b>' + esc(donorName(p.donor_client_id)) + '</b>' + pendTag(pendRowKey('g_pledges', p.client_id)) + '</td>' +
      '<td>' + esc(p.cause || '—') + '</td>' +
      '<td>' + esc(p.agent || '—') + '</td>' +
      '<td class="num">' + ils(p.amount) + '</td>' +
      '<td class="num">' + ils(c) + '</td>' +
      '<td class="num">' + ils(Math.max(0, num(p.amount) - c)) + '</td>' +
      '<td>' + (late ? '<span class="badge bad">' + dmyDate(p.due_date) + '</span>' : dmyDate(p.due_date)) + '</td>' +
      '<td><span class="badge ' + statusClass(st) + '">' + st + '</span></td>' +
      '<td><button class="btn ghost xs" data-act="pledge-edit" data-id="' + p.client_id + '">עריכה</button> ' +
        '<button class="btn danger xs" data-act="pledge-del" data-id="' + p.client_id + '">מחיקה</button></td></tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

function pledgeTotalsHTML(list) {
  var pledged = sum(list, function (p) { return p.amount; });
  var got = sum(list, function (p) { return collectedForPledge(p.client_id); });
  return '<div class="u-gtc-repeat-2-1fr hero-stats">' +
    '<div class="stat"><span>סה"כ התחייבויות</span><b>' + ils(pledged) + '</b></div>' +
    '<div class="stat ok"><span>נגבה</span><b>' + ils(got) + '</b></div>' +
    '<div class="stat warn"><span>נותר</span><b>' + ils(Math.max(0, pledged - got)) + '</b></div>' +
    '<div class="stat"><span>מספר התחייבויות</span><b>' + list.length + '</b></div>' +
  '</div>';
}

function viewPledges() {
  var list = filteredPledges();
  var f = state.pf;
  return '<section class="card">' +
    '<h2>🤝 התחייבויות<span class="cnt">' + list.length + '</span>' +
      '<span class="sp"><button class="btn sm" data-act="pledge-new">＋ התחייבות</button></span></h2>' +
    '<div id="pledge-totals">' + pledgeTotalsHTML(list) + '</div>' +
    '<div class="u-mt-5 filters">' +
      '<label class="fld"><span>שגריר</span>' + selectHTML('pf-agent', agentPool(), f.agent, 'הכל') + '</label>' +
      '<label class="fld"><span>סטטוס</span>' + selectHTML('pf-status', ['לא בוצע', 'חלקי', 'בוצע'], f.status, 'הכל') + '</label>' +
      '<label class="fld"><span>עילה</span>' + selectHTML('pf-cause', state.config.causes, f.cause, 'הכל') + '</label>' +
      '<label class="fld"><span>מתאריך</span><input class="inp" type="date" id="pf-from" value="' + esc(f.from) + '"></label>' +
      '<label class="fld"><span>עד תאריך</span><input class="inp" type="date" id="pf-to" value="' + esc(f.to) + '"></label>' +
    '</div>' +
    '<div class="u-mb-5 btnrow">' +
      '<button class="btn ghost sm" data-act="pf-clear">ניקוי מסננים</button></div>' +
    '<div id="pledge-table">' + pledgeTableHTML(list) + '</div>' +
  '</section>';
}

// ⚠️ **רינדור חלקי במכוון — לא `render()`.** המסננים הם אלמנטים חיים במסך,
// ורינדור מלא היה בונה אותם מחדש ומאבד את הפוקוס ואת מצב הבורר הפתוח באמצע
// בחירה. מוחלפים רק שני האזורים שהמסננים משפיעים עליהם.
function refreshPledges() {
  var list = filteredPledges();
  var t = $('#pledge-table'), o = $('#pledge-totals');
  if (t) t.innerHTML = pledgeTableHTML(list);
  if (o) o.innerHTML = pledgeTotalsHTML(list);
}

/* ══════════════════════════════════════════════════════════════════════════
   משימות — לוח קנבן עם גרירה
   ══════════════════════════════════════════════════════════════════════════
   ⛔ אין לקשור מאזין לכרטיס ולעמודה — ה-HTML של הלוח
   נוצר מחדש בכל רינדור, ומאזין שנקשר אליהם מת איתם: ⚠️ ולכן הגרירה
   באצלה מ-`document` כמו כל שאר האירועים.
   ══════════════════════════════════════════════════════════════════════════ */
function viewTasks() {
  var h = '<section class="u-mb-6 card">' +
    '<h2>🗂️ משימות<span class="cnt">' + state.tasks.length + '</span>' +
    '<span class="sp"><button class="btn sm" data-act="task-new">＋ משימה</button></span></h2>' +
    '<div class="u-c-text3 u-fs-3">גררו כרטיס בין העמודות, או שנו שלב בבורר שבתוך הכרטיס.</div>' +
  '</section><div class="kb">';

  STAGES.forEach(function (st) {
    var list = state.tasks.filter(function (t) { return t.stage === st; });
    h += '<div class="kcol" data-stage="' + esc(st) + '">' +
      '<h3><span class="dot ' + STAGE_CLS[st] + '"></span>' + esc(st) +
      '<span class="cnt">' + list.length + '</span></h3>';
    if (!list.length) h += '<div class="u-p-6-3 u-fs-3 empty">אין משימות</div>';
    list.forEach(function (t) {
      var late = t.due_date && t.due_date < dayToday() && t.stage !== 'השלמה';
      h += '<div class="kcard" data-id="' + t.client_id + '">' +
        '<span class="grip" aria-hidden="true">⣿</span>' +
        '<b>' + esc(t.title) + '</b>' + pendTag(pendRowKey('g_tasks', t.client_id)) +
        '<div class="meta">' +
          (t.assignee ? '<span class="badge brand">' + esc(t.assignee) + '</span>' : '') +
          (t.domain ? '<span class="badge">' + esc(t.domain) + '</span>' : '') +
          (t.due_date ? '<span class="badge ' + (late ? 'bad' : '') + '">' + dmyDate(t.due_date) + '</span>' : '') +
          (t.log ? '<span class="logdot" title="יש רישום ביומן">✎</span>' : '') +
        '</div>' +
        '<div class="ft">' +
          '<select data-inp="stage" aria-label="שלב המשימה" data-id="' + t.client_id + '">' +
            STAGES.map(function (s) {
              return '<option value="' + esc(s) + '"' + (s === t.stage ? ' selected' : '') + '>' + esc(s) + '</option>';
            }).join('') +
          '</select>' +
          '<button class="btn ghost xs" data-act="task-open" data-id="' + t.client_id + '">פתיחה</button>' +
        '</div>' +
      '</div>';
    });
    h += '</div>';
  });
  return h + '</div>';
}

/*  ⛔ הגרירה על אירועי מצביע ⛔ ולא על גרירת HTML5 — ⚠️ **במגע היא אינה
 *  קיימת כלל**: ⭐ נמדד בדפדפן — `dragstart` · `dragover` ו-`drop` לא
 *  נורו אף פעם באצבע, ⛔ ורק `pointer*` הגיעו; ⚠️ ואירועי מצביע חיים
 *  בעכבר ובאצבע כאחד.
 *  ⛔ **והגרירה מתחילה מהידית בלבד** — ⚠️ כרטיס שכולו נגרר חוטף את
 *  גלילת המסך, ⭐ ו-`touch-action` שמבטל אותה על כל הכרטיס נועל את הלוח.
 *  ⚠️ **והם באצלה מ-`document`** — ⭐ הלוח נבנה מחדש בכל רינדור, ⛔ ומאזין
 *  פר-כרטיס היה מת איתו. */
/*  ⛔ **מה נכנס**: הכרטיס שנתפס בידיתו והעמודה שמתחתיו ברגע השחרור;
 *  ⚠️ **ומה מפיל**: שחרור מעל עמודה שאינה קיימת — ⭐ הגרירה מסתיימת בלי
 *  כתיבה. ⛔ **ולמה המבנה קיים**: הגרירה היא העברת שלב ⛔ ולא שינוי סדר,
 *  ⚠️ ולכן הנמדד הוא העמודה שבעץ ⭐ ולא צמד «מאיפה לאן». */
var KDRAG = { el: null, col: null };

function kdragCol(x, y) {
  var over = document.elementFromPoint(x, y);
  return over && over.closest ? over.closest('.kcol') : null;
}
document.addEventListener('pointerdown', function (e) {
  var g = e.target && e.target.closest ? e.target.closest('.kcard > .grip') : null;
  if (!g) return;
  KDRAG.el = g.closest('.kcard');
  KDRAG.col = null;
  KDRAG.el.classList.add('dragging');
  /*  ⛔ המצביע נלכד על הידית — ⚠️ בלעדיו אצבע שיוצאת מגבול הכרטיס
   *  מפסיקה לשדר, ⭐ והגרירה נתקעת באמצע. */
  try { g.setPointerCapture(e.pointerId); } catch (e1) {}
  e.preventDefault();
});
document.addEventListener('pointermove', function (e) {
  if (!KDRAG.el) return;
  e.preventDefault();
  var col = kdragCol(e.clientX, e.clientY);
  if (col === KDRAG.col) return;
  /*  ⛔ הסימון על העמודה הוא המשוב היחיד — ⚠️ בלעדיו המשתמש אינו
   *  יודע אל איזו עמודה הכרטיס ייפול. */
  if (KDRAG.col) KDRAG.col.classList.remove('over');
  KDRAG.col = col;
  if (col) col.classList.add('over');
});
document.addEventListener('pointerup', function (e) {
  if (!KDRAG.el) return;
  var el = KDRAG.el, col = kdragCol(e.clientX, e.clientY);
  if (KDRAG.col) KDRAG.col.classList.remove('over');
  KDRAG.el = null; KDRAG.col = null;
  el.classList.remove('dragging');
  if (col && col.dataset.stage) moveTask(el.dataset.id, col.dataset.stage);
});

// עדכון אופטימי עם החזרה אחורה: הכרטיס זז מיד (גרירה שמחכה לשמירה נראית
// תקועה), ואם השמירה נכשלה השלב חוזר לערכו הקודם והמסך מצויר מחדש.
// ⚠️ ההחזרה אינה מיותרת דווקא מפני שהכתיבה מקומית: `update` נכשלת רק כשגם
// הכתיבה המקומית נכשלה (אחסון מלא) — כלומר בדיוק במצב שבו הכרטיס על המסך
// היה משקר על משהו ששום שכבה לא שמרה.
function moveTask(id, stage) {
  var t = null;
  for (var i = 0; i < state.tasks.length; i++) if (idEq(state.tasks[i].id, id)) t = state.tasks[i];
  if (!t || t.stage === stage) return;
  var prev = t.stage;
  t.stage = stage;
  render();
  // update() אינה נכשלת ברשת (היא מקומית-תחילה) — היא נכשלת רק כשהכתיבה
  // המקומית או התור נכשלו, וזה בדיוק המצב שבו הגרירה חייבת לחזור אחורה.
  Promise.resolve().then(function () { return update('g_tasks', id, { stage: stage }); })
    .then(function () { schedulePush(); })
    .catch(function (e) { t.stage = prev; render(); errToast(e); });
}

/* ⛔⛔ אזור ההגדרות — הערת הגנה משותפת לכל האפליקציות
   ⛔ **אין להוסיף שער סיסמה נפרד מעל מסך ההגדרות.** ההרשאה נגזרת
   מהמשתמש המחובר בלבד, ואין שכבה שנייה מעליה.

   **הנימוק — שתי סיבות, וכל אחת מהן מספיקה לבדה:**
   1. שער כזה הוא **שכבת הרשאה כפולה** — מנגנון שני עם מסך משלו,
      מסלול שינוי משלו ותחזוקה משלו, לאותו אדם.
   2. **בהתקנה טרייה שער כזה נופל חזרה לערך ברירת מחדל** — ⚠️ ונפתח
      לכל מי שמקליד אותו: ⛔ הגנה שתלויה בכך שמישהו הריץ שורת זריעה
      בקובץ הסכימה אינה הגנה.

   ⛔ **ואין לזרוע ערך ברירת מחדל לסיסמה או לתפקיד בשום מקום** — לא
   בסכימה, לא במיגרציה, לא בקוד ולא בקובץ בדיקה. ברירת מחדל
   לסיסמה היא חשבון שסיסמתו ידועה לכל העולם;
   ברירת מחדל לתפקיד היא הרשאה שניתנת למי שאיש לא החליט
   להעניק לו אותה. תפקיד נכתב **במפורש** ביצירת המשתמש.

   ⚠️ **הערה זו זהה בית-לבית בכל האפליקציות** פרט לשורת «כאן:» שבסופה.
   לקח אבטחתי שנלמד באפליקציה אחת נרשם בכולן — גם כשהמנגנון עצמו
   רלוונטי רק לאחת. הערה שיושבת במקום אחד אינה
   מגינה על הארגון.

   כאן: `viewSettings` / `isAdmin` — ההרשאה נגזרת מ-`g_users.role` (`admin` מול
   `manager`), והעמודה היא `text not null` **בלי DEFAULT** (0001). שלוש
   טבלאות המשתמשים בארגון מיושרות בנקודה הזו, ובשלושתן **יצירת משתמש בלי
   `role` נכשלת במסד**. ⭐ **והערכים מיושרים**: `admin` הוא
   המורשה ו-`manager` מי שאינו, ⚠️ ודרגת ביניים נוספת מוכרזת במקומה עם
   נימוקה. ⚠️ הנפילה-חזרה `val('us-role') || 'manager'` ב-`saveUser`
   **נשארת** — היא שכבת הגנה בטופס (התפקיד הנמוך), לא ברירת מחדל במסד.
   ═════════════════════════════════════════════════════════════════════ */
function viewSettings() {
  // שכבת ההגנה השנייה. `go()` כבר חוסם את הניווט, אבל מסך שמרנדר את עצמו
  // ללא תלות בהרשאה הוא מסך שנפתח לכל מי שהגיע אליו בדרך אחרת (רינדור
  // ישיר, `state.screen` שנקבע במקום אחר). ⛔ אין להסיר את הבדיקה הזו —
  // «כי `go` כבר בודק» — שתי השכבות נועדו בדיוק זו לזו.
  if (!isAdmin()) {
    return '<section class="card">' + emptyBox('🔒', 'אין הרשאה — מסך ההגדרות פתוח לבעלים בלבד') + '</section>';
  }

  var h = '';

  /* משתמשים */
  h += '<section class="card"><h2>👥 ניהול משתמשים<span class="cnt">' + state.users.length + '</span>' +
    '<span class="sp"><button class="btn sm" data-act="user-new">＋ משתמש</button></span></h2>' +
    '<div class="tw"><table><thead><tr><th>שם מלא</th><th>שם משתמש</th><th>תפקיד</th><th>סטטוס</th><th></th></tr></thead><tbody>';
  state.users.forEach(function (u) {
    h += '<tr><td><b>' + esc(u.full_name) + '</b></td><td>' + esc(u.username) + '</td>' +
      '<td><span class="badge ' + (isAdminOf(u) ? 'brand' : '') + '">' + (isAdminOf(u) ? 'בעלים' : 'מנהל') + '</span></td>' +
      '<td><span class="badge ' + (u.active ? 'ok' : 'bad') + '">' + (u.active ? 'פעיל' : 'מושבת') + '</span></td>' +
      '<td><button class="btn ghost xs" data-act="user-edit" data-id="' + u.client_id + '">עריכה</button> ' +
        '<button class="btn ghost xs" data-act="user-pass" data-id="' + u.client_id + '">סיסמה</button> ' +
        '<button class="btn ' + (u.active ? 'danger' : 'soft') + ' xs" data-act="user-toggle" data-id="' + u.client_id + '">' +
          (u.active ? 'השבתה' : 'הפעלה') + '</button></td></tr>';
  });
  h += '</tbody></table></div></section>';

  /* רשימות */
  h += '<section class="card"><h2>📋 ניהול רשימות</h2>' +
    '<div class="u-c-text3 u-fs-3 u-mb-5">הרשימות האלו מזינות את כל התפריטים באפליקציה.</div>' +
    '<div class="grid2">';
  CONFIG_KEYS.forEach(function (c) {
    var items = state.config[c.key] || [];
    h += '<div class="u-bd-1-solid-border u-r-radius-sm u-p-5">' +
      '<div class="u-fw-700 u-fs-3">' + esc(c.label) + '</div>' +
      '<div class="u-c-text3 u-fs-2 u-mb-4">' + esc(c.hint) + '</div>';
    if (!items.length) h += '<div class="u-c-text3 u-fs-3 u-p-4-0">הרשימה ריקה</div>';
    items.forEach(function (v, i) {
      h += '<div class="u-d-flex u-ai-c u-g-3 u-p-3-0 u-bb-1-solid-border-2">' +
        '<span class="u-fx-1 u-fs-3">' + esc(v) + '</span>' +
        '<button class="btn ghost xs" data-act="cfg-edit" data-key="' + c.key + '" data-i="' + i + '">עריכה</button>' +
        '<button class="btn danger xs" data-act="cfg-del" data-key="' + c.key + '" data-i="' + i + '">הסרה</button></div>';
    });
    h += '<div class="addrow ksave">' +
      '<input aria-label="ערך חדש" class="inp" id="cfg-add-' + c.key + '" placeholder="ערך חדש…">' +
      '<button class="btn sm" data-act="cfg-add" data-ksave data-key="' + c.key + '">הוספה</button></div>' +
      '</div>';
  });
  h += '</div></section>';

  /* יעדים */
  h += '<section class="card"><h2>🎯 יעד חודשי<span class="cnt">' + state.targets.length + '</span>' +
    '<span class="sp"><button class="btn sm" data-act="target-set">קביעת יעד</button></span></h2>';
  if (!state.targets.length) h += emptyBox('🎯', 'עדיין לא הוגדרו יעדים');
  else {
    h += '<div class="tw"><table><thead><tr><th>חודש</th><th class="num">יעד</th><th class="num">נגבה</th>' +
      '<th class="num">אחוז</th><th></th></tr></thead><tbody>';
    state.targets.forEach(function (t) {
      var got = sum(monthTxns(t.month), function (x) { return x.amount; });
      var pct = num(t.amount) > 0 ? got / num(t.amount) * 100 : 0;
      h += '<tr><td>' + esc(monthLabel(t.month)) + '</td>' +
        '<td class="num">' + ils(t.amount) + '</td><td class="num">' + ils(got) + '</td>' +
        '<td class="num">' + pct.toFixed(0) + '%</td>' +
        '<td><button class="btn ghost xs" data-act="target-set" data-month="' + esc(t.month) + '">עריכה</button></td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</section>';
  return h;
}

/* ══════════════════════════════════════════════════════════════════════════
   בורר התורם — חיפוש תוך כדי הקלדה + יצירה מיידית
   ══════════════════════════════════════════════════════════════════════════
   הרכיב קיים כדי שרישום תנועה לתורם חדש לא יחייב לצאת מהטופס, ליצור תורם
   במסך אחר, ולחזור. הערך הנבחר יושב ב-`dataset.value` של השורש ונקרא
   ב-`pickerValue(id)` — **לא** ב-`<select>`, כי הרשימה נבנית מחדש בכל
   הקלדה ובורר עם מאות אפשרויות אינו שמיש במובייל.
   ⚠️ היצירה המיידית עוברת ב-`insert` הרגיל, כלומר מקומית-תחילה: תורם חדש
   נוצר גם בלי רשת, ומסומן ⏳ עד שיעלה.
   ══════════════════════════════════════════════════════════════════════════ */
function pickerHTML(id, donorId) {
  var d = donorId ? donorById(donorId) : null;
  return '<div class="picker ksave" id="' + id + '" data-value="' + esc(d ? d.client_id : '') + '">' +
    '<div class="dp-chosen' + (d ? '' : ' hidden') + '">' +
      '<span class="dp-name">' + esc(d ? d.name : '') + '</span>' +
      '<button type="button" data-act="dp-clear" aria-label="ניקוי">✕</button>' +
    '</div>' +
    '<input aria-label="חיפוש תורם לפי שם או טלפון" class="inp dp-q' + (d ? ' hidden' : '') + '" placeholder="חיפוש תורם לפי שם או טלפון…" autocomplete="off">' +
    '<div class="dp-results hidden"></div>' +
    '<div class="dp-new hidden">' +
      '<div class="u-fw-700 u-fs-3 u-mb-4">תורם חדש</div>' +
      '<div class="f2">' +
        '<label class="fld"><span>שם התורם</span><input class="inp dp-n-name"></label>' +
        '<label class="fld"><span>טלפון</span><input class="inp dp-n-phone" inputmode="tel"></label>' +
      '</div>' +
      '<div class="btnrow"><button type="button" class="btn sm" data-act="dp-n-save" data-ksave>שמירה ובחירה</button>' +
      '<button type="button" class="btn ghost sm" data-act="dp-n-cancel" data-kesc>ביטול</button></div>' +
    '</div>' +
  '</div>';
}

function pickerValue(id) { var el = $('#' + id); return el ? el.dataset.value : ''; }

/*  ⛔ הרשימה מתרוקנת בכל מעבר מצב ⛔ ולא רק מוסתרת — ⚠️ הסימון `data-ksave`
 *  יושב על הכפתור הראשון שבה, ⭐ וכפתור שנשאר בעץ מוסתר היה נבחר במקש
 *  במקום כפתור השמירה של תורם חדש. */
function pickerClear(root) {
  var res = $('.dp-results', root);
  res.innerHTML = '';
  res.classList.add('hidden');
}

/*  ⛔ שדה `#txn-pledge` תלוי בתורם שנבחר — ⚠️ והתלות יושבת כאן, במקום אחד,
 *  ⭐ ולא בסגור שנמסר לרכיב בכל פתיחת מודאל: סגור פר-פתיחה הוא מסלול שני
 *  שמתיישן ברגע שהרכיב משתנה. */
function pickerSet(root, d) {
  var chosen = $('.dp-chosen', root), q = $('.dp-q', root);
  root.dataset.value = d ? d.client_id : '';
  $('.dp-name', chosen).textContent = d ? d.name : '';
  chosen.classList.toggle('hidden', !d);
  q.classList.toggle('hidden', !!d);
  pickerClear(root);
  $('.dp-new', root).classList.add('hidden');
  if (!d) { q.value = ''; q.focus(); }
  if (root.id === 'txn-donor') {
    var sel = $('#txn-pledge');
    if (sel) sel.innerHTML = pledgeOptionsFor(d ? d.client_id : '');
  }
}

/*  ⛔ ההתאמה הראשונה נושאת את `data-ksave` — ⚠️ ובלי התאמות הוא עובר
 *  לכפתור «צור תורם חדש»: ⭐ המקש עושה בשורת החיפוש בדיוק את מה שהעין
 *  רואה ראשון. */
function pickerPaint(root) {
  var q = $('.dp-q', root), res = $('.dp-results', root);
  var term = q.value.trim();
  var list = donorMatches(term).slice(0, 30);
  var h = '';
  list.forEach(function (d, i) {
    h += '<button type="button" data-act="dp-pick"' + (i ? '' : ' data-ksave') +
      ' data-id="' + d.client_id + '">' + esc(d.name) +
      '<small>' + esc(d.phone || 'ללא טלפון') + '</small></button>';
  });
  h += '<button type="button" class="mk" data-act="dp-new"' + (list.length ? '' : ' data-ksave') +
    '>＋ צור תורם חדש' + (term ? ' — "' + esc(term) + '"' : '') + '</button>';
  res.innerHTML = h;
  res.classList.remove('hidden');
}

function pickerNew(root) {
  var box = $('.dp-new', root);
  pickerClear(root);
  box.classList.remove('hidden');
  $('.dp-n-name', box).value = $('.dp-q', root).value.trim();
  $('.dp-n-name', box).focus();
}

function pickerSave(root) {
  var box = $('.dp-new', root);
  var name = $('.dp-n-name', box).value.trim();
  var phone = $('.dp-n-phone', box).value.trim();
  if (!name) { toast(MSG_NEED_DONOR_NAME, null, 'bad'); return; }
  return insert('g_donors', { name: name, phone: phone || null })
    .then(function (d) {
      state.donors.push(d);
      $('.dp-n-name', box).value = '';
      $('.dp-n-phone', box).value = '';
      pickerSet(root, d);
      toast(MSG_DONOR_CREATED, null, 'good');
    })
    .catch(errToast);
}

/* ══════════════════════════════════════════════════════════════════════════
   טפסים — בנייה (`form*`) ושמירה (`save*`)
   ══════════════════════════════════════════════════════════════════════════
   הזוג קבוע: `formX` פותח מודאל, `saveX` קורא את השדות ומחזיר Promise.
   ⚠️ **`saveX` שמחזירה `Promise.resolve()` — כלומר `undefined` — היא
   ולידציה שעצרה**, ו-`runSave` מזהה זאת ואינה סוגרת את המודאל.
   ⛔ אין להחזיר משם ערך «בשביל האחידות» —
   זה היה סוגר את הטופס ומציג «נשמר» על
   קלט שנדחה.
   ══════════════════════════════════════════════════════════════════════════ */
function pledgeOptionsFor(donorId) {
  var list = donorId ? pledgesOfDonor(donorId) : [];
  var h = '<option value="">— ללא שיוך —</option>';
  list.forEach(function (p) {
    var left = Math.max(0, num(p.amount) - collectedForPledge(p.client_id));
    h += '<option value="' + p.client_id + '">' + esc(p.cause || 'התחייבות') + ' · ' + ils(p.amount) +
      ' (נותר ' + ils(left) + ')</option>';
  });
  return h;
}

// ⭐ תבנית שש הספרות — ⛔ נאכפת במסלולי יצירה ושינוי בלבד: ⚠️ אכיפה
// במסלול הכניסה נועלת בחוץ סיסמה תקפה שנקבעה לפני התקן.
var PASS_SIX_RE = /^[0-9]{6}$/;

function formUser(existing) {
  var u = existing || {};
  var body =
    '<div class="f2">' +
      '<label class="fld"><span>שם מלא *</span><input class="inp" id="us-full" value="' + esc(u.full_name || '') + '"></label>' +
