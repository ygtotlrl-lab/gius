    '</div>' +
    (u.client_id ? '' : '<label class="fld"><span>סיסמה *</span><input class="inp" id="us-pass" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"><button type="button" class="u-mt-2 btn ghost sm" data-act="pass-eye" data-id="us-pass" title="הצג/הסתר סיסמה">👁</button></label>') +
    '<div class="f2">' +
      '<label class="fld"><span>תפקיד</span><select class="inp" id="us-role">' +
        '<option value="manager"' + (isAdminOf(u) ? '' : ' selected') + '>מנהל</option>' +
        '<option value="admin"' + (isAdminOf(u) ? ' selected' : '') + '>בעלים</option></select></label>' +
      '<label class="u-mt-7 fld chk"><input type="checkbox" id="us-active"' +
        (u.client_id ? (u.active ? ' checked' : '') : ' checked') + '><span>משתמש פעיל</span></label>' +
    '</div>';
  var foot = '<button class="btn ghost" data-act="modal-close">ביטול</button>' +
    '<button class="btn" data-act="user-save" data-ksave data-id="' + (u.client_id || '') + '">שמירה</button>';
  openModal(u.client_id ? MSG_EDIT_USER : MSG_NEW_USER, body, foot);
}

function saveUser(id) {
  var full = val('us-full'), uname = val('us-name');
  if (!full || !uname) { toast(MSG_NEED_FULL_AND_USER, null, 'bad'); return Promise.resolve(); }
  var row = {
    full_name: full, username: uname,
    role: val('us-role') || 'manager',
    active: checked('us-active')
  };
  // ⚠️ כתיבת משתמש דורשת רשת (`writeUser`), כי היא חייבת להגיע לענן
  // כדי שהטביעה תגיע לשאר המכשירים. בלי רשת — נכשל ברעש.
  if (!navigator.onLine) { toast(MSG_OFF_USER_WRITE, null, 'bad'); return Promise.resolve(); }
  if (!id) {
    var p = $('#us-pass') ? $('#us-pass').value : '';
    if (!p) { toast(MSG_NEED_PASS, null, 'bad'); return Promise.resolve(); }
    if (!PASS_SIX_RE.test(p)) { toast(MSG_PASS_SIX, null, 'bad'); return Promise.resolve(); }
    return passFields(p).then(function (pf) {
      return writeUser(null, Object.assign({}, row, pf)).then(warnIfNoFp)
        .then(function (r) { if (r && !r.error) plTouch(); return r; });
    });
  }
  // עריכת משתמש קיים אינה נוגעת בסיסמה, ולכן גם לא בטביעה.
  /*  ⛔ כתיבת משתמש שהצליחה מקדמת את אות הפולינג — ⚠️ `g_users` נמשכת
   *  ב-`syncPull` כמו כל טבלה שב-`TABLES`, ⭐ ובלי הקידום השינוי נשאר
   *  בלתי-נראה לכל מכשיר אחר עד לשינוי נתונים אחר. */
  return writeUser(id, row).then(function (r) { if (r && !r.error) plTouch(); return r; });
}

// ⚠️ שמירה שהצליחה **בלי** טביעה אינה «נשמר בהצלחה»: המשתמש נשמר, אבל
// הכניסה האופליין שלו לא תעבוד. אומרים את זה, לא בולעים.
function warnIfNoFp(r) {
  if (r && r.noFp) toast(MSG_SAVED_NO_FP, null, 'bad');
  return r;
}

function formPassword(u) {
  openModal(MSG_PASS_CHANGE_FOR + u.full_name,
    '<label class="fld"><span>סיסמה חדשה *</span><input class="inp" id="pw-new" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"><button type="button" class="u-mt-2 btn ghost sm" data-act="pass-eye" data-id="pw-new" title="הצג/הסתר סיסמה">👁</button></label>',
    '<button class="btn ghost" data-act="modal-close">ביטול</button>' +
    '<button class="btn" data-act="pass-save" data-ksave data-id="' + u.client_id + '">שמירה</button>');
  var el = $('#pw-new'); if (el) el.focus();
}

// ⭐ החלפת סיסמה עצמית — לכל משתמש מחובר, מתוך המסך (כפתור 🔑
//    בכותרת). הסיסמה הנוכחית מאומתת מול הענן ואינה נשמרת בשום מקום;
//    הכתיבה עוברת ב-`passFields`+`writeUser` — אותו מסלול בדיוק כמו
//    שינוי סיסמה ע"י הבעלים, כולל גזירת הטביעה מחדש.
// ⚠️ הסיסמה **הנוכחית** אינה נבדקת מול תבנית שש-הספרות — בדיוק כמו
//    במסלול הכניסה: אכיפה שם הייתה נועלת בחוץ סיסמה ותיקה ותקפה.
function formMyPassword() {
  openModal(MSG_MY_PASS_TITLE,
    '<label class="fld"><span>סיסמה נוכחית *</span><input class="inp" id="mp-cur" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></label>' +
    '<label class="fld"><span>סיסמה חדשה *</span><input class="inp" id="mp-new" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>' +
    '<label class="fld"><span>אימות סיסמה חדשה *</span><input class="inp" id="mp-new2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>',
    '<button class="btn ghost" data-act="modal-close">ביטול</button>' +
    '<button class="btn" data-act="my-pass-save" data-ksave>שמירה</button>');
  var el = $('#mp-cur'); if (el) el.focus();
}

function formSaveMyPassword() {
  var c1 = $('#mp-cur'), n1 = $('#mp-new'), n2 = $('#mp-new2');
  if (!c1 || !n1 || !n2) { uiNoDialog('formSaveMyPassword', 'mp-cur'); return; }
  var cur = c1.value.trim(), p1 = n1.value.trim(), p2 = n2.value.trim();
  if (!cur || !p1 || !p2) { toast(MSG_FILL_ALL, null, 'bad'); return; }
  if (!PASS_SIX_RE.test(p1)) { toast(MSG_PASS_SIX, null, 'bad'); return; }
  if (p1 !== p2) { toast(MSG_PASS_MISMATCH, null, 'bad'); return; }
  if (!sb || !navigator.onLine) { toast(MSG_OFF_USER_WRITE, null, 'bad'); return; }
  // ⚠️ האימות הוא מול הענן, רגעי בלבד — הסיסמה הנוכחית אינה נכתבת לשום
  //    מקום, וכשל רשת באמצע נכשל ברעש (writeUser ממילא דורש רשת).
  return runSave(function () {
    // ⭐ אימות הסיסמה הנוכחית מול הטביעה; הטקסט הגלוי אינו נשלף.
    return withTimeout(sb.from('g_users').select('client_id,active,pass_salt,pass_fp').eq('client_id', state.user.client_id).limit(1))
      .then(function (res) {
        if (res && res.error) throw res.error;
        var u = res && Array.isArray(res.data) && res.data[0];
        if (!u) throw new Error('הסיסמה הנוכחית שגויה');
        return gVerifyOffline(u, cur).then(function (v) {
          if (v !== 'ok') throw new Error('הסיסמה הנוכחית שגויה');
          return passFields(p1);
        });
      })
      .then(function (pf) { return writeUser(state.user.client_id, pf).then(warnIfNoFp)
        .then(function (r) { if (r && !r.error) plTouch(); return r; }); });
  }, 'הסיסמה עודכנה');
}

/* ══════════════════════════════════════════════════════════════════════════
   החלפת משתמש — מסך אחד, מול הטביעה
   ══════════════════════════════════════════════════════════════════════════
   ⭐ שכבת הכניסה אחידה: שתי האפליקציות שיש בהן ניהול משתמשים
   מלא מחזיקות **גם** שינוי סיסמה עצמי **וגם** החלפת
   משתמש.
   ⛔ האימות הוא `gVerifyOffline` — אותה פונקציה בדיוק שמכריעה
   את הכניסה, מקוונת ואופליין. ⚠️ מסלול אימות שני היה מקום נוסף שבו
   `active` או הטביעה עלולים להיבדק אחרת, ובדיוק שם נולדים פערים.
   ⛔ ואין כאן קיצור דרך: החלפה בלי סיסמה הייתה הופכת כל מכשיר פתוח
   למעבר חופשי לכל זהות שנמצאת במראה.
   ══════════════════════════════════════════════════════════════════════════ */
function formSwitchUser() {
  var others = (MIRROR.g_users || []).filter(function (u) {
    return u && u.active !== false && String(u.client_id) !== String(state.user.client_id);
  });
  if (!others.length) { toast(MSG_NO_OTHER_USER_LOCAL, null, 'bad'); return; }
  openModal(MSG_SWITCH_USER,
    '<label class="fld"><span>משתמש</span><select class="inp" id="sw-user" aria-label="המשתמש שאליו עוברים">' +
      others.map(function (u) {
        return '<option value="' + esc(u.client_id) + '">' + esc(u.full_name || u.username) + '</option>';
      }).join('') +
    '</select></label>' +
    '<label class="fld"><span>סיסמה *</span><input class="inp" id="sw-pass" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></label>',
    '<button class="btn ghost" data-act="modal-close">ביטול</button>' +
    '<button class="btn" data-act="switch-confirm" data-ksave>כניסה</button>');
  var el = $('#sw-pass'); if (el) el.focus();
}

function formTarget(month) {
  var m = month || state.month;
  var cur = 0;
  for (var i = 0; i < state.targets.length; i++) if (state.targets[i].month === m) cur = num(state.targets[i].amount);
  openModal(MSG_MONTH_GOAL,
    '<div class="f2">' +
      '<label class="fld"><span>חודש *</span><input class="inp" type="month" id="tg-month" value="' + esc(m) + '"></label>' +
      '<label class="fld"><span>סכום יעד *</span><input class="inp" id="tg-amount" inputmode="decimal" value="' + (cur || '') + '"></label>' +
    '</div>',
    '<button class="btn ghost" data-act="modal-close">ביטול</button>' +
    '<button class="btn" data-act="target-save" data-ksave>שמירה</button>');
}

function saveTarget() {
  var m = val('tg-month');
  if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(m)) { toast(MSG_PICK_VALID_MONTH, null, 'bad'); return Promise.resolve(); }
  var amount = num(val('tg-amount'));
  return upsertBy('g_targets', 'month', { month: m, amount: amount });
}

/* ══════════════════════════════════════════════════════════════════════════
   פעולות — מפת `data-act` אחת, האזנה מואצלת אחת
   ══════════════════════════════════════════════════════════════════════════
   כל כפתור באפליקציה נושא את שם הפעולה במאפיין `data-act`, ומאזין יחיד
   על `document` מוצא את הפונקציה ב-`DOM_ACTIONS`. ⛔ **אין `onclick` עם קוד JS
   בתוך מאפיין HTML** — כל המסכים נבנים כמחרוזות, וקוד בתוך מאפיין נשבר מכל גרש בשם
   תורם והופך הזרקה לביצוע. אותו לקח נמדד ותוקן בשתי אחיות.
   ערכים נמסרים ב-`data-*` ונקראים מ-`dataset`.
   ══════════════════════════════════════════════════════════════════════════ */
/*  ⛔ נקודת הרענון של הצינור — ⚠️ **מה נכנס**: טעינת המראה לזיכרון והציור
 *  שאחריה, ⛔ **ומה מפיל**: המתנה לרשת כאן — ⭐ הכתיבה כבר במראה ובתור,
 *  ⚠️ והסנכרון מרנדר שוב ברקע כשהוא מביא משהו חדש. */
function saveRefresh() {
  applyMirrorToState();
  render();
  pendRender();
}
function findUser(id) {
  for (var i = 0; i < state.users.length; i++) if (idEq(state.users[i].client_id, id)) return state.users[i];
  return null;
}
function findTask(id) {
  for (var i = 0; i < state.tasks.length; i++) if (idEq(state.tasks[i].id, id)) return state.tasks[i];
  return null;
}

var DOM_ACTIONS = {
  'sw-apply':            function (el) { swApply(el); },
  'sw-dismiss':          function () { swHideUpdate(); },
  /*  ⛔ שלוש התראות התשתית מנותבות במפה — ⚠️ הכפתור נבנה ב-JS,
   *  ⭐ והמאזין הישיר שעליו היה בדיוק ההיקף שיצא מהמנגנון. */
  'ls-alert-close':      function () { var el = document.getElementById('ls-alert'); if (el) el.style.display = 'none'; },
  'pend-alert-ok':       function () { pendAlertDismiss(); },
  'lk-stay':             function () { lkReset(); },
  'tab': function (el) { go(el.dataset.tab); },
  'switch-user': function () { formSwitchUser(); },
  'switch-confirm': function (el) {
    var id = $('#sw-user') ? $('#sw-user').value : '';
    var p  = $('#sw-pass') ? $('#sw-pass').value : '';
    if (!id || !p) { toast(MSG_PICK_USER_AND_PASS, null, 'bad'); return; }
    var cu = null, arr = MIRROR.g_users || [];
    for (var i = 0; i < arr.length; i++) if (String(arr[i].id) === String(id)) cu = arr[i];
    /*  ⛔ ארבע ההודעות נשארות נבדלות גם כאן — «אין במה לאמת»
     *  אינו «סיסמה שגויה», והודעה מאוחדת שולחת את המשתמש להקליד שוב
     *  ושוב סיסמה נכונה לחלוטין במקום לומר לו שנדרש חיבור אחד. */
    if (!cu) { toast(MSG_OFF_UNKNOWN, null, 'bad'); return; }
    return gVerifyOffline(cu, p).then(function (v) {
      if (v === 'no-fp')     { toast(MSG_OFF_NO_FP, null, 'bad'); return; }
      if (v === 'no-crypto') { toast(MSG_OFF_NO_CRYPTO, null, 'bad'); return; }
      if (v !== 'ok')        { toast(MSG_BAD_LOGIN, null, 'bad'); return; }
      closeModal();
      ctxSwitch();
      state.user = { client_id: cu.client_id, username: cu.username, full_name: cu.full_name, role: cu.role };
      state.screen = 'home';
      state.donorId = null;
      boot();
      toast(MSG_SWITCHED_TO + (cu.full_name || cu.username), null, 'good');
    }, function (e) { console.warn('[switch]', e); toast(MSG_OFF_NO_CRYPTO, null, 'bad'); });
  },
  'logout': function () { doLogout(); },
  'modal-close': function () { closeModal(); },
  'ask-yes': function () { closeAsk(true); },
  'ask-no': function () { closeAsk(false); },

  'month': function (el) { state.month = shiftMonth(state.month, +el.dataset.d); render(); },

  'fab': function () {
    openModal(MSG_WHAT_TO_ADD,
      '<div class="chooser">' +
        '<button data-act="txn-new"><span class="ic">💰</span><span>תנועה<small>רישום כסף שנכנס</small></span></button>' +
        '<button data-act="task-new"><span class="ic">📋</span><span>משימה<small>מטלה לקנבן</small></span></button>' +
        '<button data-act="pledge-new"><span class="ic">🤝</span><span>התחייבות<small>הבטחת תרומה</small></span></button>' +
      '</div>', '');
  },

  /* תורמים */
  'donor-new': function () { formDonor(null); },
  'donor-edit': function (el) { formDonor(donorById(el.dataset.id)); },
  'donor-save': function (el) { return runSave(function () { return saveDonor(el.dataset.id); }, 'נשמר'); },
  'donor-open': function (el) {
    state.screen = 'donors';
    state.donorId = el.dataset.id;
    render();
  },
  'donor-back': function () { state.donorId = null; render(); },
  'vip-toggle': function (el) {
    var d = donorById(el.dataset.id);
    if (!d) return;
    return update('g_donors', d.client_id, { is_vip: !d.is_vip })
      .then(function () { d.is_vip = !d.is_vip; render(); })
      .catch(errToast);
  },
  'notes-save': function (el) {
    var notes = $('#donor-notes') ? $('#donor-notes').value : '';
    return update('g_donors', el.dataset.id, { notes: notes || null })
      .then(function () {
        var d = donorById(el.dataset.id);
        if (d) d.notes = notes;
        toast(MSG_NOTES_SAVED, null, 'good');
      })
      .catch(errToast);
  },
  'donor-del': function (el) {
    var d = donorById(el.dataset.id);
    if (!d) return;
    var hasData = pledgesOfDonor(d.client_id).length || txnsOfDonor(d.client_id).length;
    return ask(MSG_DEL_DONOR_TITLE,
      hasData
        ? MSG_DEL_DONOR_LINKED
        : MSG_DEL_QUOTE_PRE + d.name + MSG_DEL_QUOTE_POST,
      MSG_DELETE_ACT
    ).then(function (yes) {
      if (!yes) return;
      softDelete('g_donors', d.client_id)
        .then(function () { state.donorId = null; return afterSave('התורם נמחק'); })
        .catch(errToast);
    });
  },

  /* תנועות */
  'txn-new': function (el) { formTxn(null, el.dataset.donor || ''); },
  'txn-edit': function (el) {
    var t = null;
    for (var i = 0; i < state.txns.length; i++) if (idEq(state.txns[i].id, el.dataset.id)) t = state.txns[i];
    if (t) formTxn(t);
  },
  'txn-save': function (el) { return runSave(function () { return saveTxn(el.dataset.id); }, 'התנועה נשמרה'); },
  'txn-del': function (el) {
    return ask(MSG_DEL_TXN_TITLE, MSG_DEL_TXN_BODY, MSG_DELETE_ACT).then(function (yes) {
      if (!yes) return;
      softDelete('g_txns', el.dataset.id).then(function () { return afterSave('נמחק'); }).catch(errToast);
    });
  },

  /* התחייבויות */
  'pledge-new': function (el) { formPledge(null, el.dataset.donor || ''); },
  'pledge-edit': function (el) { formPledge(pledgeById(el.dataset.id)); },
  'pledge-save': function (el) { return runSave(function () { return savePledge(el.dataset.id); }, 'ההתחייבות נשמרה'); },
  'pledge-del': function (el) {
    return ask(MSG_DEL_PLEDGE_TITLE, MSG_DEL_PLEDGE_BODY, MSG_DELETE_ACT).then(function (yes) {
      if (!yes) return;
      softDelete('g_pledges', el.dataset.id).then(function () { return afterSave('נמחק'); }).catch(errToast);
    });
  },
  'pf-clear': function () {
    state.pf = { agent: '', status: '', cause: '', from: '', to: '' };
    render();
  },

  /* משימות */
  'task-new': function () { formTask(null); },
  'task-open': function (el) { formTask(findTask(el.dataset.id)); },
  'task-save': function (el) { return runSave(function () { return saveTask(el.dataset.id); }, 'המשימה נשמרה'); },
  'task-del': function (el) {
    return ask(MSG_DEL_TASK_TITLE, MSG_DEL_TASK_BODY, MSG_DELETE_ACT).then(function (yes) {
      if (!yes) return;
      softDelete('g_tasks', el.dataset.id).then(function () { return afterSave('נמחק'); }).catch(errToast);
    });
  },

  /* הגדרות — משתמשים */
  'user-new': function () { formUser(null); },
  'user-edit': function (el) { formUser(findUser(el.dataset.id)); },
  'user-save': function (el) { return runSave(function () { return saveUser(el.dataset.id); }, 'המשתמש נשמר'); },
  'user-pass': function (el) { var u = findUser(el.dataset.id); if (u) formPassword(u); },
  'pass-save': function (el) {
    var p = $('#pw-new') ? $('#pw-new').value : '';
    if (!p) { toast(MSG_NEED_PASS, null, 'bad'); return; }
    if (!PASS_SIX_RE.test(p)) { toast(MSG_PASS_SIX, null, 'bad'); return; }
    if (!navigator.onLine) { toast(MSG_OFF_USER_WRITE, null, 'bad'); return; }
    // ⭐ הטביעה נגזרת בכל שינוי סיסמה, לצד הסיסמה עצמה.
    return runSave(function () {
      return passFields(p).then(function (pf) {
        return writeUser(el.dataset.id, pf).then(warnIfNoFp);
      });
    }, 'הסיסמה עודכנה');
  },
  'my-pass': function () { formMyPassword(); },
  /*  ⛔ מלווה את המעבר ל-`type=password` — שני השדות שהבעלים
   *  קובע בהם סיסמה **לאדם אחר** אין להם שדה אימות, ולכן הסתרה בלי דרך
   *  לראות מה הוקלד הייתה יוצרת נעילה-בחוץ שקטה במקום להסיר סיכון. */
  'pass-eye': function (el) {
    var f = $('#' + el.dataset.id);
    if (f) f.type = (f.type === 'password' ? 'text' : 'password');
  },
  'my-pass-save': function () { return formSaveMyPassword(); },
  'user-toggle': function (el) {
    var u = findUser(el.dataset.id);
    if (!u) return;
    if (idEq(u.client_id, state.user.client_id) && u.active) { toast(MSG_NO_SELF_DISABLE, null, 'bad'); return; }
    if (!navigator.onLine) { toast(MSG_OFF_USER_WRITE, null, 'bad'); return; }
    // ⚠️ ההשבתה חייבת להגיע לענן: משתמש שהושבת ונשאר במראה של מכשיר אחר
    //    היה נשאר בר-כניסה אופליין. המשיכה הבאה מורידה אותו משם.
    return writeUser(u.client_id, { active: !u.active })
      .then(function () { render(); toast(MSG_UPDATED, null, 'good'); })
      .catch(errToast);
  },

  /* הגדרות — רשימות */
  'cfg-add': function (el) {
    var key = el.dataset.key;
    var input = $('#cfg-add-' + key);
    var v = input ? input.value.trim() : '';
    if (!v) { toast(MSG_NEED_VALUE, null, 'bad'); return; }
    var list = (state.config[key] || []).slice();
    if (uniqHas(list, v)) { toast(MSG_VALUE_EXISTS2, null, 'bad'); return; }
    list.push(v);
    return runSave(function () { return saveConfigList(key, list); }, 'נוסף');
  },
  'cfg-edit': function (el) {
    var key = el.dataset.key, i = +el.dataset.i;
    var list = (state.config[key] || []).slice();
    openModal(MSG_EDIT_VALUE,
      '<label class="fld"><span>ערך</span><input class="inp" id="cfg-v" value="' + esc(list[i] || '') + '"></label>' +
      '<div class="u-c-text3 u-fs-2">שינוי הערך אינו משנה רשומות קיימות שכבר משתמשות בערך הישן.</div>',
      '<button class="btn ghost" data-act="modal-close">ביטול</button>' +
      '<button class="btn" data-act="cfg-edit-save" data-ksave data-key="' + key + '" data-i="' + i + '">שמירה</button>');
  },
  'cfg-edit-save': function (el) {
    var key = el.dataset.key, i = +el.dataset.i;
    var v = val('cfg-v');
    if (!v) { toast(MSG_NEED_VALUE, null, 'bad'); return; }
    var list = (state.config[key] || []).slice();
    list[i] = v;
    return runSave(function () { return saveConfigList(key, list); }, 'נשמר');
  },
  'cfg-del': function (el) {
    var key = el.dataset.key, i = +el.dataset.i;
    var list = (state.config[key] || []).slice();
    return ask(MSG_REMOVE_VALUE_TITLE, MSG_REMOVE_QUOTE_PRE + list[i] + MSG_REMOVE_QUOTE_POST, MSG_REMOVE_ACT)
      .then(function (yes) {
        if (!yes) return;
        list.splice(i, 1);
        saveConfigList(key, list).then(function () { return afterSave('הוסר'); }).catch(errToast);
      });
  },

  /* הגדרות — יעדים */
  'target-set': function (el) { formTarget(el.dataset.month || state.month); },
  'target-save': function () { return runSave(saveTarget, 'היעד נשמר'); },
  'reload':            function () { location.reload(); },
  'login':             function () { return doLogin(); },
  'dp-pick':           function (el) { pickerSet(el.closest('.picker'), donorById(el.dataset.id)); },
  'dp-new':            function (el) { pickerNew(el.closest('.picker')); },
  'dp-clear':          function (el) { pickerSet(el.closest('.picker'), null); },
  'dp-n-cancel':       function (el) { var r = el.closest('.picker');
                                       $('.dp-new', r).classList.add('hidden'); $('.dp-q', r).focus(); },
  'dp-n-save':         function (el) { return pickerSave(el.closest('.picker')); },
};

/* ── מאזינים גלובליים ──────────────────────────────────────────────────────
   ⚠️ **האצלה על `document`, ולא קשירה לאלמנטים.** המסכים נבנים מחדש בכל
   `render()`, ומאזין שנקשר לכפתור מת עם הכפתור — ואין יוצא מן הכלל.
   ⚠️ `if (el.tagName === 'A') return;` בקליק אינו קישוט: `<a>` שיושב בתוך
   אזור עם `data-act` מקבל `preventDefault` ומאבד את הניווט הטבעי שלו,
   כלומר הופך לקישור שאינו עושה כלום. ⛔ אין למחוק את השורה כשאין `<a>`
   כזה בקוד — היא הגנה שנכשלת-סגור, והעלות שלה אפס. */
/*  ⛔ מאזין הקליק האחד של האפליקציה — ⚠️ סגירת הרקע קודמת לניתוב:
 *  ⭐ לחיצה על הרקע אינה נושאת `data-act`, ⛔ ושני מאזינים לאותו אירוע
 *  הם שני מקומות שבהם לחיצה נתפסת. */
document.addEventListener('click', function (e) {
  if (modalBackdrop(e)) return;
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fn = DOM_ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') return;
  e.preventDefault();
  actRun(el, fn);
});

/*  ⛔ מאזין המקלדת האחד של האפליקציה — ⚠️ הוא קורא לשני המסלולים
 *  המשותפים בסדר מוצהר: ⭐ שמירה בשדה עריכה קודמת לסגירת המודאל,
 *  ⛔ שאחרת `Escape` בשדה שבתוך מודאל היה סוגר אותו במקום לבטל את השדה. */
document.addEventListener('keydown', function (e) {
  if (ksKey(e)) return;
  modalEsc(e);
});

// ⚠️ חיפוש התורמים מרנדר **רק את הרשימה ואת המונה**, ולא את המסך. רינדור
// מלא היה בונה מחדש את שדה החיפוש עצמו ומאבד את הפוקוס אחרי כל תו — אותו
// שיקול כמו ב-`refreshPledges`.
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.id === 'donor-q') {
    state.donorSearch = el.value;
    var box = $('#donor-list');
    if (box) box.innerHTML = donorRowsHTML(donorMatches(state.donorSearch));
    var cnt = $('#view .card > h2 .cnt');
    if (cnt) cnt.textContent = donorMatches(state.donorSearch).length;
    return;
  }
  if (el.classList && el.classList.contains('dp-q')) pickerPaint(el.closest('.picker'));
});

document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.dataset && el.dataset.inp === 'stage') {
    moveTask(el.dataset.id, el.value);
    return;
  }
  var map = { 'pf-agent': 'agent', 'pf-status': 'status', 'pf-cause': 'cause', 'pf-from': 'from', 'pf-to': 'to' };
  if (el.id && map[el.id]) {
    state.pf[map[el.id]] = el.value;
    refreshPledges();
  }
});

/*  ⛔ שורת החיפוש שבבורר מציירת בהאצלה כמו כל השאר — ⚠️ ו-`focus` אינו
 *  עולה בעץ, ⭐ ולכן `focusin`: מאזין שנקשר לשדה עצמו היה מת עם המודאל
 *  שנבנה מחדש. */
document.addEventListener('focusin', function (e) {
  if (e.target.classList && e.target.classList.contains('dp-q')) pickerPaint(e.target.closest('.picker'));
});


/* ══════════════════════════════════════════════════════════════════════════
   עלייה — סדר הפעולות, וכל אחת מהן במקומה מסיבה
   ══════════════════════════════════════════════════════════════════════════
   `start()` הוא נקודת הכניסה: אחסון ← מראה ← סימוני ⏳ ← מיגרציות ← סשן.
   `boot()` הוא מה שרץ אחרי שיש משתמש: מציג מהעותק המקומי, ואז מסנכרן.
   ⛔ **אין להזיז את `mirrorLoad()` אחרי הסנכרון הראשון** — כל הרעיון הוא
   שהמסך עולה מהדיסק לפני שנגעו ברשת.
   ══════════════════════════════════════════════════════════════════════════ */
function boot() {
  // נעילת חוסר-פעילות — נקודת הדריכה מחדש אחרי כניסה מוצלחת;
  // שני מסלולי הכניסה (מקוון ואופליין) מגיעים לכאן, ולכן זו נקודה אחת.
  try { lkReset(); } catch (e) { console.warn('[lk] lkReset', e); }
  $('#app').innerHTML = '<div id="boot"><span class="spin"></span></div>';
  // ⭐ קריאה מהעותק המקומי **ראשונה**, לפני כל נגיעה ברשת. זה כל ההבדל
  //    בין אפליקציה שעובדת אופליין לאחת שרק מציגה ספינר.
  applyMirrorToState();
  pendRender();

  if (mirrorHasData()) {
    render();                 // המשתמש רואה נתונים מיד — גם בלי רשת
    syncNow();                // ורענון ברקע
    return Promise.resolve();
  }

  // אין עותק מקומי כלל (התקנה ראשונה / משתמש חדש) — כאן רשת היא חובה.
  return syncNow().then(function (okPull) {
    if (okPull || mirrorHasData()) { render(); return; }
    $('#app').innerHTML = '<div class="auth"><div class="auth-card">' +
      '<h1>שגיאת טעינה</h1><div class="sub">אין עדיין עותק מקומי של הנתונים, ולא הצלחנו לטעון מהשרת. ' +
      'התחברו לרשת פעם אחת — מכאן והלאה האפליקציה תעבוד גם בלעדיה.</div>' +
      '<button class="u-mt-6 btn block" data-act="reload">רענון</button>' +
      '</div></div>';
  });
}

function start() {
  if (!window.supabase || !window.supabase.createClient) {
    $('#app').innerHTML = '<div class="auth"><div class="auth-card"><h1>שגיאת טעינה</h1>' +
      '<div class="sub">ספריית Supabase לא נטענה. בדקו את החיבור לאינטרנט ורעננו.</div>' +
      '<button class="btn block" data-act="reload">רענון</button></div></div>';
    return;
  }
  sb = sbWatch(window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false }
  }));

  // עמידות אחסון: מדידה + פינוי יזום, ואז טעינת המראה — בסדר הזה,
  // כדי שהמשיכה שאחריה תכתוב לאחסון שכבר יש בו מקום.
  try { lsBoot(); } catch (e) { console.warn('[ls] lsBoot', e); }
  // מודל הסשן — נקודת ההפעלה היחידה של המודול.
  try { sessBoot(); } catch (e) { console.warn('[sess] sessBoot', e); }
  mirrorBoot();
  // סימוני "ממתין לסנכרון" — נטענים מהדיסק לפני הרינדור הראשון,
  // כך שפעולה שלא עלתה בסשן הקודם מוצגת כממתינה מיד.
  try { pendBoot(); } catch (e) { console.warn('[pend] pendBoot', e); }
  try { tombBoot(); } catch (e) { console.warn('[tomb] tombBoot', e); }
  /*  ⛔ בדיקת העידן — ⚠️ נקודת ההפעלה היחידה, פעם אחת לעלייה: ⭐ היא
   *  דוחפת תחילה, ⛔ ואינה זורקת דבר אם אחד משלושת התנאים אינו מתקיים. */
  try { eraKick(); } catch (e) { console.warn('[era] eraKick', e); }
  // גיבוי יומי ויומן פעולות — נקודת ההפעלה היחידה של המודול.
  // ⛔ אין להחזיר אותה ל-`syncPull` — שם היא רצה רק אחרי
  //    משיכה מלאה שהצליחה, כלומר תלויה בפעילות סנכרון. זו הצורה שהשביתה
  //    גיבוי ל-25 יום בלי שאיש ידע.
  try { bkBoot(); } catch (e) { console.warn('[bk] bkBoot', e); }
  // ניסיון חוזר בסנכרון — נקודת ההפעלה היחידה של המודול.
  try { rtyBoot(); } catch (e) { console.warn('[rty] rtyBoot', e); }
  // מנגנון המשיכה — נקודת ההפעלה היחידה של המודול.
  try { plBoot(); } catch (e) { console.warn('[pl] plBoot', e); }
  try { hwBoot(); } catch (e) { console.warn('[hw] hwBoot', e); }
  // נעילת חוסר-פעילות — נקודת ההפעלה היחידה של המודול.
  try { lkBoot(); } catch (e) { console.warn('[lk] lkBoot', e); }

  // ⛔ **אין כאן שחזור סשן** — כל עלייה מתחילה במסך הכניסה, גם
  //    כשהמשתמש נכנס לפני דקה. ⚠️ סשן שמשוחזר מ-localStorage **בלי
  //    תפוגה** משאיר מי שנכנס פעם אחת מחובר לנצח על אותו מכשיר.
  //    ⛔ אין להחזיר: על מכשיר משותף זו
  //    כניסה קבועה, והסשן הוריד לדיסק גם את **ההרשאה** (`role`).
  //    ⚠️ הכניסה האופליין לא נפגעה — היא מוכרעת ב-`gVerifyOffline` מול
  //    `pass_fp` שבמראה, ולא מול הסשן.
  // ⛔ `revalidateSession` ירדה איתו — היא רצה **רק** מכאן,
  //    ותפקידה היה לאמת סשן משוחזר. אין סשן משוחזר, אין מה לאמת:
  //    הכניסה עצמה כבר קוראת את השורה מהענן ומרעננת את המראה.
  renderLogin();
}

start();

})();
</script>
</body>
</html>
