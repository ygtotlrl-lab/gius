<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="ניהול תורמים, התחייבויות, תנועות ומשימות גיוס כספים.">
<title>גיוס</title>

<script>
// ⛔ חייב לרוץ לפני שכל כתובת יחסית מפוענחת (נרשם בסבב 67) —
// ה-service worker מגיש נתיבים עמוקים (/gius/anything/here) עם אותה קליפה,
// ובכתובת כזו כל href יחסי היה נפתר רמה או שתיים עמוק מדי: manifest.json,
// sw.js והאייקונים היו מחזירים 404, וה-worker היה נרשם ב-scope שגוי.
// לכן מקבעים <base> בשורש האפליקציה.
(function () {
  var p = location.pathname;
  var m = p.match(/^(.*?\/gius\/)/);
  var b = document.createElement('base');
  b.href = m ? m[1] : p.replace(/[^/]*$/, '');
  document.head.appendChild(b);
})();
</script>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="גיוס">

<style>
/* ========================================================= אסימוני העיצוב */
:root{
  /*  ⛔ מרחק הטוסט מתחתית המסך — ⚠️ הערך היחיד שנבדל בשכבת הטוסט:
   *  סרגל לשוניות תחתון, ⛔ ומעליו סרגל הפעולה. */
  --toast-bottom:150px;
  /*  ⛔ גוון האזהרה של אזור המצב — ⚠️ אסימון אחד בשם אחד בארבעתן,
   *  ⭐ והגוון בלבד נבדל: ⛔ כלל משותף אינו יכול לנקוב בשם פרטי. */
  /*  ⛔ צבע הזהות של האפליקציה — ⚠️ אסימון אחד בשם אחד בארבעתן,
   *  ⭐ והגוון בלבד נבדל: ⛔ רכיב שמייצג את האפליקציה נגזר ממנו
   *  ⛔ ולא מדיו הטקסט — ⚠️ ארבעה באנרים בארבעה גוונים נראו זהים.
   *  ⛔ **והדיו שעליו צמד הפוך** — ⚠️ ומתחלף איתו יחד. */
  --brand:var(--brand-fill); --on-brand:#ffffff;

  --bg:#f4f6f9; --card:#ffffff; --card-2:#fbfcfe;
  --text:#12202e; --text2:#3b4d61; --text3:#6b7c90;
  --border:#e3e8ef; --border-2:#eef2f7;
  --brand-ink:#0f766e; --brand-fill:#0f766e; --brand-soft:#e6f4f2;
  --ok:#15803d; --ok-soft:#e7f6ec;
  --warn:#b45309; --warn-soft:#fdf1e3;
  --bad:#b91c1c; --bad-soft:#fdeceb;
  --gold:#a16207; --gold-soft:#fdf5e0;
  --radius:var(--r-5); --radius-sm:var(--r-4);
  --shadow:0 1px 2px rgba(16,32,48,.05), 0 8px 24px rgba(16,32,48,.06);
  --shadow-lg:0 12px 40px rgba(16,32,48,.18);
  --tab-h:62px;
}
@media (prefers-color-scheme:dark){
  :root{
    --on-brand:#ffffff;

    --bg:#0d151d; --card:#131e29; --card-2:#18242f;
    --text:#e8eef5; --text2:#c2cfdc; --text3:#93a5b8;
    --border:#24333f; --border-2:#1d2a35;
    --brand-ink:#2dd4bf; --brand-fill:#0f766e; --brand-soft:#0f2c2a;
    --ok:#4ade80; --ok-soft:#122a1c;
    --warn:#fbbf24; --warn-soft:#2c2213;
    --bad:#f87171; --bad-soft:#2d1717;
    --gold:#fcd34d; --gold-soft:#2b2413;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
    --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  }
}

/* ==================================================================== בסיס */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Hebrew","Rubik",Arial,sans-serif;
  font-size:var(--fs-4); line-height:1.55; -webkit-text-size-adjust:100%;
  overflow-wrap:anywhere;
}
body.locked{overflow:hidden}
h1,h2,h3{margin:0; font-weight:700; line-height:1.3}
button{font:inherit; color:inherit}
input,select,textarea{font:inherit; color:inherit}
table{border-collapse:collapse; width:100%}
.hidden{display:none !important}
.spin{width:20px;height:20px;border:2.5px solid var(--border);border-top-color:var(--brand-ink);
  border-radius:var(--r-7);animation:sp .7s linear infinite;display:inline-block;vertical-align:-4px}
@keyframes sp{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:var(--r-3)}

/* =================================================================== כניסה */
.auth{min-height:100dvh;display:grid;place-items:center;padding:var(--sp-7)}
.auth-card{
  width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-6);padding:var(--sp-7) var(--sp-7);box-shadow:var(--shadow);text-align:center;
}
.auth-card .mark{width:66px;height:66px;margin:0 auto var(--sp-6);display:block}
.auth-card h1{font-size:var(--fs-6);letter-spacing:-.5px}
.auth-card .sub{color:var(--text3);font-size:var(--fs-3);margin:var(--sp-2) 0 var(--sp-7)}
.auth-card .fld{text-align:start;margin-bottom:var(--sp-5)}
.auth-err{
  display:none;margin-top:var(--sp-6);background:var(--bad-soft);color:var(--bad);
  border-radius:var(--radius-sm);padding:var(--sp-5) var(--sp-5);font-size:var(--fs-3);font-weight:600
}
.auth-err.show{display:block}

/* =================================================================== קליפה */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--card);
  border-bottom:1px solid var(--border);
  padding:var(--sp-5) var(--sp-6); padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:var(--sp-5);
}
.brand{display:flex;align-items:center;gap:var(--sp-4);font-weight:800;font-size:var(--fs-4);letter-spacing:-.3px}
.brand svg{width:26px;height:26px;flex:none}
.brand small{font-weight:500;color:var(--text3);font-size:var(--fs-2);display:none}
.who{margin-inline-start:auto;display:flex;align-items:center;gap:var(--sp-4);min-width:0}
.who .nm{font-size:var(--fs-3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.who .role{font-size:var(--fs-1);color:var(--text3);display:block;font-weight:500}

.tabbar{
  position:fixed;inset-inline:0;bottom:0;z-index:45;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--card);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  background:none;border:0;cursor:pointer;padding:var(--sp-4) var(--sp-1) var(--sp-4);
  display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);
  font-size:var(--fs-1);font-weight:600;color:var(--text3);
}
.tabbar button .ic{font-size:var(--fs-5);line-height:1}
.tabbar button.on{color:var(--brand-ink)}
.tabbar button.on .ic{transform:translateY(-1px)}

main{padding:var(--sp-6); padding-bottom:calc(var(--tab-h) + 84px + env(safe-area-inset-bottom));
  max-width:1180px;margin:0 auto}

@media (min-width:900px){
  .brand small{display:inline}
  .tabbar{
    position:static;display:flex;gap:var(--sp-2);border:0;background:none;padding:0;
    margin-inline-start:var(--sp-6);
  }
  .tabbar button{flex-direction:row;gap:var(--sp-3);font-size:var(--fs-3);padding:var(--sp-4) var(--sp-5);border-radius:var(--r-4)}
  .tabbar button .ic{font-size:var(--fs-4)}
  .tabbar button.on{background:var(--brand-soft)}
  main{padding:var(--sp-7);padding-bottom:var(--sp-7)}
}

/* ================================================================= כרטיסים */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:var(--sp-6);box-shadow:var(--shadow);margin-bottom:var(--sp-6)}
.card > h2{font-size:var(--fs-4);display:flex;align-items:center;gap:var(--sp-4);margin-bottom:var(--sp-5)}
.card > h2 .cnt{
  font-size:var(--fs-2);font-weight:700;background:var(--border-2);color:var(--text3);
  border-radius:var(--r-6);padding:var(--sp-1) var(--sp-4)}
.card > h2 .sp{margin-inline-start:auto;font-weight:500;font-size:var(--fs-3);color:var(--text3)}
.grid2{display:grid;gap:var(--sp-6)}
@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.empty{color:var(--text3);text-align:center;padding:var(--sp-7) var(--sp-5);font-size:var(--fs-3)}
.empty .big{font-size:var(--fs-6);display:block;margin-bottom:var(--sp-3);opacity:.65}

/* ============================================================= טבעת הבית */
/* זה לצד זה מנקודת השבירה שמתחת. מתחתיה הטבעת נערמת מעל המחוונים כדי
   שהאריחים יקבלו את הרוחב המלא — אחרת "100,000 ₪" נשבר בין שורות. */
.hero{display:flex;flex-direction:column;gap:var(--sp-6);align-items:center}
@media (min-width:640px){.hero{flex-direction:row;gap:var(--sp-6)}}
.ring{width:132px;height:132px;flex:none}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bg{stroke:var(--border)}
.ring .fg{stroke:var(--brand-ink);transform:rotate(-90deg);transform-origin:50% 50%;
  transition:stroke-dasharray .6s cubic-bezier(.4,0,.2,1)}
.ring-wrap{position:relative;flex:none}
.ring-val{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center
}
.ring-val b{font-size:var(--fs-6);letter-spacing:-1px;display:block;line-height:1.1}
.ring-val span{font-size:var(--fs-1);color:var(--text3);font-weight:600}
.hero-stats{flex:1;width:100%;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-5)}
@media (min-width:1200px){.hero-stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card-2);border:1px solid var(--border-2);border-radius:var(--radius-sm);padding:var(--sp-4) var(--sp-5)}
.stat span{display:block;font-size:var(--fs-2);color:var(--text3);font-weight:600;margin-bottom:var(--sp-1)}
.stat b{font-size:var(--fs-4);letter-spacing:-.4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)}
.momentum{
  margin-top:var(--sp-6);background:var(--brand-soft);color:var(--brand-ink);
  border-radius:var(--radius-sm);padding:var(--sp-5) var(--sp-6);font-weight:700;text-align:center;font-size:var(--fs-4)}
.monthnav{display:flex;align-items:center;gap:var(--sp-4);margin-bottom:var(--sp-6)}
.monthnav b{font-size:var(--fs-4);min-width:130px;text-align:center}
.monthnav .grow{margin-inline-start:auto}

/* ================================================================= טבלאות */
.tw{overflow-x:auto;margin:0 calc(-1 * var(--sp-6));padding:0 var(--sp-6)}
th,td{padding:var(--sp-4) var(--sp-5);text-align:start;font-size:var(--fs-3);border-bottom:1px solid var(--border-2);white-space:nowrap}
th{font-size:var(--fs-2);color:var(--text3);font-weight:700;letter-spacing:.2px;
  border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card)}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--card-2)}
tfoot td{font-weight:700;border-top:1px solid var(--border);border-bottom:0;background:var(--card-2)}
.bar{height:5px;border-radius:var(--r-6);background:var(--border);overflow:hidden;min-width:52px}
.bar i{display:block;height:100%;background:var(--brand-fill);border-radius:var(--r-6)}

/* ================================================================== רשימות */
.row{
  display:flex;align-items:center;gap:var(--sp-5);padding:var(--sp-5) var(--sp-2);
  border-bottom:1px solid var(--border-2);cursor:pointer
}
.row:last-child{border-bottom:0}
.row:hover{background:var(--card-2)}
.row .av{
  width:37px;height:37px;border-radius:var(--r-4);flex:none;display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand-ink);font-weight:800;font-size:var(--fs-3)}
.row .av.vip{background:var(--gold-soft);color:var(--gold)}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-size:var(--fs-4);font-weight:650;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main small{color:var(--text3);font-size:var(--fs-2)}
.row .end{text-align:end;flex:none;font-size:var(--fs-3);font-variant-numeric:tabular-nums}
.row .end small{display:block;color:var(--text3);font-size:var(--fs-2)}

/* ================================================================== תגיות */
.badge{
  display:inline-block;font-size:var(--fs-2);font-weight:700;border-radius:var(--r-6);
  padding:var(--sp-1) var(--sp-4);white-space:nowrap;background:var(--border-2);color:var(--text3)
}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.brand{background:var(--brand-soft);color:var(--brand-ink)}
.badge.gold{background:var(--gold-soft);color:var(--gold)}

/* ================================================================== פקדים */
.inp,select.inp,textarea.inp{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:var(--sp-5) var(--sp-5);font-size:var(--fs-4);outline:none;transition:border-color .15s,box-shadow .15s
}
.inp:focus{border-color:var(--brand-ink);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.inp{resize:vertical;min-height:78px;line-height:1.55}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),
  linear-gradient(135deg,var(--text3) 50%,transparent 50%);
  background-position:12px calc(50% - 2px),17px calc(50% - 2px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  /* החץ מצויר בקצה השמאלי, ולכן גם המקום הנוסף חייב להיות משמאל —
     padding-inline-start היה שם אותו מימין תחת RTL */
  padding-left:var(--sp-7)}
.fld{display:block;margin-bottom:var(--sp-5)}
.fld > span{display:block;font-size:var(--fs-2);font-weight:650;color:var(--text2);margin-bottom:var(--sp-3)}
.fld.chk{display:flex;align-items:center;gap:var(--sp-4);cursor:pointer}
.fld.chk input{width:19px;height:19px;accent-color:var(--brand-fill);flex:none;margin:0}
.fld.chk > span{margin:0;font-size:var(--fs-3)}
.f2{display:grid;gap:0 var(--sp-5)}
@media (min-width:640px){.f2{grid-template-columns:1fr 1fr}}

.btn{
  background:var(--brand-fill);color:#fff;border:1px solid transparent;
  border-radius:var(--radius-sm);padding:var(--sp-5) var(--sp-6);font-weight:700;font-size:var(--fs-4);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-3);
  white-space:nowrap
}
/* שדה וכפתור בשורה אחת; הכפתור שומר על רוחבו, והשדה מתכווץ */
.addrow{display:flex;gap:var(--sp-3);margin-top:var(--sp-5)}
.addrow .inp{min-width:0}
.addrow .btn{flex:none}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--text2);border-color:var(--border)}
.btn.ghost:hover{background:var(--card-2)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:var(--sp-3) var(--sp-5);font-size:var(--fs-3);border-radius:var(--r-3)}
.btn.xs{padding:var(--sp-2) var(--sp-4);font-size:var(--fs-2);border-radius:var(--r-3);font-weight:650}
.btn.block{width:100%}
.btn.icon{padding:var(--sp-4) var(--sp-5)}
.btnrow{display:flex;gap:var(--sp-4);flex-wrap:wrap}

/* ========================================================= כפתור ההוספה */
.fab{
  position:fixed;inset-inline-end:18px;
  bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom));
  z-index:44;width:60px;height:60px;border-radius:var(--r-7);border:0;cursor:pointer;
  background:var(--brand-fill);color:#fff;font-size:var(--fs-6);line-height:1;
  box-shadow:0 6px 22px rgba(15,118,110,.42);display:grid;place-items:center;
  transition:transform .18s
}
.fab:active{transform:scale(.93)}
@media (min-width:900px){.fab{bottom:26px}}

/* ================================================================= גיליונות */
.veil{
  position:fixed;inset:0;z-index:60;background:rgba(10,20,30,.5);
  display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(2px)
}
.veil.open{display:flex}
@media (min-width:640px){.veil{align-items:center}}
.sheet{
  width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--card);
  border-radius:var(--r-6) var(--r-6) 0 0;box-shadow:var(--shadow-lg);
  animation:up .22s cubic-bezier(.2,.8,.3,1);
  padding-bottom:env(safe-area-inset-bottom)
}
@media (min-width:640px){.sheet{border-radius:var(--r-6);animation:pop .18s ease-out}}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.sheet-hd{
  display:flex;align-items:center;gap:var(--sp-5);padding:var(--sp-6) var(--sp-6);
  border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:2;
  border-radius:var(--r-6) var(--r-6) 0 0}
.sheet-hd h3{font-size:var(--fs-4);flex:1}
.sheet-hd .x{background:none;border:0;font-size:var(--fs-5);line-height:1;color:var(--text3);
  cursor:pointer;padding:var(--sp-1) var(--sp-3);border-radius:var(--r-3)}
.sheet-hd .x:hover{background:var(--border-2)}
.sheet-bd{padding:var(--sp-6) var(--sp-6)}
/* ⛔ הצבע עבר מהמחרוזת ל-CSS — ⚠️ גוף `ask` הוא `textContent` בכל ארבעתן, ⭐ ועיצוב שנשען על `<p>` שנבנה בקוד היה שובר את הזהות בית-לבית */
#ask-body{color:var(--text2)}
.sheet-ft{padding:var(--sp-5) var(--sp-6) var(--sp-6);display:flex;gap:var(--sp-4)}
.sheet-ft:empty{display:none}
.sheet-ft .btn{flex:1}

.chooser{margin:calc(-1 * var(--sp-6)) calc(-1 * var(--sp-6));padding:var(--sp-6) var(--sp-6) var(--sp-7);display:grid;gap:var(--sp-5)} /* ⛔ השוליים השליליים מבטלים את `padding` של `.sheet-bd` — ⚠️ עד כאן הבורר איפס אותו בזמן ריצה, ⛔ ו-`openModal` היה חייב להחזירו: ⭐ שני מסלולים על אותה תכונה, ⛔ ומודאל שנפתח מתוך הבורר נשאר בלי `padding` */
.chooser button{
  display:flex;align-items:center;gap:var(--sp-5);text-align:start;width:100%;cursor:pointer;
  background:var(--card-2);border:1px solid var(--border);border-radius:var(--r-5);padding:var(--sp-6) var(--sp-6);
  font-size:var(--fs-4);font-weight:700
}
.chooser button:hover{border-color:var(--brand-ink);background:var(--brand-soft)}
.chooser button .ic{font-size:var(--fs-6)}
.chooser button small{display:block;font-weight:500;font-size:var(--fs-2);color:var(--text3)}

/* ============================================================ בורר התורם */
.picker{position:relative}
.dp-chosen{
  display:flex;align-items:center;gap:var(--sp-4);background:var(--brand-soft);color:var(--brand-ink);
  border-radius:var(--radius-sm);padding:var(--sp-4) var(--sp-5);font-weight:700;font-size:var(--fs-4)}
.dp-chosen button{margin-inline-start:auto;background:none;border:0;cursor:pointer;
  color:inherit;font-size:var(--fs-5);line-height:1;opacity:.7}
.dp-results{
  border:1px solid var(--border);border-radius:var(--radius-sm);margin-top:var(--sp-3);
  max-height:210px;overflow:auto;background:var(--card)
}
.dp-results button{
  display:block;width:100%;text-align:start;background:none;border:0;cursor:pointer;
  padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border-2);font-size:var(--fs-3)}
.dp-results button:last-child{border-bottom:0}
.dp-results button:hover{background:var(--card-2)}
.dp-results button small{color:var(--text3);font-size:var(--fs-2);margin-inline-start:var(--sp-3)}
.dp-results .mk{color:var(--brand-ink);font-weight:700}
.dp-new{border:1px dashed var(--border);border-radius:var(--radius-sm);padding:var(--sp-5);margin-top:var(--sp-4);
  background:var(--card-2)}

/* =================================================================== קנבן */
.kb{display:grid;gap:var(--sp-5)}
@media (min-width:900px){.kb{grid-template-columns:repeat(4,1fr);align-items:start}}
.kcol{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:var(--sp-5);min-height:110px;transition:border-color .15s,background .15s
}
.kcol.over{border-color:var(--brand-ink);background:var(--brand-soft)}
.kcol > h3{font-size:var(--fs-3);display:flex;align-items:center;gap:var(--sp-4);margin-bottom:var(--sp-5)}
.kcol > h3 .dot{width:8px;height:8px;border-radius:var(--r-7);flex:none}
.kcol > h3 .cnt{margin-inline-start:auto;font-size:var(--fs-2);color:var(--text3);
  background:var(--border-2);border-radius:var(--r-6);padding:var(--sp-1) var(--sp-4);font-weight:700}
.kcard{
  background:var(--card-2);border:1px solid var(--border);border-radius:var(--r-5);
  padding:var(--sp-5);margin-bottom:var(--sp-4);cursor:grab
}
.kcard.dragging{opacity:.4}
.kcard b{display:block;font-size:var(--fs-3);font-weight:650;margin-bottom:var(--sp-3)}
.kcard .meta{display:flex;flex-wrap:wrap;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.kcard .ft{display:flex;gap:var(--sp-3);align-items:center}
.kcard select{
  flex:1;font-size:var(--fs-2);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-3);border:1px solid var(--border);
  background:var(--card);min-width:0
}
.kcard .logdot{color:var(--brand-ink);font-size:var(--fs-2);font-weight:700}

/* ================================================================== מסננים */
.filters{display:grid;gap:var(--sp-4);grid-template-columns:1fr 1fr}
@media (min-width:900px){.filters{grid-template-columns:repeat(5,1fr)}}
/* פריטי grid מקבלים min-width:auto כברירת מחדל, והרוחב הפנימי של שדה
   תאריך רחב מהתא — בלי זה שורת המסננים גולשת ומאבדת יישור */
.filters > *{min-width:0}
.filters .fld{margin:0}
.filters .inp{width:100%;min-width:0}


/* ==================================================================== שונות */
.kv{display:flex;gap:var(--sp-5);padding:var(--sp-4) 0;border-bottom:1px solid var(--border-2);font-size:var(--fs-3)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--text3);min-width:82px;font-size:var(--fs-3)}
.kv b{font-weight:650}
.log{
  background:var(--card-2);border:1px solid var(--border-2);border-radius:var(--radius-sm);
  padding:var(--sp-5);font-size:var(--fs-3);white-space:pre-wrap;max-height:230px;overflow:auto;
  line-height:1.65;margin:0;font-family:inherit
}
.back{background:none;border:0;color:var(--brand-ink);font-weight:700;cursor:pointer;
  padding:var(--sp-2) 0;margin-bottom:var(--sp-4);font-size:var(--fs-3)}

/* ==================================================================== טוסט */

/* ================================================================= מעדכן */
#updater{
  position:fixed;inset-inline:0;z-index:70;
  bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));
  display:none;justify-content:center;padding:var(--sp-5) var(--sp-6)}
#updater.show{display:flex}
#updater .in{
  background:var(--brand);color:var(--on-brand);border-radius:var(--r-5);padding:var(--sp-5) var(--sp-5) var(--sp-5) var(--sp-6);
  display:flex;align-items:center;gap:var(--sp-5);box-shadow:var(--shadow-lg);
  font-size:var(--fs-3);font-weight:650;max-width:520px;width:100%
}
#updater button{
  margin-inline-start:auto;background:var(--on-brand);color:var(--brand);border:0;
  border-radius:var(--r-4);padding:var(--sp-4) var(--sp-6);font-weight:700;cursor:pointer;font-size:var(--fs-3);flex:none
}
#updater button.x{
  margin-inline-start:0;background:none;color:var(--on-brand);opacity:.7;padding:0 var(--sp-2);font-size:var(--fs-4)}
@media (min-width:900px){#updater{bottom:16px}}

/* =================================================================== עלייה */
#boot{min-height:100dvh;display:grid;place-items:center;gap:var(--sp-5);color:var(--text3)}
/* ═══ שכבת הטוסט — מודול משותף (סבב 87ב) ════════════════════════════════════
   זהה בית-לבית בארבע האפליקציות. ⛔ הכללים אינם נשענים על משתני-הצבע של
   אף אפליקציה — ⚠️ הם נבדלים ביניהן, ⭐ ולכן הצבעים כתובים במפורש.
   ⛔ מיכל אחד ובתוכו `div` לכל הודעה — ⚠️ הנימוק המדוד: בשלוש מהן היה
      אלמנט **קבוע** אחד, ⛔ והודעה שנייה דרסה את הראשונה: ⭐ «נשמר»
      ו«שגיאת רשת» ברצף השאירו על המסך אחת בלבד.
   ⛔ ו-`--toast-bottom` הוא הערך היחיד שנבדל — ⚠️ לשתיים מהן יש סרגל
      תחתון קבוע, ⭐ ולטוסט שיושב מתחתיו אין מי שיראה אותו. */
#toasts{position:fixed;inset-inline:0;bottom:calc(var(--toast-bottom) + env(safe-area-inset-bottom));z-index:999;display:grid;gap:var(--sp-4);justify-items:center;pointer-events:none;padding:0 var(--sp-6)}
.toast{background:#1a1a1a;color:#fff;border-radius:var(--r-6);padding:var(--sp-5) var(--sp-7);font-size:var(--fs-3);font-weight:600;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.22);max-width:92vw;text-align:center;animation:toastUp .2s ease-out}
.toast.bad{background:#b91c1c;color:#fff}
.toast.good{background:#15803d;color:#fff}
@keyframes toastUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ═══ סוף CSS שכבת הטוסט ════════════════════════════════════════════════ */
/* ═══ CSS גרף העמודות — מודול משותף (סבב 137) ═══════════════════════════════
   ⛔ הצגה חזותית של סדרה נבנית מרוחב יחסי ⛔ ולא מספריית גרפים — ⚠️ ספרייה
      כזו היא מאות קילובייטים בכל עלייה, ⭐ והנתון עצמו הוא שתי מנות לשורה.
   ⛔ הצבעים מהאסימונים ⛔ ואין כאן ליטרל — ⚠️ `--brand` למה שנגבה,
      ⭐ ו-`--card-2` למסלול שמאחוריו: ⛔ ליטרל מוטבע כאן היה נשאר בהיר
      במצב כהה, ⚠️ ומבטל את הזהות הפר-אפליקציה.
   ⛔ ופס היעד הוא **אותו** אסימון בשקיפות — ⚠️ אסימון שני היה תפקיד שני
      לצבע קיים, ⭐ והשורה על תפקיד אחד לאסימון אוסרת אותו. */
.bchart{display:grid;gap:var(--sp-4);padding:var(--sp-2) 0}
.brow{display:grid;grid-template-columns:4.6rem 1fr 4.4rem;align-items:center;gap:var(--sp-4);font-size:var(--fs-3)}
.blab{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bbars{display:grid;gap:var(--sp-2)}
.btrack{display:block;height:8px;border-radius:var(--r-6);background:var(--card-2);overflow:hidden}
.btrack i{display:block;height:100%;border-radius:var(--r-6);background:var(--brand)}
.btrack.tgt{height:4px}
.btrack.tgt i{opacity:.38}
.bval{color:var(--text2);text-align:end;white-space:nowrap}
/* ═══ סוף CSS גרף העמודות ════════════════════════════════════════════════ */
/* ═══ סולמות הגודל, הריווח והרדיוס — מודול משותף (סבב 138) ═══════════════
   ⛔ שלושה סולמות, ⛔ ואותן דרגות בארבע האפליקציות — ⚠️ כל ערך מספרי חזותי
      נגזר מהם ⛔ ואינו נבחר לכל אתר בנפרד: ⭐ ערך שנבחר באתר הוא סולם שלא
      הוגדר, ⛔ ושני אתרים שנבדלים בפיקסל אחד הם שני ערכים שאיש לא הכריע
      ביניהם.
   ⛔ **ומספר הדרגות נגזר מהערכים שהיו בפועל** ⛔ ואינו נבחר — ⚠️ אשכול
      משוקלל בסולם לוגריתמי על כל הערכים שבארבעת הריפו, ⭐ ותקרה של שבע.
   ⛔ **ודרגה שאין לה קורא באפליקציה אחת נשארת** — ⚠️ הסולם הוא תשתית,
      ⭐ ולא מפקד של מה שמשמש היום: ⛔ דרגה יורדת רק כשאין לה קורא בארבעתן.
   ⛔ **והמחלקות שכאן הן אלה שחיות בארבעתן** — ⚠️ מחלקה שחיה בחלקן יושבת
      בבלוק הפרטי שמתחת: ⭐ מחלקה בבלוק משותף שאין לה קורא באחת מהן היא
      סלקטור בלי קורא, ⛔ והשער מפיל עליה.
   ⛔ **ואין כאן `!important`** — ⚠️ `display` ו-`color` נכתבים מ-JS בזמן
      ריצה, ⭐ וסגנון מוטבע שנכתב אחר כך חייב לגבור עליהן: ⛔ הקדימות באה
      מהמיקום — ⚠️ הבלוק יושב בסוף הגיליון, אחרי כל כלל אחר.
   ⛔ שינוי כאן — ארבע האפליקציות **וארבעת עותקי השער**, באותו סבב.
   ═══════════════════════════════════════════════════════════════════════ */

--fs-1:.65rem;--fs-2:.75rem;--fs-3:.85rem;--fs-4:.95rem;--fs-5:1.2rem;--fs-6:1.7rem;--fs-7:2.8rem;

}

.u-m-0-0-5{margin:0 0 var(--sp-5)}

.u-m-5-0-2{margin:var(--sp-5) 0 var(--sp-2)}
.u-mb-4{margin-bottom:var(--sp-4)}
.u-mb-5{margin-bottom:var(--sp-5)}

<body>

<div id="app">
  <div id="boot"><span class="spin"></span></div>
</div>

<!-- generic sheet / modal -->
<div class="veil" id="modal">
  <div class="sheet ksave" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="sheet-hd">
      <h3 id="modal-title"></h3>
      <button class="x" data-act="modal-close" aria-label="סגירה">✕</button>
    </div>
    <div class="sheet-bd" id="modal-body"></div>
    <div class="sheet-ft" id="modal-foot"></div>
  </div>
</div>

<!-- confirm -->
<div class="veil" id="ask">
  <div class="sheet" role="alertdialog" aria-modal="true">
    <div class="sheet-hd"><h3 id="ask-title"></h3></div>

    </div>
  </div>
</div>

<div id="toasts"></div>

</div>

/* ── פינוי יזום ─────────────────────────────────────────────────────────

  return { diff: true, prefix: BK_DIFF_PREFIX, key: bkey,

}
/*  ⛔⛔ הקריאה בעימוד, ⛔ ואימות מול מונה השרת — ⚠️ תשובה שנחתכה נראית
 *  בדיוק כמו תשובה שלמה, ⭐ והדרך היחידה לדעת היא לשאול את השרת כמה שורות
 *  יש: ⛔ אי-התאמה מחזירה `null` ⛔ ונכשלת בקול, ⚠️ ואינה שומרת חצי גיבוי. */
async function _bkReadRows(c, s, win) {
  var sel = s.cols || '*';
  var rows = await _ysRowsPaged(function () {
    var q = c.from(s.name).select(sel);
    if (s.eq) q = q.eq(s.eq[0], s.eq[1]);
    return q;
  }, s.order || null, win);
  if (!rows) return null;
  try {
    var cq = c.from(s.name).select(sel, { count: 'exact', head: true });
    if (s.eq) cq = cq.eq(s.eq[0], s.eq[1]);
    if (win && win.col) {
      if (win.from) cq = cq.gte(win.col, win.from);
      if (win.to) cq = cq.lte(win.col, win.to);
    }
    var cr = await withTimeout(cq);
    if (!cr || cr.error || typeof cr.count !== 'number') return null;
    if (cr.count !== rows.length) {
      console.error('[bk] הגיבוי נחתך — ' + s.name + ': נמדדו ' + rows.length +
                    ' שורות והשרת מדווח ' + cr.count);
      return null;
    }
  } catch (e) { return null; }
  return rows;
}
/* ── הגיבוי היומי ──────────────────────────────────────────────────────── */
// מחזירה true רק כשכל המקורות גובו (או דולגו כבלתי-משתנים) בהצלחה.
async function bkMaybeDaily() {
  if (_bkRunning) return false;
  var c = _bkClient();
  if (!c) return false;
  var flag = _bkCfg('flagKey', null);
  if (!flag) return false;
  var today = bkToday();
  if (lsGet(flag, '') === today) return false;
  var src = _bkCfg('sources', []) || [];
  if (!src.length) return false;
  _bkRunning = true;
  var ok = true, wrote = 0, same = 0, failed = [];
  try {
    var pre = _bkCfg('prefix', '') || '';
    var secrets = _bkSecrets(), dailyKeys = [];
    for (var i = 0; i < src.length; i++) {
      var s = src[i], val = null;
      // ⛔ מפתח שברשימת הסודות אינו נכתב לגיבוי לעולם (השלמת סבב 35) —
      //    admin_pass שרד בגיבויים אחרי שנמחק מהמקור, ונוקה ידנית.
      if (s.kind === 'kv' && secrets.indexOf(s.name) !== -1) continue;
      // ⭐ `key` פר-מקור (סבב 35) — מקור-טבלה שמפתחו היה מתנגש במקור
      //    ה-kv ההיסטורי באותו שם מקבל מפתח גיבוי משלו. הרשימה שנצברת
      //    כאן היא רשימת-ההיתר של הגריעה — בלי תלות בהצלחת המקור.
      var bkey = pre + (s.key || s.name);
      dailyKeys.push(bkey);
      /*  ⛔ שתי השכבות נכנסות לרשימת-ההיתר של הגריעה (סבב 87ג) — ⚠️ מפתח
       *  שאינו שם אינו מתפנה לעולם, ⭐ ו-`ANCHOR:`/`DIFF:` הם מפתחות
       *  חדשים: ⛔ בלעדיהם הם היו נצברים בלי גבול. */
      if (s.kind !== 'kv') {
        dailyKeys.push(BK_ANCHOR_PREFIX + bkey);
        dailyKeys.push(BK_DIFF_PREFIX + bkey);
      }
      /* ⭐ דגל-יום פר-מקור (סבב 62) — מקור שכבר גובה היום מדולג, גם
         כשהדגל הגלובלי לא נכתב. ⛔ בלעדיו מקור אחד שנכשל החזיק את כל
         השאר בלולאה: הדגל הגלובלי נכתב רק כשכולם הצליחו, ולכן כל עלייה
         גיבתה מחדש את מה שכבר גובה, שוב ושוב באותו יום.
         ⚠️ הדחיפה ל-`dailyKeys` קודמת לדילוג בכוונה: הרשימה היא
         רשימת-ההיתר של הגריעה, ומפתח שנופל ממנה אינו מתפנה לעולם. */
      var dayKey = 'bk_day_' + bkey;
      if (lsGet(dayKey, '') === today) { same++; continue; }
      if (s.kind === 'kv') {
        var res = await c.from(s.table).select('value').eq('key', s.name).maybeSingle();
        if (!res || res.error) { ok = false; failed.push(bkey); continue; }
        val = (res.data && res.data.value != null) ? String(res.data.value) : null;
      } else {
        /*  ⛔⛔ שכבת הגיבוי — עוגן שבועי מלא, ודיפרנציאלי בכל שאר הימים
         *  (סבב 87ג): ⚠️ הנימוק המדוד — הקריאה הייתה בקשה **אחת** בלי
         *  עימוד, ⛔ ו-Supabase מחזיר 1,000 שורות כברירת מחדל **בלי
         *  שגיאה**: ⭐ טבלה גדולה מהתקרה גובתה עד התקרה, ⛔ וכל השאר
         *  מעולם לא גובה — ⚠️ והכשל היה שקט לחלוטין. */
        var layer = _bkLayer(bkey, s);
        var rows = await _bkReadRows(c, s, layer.win);
        if (rows === null) { ok = false; failed.push(bkey); continue; }
        bkey = layer.prefix + bkey;
        // ⛔ שדה-סוד בשורות טבלה מסונן לפני הסריאליזציה (השלמת סבב 35) —
        //    שורה שמפתחה (`secretField`, ברירת מחדל `key`) ברשימת הסודות
        //    אינה מגיעה לגיבוי, גם כשהיא עדיין קיימת במקור.
        if (secrets.length) rows = rows.filter(function (r) {
          return secrets.indexOf(r && r[s.secretField || 'key']) === -1;
        });
        /*  ⛔ דיפרנציאלי ריק אינו נכתב ⛔ ואינו כישלון — ⚠️ יום שלא השתנה
         *  בו דבר הוא המצב הרגיל, ⭐ ועותק ריק בכל לילה מציף את הפינוי. */
        if (layer.diff && !rows.length) { same++; continue; }
        val = JSON.stringify(rows);
        if (!layer.diff && s.ts) _bkSetMark(layer.key, _bkMaxTs(rows, s.ts));
      }
      // מקור שאין לו ערך בענן — אין מה לגבות, וזה אינו כישלון.
      if (val == null) continue;
      var sig = bkSig(val), sigKey = 'bk_sig_' + bkey;
      if (lsGet(sigKey, '') === sig) { same++; continue; }
      var ins = await c.from(BK_TABLE).insert({ key: bkey, value: val });
      if (!ins || ins.error) { ok = false; failed.push(bkey); continue; }
      lsSet(sigKey, sig);
      lsSet(dayKey, today);
      wrote++;
    }
    /* ⭐ הגריעה אינה מותנית עוד בהצלחת **כל** המקורות (סבב 62) — היא רצה
       על רשימת-ההיתר המלאה בכל פעם שנכתב עותק חדש. ⛔ הכריכה הישנה היא
       ששיתקה אותה: מקור אחד שנכשל מנע גריעה של כל השאר, וזה שורש מצבור
       ה-503 השורות שנוקה ב-26.8. ⚠️ והיא עדיין רצה **אחרי** הכתיבה, כדי
       שלא ייגרע עותק ישן לפני שהחדש נכתב (השלמת סבב 35). */
    if (wrote) { try { await _bkRetention(c, dailyKeys); } catch (e2) { } }
    if (ok) {
      lsSet(flag, today);
      logAction('backup', null, wrote, { date: today, scope: pre || null, wrote: wrote, unchanged: same });
    } else {
      /* ⛔ בלי כתיבת הדגל הגלובלי — ההזדמנות הבאה באותו יום תנסה שוב
         (נרשם בסבב 6 בהנהלה): גיבוי שנכשל ודילג על יממה שלמה הוא בדיוק
         מה שהדגל שנכתב-מראש גרם. ⚠️ ומה שכן השתנה (סבב 62): המקורות
         שהצליחו נושאים דגל-יום משלהם ואינם נגבים שוב, ולכן הניסיון החוזר
         מכוון למי שנכשל בלבד. ⛔ וכשל חלקי מדווח ואינו נבלע — `failed`
         נושא את שמות המקורות, אחרת «נכשל» היה מספר בלי מען. */
      logAction('backup_fail', null, wrote, { date: today, scope: pre || null, wrote: wrote, unchanged: same, failed: failed });
      console.warn('[backup] מקורות שנכשלו: ' + (failed.join(', ') || '?') + ' — ייבחנו שוב בהזדמנות הבאה');
    }
  } catch (e) { ok = false; }
  _bkRunning = false;
  return ok;
}

/* ── מדיניות השמירה — גריעת עותקים יומיים ישנים מ-30 יום ──────────────── */
// ⛔ הגריעה מוגבלת ב-`in('key', keys)` לרשימת המפתחות היומיים של
//    האפליקציה הנוכחית בלבד (השלמת סבב 35) — רשימת-היתר, לא קידומת:
//    גיבויי `PRE_*` וגיבויים של אפליקציה אחרת אינם מועמדים כלל.
// ⚠️ נכשלת סגור: `error` (כולל היעדר הרשאת DELETE — סבב 29) מוחזר כאפס
//    בשקט, בלי להפיל את הגיבוי ובלי רישום-סרק יומי ליומן הראיות.
async function _bkRetention(c, keys) {
  if (!c || !Array.isArray(keys) || !keys.length) return 0;
  var cutoff = new Date(Date.now() - BK_RETENTION_DAYS * 86400000).toISOString();
  var del = await c.from(BK_TABLE)['delete']().in('key', keys).lt('created_at', cutoff).select('id');
  if (!del || del.error || !Array.isArray(del.data)) return 0;
  var n = del.data.length;
  if (n > 0) logAction('retention', null, n, { days: BK_RETENTION_DAYS, keys: keys.length });
  return n;
}


/* ── נקודת ההפעלה היחידה ─────────────────────────────────────────────── */
// ⛔ זו הקריאה היחידה שקוד האפליקציה עושה למודול (סבב 30, השלמה) — היא
//    יושבת בפונקציית העלייה, לצד `lsBoot()` ו-`pendBoot()`, ולעולם לא
//    במסלול דחיפה/סנכרון. ר' הנימוק המלא בכותרת הבלוק.
// ⚠️ שתי הקריאות אינן ב-`await` ואינן חוסמות: העלייה אינה ממתינה לרשת,
//    וכל כשל נבלע בשקט בתוך המודול.
function bkBoot() {
  try { bkMaybeDaily(); } catch (e) { }
  try { logFlush(); } catch (e) { }
}
window.bkBoot = bkBoot;
/* ═══════════════ סוף מודול הגיבוי היומי ═══════════════════════════════ */

/* ── PEND_CFG — הדבר היחיד שנבדל בין האפליקציות ─────────────────────────── */
// מאז שלב 3 אין כאן תור, ולכן אין `extra` — הסימונים הם מקור האמת היחיד,
// בדיוק כמו ב-schar-limud.
var PEND_CFG = {
  app: 'gius', key: 'g_pending',
  // השהיית ציור (סבב 16): בתום ההחזקה, תגית ⏳ שנותרה צריכה להיכנס לשורות
  // שכבר רונדרו בלעדיה. render() מצייר מחדש את המסך הנוכחי בלבד ושומר על
  // מיקום הגלילה ברינדור-במקום — בדיוק כמו אחרי כל שמירה.
  redraw: function () { try { render(); } catch (e) { } }
};

/* ═══ ממתין לסנכרון — מודול משותף (סבב 12) ═══════════════════════════════
   ⛔ שינוי כאן (סבב 65) — ארבע האפליקציות **וארבעת עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ═══════════════════════════════════════════════════════════════════════ */
var PEND_LATE_MS = 24 * 60 * 60 * 1000;   // סף ההתרעה
var PEND_MAX = 800;                       // תקרת המפה — הגנה מפני צמיחה בלי גבול
var _pendMap = null;
var _pendAlertDismissed = 0;

/* ---------------------------------------------- השהיית ציור (סבב 16) ----
   באונליין תקין האישור מגיע תוך פחות משתי שניות מהסימון, והתגית והסרגל היו
   מהבהבים לשבריר שנייה על כל שמירה. לכן סימון שנוצר **הרגע** בכתיבה חדשה
   מקבל "החזקת ציור" בזיכרון: אם האישור הגיע בתוך PEND_DRAW_DELAY_MS —
   ה-⏳ לא מופיע כלל; אם לא — הוא מופיע וממשיך להתנהג בדיוק כמו היום.
   ⚠️ ההשהיה היא על ה**ציור בלבד**: הסימון הלוגי נכתב ל-localStorage מיידית
   (מנגנוני הבטיחות — פינוי, דחיפה, מיגרציות — נשענים עליו), מסך ההגדרות
   (pendStatusHTML) והמונים הלוגיים (pendCount/pendHas/pendSince) אינם
   מושהים לעולם, וההחזקה חיה **בזיכרון בלבד** — סימון שנטען מהדיסק בעליית
   האפליקציה (המכשיר נסגר בתוך שתי השניות) מצויר מיד. */
var PEND_DRAW_DELAY_MS = 2000;
var _pendDrawHold = {};     // key -> הרגע שממנו מותר לצייר (זיכרון בלבד, לא נשמר)

function pendHoldDraw(key, now) {
  _pendDrawHold[key] = (now || Date.now()) + PEND_DRAW_DELAY_MS;
}
// חותמת לציור: 0 כל עוד הסימון מוחזק. סימון בלי החזקה (נטען מהדיסק) — מיידי.
function pendDrawSince(key) {
  var t = pendSince(key);
  if (!t) return 0;
  var h = _pendDrawHold[key];
  if (h && Date.now() < h) return 0;
  if (h) delete _pendDrawHold[key];
  return t;
}
// כמה סימונים מותר לצייר עכשיו. משמש רק להחלטת "האם להציג את הסרגל" —
// המספר המוצג עצמו הוא תמיד pendCount() המלא.
function pendDrawCount() {
  var m = pendAll(), keys = Object.keys(m), n = 0, now = Date.now();
  for (var i = 0; i < keys.length; i++) {
    var h = _pendDrawHold[keys[i]];
    if (!h || now >= h) n++;
  }
  return n;
}
// בתום ההחזקה: הסימון עדיין קיים (לא אושר — אופליין/רשת איטית) ⇒ מציירים
// אותו עכשיו, כולל רינדור הרשימות דרך PEND_CFG.redraw (פר-אפליקציה).
// אושר בינתיים (המסלול המהיר הרגיל) ⇒ אין מה לצייר ואין רינדור מיותר.
function pendDrawFlush() {
  var m = pendAll(), now = Date.now(), revealed = false;
  Object.keys(_pendDrawHold).forEach(function (k) {
    if (now >= _pendDrawHold[k]) {
      delete _pendDrawHold[k];
      if (m[k]) revealed = true;
    }
  });
  if (!revealed) return;
  pendRender();
  try { if (typeof PEND_CFG === 'object' && PEND_CFG.redraw) PEND_CFG.redraw(); } catch (e) { }
}
function pendScheduleFlush() {
  try { setTimeout(pendDrawFlush, PEND_DRAW_DELAY_MS + 50); } catch (e) { }
}

// `PEND_CFG.key` יכולה להיות מחרוזת או פונקציה. yoman-avoda מחזיקה שני
// מוסדות באותו דומיין, וסימוני האחד אינם תקפים לשני — שם היא פונקציה.
function pendKeyName() {
  var k = (typeof PEND_CFG === 'object') ? PEND_CFG.key : null;
  if (typeof k === 'function') { try { k = k(); } catch (e) { k = null; } }
  return k || 'pending_sync';
}
// החלפת הקשר (מוסד/משתמש) — המפה נטענת מחדש מהמפתח החדש.
function pendReload() { _pendMap = null; _pendDrawHold = {}; pendAll(); pendRender(); }

function pendAll() {
  if (_pendMap) return _pendMap;
  var v = null;
  try { var raw = lsGet(pendKeyName(), null); v = raw == null ? null : JSON.parse(raw); }
  catch (e) { v = null; }
  _pendMap = (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
  // ניקוי ערכים פגומים — חותמת שאינה מספר חיובי אינה ראיה לכלום
  Object.keys(_pendMap).forEach(function (k) {
    var t = Number(_pendMap[k]);
    if (!isFinite(t) || t <= 0) delete _pendMap[k];
  });
  return _pendMap;
}

// הכתיבה עוברת דרך lsSet. כישלון כאן אינו שקט: lsSet מרימה
// באנר ורושמת ליומן, ו-lsGuardToast יבלע כל "✅" בשתי השניות הבאות.
function pendSave() {
  var m = pendAll();
  var keys = Object.keys(m);
  if (keys.length > PEND_MAX) {
    // גריעה של הישנים ביותר. זו לא "מחיקת נתון שטרם הסתנכרן" — הרשומה עצמה
    // נשארת במקומה; רק הסימון שלה יורד. עדיין נרשם ליומן, כי סימון שנעלם
    // בלי אישור הוא בדיוק מה שהמודול בא למנוע.
    keys.sort(function (a, b) { return m[a] - m[b]; });
    var drop = keys.slice(0, keys.length - PEND_MAX);
    drop.forEach(function (k) { delete m[k]; });
    try { lsLog('pend-overflow', drop.length + ' סימונים נגרעו (תקרה ' + PEND_MAX + ')', 0); } catch (e) { }
  }
  return lsSet(pendKeyName(), JSON.stringify(m));
}

// סימון. חותמת קיימת **אינה נדרסת** — הגיל נמדד מהכתיבה הראשונה שלא אושרה,
// אחרת עריכה חוזרת של אותה רשומה הייתה מאפסת את שעון ההתרעה לנצח.
function pendMark(key) {
  if (!key) return 0;
  var m = pendAll();
  if (!m[key]) {
    // הסימון הלוגי נכתב מיידית (pendSave); רק הציור מוחזק (סבב 16).
    m[key] = Date.now();
    pendHoldDraw(key, m[key]); pendScheduleFlush();
    pendSave(); pendRender();
  }
  return m[key];
}
function pendMarkMany(keys) {
  if (!keys || !keys.length) return;
  var m = pendAll(), now = Date.now(), ch = false;
  for (var i = 0; i < keys.length; i++) {
    if (keys[i] && !m[keys[i]]) { m[keys[i]] = now; pendHoldDraw(keys[i], now); ch = true; }
  }
  if (ch) { pendScheduleFlush(); pendSave(); pendRender(); }
}

// אישור — יש ראיה שהענן קיבל.
function pendClear(key) {
  if (!key) return;
  var m = pendAll();
  if (m[key]) { delete m[key]; delete _pendDrawHold[key]; pendSave(); pendRender(); }
}
function pendClearMany(keys) {
  if (!keys || !keys.length) return;

/* ── SESS_CFG — הדבר היחיד שנבדל בין האפליקציות ─────────────────────────── */

/* ═══ מודל הסשן — מודול משותף (סבב 53) ════════════════════════════════════
   ⛔ שינוי כאן (סבב 65) — ארבע האפליקציות **וארבעת עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.

function _sessLegacy() {
  try {
    var k = (typeof SESS_CFG === 'object' && SESS_CFG && SESS_CFG.legacy) || [];
    return Object.prototype.toString.call(k) === '[object Array]' ? k : [];
  } catch (e) { return []; }

/*  ניקוי שרידי הסשן; מחזירה את מספר המפתחות שנמחקו בפועל.
    ⚠️ הקריאה קודמת למחיקה בכוונה — כדי שהיומן יירשם רק כשבאמת היה שם
    משהו, ולא בכל עלייה של כל מכשיר. */
function _sessPurge() {
  var keys = _sessLegacy(), gone = [];
  for (var i = 0; i < keys.length; i++) {
    try {
      if (lsGet(keys[i], null) === null) continue;
      lsRemove(keys[i]);
      gone.push(keys[i]);
    } catch (e) { /* אחסון חסום — לא נוגעים, וננסה שוב בעלייה הבאה */ }
  }
  if (gone.length) { try { lsLog('sess-purge', gone.join(',')); } catch (e) { } }
  return gone.length;
}

/*  מצב המודול — לבדיקות ולאבחון. ⛔ אינו מחזיר את אובייקט המשתמש עצמו
    (סבב 53) — צרכן שהיה מקבל אותו יכול היה לכתוב אותו לדיסק, וזה בדיוק
    מה שהמודול בא למנוע. */
function sessState() {
  return { active: !!_sessUser, booted: _sessBooted, legacy: _sessLegacy().slice() };
}

/*  ⛔ נקודת ההפעלה היחידה — פונקציית העלייה של האפליקציה,
    זו שקוראת גם ל-`lsBoot()` ול-`pendBoot()`. */
function sessBoot() {
  if (_sessBooted) return 0;

/* ═══ מודל ההרשאות — מודול משותף (סבב 113) ════════════════════════════════
   ⛔ ההרשאה נגזרת מ-`role` שבטבלת המשתמשים ⛔ ולא מסיסמת שער — ⚠️ ואוצר
      המילים אחד בשלוש האפליקציות: `admin` הוא המורשה, `manager` מי שאינו.
      ⭐ אפליקציה שיש בה מטריצת הרשאות נושאת דרגת ביניים נוספת, ⛔ והיא

      הוא נלקח כאן מ-`sessGet()`, ⭐ שהוא נקודת המעבר האחת של הסשן
      בשלושתן; ⛔ והביטוי הפרטי מוצהר בשער.
   ⛔ שינוי כאן — שלוש האפליקציות **ושלושת עותקי השער**, באותו סבב.

function isAdminOf(u) { return !!u && String(u.role) === ROLE_ADMIN; }

/* ═══════════════ סוף מודול מודל ההרשאות ═════════════════════════════════ */



/* ── PL_CFG — הדבר היחיד שנבדל בין האפליקציות ──────────────────────────── */
/* ⚠️ בגיוס החותמת היא שורת `g_config` שמפתחה `G_STAMP_KEY`. היא **מוחרגת

   (סבב 51) הייתה מחזירה לענן חותמת ישנה שיושבת במכשיר הזה.
   ⛔ **ו-`active()` אינו בודק את הלקוח** — ⚠️ המשיכה בודקת אותו ממילא,
   ⭐ ובדיקה כפולה היא מקור אמת שני שנסחף מהצד שנערך אחרון.
   ⚠️ `ok()` **אינו** נוגע ב-`_lastPullOk`: הוא עֵד המשיכה המלאה, והוא מה
   שמזין את חיווי «סונכרן לאחרונה». ⛔ הזנתו משיחה מוצלחת שאינה משיכה

var PL_CFG = {

  active: function () { return sessActive(); },
  seen:   function () { return _gSeenTs; },
  note:   function (ts) { _gSeenTs = ts; },
  ok:     function () { _lastSeenOk = Date.now(); },
  stamp:  function (ts) {

  pull:   function () { return syncNow(); },
  remote: function () {

      .then(function (r) {
        if (!r || r.error) return { ok: false, ts: null };
        return { ok: true, ts: r.data ? plNum(kvParse(G_STAMP_KEY, r.data.value).value) : null };
      }, function () { return { ok: false, ts: null }; });
  },
};
/* ═══ שומר ההקשר — מודול משותף (סבב 109) ══════════════════════════════════
   ⛔ שינוי כאן — ארבע האפליקציות **וארבעת עותקי השער**, באותו סבב: ⚠️ אחרת
      החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ⛔ מחזור «קרא ← מזג ← דחוף» נפתח בהקשר אחד ⛔ ואינו רשאי לכתוב באחר —
      ⚠️ בין ה-`await` הראשון לאחרון ההקשר יכול להתחלף, ⭐ ומאותו רגע
      הגלובלים מצביעים על החדש והזיכרון עדיין מחזיק את הישן: ⛔ כל כתיבה
      שאחריו כותבת את נתוני ההקשר הקודם תחת החדש, ⚠️ וכל רישום הצלחה נזקף
      לחשבון הלא נכון — ⭐ ועֵד פינוי כזה מתיר למחוק מהדיסק רשומה שמעולם
      לא עלתה.
   ⛔ **המונה ⛔ ולא שם ההקשר** — ⚠️ החלפה הלוך-ושוב מחזירה את אותו שם,
      ⭐ והזיכרון בינתיים כבר הוחלף: ⛔ שוויון שמות אינו שוויון הקשר.
   ⛔ **ומה נלכד מוצהר פר-אפליקציה** ⛔ ואינו כאן — ⚠️ באפליקציה רב-מוסדית
      זה המוסד, ⭐ ובשאר המשתמש המחובר: ⛔ המנגנון אחד ⚠️ והנלכד נבדל.
   ═══════════════════════════════════════════════════════════════════════ */
var _ctxEpoch = 0;
function ctxEpoch() { return _ctxEpoch; }
/*  ⛔ נקודת הקידום היחידה — ⚠️ כל מסלול שמחליף הקשר קורא לה **לפני**
 *  הטעינה החדשה: ⭐ קידום שאחרי הטעינה משאיר את המחזור שרץ עכשיו סבור
 *  שהוא עדיין בהקשר שלו, ⛔ והכתיבה שלו נזקפת לחשבון החדש. */
function ctxSwitch() { _ctxEpoch++; return _ctxEpoch; }
/*  ⛔ «האם ההקשר התחלף מאז שהתחלתי» — ⚠️ הקורא לוכד את הערך בכניסה
 *  ⛔ ומוסר אותו כאן, ⭐ ואינו קורא את הגלובלי פעמיים. */
function ctxStale(ep) { return ep !== _ctxEpoch; }
/* ═══════════════ סוף שומר ההקשר ═════════════════════════════════════════ */
/* ═══ מנגנון המשיכה — מודול משותף (סבב 51) ════════════════════════════════
   ⛔ שינוי כאן (סבב 65) — ארבע האפליקציות **וארבעת עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ═══════════════════════════════════════════════════════════════════════ */
var PL_FALLBACK_MS = 60000;   // אין שורת חותמת בענן ⇒ משיכה מלאה אחת לדקה
var _plTimer = null, _plBusy = false, _plFullAt = 0, _plWired = false;

/* חותמת מהענן: מספר, מחרוזת JSON של מספר, או כל דבר אחר ⇒ 0. */
function plNum(v) {
  if (v === null || v === undefined) return 0;
  if (typeof v === 'number') return Math.floor(v) || 0;
  try { var p = JSON.parse(v); if (typeof p === 'number') return Math.floor(p) || 0; } catch (e) { }
  return parseInt(v, 10) || 0;
}

function plBusy() { return _plBusy; }
function _plSeen() { try { return plNum(PL_CFG.seen()); } catch (e) { return 0; } }
function plState() { return { busy: _plBusy, armed: !!_plTimer, fullAt: _plFullAt, seen: _plSeen() }; }

/* ⭐ נקראת אחרי כל כתיבה מוצלחת לענן. היא מקדמת קודם את «מה שכבר נראה»
   מקומית — כדי שהתקתוק הבא לא ימשוך מלא בגלל השינוי של המכשיר הזה
   עצמו — ורק אז כותבת את החותמת לענן. ⛔ כשל בכתיבת החותמת אינו מפיל
   את הכתיבה שקדמה לה (סבב 51) — הנתון כבר בענן, והמכשירים האחרים
   יראו אותו בשינוי הבא או בנפילה-חזרה. */
function plTouch(ts) {
  var t = plNum(ts) || Date.now();
  try { PL_CFG.note(t); } catch (e) { }
  try {
    return Promise.resolve(PL_CFG.stamp(t)).then(function () { return t; }, function () { return t; });
  } catch (e) { return Promise.resolve(t); }
}

function _plFull() {
  var done = function (v) { _plBusy = false; return v; };
  /*  ⛔ שחרור האופק **לפני** המשיכה ⛔ ולא אחריה — ⚠️ הניקוי הוא שמתיר
   *  לכתיבה שבסופה להחזיר את הישן, ⭐ וניקוי שאחריה ממתין למשיכה הבאה. */
  try { lsHorizonRelease(); } catch (e0) { }
  try {
    return Promise.resolve(PL_CFG.pull()).then(
      function () { _plFullAt = Date.now(); return done(true); },
      function () { return done(false); });
  } catch (e) { return Promise.resolve(done(false)); }
}

function plTick() {
  if (_plBusy) return Promise.resolve(false);
  var live; try { live = !!PL_CFG.active(); } catch (e) { live = false; }
  if (!live) return Promise.resolve(false);
  _plBusy = true;
  var done = function (v) { _plBusy = false; return v; };
  var p;
  try { p = Promise.resolve(PL_CFG.remote()); } catch (e) { p = Promise.reject(e); }
  return p.then(function (r) {
    if (!r || !r.ok) return done(false);
    try { PL_CFG.ok(); } catch (e) { }
    if (r.ts === null || r.ts === undefined) {
      if (Date.now() - _plFullAt >= PL_FALLBACK_MS) return _plFull();
      return done(false);
    }
    var ts = plNum(r.ts);
    if (ts > _plSeen()) { try { PL_CFG.note(ts); } catch (e) { } return _plFull(); }
    return done(false);
  }, function () { return done(false); });

function plStop() { if (_plTimer) { clearInterval(_plTimer); _plTimer = null; } }

function plBoot() {
  if (!_plWired) {
    _plWired = true;
    try { window.addEventListener('online', function () { plTick(); }); }
    catch (e) { console.warn('[pl] wiring', e); }
  }
  if (_plTimer) return false;
  var ms = 0;
  try { ms = parseInt(PL_CFG.every, 10) || 0; } catch (e) { ms = 0; }

}

/* ── PUSH_CFG — הדבר היחיד שנבדל בין האפליקציות ────────────────────────── */
/* ⛔ `g_users` **אינה כאן ואינה נדחפת לעולם** (סבב 12 שלב 3) — ⚠️ המראה

   ⚠️ סדר הטבלאות הוא מה ששומר על המפתח הזר — ⭐ תורמים לפני התחייבויות
   ותנועות. */
var PUSH_TABLES = ['g_donors', 'g_pledges', 'g_txns', 'g_tasks', 'g_targets', 'g_config'];
/*  ⛔ ההקשר שנלכד לפני ההמתנה הראשונה — ⚠️ `mark` רץ אחרי `await`, ⭐ וקריאת
 *  הגלובלי בו הייתה זוקפת את הצלחת הדחיפה של משתמש אחד לחשבון השני. */

var PUSH_CFG = {

  chunk:  500,
  delay:  400,
  dirty:  function (t, ctx) { _gPushEp = ctxEpoch(); return dirtyRows(t, (ctx && ctx[t]) || {}); },
  key:    function (t, row) { return rowPendingKey(t, row); },
  send:   function (t, rows) {

  },
  mark:   function (t) { if (!ctxStale(_gPushEp)) _gMarkPushed(t); },

/* ═══ שכבת הדחיפה — מודול משותף (סבב 102) ═════════════════════════════════

      משלה: ⭐ שכבות שמעורבבות בפונקציה אחת אינן ניתנות לחתימה ואינן
      ניתנות למדידה, ⛔ ולכן אותו תפקיד נכתב בארבע צורות בלי שאיש מדד.
   ⛔ שינוי כאן — ארבע האפליקציות **וארבעת עותקי השער**, באותו סבב: ⚠️ אחרת
      החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ⛔ המנה היא `PUSH_CFG.chunk` — ⚠️ הדחיפה הראשונה במכשיר נוגעת בכל
      הרשומות, ⭐ ובקשה לשורה היא אלפי בקשות רשת: ⛔ **ומנה שנכשלה נדחפת
      שוב שורה-שורה** — ⚠️ כתיבת מנה היא הכל-או-כלום, ⭐ ושורה פגומה אחת
      חוסמת את כל התקינות שאיתה.

      הטבלה **בלי לסמן את עֵד הפינוי**, ⭐ ומערך ריק מסמן אותו: ⛔ סימון על
      טבלה שלא נמשכה היה מתיר לפנות מהדיסק רשומה שמעולם לא עלתה. */
var _pushTimer = null;

/*  ⛔ שכבה 1 — **מנה אחת ותו לא** — ⚠️ היא אינה יודעת מה מלוכלך ואינה
 *  נוגעת בסימון ה-⏳: ⭐ כל מה שהיא עושה הוא כתיבה אחת, ⛔ וכשל שלה הוא
 *  זריקה — ⚠️ תשובה שנושאת `error` אינה זורקת מעצמה, ⭐ והבודקת היחידה
 *  שלה היא כאן. */
function pushRow(t, rows) {
  return Promise.resolve(PUSH_CFG.send(t, rows)).then(function (res) {
    if (res && res.error) throw res.error;
    return rows.length;
  });

/*  ⛔ שכבה 2 — **טבלה אחת**: המנות, סימוני ה-⏳, ועֵד הדחיפה — ⚠️ «אין ראיה»

// מנוע המיזוג. הענן הוא בסיס הסדר ומנצח בשוויון — דטרמיניסטי, ולכן שני
// מכשירים שממזגים את אותם שני צדדים מגיעים לאותה תוצאה בדיוק.
// ⚠️ **`isPending` — רשומה מקומית שטרם אושרה בענן מנצחת ללא תלות בחותמת.**
// ⛔ אין להסיר את הכלל — ⚠️ חותמת שווה בין שני מכשירים נופלת לענף «הענן
// מנצח בשוויון», ⭐ ורשומה מקומית שלא אושרה הייתה נדרסת בגרסה שמעולם לא
// ראתה את העריכה. אותו כלל בדיוק ב-schar-limud.
/* ═══ מיזוג רשומות — מודול משותף (סבב 38) ════════════════════════════════
   ⛔ שינוי כאן (סבב 65) — ארבע האפליקציות **וארבעת עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ═══════════════════════════════════════════════════════════════════════ */
// כלל ההכרעה בין שתי גרסאות של **אותה** רשומה — הנקודה היחידה בארגון שבה
// הוא נכתב. ⛔ אין לשכפל אותה (סבב 38) — ר' הנימוק שבראש הבלוק.
// `isPend` הוא הסימון ⏳ של הרשומה המקומית; `mergePair`, כשהוא קיים, מקבל
// את ההכרעה כפרמטר ומרחיב אותה (מיזוג פנימי של סנאפשוט).
// ⛔ **⏳ שובר שוויון ⛔ ואינו גובר על חותמת חדשה יותר** — ⚠️ מכשיר א׳ ערך
//    ב-08:00 ולא הספיק לדחוף, ב׳ ערך ב-10:00 וסנכרן, וא׳ עלה ב-14:00:
//    ⭐ ⏳ שמנצח תמיד היה מוחק כאן את עריכת ה-10:00. ⛔ והמקרה שבו ⏳ באמת
//    נחוץ — רשומה שאינה בענן כלל — מטופל במסלול «מפתח שאינו בענן».
function _mergePick(loc, rem, k, isPend, tsOf, mergePair) {

// `opts`: getKey · ts · isPending · mergePair · keepUnversionedLocal · onDrop
//         ובנוסף ארבע ידיות המדיניות שבראש הבלוק.
function mergeCore(local, remote, opts) {

      // ⚠️ הסדר כאן הוא (הקיים, החדש) — שוויון נופל על ה**מאוחר** במערך.
      //    היפוך הארגומנטים הופך את שובר-השוויון בשקט.
      map[k] = (remoteDupe === 'last') ? r
             : _mergePick(map[k], r, k, false, tsOf, mergePair);
    });
    L.forEach(function (r) {
      if (!r) return;
      var k = getKey(r); if (k == null) return; k = String(k);
      if (!(k in map)) {
        // רשומה מקומית-בלבד — היעדרות אצל הצד השני אינה מחיקה.

  var out = [], seen = {}, byKey = {};
  L.forEach(function (l) {

    var k = getKey(r);
    if (k == null) { if (keyless === 'keep-remote') out.push(r); return; }
    k = String(k); seen[k] = 1;

/* ═══ גריעת tombstones — מודול משותף (סבב 93) ════════════════════════════
   ⛔ שינוי כאן (סבב 93) — ארבע האפליקציות **וארבעת עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ═══════════════════════════════════════════════════════════════════════ */
// כל רשומה שנמחקה משאירה tombstone לנצח. הם נשמרים במכשיר **ונדחפים לענן
// בכל שמירה**, ואיש כבר אינו קורא אותם.
//
// שלושה כללים, כולם קריטיים:
// 1. **רק tombstones.** רשומה חיה אינה נגרעת לעולם, בלי קשר לגיל.
// 2. **רק עם חותמת מספרית.** tombstone בלי חותמת — אי אפשר לדעת מתי נמחק,
//    ולכן הוא **נשאר**: חותמת חסרה נקראת 0, וגריעה לפיה הייתה מוחקת דווקא
//    את הישנים ביותר בלי שום ראיה לגילם.
// 3. **`TOMBSTONE_TTL_MS`.** ⛔ הסף ארוך בהרבה מכל היעדרות סבירה.
//
// ⚠️ המחיר המודע: מכשיר שהיה מנותק מעבר לסף ולא קיבל את ה-tombstone עדיין
// מחזיק את הרשומה כחיה, וכשיסתנכרן היא תחזור **פעם אחת**. מחיקה חוזרת
// יוצרת tombstone חדש ומתוארך. ⛔ והסף עצמו הוא מדיניות נתונים ⛔ ולכן
// החלטת המנהל.
var TOMBSTONE_TTL_MS = 90 * 24 * 60 * 60 * 1000;

// דגל חד-פעמי: הטעינה מרימה אותו, והמיזוג הראשון שאחריה צורך אותו.
// ⛔ גריעה מקומית בלבד חסרת משמעות — מנוע המיזוג מחזיר כל רשומה שקיימת
// בענן ואין לה מקבילה מקומית, ולכן ה-tombstones היו חוזרים תוך שניות
// והעותק הענני לעולם לא היה מצטמצם. ⚠️ הגריעה **אינה** רצה בפולינג
// ואינה נוגעת במנוע המיזוג — היא מופעלת על התוצאה, פעם אחת לעלייה.
var _tombPrunePending = false;

// ⛔ שתי צורות החותמת נקראות כאן — ⚠️ `updatedAt` ו-`updated_at` חיות שתיהן
//    בארגון, ⭐ ופונקציה שמכירה אחת מהן אינה מודול משותף: ⛔ היא הייתה
//    מחזירה «בלי חותמת» לכל רשומה בשתי אפליקציות, ומשאירה כל tombstone.
function tombStamp(r) {
  if (!r || typeof r !== 'object') return null;
  if (typeof r.updatedAt === 'number') return r.updatedAt;
  if (typeof r.updated_at === 'number') return r.updated_at;
  return null;
}

function prunePastTombstones(arr, nowTs) {
  if (!Array.isArray(arr)) return [];
  var cutoff = (typeof nowTs === 'number' ? nowTs : Date.now()) - TOMBSTONE_TTL_MS;
  return arr.filter(function (r) {
    if (!r || typeof r !== 'object') return false;
    if (!r.deleted) return true;                 // חי — לא נוגעים
    var t = tombStamp(r);
    if (t === null) return true;                 // בלי חותמת — משאירים
    return t >= cutoff;                          // tombstone טרי — משאירים

// ⛔ נקודת ההפעלה האחת — ⚠️ המיזוג של אוסף רשומות מעביר כאן את תוצאתו,
//    ⭐ והגריעה רצה בפעם הראשונה שאחרי הטעינה ותו לא: ⛔ עוטף שני היה
//    מאפשר לכל מקום בקוד לגרוע, ⚠️ ובכל פולינג.
function tombPruneMerged(arr) {

  var out = prunePastTombstones(arr);
  if (before !== out.length) console.log('[tomb] נגרעו ' + (before - out.length) + ' tombstones מעבר לסף');
  return out;
}
// ⛔ נקודת ההפעלה היחידה של המודול — ⚠️ העלייה מרימה את הדגל **פעם אחת**,
//    ⭐ והמיזוג הראשון שאחריה צורך אותו: ⛔ הרמה בכל פולינג הייתה גורעת
//    בכל שלוש שניות, ⚠️ וזה בדיוק מה שהדגל בא למנוע.
function tombBoot() { _tombPrunePending = true; }
/* ═══════════════ סוף מודול גריעת ה-tombstones ══════════════════════════ */

// חיבור גיוס לליבה המשותפת (סבב 38). ⛔ החתימה לא השתנתה.
// ⛔ `dedupe: false` — אותו נימוק כמו בשכר לימוד (סבב 38): כפילות נשארת
//    גלויה ואינה מכווצת בשקט.
// ⚠️ `localPick: 'first'` — `findRow` החזירה את ההתאמה ה**ראשונה**, ולא
//    האחרונה כמו בשכר לימוד. ההבדל נראה זניח, אבל הוא קובע איזו משתי
//    רשומות מקומיות בעלות אותו מפתח מתמודדת מול הענן.
// ⚠️ המפתח הוא שם עמודה ולא פונקציה, ו-`String()` עליו לעולם אינו `null` —
//    ולכן ענף `keyless` אינו נגיש כאן, בדיוק כפי שהיה.
function mergeRows(local, remote, keyName, isPending) {
  return tombPruneMerged(mergeCore(local, remote, {
    getKey: function (r) { return String(r[keyName]); },
    ts: rowTs, isPending: isPending, keepUnversionedLocal: true,
    dedupe: false, keyless: 'drop', localPick: 'first'

}

function liveRows(t) {
  var m = tableMeta(t), arr = MIRROR[t] || [];
  return m.soft ? arr.filter(function (r) { return !r.deleted; }) : arr.slice();
}
// שכפול סדר השאילתה בצד הלקוח — עכשיו שהמיון כבר לא מגיע מהשרת.
function sortRows(t, arr) {
  var m = tableMeta(t);
  if (!m.order) return arr;
  var dir = m.desc ? -1 : 1;
  return arr.sort(function (a, b) {
    var x = a[m.order], y = b[m.order];
    var xe = (x == null || x === ''), ye = (y == null || y === '');
    if (xe && ye) return 0;
    if (xe) return 1;                    // nullsFirst:false — ריקים בסוף, תמיד
    if (ye) return -1;
    if (m.order === 'name') return HE.compare(x, y) * dir;
    return (x < y ? -1 : x > y ? 1 : 0) * dir;
  });
}

/*  ⛔ `value` הוא **טקסט** בטבלה ⛔ ואינו `jsonb` — ⚠️ הלקוח ממיר אותו
 *  בעצמו: ⭐ ממיר בצד השרת הוא מנתח שני לאותו ערך, ⛔ ושני מנתחים
 *  נסחפים זה מזה בשקט. ⚠️ וערך פגום נקרא כשורה חסרה ⛔ ולא מפיל מסך. */
function gCfgParse(key, v) {
  if (Array.isArray(v)) return v;
  var pr = kvParse(key, v);

  var cfg = { categories: [], causes: [], domains: [] }, seen = {};
  (MIRROR.g_config || []).forEach(function (row) {

    if (!list) return;
    cfg[row.key] = list.slice();
    seen[row.key] = true;

  Object.keys(DEFAULT_CONFIG).forEach(function (k) { if (!seen[k]) cfg[k] = DEFAULT_CONFIG[k].slice(); });

  state.pledges = sortRows('g_pledges', liveRows('g_pledges'));
  state.txns    = sortRows('g_txns',    liveRows('g_txns'));
  state.tasks   = sortRows('g_tasks',   liveRows('g_tasks'));
  state.targets = sortRows('g_targets', liveRows('g_targets'));

/* -------------------------------------------------------------- התור */

// ⚠️ **הכתיבה המקומית חייבת להיכשל בקול.** אם היא נכשלה (אחסון מלא) הפעולה
// לא תגיע לענן לעולם, ולכן היא זורקת כאן — לפני שמשהו על המסך מתנהג כאילו
// נשמר. `runSave` תופסת את הזריקה, מציגה שגיאה, ו-`lsGuardToast` חוסם ממילא
// כל "✅" בשתי השניות הבאות.
function markLocal(table, id) {
  if (!mirrorSave(table)) throw new Error(MSG_LS_FULL);
  if (!pendMark(pendRowKey(table, id))) throw new Error(MSG_LS_FULL);
  schedulePush();
}

/* ------------------------------------------------- API כתיבה (מקומי-תחילה) */
function upsertLocal(t, row) {
  var m = tableMeta(t);
  var arr = MIRROR[t] || (MIRROR[t] = []);
  // סבב 23: הסינון קודם לכתיבה לזיכרון, לא רק לדיסק — כדי שהסוד לא יישב
  // ב-`MIRROR` אפילו לרגע ולא יוכל להישטף החוצה בנתיב אחר.
  row = stripCols(t, row);
  var cur = findRow(arr, m.key, row[m.key]);
  if (cur) Object.keys(row).forEach(function (k) { cur[k] = row[k]; });
  else arr.push(row);
  mirrorSave(t);
  return cur || row;
}

function insert(table, row) {
  var m = tableMeta(table);
  var full = Object.assign({}, row);
  if (full[m.key] == null) full[m.key] = newClientId();
  if (!full.created_at) full.created_at = nowISO();
  full.updated_at = Date.now();
  if (m.soft) { if (full.deleted == null) full.deleted = false; if (full.deleted_at === undefined) full.deleted_at = null; }
  // ה-insert נשלח כ-upsert על המפתח הראשי: ניסיון חוזר אחרי תשובה שאבדה
  // ברשת לא ייכשל על מפתח כפול, ולכן ריקון התור אידמפוטנטי.
  var saved = upsertLocal(table, full);
  markLocal(table, full[m.key]);
  applyMirrorToState();
  return Promise.resolve(saved);
}

function update(table, id, patch) {
  var m = tableMeta(table);
  var p = Object.assign({}, patch, { updated_at: Date.now() });
  var row = Object.assign({}, p);
  row[m.key] = id;
  var saved = upsertLocal(table, row);
  markLocal(table, id);
  applyMirrorToState();
  return Promise.resolve(saved);
}

function softDelete(table, id) {
  return update(table, id, { deleted: true, deleted_at: nowISO() });
}

// upsert לפי עמודה שאינה המפתח הראשי (חודש ביעדים, key ברשימות).
function upsertBy(table, conflict, row) {
  var m = tableMeta(table);
  var full = Object.assign({}, row, { updated_at: Date.now() });
  var arr = MIRROR[table] || (MIRROR[table] = []);
  var cur = findRow(arr, conflict, full[conflict]);
  if (cur && cur[m.key] != null) full[m.key] = cur[m.key];
  else if (full[m.key] == null && m.key !== conflict) full[m.key] = newClientId();
  if (cur) Object.keys(full).forEach(function (k) { cur[k] = full[k]; });
  else arr.push(full);
  markLocal(table, full[m.key]);
  applyMirrorToState();
  return Promise.resolve(cur || full);
}

function saveConfigList(key, list) {
  return upsertBy('g_config', 'key', { key: key, value: JSON.stringify(list) });
}

/*  ⛔ הדבר היחיד שנבדל בין שלוש האפליקציות שיש בהן כניסה — ⚠️ הלקוח,
 *  שם הטבלה, הודעת הניתוק, ומה נעשה **אחרי** שהתשובה חזרה: ⭐ הכתיבה
 *  עצמה זהה בית-לבית.
 *  ⚠️ **וכאן `after` עושה את העבודה הכבדה** — ⛔ הכתיבה נכנסת למראה
 *  **בלי `pendMark`**: ⭐ מה שכבר בענן אינו ממתין לכלום, ⛔ וסימון ⏳ עליו
 *  היה נותן לו לנצח במיזוג ולהסתיר את השורה האמיתית שבענן. */
var USER_CFG = {
  ready: function () { return !!sb && navigator.onLine; },
  /*  ⛔ ההודעה נקראת בזמן הקריאה ⛔ ולא בזמן ההשמה — ⚠️ הקבוע מוצהר
   *  **מתחת** לבלוק הזה, ⭐ וקריאה בהשמה הייתה נותנת `undefined`. */
  offMsg: function () { return MSG_OFF_USER_WRITE; },
  from: function () { return sb.from('g_users'); },
  run: function (q) { return withTimeout(q); },
  missingFp: gIsMissingFpCol,
  after: function (res, body) {
    /*  ⛔ הכשל נזרק כאן ⛔ ולא בבלוק — ⚠️ שלושת הקוראים כאן עובדים
     *  ב-`catch`, ⭐ ובשתי האחיות הקוראים בודקים `res.error`. */
    if (!res || res.error) throw ((res && res.error) || new Error('שגיאת שרת'));
    var saved = (Array.isArray(res.data) && res.data[0]) || body;
    usersCacheSave(saved);
    /*  ⛔ העֵד נכתב כאן ⛔ ולא במשיכה — ⚠️ זו כתיבה לענן שחזרה `ok`,
     *  ⭐ ומשיכה אינה ראיה שהשורה שלנו עלתה. */
    _gMarkPushed('g_users');
    applyMirrorToState();
    /*  ⭐ `g_users` היא אחת משבע הטבלאות שנמשכות, ⛔ ולכן גם כתיבה אליה
     *  מקדמת את החותמת — ⚠️ אחרת משתמש חדש לא היה מגיע למכשיר אחר עד
     *  לשינוי נתונים אחר לגמרי. */
    plTouch();
    /*  ⛔ «ללא טביעה» משני מקורות: ⚠️ העמודות טרם קיימות, ⛔ או שהגזירה
     *  עצמה נכשלה ולכן `pass_fp` נכתב ריק לצד סיסמה חדשה. ⭐ הסימן הוא
     *  **נוכחות השדה** — ⚠️ הוא נכנס ל-`body` אך ורק כשנמסרה סיסמה. */
    return { noFp: !!res._noFp ||
      (Object.prototype.hasOwnProperty.call(body, 'pass_fp') && !body.pass_fp) };
  }
};

/* ═══ כתיבת משתמש — מודול משותף (סבב 103) ═════════════════════════════════
   ⛔ שינוי כאן — שלוש האפליקציות שיש בהן כניסה **ושלושת עותקי השער**,
      באותו סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשניים.
   ⛔ **כל כתיבה לטבלת המשתמשים עוברת כאן** — ⚠️ הטבלה אינה ב-`PUSH_TABLES`,
      ⭐ שהמראה המקומית מסירה ממנה את הסוד: ⛔ דחיפה גורפת שלה הייתה כותבת
      אותו חזרה ריק לכל המשתמשים.
   ⛔ **והכתיבה דורשת רשת** — ⚠️ אין רשת ⇒ נדחה ברעש ⛔ ולא «נשמר»: ⭐ מה
      שאינו נכתב כאן אינו עולה לענן בשום מסלול אחר.
   ⛔ **`upsert` ליצירה, `update` לעריכה, ⛔ ואין להחליף ביניהם** — ⚠️ שדות
      החובה נבדקים על השורה המועמדת **לפני** ש-`ON CONFLICT` מופעל, ⭐ ולכן
      `upsert` עם אובייקט חלקי נופל על `not null` במקום לעדכן. ⚠️ וביצירה
      השורה מלאה **והמזהה נוצר במכשיר**, ⛔ ולכן ניסיון חוזר אחרי תשובה
      שאבדה ברשת מעדכן ⛔ ואינו מכפיל.
   ⛔ **והתשובה מוחזרת ⛔ ואינה נזרקת** — ⚠️ supabase-js אינו זורק בכשל,
      ⭐ ו-`USER_CFG.after` הוא שמכריע מה נעשה ב-`res.error`. */
function _writeUserSend(body, key) {
  var q = key == null
    ? USER_CFG.from().upsert(body, { onConflict: 'client_id' })
    : USER_CFG.from().update(body).eq('client_id', key);
  /*  ⛔ `.select()` בשני המסלולים — ⚠️ הקורא צריך את השורה **כפי שנשמרה**
   *  ולא כפי שנשלחה: ⭐ בלעדיה המטמון נכתב מהמטען, ⛔ ועמודה שהמסד מילא
   *  אינה מגיעה אליו לעולם. */
  return USER_CFG.run(q.select());
}

function writeUser(id, row) {
  if (!USER_CFG.ready()) return Promise.reject(new Error(USER_CFG.offMsg()));
  var key = (id == null || id === '') ? null : String(id);
  var body = Object.assign({}, row);
  body.updated_at = Date.now();
  body.client_id = (key == null) ? (body.client_id || newClientId()) : key;
  return _writeUserSend(body, key).then(function (res) {
    /*  ⛔ נפילה-חזרה לחלון שבין דחיפת הקוד להרצת המיגרציה — ⚠️ בלעדיה
     *  **כל** שמירת משתמש נכשלת עד שהעמודות ייווצרו: ⭐ המשתמש נשמר,
     *  והכניסה האופליין שלו תיפתח בשינוי הסיסמה הבא. */
    if (!(res && res.error && USER_CFG.missingFp(res.error))) return res;
    var b2 = Object.assign({}, body);
    delete b2.pass_salt; delete b2.pass_fp;
    return _writeUserSend(b2, key).then(function (r) {
      if (r && !r.error) r._noFp = true;
      return r;
    });
  }).then(function (res) { return USER_CFG.after(res, body); });
}
/* ═══════════════ סוף מודול כתיבת משתמש ══════════════════════════════════ */

// גוזרת טביעה לסיסמה חדשה ומחזירה את שדות הכתיבה.
// ⛔ **כישלון גזירה מאפס את שני השדות ולא רק מדלג על הכתיבה** (סבב 23) — טביעה ישנה
//    שנשארת הייתה ממשיכה לפתוח את הכניסה האופליין עם הסיסמה **הקודמת**,
//    לנצח — כלומר שינוי סיסמה שאינו משנה כלום מבחינת מי שמחזיק את המכשיר.
/* ⛔ **צעד ב — הכתיבה לטקסט הגלוי ירדה בהחלטת המנהל** ⚠️ ואין להחזירה:
   `g_users.password` הייתה קריאה לכל מי שהחזיק את מפתח ה-anon שב-`index.html`
   הציבורי, וה-RLS כאן פתוח בכוונה. ⛔ הפונקציה מחזירה שני שדות בלבד,
   ⭐ והם היחידים שהאימות נשען עליהם. */
function passFields(pass) {
  return gMakePassFp(pass).then(function (made) {
    return made ? { pass_salt: made.salt, pass_fp: made.fp }
                : { pass_salt: null, pass_fp: null };
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   דחיפת-מצב (סבב 12 שלב 3) — מה שמקומי-וחדש-יותר עולה לענן
   ══════════════════════════════════════════════════════════════════════════
   התור היוצא הוחלף בדחיפת-מצב, השיטה המוכחת בשלוש האחיות. היא פשוטה יותר
   וחסינה יותר: **אין פריט שיכול "להיתקע" לבדו.** בתור, פעולה אחת שנכשלה
   כשל תוכן חסמה את כל מה שאחריה (FIFO) או הפכה ל-`dead` ונשארה תלויה;
   בדחיפת-מצב כל רשומה עומדת בפני עצמה, וכל סנכרון מתקן את מה שחסר.
   ══════════════════════════════════════════════════════════════════════════ */
function rowPendingKey(t, row) { return pendRowKey(t, row[tableMeta(t).key]); }

// מה צריך לעלות: אין מקבילה בענן, מקומי חדש יותר, **או עדיין מסומן ⏳**.
// ⛔ אין להסיר את הסעיף השלישי — ר' ההערה ב-mergeRows על חותמת שווה.
function dirtyRows(t, remoteByKey) {
  var m = tableMeta(t);
  return (MIRROR[t] || []).filter(function (l) {
    var k = String(l[m.key]);
    if (k === 'undefined' || k === 'null') return false;
    var r = remoteByKey[k];
    return !r || rowTs(l) > rowTs(r) || pendHas(pendRowKey(t, l[m.key]));
  });
}

/* ── ניקוי חד-פעמי של סימוני ⏳ על `g_users` (סבב 23) ──────────────────────
   ⚠️ **סימונים שלא ניתן לקיים אינם "בטוחים" — הם מזיקים.** עד סבב 23
   `saveUser`/`pass-save`/`user-toggle` קראו ל-`insert`/`update` המקומיים
   וסימנו ⏳, אבל `g_users` אינה ב-`PUSH_TABLES` — כלומר הסימון הבטיח
   שליחה חוזרת **שלא תקרה לעולם**. גרוע מזה: `mergeRows` נותנת לרשומה
   מסומנת לנצח את הניצחון במיזוג, ולכן הרשומה המקומית הייתה **מסתירה
   לצמיתות** את השורה האמיתית שבענן — כולל את הטביעה שסבב 23 מביא.

   הניקוי נכון ולא מאבד נתון: הכתיבות ההן אכן לא הגיעו לענן, ומעכשיו
   `writeUser` הוא המסלול היחיד והוא דורש רשת. המשיכה הראשונה אחרי
   הניקוי מחזירה את מצב הענן. הפעולה נרשמת ביומן — סימון שנעלם בשקט הוא
   בדיוק מה שמודול ה-⏳ בא למנוע. */
function migrateUserPend() {
  var m, keys = [];
  try { m = pendAll(); } catch (e) { return 0; }
  Object.keys(m || {}).forEach(function (k) {
    if (k.indexOf('g_users:') === 0) keys.push(k);
  });
  if (!keys.length) return 0;
  pendClearMany(keys);
  try { lsLog('users-pend-clear', keys.length + ' סימוני ⏳ על משתמשים נוקו — כתיבת משתמש דורשת רשת', 0); } catch (e) { }
  console.warn('[users] נוקו ' + keys.length + ' סימוני ⏳ שלא היה מי שידחוף');
  return keys.length;
}

/* ------------------------------------------------------------- משיכה */
// מחזירה `{ok, remote}` — `remote` היא מפת הענן פר-טבלה, והיא מה שמאפשר
// לדחיפה שאחריה לדעת מה מקומי-וחדש-יותר.
function syncPull() {
  if (_pulling || !sb) return Promise.resolve({ ok: false, remote: {} });
  _pulling = true;
  /*  ⛔ ההקשר נלכד בכניסה ⛔ ונבדק לפני המיזוג — ⚠️ המחזור מושך, ממזג
   *  וכותב, ⭐ והמשתמש יכול להתחלף בין המשיכה לכתיבה: ⛔ מה שנמזג עבור
   *  הקודם היה יורד לדיסק אחרי שהחדש כבר נכנס. */
  var _ep = ctxEpoch();
  var remoteMaps = {};
  return Promise.all(TABLES.map(function (m) {
    // ⚠️ בלי `.eq('deleted', false)` — חייבים גם את ה-tombstones, אחרת מחיקה
    //    שנעשתה במכשיר אחר לא תגיע לכאן לעולם. הסינון ב-`liveRows()`.
    /*  ⛔ המשיכה **מלאה** ⛔ ואין לה חלון — ⚠️ מנוע ההכרעה חייב את כל
     *  הרשומות, ⭐ ורשומה שלא נמשכה נקראת «נמחקה». ⚠️ מה שכן נוסף הוא
     *  **העימוד** — ⛔ עד כאן `select('*')` הביא את הטבלה בבקשה אחת,
     *  ⭐ וביום ש-`db-max-rows` יוגדר היא הייתה נחתכת **בשקט**.
     *  ⛔ והסדר הוא `m.key` ⛔ ולא `m.order` — ⚠️ `m.order` הוא סדר
     *  **תצוגה** שעשוי להיות ריק, ⭐ והעימוד דורש מפתח יציב וייחודי. */
    return _ysRowsPaged(function () {
      return sb.from(m.t).select('*');
    }, m.key, null)
      .then(function (rows) { return { m: m, res: rows ? { data: rows, error: null }
                                                       : { data: null, error: { message: 'rows:' + m.t } } }; },
            function (e) { return { m: m, res: { error: e } }; });
  })).then(function (list) {
    if (ctxStale(_ep)) return { ok: false, remote: {} };
    var errs = [];
    list.forEach(function (x) {
      if (!x.res || x.res.error || !Array.isArray(x.res.data)) { errs.push(x.m.t); return; }
      var rows = stripRows(x.m.t, x.res.data);
      hwNoteCloud(mirrorKey(x.m.t), rows);   // ראיה עננית לשער הדיסק (סבב 35)
      var map = {};
      rows.forEach(function (r) { map[String(r[x.m.key])] = r; });
      remoteMaps[x.m.t] = map;
      var merged = mergeRows(MIRROR[x.m.t], rows, x.m.key,
        function (k) { return pendHas(pendRowKey(x.m.t, k)); });
      // סבב 26: מראת המשתמשים נשמרת דרך **הנתיב המלא** של המודול שלה,
      // אותו מסנן בדיוק שמשמש את הנתיב החלקי. ר' `usersSanitize`.
      if (x.m.t === 'g_users') usersCacheSaveAll(merged);
      else { MIRROR[x.m.t] = merged; mirrorSave(x.m.t); }
    });
    applyMirrorToState();
    if (!errs.length) {
      _lastPullOk = Date.now();
      // ⛔ הגיבוי היומי **אינו** נתלה כאן (סבב 30, השלמה) — הניסוח הראשון
      //    תלה אותו במשיכה מלאה שהצליחה, כלומר בפעילות סנכרון. נקודת
      //    ההפעלה היא `bkBoot()` ב-`start()`. ⚠️ ריקון תור היומן כן נשאר:
      //    הוא ריקון חוזר, וכאן יש ראיה טרייה שהרשת עובדת.
      try { logFlush(); } catch (eB) { }
      /* ⛔ **אין כאן כתיבת עֵד פינוי** (סבב 96) — ⚠️ עד כאן נכתבה מכאן
       *  `g_synced_at`, והיא חותמת **משיכה**: «ראיתי את מצב הענן» אינו
       *  «מה שאצלי עלה לשם». ⭐ העֵד הוא `_gPushedAt` פר-טבלה, והוא
       *  מסומן בסוף מעבר הדחיפה של אותה טבלה. */
      if (_netWarned) { _netWarned = false; toast(MSG_SYNC_BACK, null, 'good'); }
    } else {
      console.warn('[sync] נכשלו:', errs.join(', '));
      if (!_netWarned) {
        _netWarned = true;
        toast('⚠️ טעינת הנתונים נכשלה (' + errs.join(', ') + ') — המוצג עלול להיות לא מעודכן', null, 'bad');
      }
    }
    return { ok: !errs.length, remote: remoteMaps };
  }).catch(function (e) {
    console.warn('[sync]', e);
    return { ok: false, remote: {} };
  }).then(function (r) { _pulling = false; pendRender(); return r; });
}

// ⚠️ **משיכה קודמת לדחיפה** — הפוך מהסדר של התור. בדחיפת-מצב אי אפשר לדעת
// מה "מקומי וחדש יותר" בלי לראות קודם מה יש בענן, ודחיפה עיוורת הייתה
// מחזירה לחיים רשומה שנמחקה במכשיר אחר. `t0` נלקח לפני המשיכה: רשומה
// שנכתבה תוך כדי הסנכרון לא נבדקה ולא נדחפה, ולכן הסימון שלה חייב להישאר.
function syncNow() {
  var t0 = Date.now();
  /*  ⛔ הדחיפה נבדקת מול ההקשר שנלכד לפני המשיכה — ⚠️ `res.remote` נמדד
   *  עבורו, ⭐ ודחיפה מולו אחרי החלפה זוקפת לחדש מה שנמזג לקודם. */
  var _ep = ctxEpoch();
  return syncPull().then(function (res) {
    if (!res.ok || ctxStale(_ep)) { render(); return false; }
    /*  ⛔ שער הרשת יושב כאן ⛔ ולא בשכבת הדחיפה — ⚠️ הוא תלוי בלקוח של
     *  האפליקציה, ⭐ ומעבר ריק היה מסמן את עֵד הפינוי בלי ראיה מהענן. */
    var p = (!sb || !navigator.onLine) ? Promise.resolve({ still: [] })
                                       : pushDirty(res.remote);
    return p.then(function (r) {
      if (ctxStale(_ep)) { render(); return false; }
      pendReconcile(r.still, t0);
      render();
      return true;
    });
  });
}
// הסימונים מחושבים מחדש **רק אחרי משיכה שהצליחה**: זו ראיה ישירה ולא הסקה.
// מה שנכתב אחרי `t0` לא נבדק מול הענן ולכן אינו מנוקה.
function pendReconcile(still, t0) {
  var want = {};
  (still || []).forEach(function (k) { want[k] = 1; });
  pendMarkMany(Object.keys(want));
  var m = pendAll(), gone = [];
  Object.keys(m).forEach(function (k) { if (!want[k] && m[k] < t0) gone.push(k); });
  pendClearMany(gone);
}
// ⛔ **אין כאן יותר פולינג שדוחף ואין משיכה מלאה תקופתית** (סבב 51) — עד
//    כאן רץ `setInterval` שמשך את שבע הטבלאות כל עשרים שניות ודחף בכל
//    פעם שהיה משהו ממתין, בלי שום ראיה שמשהו בענן השתנה.
//    מה שמכסה את זה במלואו: הדחיפה **מונעת-האירוע** (`schedulePush()`
//    אחרי כל כתיבה מקומית), מודול הניסיון החוזר של סבב 44 שנדרך
//    מ-`rtyNote()` ורץ רק כשהתור אינו ריק, והמשיכה המותנית של `plBoot()`
//    — שקוראת שורה אחת ומושכת רק כשהיא התקדמה, כל שלוש שניות.
/* ══════════════════════════════════════════════════════════════════════════
   נגזרות — כל חישובי הכסף, בזמן ריצה בלבד
   ══════════════════════════════════════════════════════════════════════════
   ⛔ **אין כאן שום סכום שמור, ואין להוסיף.** «נגבה», «נותר» וסטטוס
   התחייבות מחושבים בכל קריאה מ-`state.txns` (נרשם בסבב 27) — אין עמודות `collected` /
   `balance` / `status` בסכימה. סכום שמור נשמר
   ברגע אחד ומתיישן בכל תנועה שנרשמה במכשיר אחר; החישוב בזמן ריצה תמיד
   מסכים עם הנתונים שעל המסך.

  try { return { ok: true, value: JSON.parse(raw), bad: false }; }
  catch (e) {
    /*  ⛔ ההודעה יוצאת מכאן ⛔ ולא מאתר הקריאה — ⚠️ כשל שאינו אומר מה קרה
     *  שקול לכשל שקט, ⭐ ונקודת יציאה אחת היא מה שמשאיר את הנוסח אחד. */
    console.error('[sync] ' + KV_BAD + ' [' + key + ']:', e);
    toast('⚠️ ' + kvBadLabel(key), null, 'bad');
    return { ok: false, value: null, bad: true };
  }
}
function kvBadLabel(name) { return name + ' (' + KV_BAD + ')'; }
/* ═══════════════ סוף מודול ערך מפתח-ערך ═════════════════════════════════ */
/* ═══ גרף העמודות — מודול משותף (סבב 137) ═══════════════════════════════════
   ⛔ סדרה מוצגת ברוחב יחסי ⛔ ולא בספריית גרפים — ⚠️ הרוחב הוא התכונה
      היחידה שנגזרת מהנתון, ⭐ והוא החריג היחיד לסגנון מוטבע.
   ⛔ פחות משתי נקודות אינו גרף — ⚠️ עמודה אחת אינה משווה דבר, ⭐ והמסך
      מציג את הטבלה בלבד: ⛔ המחזירה מחרוזת ריקה ⛔ ואינה מציירת מסגרת.
   ⛔ וכל שורה נושאת `aria-label` עם המספרים — ⚠️ גרף בלי טקסט חלופי אינו
      נגיש, ⭐ והוא כל מה שקורא-מסך רואה.
   ⛔ **מה נכנס**: `lab` תווית · `val` הערך · `tgt` היעד · `txt` הטקסט
      החלופי · `end` מה שנכתב בסוף השורה. */
function barChart(rows, label) {
  if (!Array.isArray(rows) || rows.length < 2) return '';
  var max = 0, i;
  for (i = 0; i < rows.length; i++) max = Math.max(max, rows[i].val || 0, rows[i].tgt || 0);
  if (!(max > 0)) return '';
  var pct = function (v) { return Math.round(((v || 0) / max) * 1000) / 10; };
  var h = '<div class="bchart" role="img" aria-label="' + esc(label) + '">';
  for (i = 0; i < rows.length; i++) {
    h += '<div class="brow" aria-label="' + esc(rows[i].txt) + '">' +
      '<span class="blab">' + esc(rows[i].lab) + '</span>' +
      '<span class="bbars"><span class="btrack"><i style="width:' + pct(rows[i].val) + '%"></i></span>' +
      '<span class="btrack tgt"><i style="width:' + pct(rows[i].tgt) + '%"></i></span></span>' +
      '<span class="bval">' + esc(rows[i].end) + '</span></div>';
  }
  return h + '</div>';
}

// ⛔ גם ה-`value` וגם הטקסט עוברים `esc` (נרשם בסבב 27) — ערכי הרשימות (`g_config`) נקבעים
//    ע"י המשתמש במסך ההגדרות, ולכן הם נתוני משתמש לכל דבר.
function selectHTML(name, options, value, placeholder) {

  var h = '<select class="inp" aria-label="' + esc(placeholder || 'בחירה') + '" id="' + name + '">';

}
