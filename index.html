<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="ניהול תורמים, התחייבויות, תנועות ומשימות גיוס כספים.">
<title>גיוס — ניהול גיוס כספים</title>

<script>
// Must run before any relative URL is parsed.
// The service worker answers deep paths (/gius/anything/here) with this same
// shell, and at that URL every relative href would resolve one or more levels
// too deep — manifest.json, sw.js and the icons would all 404, and the worker
// would register under the wrong scope. Pin a <base> at the app root instead.
(function () {
  var p = location.pathname;
  var m = p.match(/^(.*?\/gius\/)/);
  var b = document.createElement('base');
  b.href = m ? m[1] : p.replace(/[^/]*$/, '');
  document.head.appendChild(b);
})();
</script>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="גיוס">

<style>
/* ============================================================ design tokens */
:root{
  --bg:#f4f6f9; --card:#ffffff; --card-2:#fbfcfe;
  --ink:#12202e; --ink-2:#3b4d61; --muted:#6b7c90;
  --line:#e3e8ef; --line-2:#eef2f7;
  --brand:#0f766e; --brand-ink:#ffffff; --brand-soft:#e6f4f2;
  --ok:#15803d; --ok-soft:#e7f6ec;
  --warn:#b45309; --warn-soft:#fdf1e3;
  --bad:#b91c1c; --bad-soft:#fdeceb;
  --gold:#a16207; --gold-soft:#fdf5e0;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(16,32,48,.05), 0 8px 24px rgba(16,32,48,.06);
  --shadow-lg:0 12px 40px rgba(16,32,48,.18);
  --tab-h:62px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d151d; --card:#131e29; --card-2:#18242f;
    --ink:#e8eef5; --ink-2:#c2cfdc; --muted:#93a5b8;
    --line:#24333f; --line-2:#1d2a35;
    --brand:#14b8a6; --brand-ink:#04201d; --brand-soft:#0f2c2a;
    --ok:#4ade80; --ok-soft:#122a1c;
    --warn:#fbbf24; --warn-soft:#2c2213;
    --bad:#f87171; --bad-soft:#2d1717;
    --gold:#fcd34d; --gold-soft:#2b2413;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
    --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  }
}

/* =================================================================== base */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Hebrew","Rubik",Arial,sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
  overflow-wrap:anywhere;
}
body.locked{overflow:hidden}
h1,h2,h3{margin:0; font-weight:700; line-height:1.3}
button{font:inherit; color:inherit}
input,select,textarea{font:inherit; color:inherit}
table{border-collapse:collapse; width:100%}
.hidden{display:none !important}
.spin{width:20px;height:20px;border:2.5px solid var(--line);border-top-color:var(--brand);
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-4px}
@keyframes sp{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ================================================================== login */
.auth{min-height:100dvh;display:grid;place-items:center;padding:24px}
.auth-card{
  width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);
  border-radius:22px;padding:34px 26px;box-shadow:var(--shadow);text-align:center;
}
.auth-card .mark{width:66px;height:66px;margin:0 auto 14px;display:block}
.auth-card h1{font-size:26px;letter-spacing:-.5px}
.auth-card .sub{color:var(--muted);font-size:14px;margin:4px 0 24px}
.auth-card .fld{text-align:start;margin-bottom:12px}
.auth-err{
  display:none;margin-top:14px;background:var(--bad-soft);color:var(--bad);
  border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;font-weight:600
}
.auth-err.show{display:block}

/* ================================================================== shell */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--card);
  border-bottom:1px solid var(--line);
  padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:12px;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.3px}
.brand svg{width:26px;height:26px;flex:none}
.brand small{font-weight:500;color:var(--muted);font-size:12px;display:none}
.who{margin-inline-start:auto;display:flex;align-items:center;gap:8px;min-width:0}
.who .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.who .role{font-size:11px;color:var(--muted);display:block;font-weight:500}

.tabbar{
  position:fixed;inset-inline:0;bottom:0;z-index:45;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  background:none;border:0;cursor:pointer;padding:8px 2px 9px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;font-weight:600;color:var(--muted);
}
.tabbar button .ic{font-size:19px;line-height:1}
.tabbar button.on{color:var(--brand)}
.tabbar button.on .ic{transform:translateY(-1px)}

main{padding:14px; padding-bottom:calc(var(--tab-h) + 84px + env(safe-area-inset-bottom));
  max-width:1180px;margin:0 auto}

@media (min-width:900px){
  .brand small{display:inline}
  .tabbar{
    position:static;display:flex;gap:4px;border:0;background:none;padding:0;
    margin-inline-start:18px;
  }
  .tabbar button{flex-direction:row;gap:6px;font-size:14px;padding:8px 13px;border-radius:10px}
  .tabbar button .ic{font-size:16px}
  .tabbar button.on{background:var(--brand-soft)}
  main{padding:20px;padding-bottom:120px}
}

/* ================================================================== cards */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);margin-bottom:14px
}
.card > h2{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card > h2 .cnt{
  font-size:11.5px;font-weight:700;background:var(--line-2);color:var(--muted);
  border-radius:99px;padding:1px 8px
}
.card > h2 .sp{margin-inline-start:auto;font-weight:500;font-size:13px;color:var(--muted)}
.grid2{display:grid;gap:14px}
@media (min-width:820px){.grid2{grid-template-columns:1fr 1fr}}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
.empty .big{font-size:26px;display:block;margin-bottom:6px;opacity:.65}

/* ============================================================== home ring */
/* Side by side from 520px up. Below that the ring stacks above the stats so
   the tiles get the full width — otherwise "100,000 ₪" breaks across lines. */
.hero{display:flex;flex-direction:column;gap:16px;align-items:center}
@media (min-width:520px){.hero{flex-direction:row;gap:18px}}
.ring{width:132px;height:132px;flex:none}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--brand);transform:rotate(-90deg);transform-origin:50% 50%;
  transition:stroke-dasharray .6s cubic-bezier(.4,0,.2,1)}
.ring-wrap{position:relative;flex:none}
.ring-val{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center
}
.ring-val b{font-size:25px;letter-spacing:-1px;display:block;line-height:1.1}
.ring-val span{font-size:11px;color:var(--muted);font-weight:600}
.hero-stats{flex:1;width:100%;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:1000px){.hero-stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card-2);border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:9px 11px}
.stat span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:1px}
.stat b{font-size:16.5px;letter-spacing:-.4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)}
.momentum{
  margin-top:14px;background:var(--brand-soft);color:var(--brand);
  border-radius:var(--radius-sm);padding:11px 14px;font-weight:700;text-align:center;font-size:15px
}
.monthnav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.monthnav b{font-size:15px;min-width:130px;text-align:center}
.monthnav .grow{margin-inline-start:auto}

/* ================================================================ tables */
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
th,td{padding:9px 10px;text-align:start;font-size:13.5px;border-bottom:1px solid var(--line-2);white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.2px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--card-2)}
tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0;background:var(--card-2)}
.bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden;min-width:52px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}

/* ================================================================== lists */
.row{
  display:flex;align-items:center;gap:11px;padding:11px 4px;
  border-bottom:1px solid var(--line-2);cursor:pointer
}
.row:last-child{border-bottom:0}
.row:hover{background:var(--card-2)}
.row .av{
  width:37px;height:37px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:14px
}
.row .av.vip{background:var(--gold-soft);color:var(--gold)}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-size:14.5px;font-weight:650;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main small{color:var(--muted);font-size:12.5px}
.row .end{text-align:end;flex:none;font-size:13.5px;font-variant-numeric:tabular-nums}
.row .end small{display:block;color:var(--muted);font-size:11.5px}

/* ================================================================ badges */
.badge{
  display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;
  padding:2px 9px;white-space:nowrap;background:var(--line-2);color:var(--muted)
}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.brand{background:var(--brand-soft);color:var(--brand)}
.badge.gold{background:var(--gold-soft);color:var(--gold)}

/* ============================================================== controls */
.inp,select.inp,textarea.inp{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:10px 12px;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s
}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.inp{resize:vertical;min-height:78px;line-height:1.55}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
  linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:12px calc(50% - 2px),17px calc(50% - 2px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  /* the chevron is painted at the left edge, so the extra room must be on the
     left too — padding-inline-start would put it on the right under RTL */
  padding-left:32px}
.fld{display:block;margin-bottom:12px}
.fld > span{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2);margin-bottom:5px}
.fld.chk{display:flex;align-items:center;gap:9px;cursor:pointer}
.fld.chk input{width:19px;height:19px;accent-color:var(--brand);flex:none;margin:0}
.fld.chk > span{margin:0;font-size:14px}
.f2{display:grid;gap:0 12px}
@media (min-width:520px){.f2{grid-template-columns:1fr 1fr}}

.btn{
  background:var(--brand);color:var(--brand-ink);border:1px solid transparent;
  border-radius:var(--radius-sm);padding:10px 16px;font-weight:700;font-size:14.5px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  white-space:nowrap
}
/* input + button on one line; the button keeps its width, the input gives way */
.addrow{display:flex;gap:6px;margin-top:10px}
.addrow .inp{min-width:0}
.addrow .btn{flex:none}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{background:var(--card-2)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.xs{padding:3px 9px;font-size:12px;border-radius:7px;font-weight:650}
.btn.block{width:100%}
.btn.icon{padding:8px 11px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* ==================================================================== fab */
.fab{
  position:fixed;inset-inline-end:18px;
  bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom));
  z-index:44;width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;
  background:var(--brand);color:var(--brand-ink);font-size:31px;line-height:1;
  box-shadow:0 6px 22px rgba(15,118,110,.42);display:grid;place-items:center;
  transition:transform .18s
}
.fab:active{transform:scale(.93)}
@media (min-width:900px){.fab{bottom:26px}}

/* ================================================================= sheets */
.veil{
  position:fixed;inset:0;z-index:60;background:rgba(10,20,30,.5);
  display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(2px)
}
.veil.open{display:flex}
@media (min-width:640px){.veil{align-items:center}}
.sheet{
  width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--card);
  border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);
  animation:up .22s cubic-bezier(.2,.8,.3,1);
  padding-bottom:env(safe-area-inset-bottom)
}
@media (min-width:640px){.sheet{border-radius:20px;animation:pop .18s ease-out}}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.sheet-hd{
  display:flex;align-items:center;gap:10px;padding:15px 18px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2;
  border-radius:20px 20px 0 0
}
.sheet-hd h3{font-size:16px;flex:1}
.sheet-hd .x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);
  cursor:pointer;padding:2px 6px;border-radius:8px}
.sheet-hd .x:hover{background:var(--line-2)}
.sheet-bd{padding:16px 18px}
.sheet-ft{padding:12px 18px 18px;display:flex;gap:9px}
.sheet-ft:empty{display:none}
.sheet-ft .btn{flex:1}

.chooser{padding:14px 18px 22px;display:grid;gap:10px}
.chooser button{
  display:flex;align-items:center;gap:13px;text-align:start;width:100%;cursor:pointer;
  background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  font-size:16px;font-weight:700
}
.chooser button:hover{border-color:var(--brand);background:var(--brand-soft)}
.chooser button .ic{font-size:24px}
.chooser button small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}

/* ============================================================ donorpicker */
.picker{position:relative}
.dp-chosen{
  display:flex;align-items:center;gap:9px;background:var(--brand-soft);color:var(--brand);
  border-radius:var(--radius-sm);padding:9px 12px;font-weight:700;font-size:14.5px
}
.dp-chosen button{margin-inline-start:auto;background:none;border:0;cursor:pointer;
  color:inherit;font-size:18px;line-height:1;opacity:.7}
.dp-results{
  border:1px solid var(--line);border-radius:var(--radius-sm);margin-top:6px;
  max-height:210px;overflow:auto;background:var(--card)
}
.dp-results button{
  display:block;width:100%;text-align:start;background:none;border:0;cursor:pointer;
  padding:9px 12px;border-bottom:1px solid var(--line-2);font-size:14px
}
.dp-results button:last-child{border-bottom:0}
.dp-results button:hover{background:var(--card-2)}
.dp-results button small{color:var(--muted);font-size:12px;margin-inline-start:6px}
.dp-results .mk{color:var(--brand);font-weight:700}
.dp-new{border:1px dashed var(--line);border-radius:var(--radius-sm);padding:12px;margin-top:8px;
  background:var(--card-2)}

/* ================================================================= kanban */
.kb{display:grid;gap:12px}
@media (min-width:760px){.kb{grid-template-columns:repeat(4,1fr);align-items:start}}
.kcol{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;min-height:110px;transition:border-color .15s,background .15s
}
.kcol.over{border-color:var(--brand);background:var(--brand-soft)}
.kcol > h3{font-size:13.5px;display:flex;align-items:center;gap:7px;margin-bottom:10px}
.kcol > h3 .dot{width:8px;height:8px;border-radius:50%;flex:none}
.kcol > h3 .cnt{margin-inline-start:auto;font-size:11.5px;color:var(--muted);
  background:var(--line-2);border-radius:99px;padding:1px 8px;font-weight:700}
.kcard{
  background:var(--card-2);border:1px solid var(--line);border-radius:12px;
  padding:11px;margin-bottom:9px;cursor:grab
}
.kcard.dragging{opacity:.4}
.kcard b{display:block;font-size:14px;font-weight:650;margin-bottom:6px}
.kcard .meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.kcard .ft{display:flex;gap:6px;align-items:center}
.kcard select{
  flex:1;font-size:12px;padding:4px 7px;border-radius:7px;border:1px solid var(--line);
  background:var(--card);min-width:0
}
.kcard .logdot{color:var(--brand);font-size:12px;font-weight:700}

/* ================================================================ filters */
.filters{display:grid;gap:9px;grid-template-columns:1fr 1fr}
@media (min-width:760px){.filters{grid-template-columns:repeat(5,1fr)}}
/* grid items default to min-width:auto, and a date input's intrinsic width is
   wider than the cell — without this the filter row overflows and misaligns */
.filters > *{min-width:0}
.filters .fld{margin:0}
.filters .inp{width:100%;min-width:0}


/* ================================================================= misc */
.kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted);min-width:82px;font-size:13px}
.kv b{font-weight:650}
.log{
  background:var(--card-2);border:1px solid var(--line-2);border-radius:var(--radius-sm);
  padding:11px;font-size:13px;white-space:pre-wrap;max-height:230px;overflow:auto;
  line-height:1.65;margin:0;font-family:inherit
}
.back{background:none;border:0;color:var(--brand);font-weight:700;cursor:pointer;
  padding:4px 0;margin-bottom:8px;font-size:14px}

/* ================================================================= toast */
#toasts{
  position:fixed;inset-inline:0;z-index:80;display:grid;gap:8px;justify-items:center;
  bottom:calc(var(--tab-h) + 88px + env(safe-area-inset-bottom));pointer-events:none;padding:0 14px
}
.toast{
  background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 20px;
  font-size:14px;font-weight:650;box-shadow:var(--shadow-lg);animation:up .2s;max-width:92vw
}
.toast.bad{background:var(--bad);color:#fff}
.toast.ok{background:var(--ok);color:#fff}

/* ================================================================ updater */
#updater{
  position:fixed;inset-inline:0;z-index:70;
  bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));
  display:none;justify-content:center;padding:10px 14px
}
#updater.show{display:flex}
#updater .in{
  background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 12px 11px 16px;
  display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-lg);
  font-size:14px;font-weight:650;max-width:520px;width:100%
}
#updater button{
  margin-inline-start:auto;background:var(--brand);color:var(--brand-ink);border:0;
  border-radius:9px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:13.5px;flex:none
}
@media (min-width:900px){#updater{bottom:16px}}

/* ================================================================ boot */
#boot{min-height:100dvh;display:grid;place-items:center;gap:12px;color:var(--muted)}

  { id: 'schar',   name: 'שכר לימוד',    pre: ['sl_'] },

function lsFmtBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + ' ב׳';
  if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
  return (n / (1024 * 1024)).toFixed(2) + ' MB';
}
function lsAppOf(key) {
  var k = String(key == null ? '' : key);
  for (var i = 0; i < LS_APPS.length; i++) {
    for (var j = 0; j < LS_APPS[i].pre.length; j++) {
      if (k.indexOf(LS_APPS[i].pre[j]) === 0) return LS_APPS[i];
    }

// UTF-16: שני בתים לתו, גם למפתח וגם לערך. הערכה, לא מדידה מדויקת — אבל
// עקבית, וזה מה שנדרש כדי להשוות מול הסף.
function lsEntryBytes(key, val) {
  return (String(key == null ? '' : key).length + String(val == null ? '' : val).length) * 2;
}

// מדידת **כל** המפתחות בדומיין, לא רק של האפליקציה הנוכחית — זה כל העניין:
// המכסה משותפת, ולכן אפליקציה שמסתכלת רק על עצמה לא רואה את מה שחונק אותה.
function lsUsage() {
  var out = { total: 0, quota: LS_QUOTA_BYTES, free: 0, pct: 0, apps: [], keys: [], ok: true };
  var byApp = {}, i;
  for (i = 0; i < LS_APPS.length; i++) byApp[LS_APPS[i].id] = { id: LS_APPS[i].id, name: LS_APPS[i].name, bytes: 0, count: 0 };
  byApp.other = { id: 'other', name: 'אחר', bytes: 0, count: 0 };
  try {
    for (i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k == null) continue;
      var v = '';
      try { v = localStorage.getItem(k) || ''; } catch (e) { }
      var b = lsEntryBytes(k, v), a = lsAppOf(k);
      out.total += b;
      out.keys.push({ key: k, bytes: b, app: a.id, appName: a.name });
      if (!byApp[a.id]) byApp[a.id] = { id: a.id, name: a.name, bytes: 0, count: 0 };
      byApp[a.id].bytes += b; byApp[a.id].count++;
    }
  } catch (e) { out.ok = false; }
  out.keys.sort(function (x, y) { return y.bytes - x.bytes; });
  Object.keys(byApp).forEach(function (id) { if (byApp[id].count) out.apps.push(byApp[id]); });
  out.apps.sort(function (x, y) { return y.bytes - x.bytes; });
  out.free = Math.max(0, out.quota - out.total);
  out.pct = out.quota ? out.total / out.quota : 0;

/* ── יומן הפינוי ────────────────────────────────────────────────────────
   הפינוי שקט כלפי המשתמש, אבל **לא בלתי נראה** — בלי יומן אי אפשר לדעת

   לצרכן מקום. הכתיבה כאן גולמית ולא דרך `lsSet` — אחרת כישלון ביומן היה

  catch (e) { return []; }

  try { console.info('[ls] ' + e.a + (e.d ? ' · ' + e.d : '') + (e.b ? ' · ' + lsFmtBytes(e.b) : '')); } catch (e1) { }
  try {
    var arr = lsLogRead();

/* ── כתיבה מוגנת ────────────────────────────────────────────────────────
   **כל כתיבה ל-localStorage באפליקציה עוברת דרך כאן.** אין קריאה ישירה
   ל-`localStorage.setItem` מחוץ למודול הזה (למעט `lsSetRaw` שבתוכו).
   מחזירה true/false — ומסלול קריטי שמתעלם מהערך המוחזר הוא באג. */
var _lsSweeping = false;

/* "אף כישלון שקט" — מונה כישלונות גלובלי.

   ⛔ שינוי כאן (סבב 65) — ארבע האפליקציות **וארבעת עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ══════════════════════════════════════════════════════════════════════ */
var BK_TABLE = 'kv_backup';       // יומן הגיבויים — הכתיבה היא insert בלבד
var BK_LOG_TABLE = 'sync_log';    // יומן הפעולות — insert בלבד
var BK_LOG_MAX = 50;              // תקרת התור המקומי של היומן
var BK_STALE_DAYS = 3;            // מעל זה — שורת התרעה ב«מידע טכני»
var BK_RETENTION_DAYS = 30;       // עותק יומי נשמר 30 יום; ישן מזה נגרע
var _bkRunning = false;           // נעילת ריצה (החליפה את הכתיבה-מראש)

function _bkVal(v) { return (typeof v === 'function') ? v() : v; }
function _bkCfg(name, dflt) {
  try {
    if (typeof BK_CFG === 'undefined' || BK_CFG[name] === undefined) return dflt;
    return _bkVal(BK_CFG[name]);
  } catch (e) { return dflt; }
}
function _bkClient() { try { return BK_CFG.client(); } catch (e) { return null; } }

// רשימת הסודות (`BK_CFG.secrets`) — מפתח או שדה שברשימה אינו נכתב לגיבוי
// לעולם; המנגנון נשאר דרוך גם כשהרשימה ריקה.
function _bkSecrets() {
  var s = _bkCfg('secrets', []);
  return Array.isArray(s) ? s : [];
}

function bkToday() { return new Date().toISOString().slice(0, 10); }

// חתימת תוכן לגיבוי הדיפרנציאלי — אורך + FNV-1a. אינה סוד ואינה אימות,
// רק "האם זה אותו ערך בדיוק".
function bkSig(s) {
  var str = String(s == null ? '' : s), h = 0x811c9dc5;
  for (var i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
  }
  return str.length + ':' + h.toString(16);
}

/* ── יומן הפעולות ──────────────────────────────────────────────────────── */
function _bkLogRow(action, key, count, details) {
  return {
    device_id: _bkCfg('device', null),
    user_name: _bkCfg('user', null),
    action: action,
    key: key || null,
    record_count: (count === undefined || count === null) ? null : count,
    details: details || null
  };
}
function _bkLogQueue(row) {
  try {
    var qk = _bkVal(BK_CFG.logQueueKey);
    var q = JSON.parse(lsGet(qk, '[]') || '[]');
    if (!Array.isArray(q)) q = [];
    q.push(row);
    if (q.length > BK_LOG_MAX) q = q.slice(-BK_LOG_MAX);
    lsSet(qk, JSON.stringify(q));
  } catch (e) { }
}
// רישום fire-and-forget. ⛔ לעולם אינו חוסם ואינו מפיל את המסלול שקרא לו
// (נרשם בסבב 6 בהנהלה) — תיעוד אבחון שמפיל כניסה או שמירה גרוע מהיעדרו.
function logAction(action, key, count, details) {
  var row = null;
  try {
    row = _bkLogRow(action, key, count, details);
    var c = _bkClient();
    if (!c) { _bkLogQueue(row); return; }
    c.from(BK_LOG_TABLE).insert(row).then(
      function (r) { if (r && r.error) _bkLogQueue(row); },
      function () { _bkLogQueue(row); }
    );
  } catch (e) { if (row) _bkLogQueue(row); }
}
// שליחת מה שהצטבר באופליין. נקראת כשיש ראיה שהרשת עובדת.
async function logFlush() {
  var qk, q;
  try { qk = _bkVal(BK_CFG.logQueueKey); q = JSON.parse(lsGet(qk, '[]') || '[]'); } catch (e) { return 0; }
  if (!Array.isArray(q) || !q.length) return 0;
  var c = _bkClient();
  if (!c) return 0;
  lsSet(qk, '[]');
  var failed = [], sent = 0;
  for (var i = 0; i < q.length; i++) {
    try {
      var r = await c.from(BK_LOG_TABLE).insert(q[i]);
      if (r && r.error) failed.push(q[i]); else sent++;
    } catch (e2) { failed.push(q[i]); }
  }
  if (failed.length) {
    try {
      var q2 = JSON.parse(lsGet(qk, '[]') || '[]');
      if (!Array.isArray(q2)) q2 = [];
      lsSet(qk, JSON.stringify(q2.concat(failed).slice(-BK_LOG_MAX)));
    } catch (e3) { }
  }
  return sent;
}

/* ── הגיבוי היומי ──────────────────────────────────────────────────────── */
// מחזירה true רק כשכל המקורות גובו (או דולגו כבלתי-משתנים) בהצלחה.
async function bkMaybeDaily() {
  if (_bkRunning) return false;
  var c = _bkClient();
  if (!c) return false;
  var flag = _bkCfg('flagKey', null);
  if (!flag) return false;
  var today = bkToday();
  if (lsGet(flag, '') === today) return false;
  var src = _bkCfg('sources', []) || [];
  if (!src.length) return false;
  _bkRunning = true;
  var ok = true, wrote = 0, same = 0, failed = [];
  try {
    var pre = _bkCfg('prefix', '') || '';
    var secrets = _bkSecrets(), dailyKeys = [];
    for (var i = 0; i < src.length; i++) {
      var s = src[i], val = null;
      // ⛔ מפתח שברשימת הסודות אינו נכתב לגיבוי לעולם (השלמת סבב 35) —
      //    admin_pass שרד בגיבויים אחרי שנמחק מהמקור, ונוקה ידנית (17.8).
      if (s.kind === 'kv' && secrets.indexOf(s.name) !== -1) continue;
      // ⭐ `key` פר-מקור (סבב 35) — מקור-טבלה שמפתחו היה מתנגש במקור
      //    ה-kv ההיסטורי באותו שם מקבל מפתח גיבוי משלו. הרשימה שנצברת
      //    כאן היא רשימת-ההיתר של הגריעה — בלי תלות בהצלחת המקור.
      var bkey = pre + (s.key || s.name);
      dailyKeys.push(bkey);
      /* ⭐ דגל-יום פר-מקור (סבב 62) — מקור שכבר גובה היום מדולג, גם
         כשהדגל הגלובלי לא נכתב. ⛔ בלעדיו מקור אחד שנכשל החזיק את כל
         השאר בלולאה: הדגל הגלובלי נכתב רק כשכולם הצליחו, ולכן כל עלייה
         גיבתה מחדש את מה שכבר גובה — נמדד ב-26.8, 66 גיבויים ביום.
         ⚠️ הדחיפה ל-`dailyKeys` קודמת לדילוג בכוונה: הרשימה היא
         רשימת-ההיתר של הגריעה, ומפתח שנופל ממנה אינו מתפנה לעולם. */
      var dayKey = 'bk_day_' + bkey;
      if (lsGet(dayKey, '') === today) { same++; continue; }
      if (s.kind === 'kv') {
        var res = await c.from(s.table).select('value').eq('key', s.name).maybeSingle();
        if (!res || res.error) { ok = false; failed.push(bkey); continue; }
        val = (res.data && res.data.value != null) ? String(res.data.value) : null;
      } else {
        // ⛔ `cols` ולא `*` בטבלאות שיש בהן סוד (סבב 30) — `kv_backup`
        //    קריאה ל-`anon`, וגיבוי גורף של טבלת משתמשים היה מעתיק לשם
        //    סיסמאות וטביעות. מי שאין לו סוד מגדיר `cols` ריק ומקבל `*`.
        var q = c.from(s.name).select(s.cols || '*');
        // ⭐ `eq`/`order` פר-מקור (סבב 35) — סינון פר-מוסד וסדר דטרמיניסטי,
        //    כדי שהחתימה הדיפרנציאלית לא תוטרד משינוי סדר-שורות אקראי.
        if (s.eq) q = q.eq(s.eq[0], s.eq[1]);
        if (s.order) q = q.order(s.order);
        var rt = await q;
        if (!rt || rt.error || !Array.isArray(rt.data)) { ok = false; failed.push(bkey); continue; }
        var rows = rt.data;
        // ⛔ שדה-סוד בשורות טבלה מסונן לפני הסריאליזציה (השלמת סבב 35) —
        //    שורה שמפתחה (`secretField`, ברירת מחדל `key`) ברשימת הסודות
        //    אינה מגיעה לגיבוי, גם כשהיא עדיין קיימת במקור.
        if (secrets.length) rows = rows.filter(function (r) {
          return secrets.indexOf(r && r[s.secretField || 'key']) === -1;
        });
        val = JSON.stringify(rows);
      }
      // מקור שאין לו ערך בענן — אין מה לגבות, וזה אינו כישלון.
      if (val == null) continue;
      var sig = bkSig(val), sigKey = 'bk_sig_' + bkey;
      if (lsGet(sigKey, '') === sig) { same++; continue; }
      var ins = await c.from(BK_TABLE).insert({ key: bkey, value: val });
      if (!ins || ins.error) { ok = false; failed.push(bkey); continue; }
      lsSet(sigKey, sig);
      lsSet(dayKey, today);
      wrote++;
    }
    /* ⭐ הגריעה אינה מותנית עוד בהצלחת **כל** המקורות (סבב 62) — היא רצה
       על רשימת-ההיתר המלאה בכל פעם שנכתב עותק חדש. ⛔ הכריכה הישנה היא
       ששיתקה אותה: מקור אחד שנכשל מנע גריעה של כל השאר, וזה שורש מצבור
       ה-503 השורות שנוקה ב-26.8. ⚠️ והיא עדיין רצה **אחרי** הכתיבה, כדי
       שלא ייגרע עותק ישן לפני שהחדש נכתב (השלמת סבב 35). */
    if (wrote) { try { await _bkRetention(c, dailyKeys); } catch (e2) { } }
    if (ok) {
      lsSet(flag, today);
      lsSet(_bkVal(BK_CFG.atKey), String(Date.now()));
      logAction('backup', null, wrote, { date: today, scope: pre || null, wrote: wrote, unchanged: same });
    } else {
      /* ⛔ בלי כתיבת הדגל הגלובלי — ההזדמנות הבאה באותו יום תנסה שוב
         (נרשם בסבב 6 בהנהלה): גיבוי שנכשל ודילג על יממה שלמה הוא בדיוק
         מה שהדגל שנכתב-מראש גרם. ⚠️ ומה שכן השתנה (סבב 62): המקורות
         שהצליחו נושאים דגל-יום משלהם ואינם נגבים שוב, ולכן הניסיון החוזר
         מכוון למי שנכשל בלבד. ⛔ וכשל חלקי מדווח ואינו נבלע — `failed`
         נושא את שמות המקורות, אחרת «נכשל» היה מספר בלי מען. */
      logAction('backup_fail', null, wrote, { date: today, scope: pre || null, wrote: wrote, unchanged: same, failed: failed });
      console.warn('[backup] מקורות שנכשלו: ' + (failed.join(', ') || '?') + ' — ייבחנו שוב בהזדמנות הבאה');
    }
  } catch (e) { ok = false; }
  _bkRunning = false;
  return ok;
}

/* ── מדיניות השמירה — גריעת עותקים יומיים ישנים מ-30 יום ──────────────── */
// ⛔ הגריעה מוגבלת ב-`in('key', keys)` לרשימת המפתחות היומיים של
//    האפליקציה הנוכחית בלבד (השלמת סבב 35) — רשימת-היתר, לא קידומת:
//    גיבויי `PRE_*` וגיבויים של אפליקציה אחרת אינם מועמדים כלל.
// ⚠️ נכשלת סגור: `error` (כולל היעדר הרשאת DELETE — סבב 29) מוחזר כאפס
//    בשקט, בלי להפיל את הגיבוי ובלי רישום-סרק יומי ליומן הראיות.
async function _bkRetention(c, keys) {
  if (!c || !Array.isArray(keys) || !keys.length) return 0;
  var cutoff = new Date(Date.now() - BK_RETENTION_DAYS * 86400000).toISOString();
  var del = await c.from(BK_TABLE)['delete']().in('key', keys).lt('created_at', cutoff).select('id');
  if (!del || del.error || !Array.isArray(del.data)) return 0;
  var n = del.data.length;
  if (n > 0) logAction('retention', null, n, { days: BK_RETENTION_DAYS, keys: keys.length });
  return n;
}

/* ── תצוגה: «גובה לאחרונה» בתוך «מידע טכני» ───────────────────────────── */
// ⛔ הרכיב נתלה **אחרי** הבלוק הקפוא ואינו עורך אותו (סבב 30) — «מידע
//    טכני» חתום ב-`check-status-area.mjs`, ועריכתו הייתה מחייבת שינוי
//    בארבעת הריפו ובחתימות עבור שורת תצוגה אחת.
function bkLastAt() {
  var v = parseInt(lsGet(_bkCfg('atKey', ''), '0'), 10);
  return isFinite(v) ? v : 0;
}
// ⚠️ מחזירה את מספר הימים רק כשהוא חצה את הסף, ו-0 אחרת — כדי שאתר
//    הקריאה יהיה `if (bkStale())` ולא השוואה שמשוכפלת בכל מקום.
//    מכשיר שטרם גיבה בכלל מחזיר 0: «— טרם גובה —» כבר אומר את זה, והתרעה
//    בנוסף לו הייתה רעש בעלייה הראשונה.
function bkStale() {
  var t = bkLastAt();
  if (!t) return 0;
  var d = Math.floor((Date.now() - t) / 86400000);
  return (d >= BK_STALE_DAYS) ? d : 0;
}
function bkStatusHTML() {
  var t = bkLastAt(), st = bkStale();
  return '<div class="sync-line bk-line"><div>גובה לאחרונה: <b>' +
    (t ? esc(syncFmtTime(t)) : '— טרם גובה —') + '</b></div>' +
    (st ? '<div class="bk-stale">⚠️ הגיבוי לא רץ ' + st + ' ימים</div>' : '') +
    '</div>';
}
function bkStatusMount() {
  var box = document.getElementById('tech-info-box');
  if (!box) return;
  var d = box.querySelector('details.tech-info');
  if (!d) return;
  var prev = d.querySelector('.bk-line');
  if (prev && prev.parentNode) prev.parentNode.removeChild(prev);
  var wrap = document.createElement('div');
  wrap.innerHTML = bkStatusHTML();
  var node = wrap.firstChild;
  if (node) d.appendChild(node);
}
window.bkStatusMount = bkStatusMount;

/* ── נקודת ההפעלה היחידה ─────────────────────────────────────────────── */
// ⛔ זו הקריאה היחידה שקוד האפליקציה עושה למודול (סבב 30, השלמה) — היא
//    יושבת בפונקציית העלייה, לצד `lsBoot()` ו-`pendBoot()`, ולעולם לא
//    במסלול דחיפה/סנכרון. ר' הנימוק המלא בכותרת הבלוק.
// ⚠️ שתי הקריאות אינן ב-`await` ואינן חוסמות: העלייה אינה ממתינה לרשת,
//    וכל כשל נבלע בשקט בתוך המודול.
function bkBoot() {
  try { bkMaybeDaily(); } catch (e) { }
  try { logFlush(); } catch (e) { }
}
window.bkBoot = bkBoot;
/* ═══════════════ סוף מודול הגיבוי היומי ═══════════════════════════════ */

/* ── PEND_CFG — הדבר היחיד שנבדל בין האפליקציות ─────────────────────────── */
// מאז שלב 3 אין כאן תור, ולכן אין `extra` — הסימונים הם מקור האמת היחיד,
// בדיוק כמו ב-schar-limud.
var PEND_CFG = {
  app: 'gius', key: 'g_pending',
  // השהיית ציור (סבב 16): בתום ההחזקה, תגית ⏳ שנותרה צריכה להיכנס לשורות
  // שכבר רונדרו בלעדיה. render() מצייר מחדש את המסך הנוכחי בלבד ושומר על
  // מיקום הגלילה ברינדור-במקום — בדיוק כמו אחרי כל שמירה.
  redraw: function () { try { render(); } catch (e) { } }
};

/* ═══ ממתין לסנכרון — מודול משותף (סבב 12) ═══════════════════════════════
   ⛔ ר' «אחד-עשר המודולים המשותפים» (`shared-modules-index`) ב-CLAUDE.md —
      שם יושבים השער שאוכף את החתימה, שורת המטריצה וכללי השינוי.
   ⛔ שינוי כאן (סבב 65) — ארבע האפליקציות **וארבעת עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ═══════════════════════════════════════════════════════════════════════ */
var PEND_LATE_MS = 24 * 60 * 60 * 1000;   // סף ההתרעה
var PEND_MAX = 800;                       // תקרת המפה — הגנה מפני צמיחה בלי גבול
var _pendMap = null;
var _pendAlertDismissed = 0;

/* ---------------------------------------------- השהיית ציור (סבב 16) ----
   באונליין תקין האישור מגיע תוך פחות משתי שניות מהסימון, והתגית והסרגל היו
   מהבהבים לשבריר שנייה על כל שמירה. לכן סימון שנוצר **הרגע** בכתיבה חדשה
   מקבל "החזקת ציור" בזיכרון: אם האישור הגיע בתוך PEND_DRAW_DELAY_MS —
   ה-⏳ לא מופיע כלל; אם לא — הוא מופיע וממשיך להתנהג בדיוק כמו היום.
   ⚠️ ההשהיה היא על ה**ציור בלבד**: הסימון הלוגי נכתב ל-localStorage מיידית
   (מנגנוני הבטיחות — פינוי, דחיפה, מיגרציות — נשענים עליו), מסך ההגדרות
   (pendStatusHTML) והמונים הלוגיים (pendCount/pendHas/pendSince) אינם
   מושהים לעולם, וההחזקה חיה **בזיכרון בלבד** — סימון שנטען מהדיסק בעליית
   האפליקציה (המכשיר נסגר בתוך שתי השניות) מצויר מיד. */
var PEND_DRAW_DELAY_MS = 2000;
var _pendDrawHold = {};     // key -> הרגע שממנו מותר לצייר (זיכרון בלבד, לא נשמר)

function pendHoldDraw(key, now) {
  _pendDrawHold[key] = (now || Date.now()) + PEND_DRAW_DELAY_MS;
}
// חותמת לציור: 0 כל עוד הסימון מוחזק. סימון בלי החזקה (נטען מהדיסק) — מיידי.
function pendDrawSince(key) {
  var t = pendSince(key);
  if (!t) return 0;
  var h = _pendDrawHold[key];
  if (h && Date.now() < h) return 0;
  if (h) delete _pendDrawHold[key];
  return t;
}
// כמה סימונים מותר לצייר עכשיו. משמש רק להחלטת "האם להציג את הסרגל" —
// המספר המוצג עצמו הוא תמיד pendCount() המלא.
function pendDrawCount() {
  var m = pendAll(), keys = Object.keys(m), n = 0, now = Date.now();
  for (var i = 0; i < keys.length; i++) {
    var h = _pendDrawHold[keys[i]];
    if (!h || now >= h) n++;
  }
  return n;
}
// בתום ההחזקה: הסימון עדיין קיים (לא אושר — אופליין/רשת איטית) ⇒ מציירים
// אותו עכשיו, כולל רינדור הרשימות דרך PEND_CFG.redraw (פר-אפליקציה).
// אושר בינתיים (המסלול המהיר הרגיל) ⇒ אין מה לצייר ואין רינדור מיותר.
function pendDrawFlush() {

// `PEND_CFG.key` יכולה להיות מחרוזת או פונקציה. yoman-avoda מחזיקה שני
// מוסדות באותו דומיין, וסימוני האחד אינם תקפים לשני — שם היא פונקציה.
function pendKeyName() {
  var k = (typeof PEND_CFG === 'object') ? PEND_CFG.key : null;
  if (typeof k === 'function') { try { k = k(); } catch (e) { k = null; } }
  return k || 'pending_sync';
}
// החלפת הקשר (מוסד/משתמש) — המפה נטענת מחדש מהמפתח החדש.
function pendReload() { _pendMap = null; _pendDrawHold = {}; pendAll(); pendRender(); }

function pendAll() {
  if (_pendMap) return _pendMap;
  var v = null;
  try { var raw = lsGet(pendKeyName(), null); v = raw == null ? null : JSON.parse(raw); }
  catch (e) { v = null; }
  _pendMap = (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
  // ניקוי ערכים פגומים — חותמת שאינה מספר חיובי אינה ראיה לכלום
  Object.keys(_pendMap).forEach(function (k) {
    var t = Number(_pendMap[k]);
    if (!isFinite(t) || t <= 0) delete _pendMap[k];

  return _pendMap;
}

// הכתיבה עוברת דרך lsSet (כלל ברזל 1). כישלון כאן אינו שקט: lsSet מרימה
// באנר ורושמת ליומן, ו-lsGuardToast יבלע כל "✅" בשתי השניות הבאות.
function pendSave() {
  var m = pendAll();
  var keys = Object.keys(m);
  if (keys.length > PEND_MAX) {
    // גריעה של הישנים ביותר. זו לא "מחיקת נתון שטרם הסתנכרן" — הרשומה עצמה
    // נשארת במקומה; רק הסימון שלה יורד. עדיין נרשם ליומן, כי סימון שנעלם
    // בלי אישור הוא בדיוק מה שהמודול בא למנוע.
    keys.sort(function (a, b) { return m[a] - m[b]; });
    var drop = keys.slice(0, keys.length - PEND_MAX);
    drop.forEach(function (k) { delete m[k]; });
    try { lsLog('pend-overflow', drop.length + ' סימונים נגרעו (תקרה ' + PEND_MAX + ')', 0); } catch (e) { }
  }

}

// סימון. חותמת קיימת **אינה נדרסת** — הגיל נמדד מהכתיבה הראשונה שלא אושרה,
// אחרת עריכה חוזרת של אותה רשומה הייתה מאפסת את שעון ההתרעה לנצח.

    m[key] = Date.now();

}
function pendMarkMany(keys) {
  if (!keys || !keys.length) return;
  var m = pendAll(), now = Date.now(), ch = false;
  for (var i = 0; i < keys.length; i++) {
    if (keys[i] && !m[keys[i]]) { m[keys[i]] = now; pendHoldDraw(keys[i], now); ch = true; }
  }

}

// אישור — יש ראיה שהענן קיבל.
function pendClear(key) {

}

  var m = pendAll(), ch = false;
  for (var i = 0; i < keys.length; i++) if (m[keys[i]]) { delete m[keys[i]]; delete _pendDrawHold[keys[i]]; ch = true; }
  if (ch) { pendSave(); pendRender(); }
}

// כשל סמכותי — הכתיבה **לא** נכנסה, ולכן הסימון יורד. ראה ההערה בראש המודול.
function pendFailed(key) { pendClear(key); }

// אישור דחיפת-מצב מלא: כל מה שסומן לפני `t0` נכלל בצילום שנדחף בהצלחה.
// `prefix` מגביל לקטגוריה אחת — דחיפה של מפתח אחד אינה מאשרת את השאר.
function pendConfirmPush(prefix, t0) {
  var m = pendAll(), ch = false;
  t0 = Number(t0) || 0;
  if (!t0) return;
  Object.keys(m).forEach(function (k) {
    if (prefix && k.indexOf(prefix) !== 0) return;
    if (m[k] < t0) { delete m[k]; delete _pendDrawHold[k]; ch = true; }
  });
  if (ch) { pendSave(); pendRender(); }
}

function pendHas(key) { return !!pendAll()[key]; }
function pendSince(key) { return pendAll()[key] || 0; }
function pendCount() { return Object.keys(pendAll()).length; }
function pendOldest() {
  var m = pendAll(), keys = Object.keys(m), t = 0;
  for (var i = 0; i < keys.length; i++) if (!t || m[keys[i]] < t) t = m[keys[i]];
  return t;

function pendReset() { _pendMap = {}; _pendDrawHold = {}; pendSave(); pendRender(); }

function pendFmtAge(ms) {
  if (!isFinite(ms) || ms < 0) ms = 0;
  var mi = Math.floor(ms / 60000);
  if (mi < 1) return 'פחות מדקה';
  if (mi < 60) return mi + ' דק׳';
  var h = Math.floor(mi / 60);
  if (h < 24) return h + ' שע׳';
  return Math.floor(h / 24) + ' ימים';
}

// התגית שנכנסת לשורת הרשומה. מחזירה מחרוזת ריקה כשאין מה להציג, כדי
// שאפשר יהיה לשרשר אותה ללא תנאי בכל תבנית.
function pendTag(key) {
  var t = pendDrawSince(key);   // השהיית ציור (סבב 16) — לא pendSince
  if (!t) return '';
  pendEnsureStyle();
  var age = Date.now() - t, late = age > PEND_LATE_MS;
  var title = 'ממתין לסנכרון מאז ' + new Date(t).toLocaleString('he-IL') +
              ' (' + pendFmtAge(age) + ') — שמור במכשיר, טרם אושר בענן';
  return '<span class="pend-tag' + (late ? ' late' : '') + '" title="' + esc(title) + '">' +
         (late ? '⚠️' : '⏳') + ' ממתין</span>';
}

function pendCounterText() {
  var n = pendCount(), off = (typeof navigator !== 'undefined' && navigator && navigator.onLine === false);
  // כל הסימונים עדיין מוחזקים (נוצרו הרגע) ⇒ הסרגל לא קופץ לשבריר שנייה.
  // כשהוא כן מוצג — n הוא האמת הלוגית המלאה, לא רק מה שמותר לצייר.
  if (!n || !pendDrawCount()) return off ? '⚠️ אין רשת' : '';
  var late = pendLateCount();
  var s = (late ? '⚠️ ' : (off ? '⚠️ אין רשת · ' : '⏳ ')) + n + ' פעולות ממתינות לסנכרון';
  var old = pendOldest();
  if (old) s += ' · הישנה ביותר לפני ' + pendFmtAge(Date.now() - old);
  return s;
}

function pendRender() {
  if (typeof document === 'undefined' || !document.body) return;
  pendEnsureStyle();
  var txt = pendCounterText(), bar = document.getElementById('pend-bar');
  if (!txt) { if (bar) bar.style.display = 'none'; }
  else {
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'pend-bar';
      document.body.appendChild(bar);
    }
    var extra = '';
    try { if (typeof PEND_CFG === 'object' && PEND_CFG.extra) extra = PEND_CFG.extra() || ''; } catch (e) { }
    bar.textContent = txt + (extra ? ' · ' + extra : '');
    bar.className = pendLateCount() ? 'late' : '';
    bar.style.display = '';
  }
  pendRenderAlert();
}

// ההתרעה נפרדת מהמונה בכוונה: מונה הוא מידע, וסרגל תחתון נבלע ברעש המסך.
// משהו שממתין מעל יממה כבר אינו "מסתנכרן ברקע" — זו תקלה שדורשת פעולה.
function pendRenderAlert() {
  var late = pendLateCount(), el = document.getElementById('pend-alert');
  if (!late || (_pendAlertDismissed && (Date.now() - _pendAlertDismissed) < 6 * 60 * 60 * 1000)) {
    if (el) el.remove();
    return;
  }
  var msg = '⚠️ ' + late + ' פעולות ממתינות לסנכרון מעל 24 שעות — בדוק חיבור לאינטרנט. הנתונים שמורים במכשיר בלבד.';
  if (el) { var sp = el.firstChild; if (sp) sp.textContent = msg; return; }
  el = document.createElement('div');
  el.id = 'pend-alert';
  var span = document.createElement('span');
  span.textContent = msg;
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'הבנתי';
  btn.onclick = function () { _pendAlertDismissed = Date.now(); pendRenderAlert(); };
  el.appendChild(span);
  el.appendChild(btn);
  document.body.appendChild(el);
}

// פאנל להגדרות — מה בדיוק ממתין, ומאיזה גיל.
function pendStatusHTML() {
  var m = pendAll(), keys = Object.keys(m);
  keys.sort(function (a, b) { return m[a] - m[b]; });
  var h = '<div style="font-size:13px;line-height:1.8">';
  h += '<div>מצב רשת: <b>' + (navigator.onLine ? 'מקוון' : 'לא מקוון') + '</b></div>';
  h += '<div>פעולות ממתינות לסנכרון: <b>' + keys.length + '</b></div>';
  if (!keys.length) { h += '<div style="color:#16a34a">✅ הכול מסונכרן</div></div>'; return h; }
  h += '<div style="margin-top:6px;max-height:220px;overflow:auto">';
  keys.slice(0, 60).forEach(function (k) {
    var age = Date.now() - m[k], late = age > PEND_LATE_MS;
    h += '<div style="display:flex;gap:8px;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,.08);padding:3px 0">' +
         '<span>' + esc(k) + '</span><span style="' + (late ? 'color:#b91c1c;font-weight:700' : 'opacity:.7') + '">' +
         esc(pendFmtAge(age)) + '</span></div>';
  });
  if (keys.length > 60) h += '<div style="opacity:.7">…ועוד ' + (keys.length - 60) + '</div>';
  h += '</div></div>';

// רענון תקופתי — הגיל מוצג בתגיות ובמונה, וסף ה-24 שעות חייב להיחצות
// גם כשהמשתמש לא נגע בכלום.
var _pendTick = null;
function pendBoot() {
  pendAll();
  pendRender();
  if (!_pendTick) _pendTick = setInterval(pendRender, 60000);
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('online', pendRender);
    window.addEventListener('offline', pendRender);

/* ═══ מזהי רשומות — מודול משותף (סבב 37א) ═════════════════════════════════
   ⛔ ר' «אחד-עשר המודולים המשותפים» (`shared-modules-index`) ב-CLAUDE.md —
      שם יושבים השער שאוכף את החתימה, שורת המטריצה וכללי השינוי.
   ⛔ שינוי כאן (סבב 65) — ארבע האפליקציות **וארבעת עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ═══════════════════════════════════════════════════════════════════════ */
function newClientId(){
  try{
    if(typeof crypto!=='undefined'&&crypto&&typeof crypto.randomUUID==='function')return crypto.randomUUID();
  }catch(e){}
  var b=null;
  try{
    if(typeof crypto!=='undefined'&&crypto&&typeof crypto.getRandomValues==='function'){
      b=new Uint8Array(16);crypto.getRandomValues(b);
    }
  }catch(e){b=null;}
  if(!b){b=new Array(16);for(var i=0;i<16;i++)b[i]=Math.floor(Math.random()*256);}
  b[6]=(b[6]&0x0f)|0x40;b[8]=(b[8]&0x3f)|0x80;  // גרסה 4, variant RFC 4122
  var h=[],j;for(j=0;j<16;j++)h.push((b[j]+0x100).toString(16).slice(1));
  return h.slice(0,4).join('')+'-'+h.slice(4,6).join('')+'-'+h.slice(6,8).join('')+'-'+h.slice(8,10).join('')+'-'+h.slice(10,16).join('');
}
// השוואת זהות — תמיד כמחרוזת. עובדת על מזהה ישן (מספר) ועל חדש (uuid)
// באותה מידה, ⛔ וגם על התאמה חוצת-סוגים שנוצרת כשמזהה עובר דרך מאפיין
// HTML וחוזר כמחרוזת (סבב 38).
function idEq(a, b) {
  if (a == null || b == null) return false;
  return String(a) === String(b);
}
// מזהה כארגומנט למאפיין `onclick`, וכבורר לאיתור האלמנט בחזרה.
// ⛔ **מצוטט תמיד** (סבב 38) — uuid בלי מרכאות הוא שם משתנה שאינו קיים,
// וכל כפתורי העריכה והמחיקה היו מתים.
// ⛔ והסינון הוא **רשימת-היתר של תווים** ולא בריחה (סבב 38): ערך המאפיין
//    עובר פענוח-ישויות לפני שהוא נקרא כ-JS, ולכן `&#39;` שנוצר ע"י `esc`

function idArg(v) {
  return "'" + String(v == null ? '' : v).replace(/[^A-Za-z0-9_-]/g, '') + "'";
}

/* ── RTY_CFG — הדבר היחיד שנבדל בין האפליקציות ──────────────────────────── */
/* ⚠️ בגיוס הריקון הוא `syncNow` — משיכה, מיזוג ודחיפת מה שמקומי-וחדש-יותר.

var RTY_CFG = {
  flush:   function () { return syncNow(); },
  pending: function () { try { return pendCount() > 0; } catch (e) { return false; } },
};
/* ═══ ניסיון חוזר בסנכרון — מודול משותף (סבב 44) ══════════════════════════
   ⛔ ר' «אחד-עשר המודולים המשותפים» (`shared-modules-index`) ב-CLAUDE.md —
      שם יושבים השער שאוכף את החתימה, שורת המטריצה וכללי השינוי.
   ⛔ שינוי כאן (סבב 65) — ארבע האפליקציות **וארבעת עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ═══════════════════════════════════════════════════════════════════════ */
var RTY_BASE_MS = 15000;   // המרווח הראשון אחרי כישלון
var RTY_MAX_MS  = 60000;   // תקרת הנסיגה — מעבר לה אין טעם להאט עוד

function _rtyPending() {
  try { return !!(typeof RTY_CFG !== 'undefined' && RTY_CFG && RTY_CFG.pending && RTY_CFG.pending()); }
  catch (e) { return false; }
}
function _rtyOnline() {
  try { return typeof navigator === 'undefined' || navigator.onLine !== false; } catch (e) { return true; }
}
function _rtyVisible() {
  try { return typeof document === 'undefined' || document.visibilityState !== 'hidden'; } catch (e) { return true; }
}

function rtyStop() { if (_rtyTimer) { clearTimeout(_rtyTimer); _rtyTimer = null; } }

function rtyArm() {
  if (_rtyTimer) return false;
  if (!_rtyPending()) return false;
  _rtyTimer = setTimeout(_rtyFire, _rtyDelay);
  return true;
}

function _rtyFire() {
  _rtyTimer = null;
  if (!_rtyPending()) { _rtyDelay = RTY_BASE_MS; return; }
  if (!_rtyOnline() || !_rtyVisible()) { rtyArm(); return; }
  rtyKick();
}

function rtyKick() {
  if (_rtyBusy) return Promise.resolve(false);
  if (!_rtyPending()) { rtyStop(); _rtyDelay = RTY_BASE_MS; return Promise.resolve(false); }
  if (!_rtyOnline() || !_rtyVisible()) { rtyArm(); return Promise.resolve(false); }
  _rtyBusy = true;
  rtyStop();
  var p;
  try { p = Promise.resolve(RTY_CFG.flush()); } catch (e) { p = Promise.reject(e); }
  var grow = function () { _rtyDelay = Math.min(_rtyDelay * 2, RTY_MAX_MS); };
  return p.then(function () { if (_rtyPending()) grow(); else _rtyDelay = RTY_BASE_MS; }, grow)
          .then(function () { _rtyBusy = false; rtyArm(); return true; });
}

function rtyNote() { _rtyDelay = RTY_BASE_MS; rtyArm(); }

function rtyBoot() {
  if (!_rtyWired) {
    _rtyWired = true;
    try {
      window.addEventListener('online', function () { _rtyDelay = RTY_BASE_MS; rtyKick(); });
      document.addEventListener('visibilitychange', function () {
        if (_rtyVisible()) { _rtyDelay = RTY_BASE_MS; rtyKick(); }
      });
    } catch (e) { console.warn('[rty] wiring', e); }
  }

    if (id == null) continue;

        typeof LS_CFG.pending === 'function' && LS_CFG.pending()) {
      try { lsLog('hw-skip', 'תור יוצא לא ריק'); } catch (e0) { }

// מסך העבר — קריאה בלבד. מחזיר מהענן את הרשומות החיות שמחוץ לחלון,
// מהחדשה לישנה, בלי לגעת בדיסק ובלי לגעת בזיכרון האפליקציה.
async function hwPastLoad(key, filter) {
  var spec = _hwSpecFor(key);

  var res = null;
  try { res = await spec.fetch(); } catch (e) { res = null; }

  if (m.soft) { if (full.deleted == null) full.deleted = false; if (full.deleted_at === undefined) full.deleted_at = null; }
  // ה-insert נשלח כ-upsert על המפתח הראשי: ניסיון חוזר אחרי תשובה שאבדה
  // ברשת לא ייכשל על מפתח כפול, ולכן ריקון התור אידמפוטנטי.
  var saved = upsertLocal(table, full);
  markLocal(table, full[m.key]);
  applyMirrorToState();
  return Promise.resolve(saved);
}

function update(table, id, patch) {
  var m = tableMeta(table);
  var p = Object.assign({}, patch, { updated_at: nowISO() });
  var row = Object.assign({}, p);
  row[m.key] = id;
  var saved = upsertLocal(table, row);
  markLocal(table, id);
  applyMirrorToState();
  return Promise.resolve(saved);
}

function softDelete(table, id) {
  return update(table, id, { deleted: true, deleted_at: nowISO() });
}

// upsert לפי עמודה שאינה המפתח הראשי (חודש ביעדים, key ברשימות).
function upsertBy(table, conflict, row) {
  var m = tableMeta(table);
  var full = Object.assign({}, row, { updated_at: nowISO() });
  var arr = MIRROR[table] || (MIRROR[table] = []);
  var cur = findRow(arr, conflict, full[conflict]);
  if (cur && cur[m.key] != null) full[m.key] = cur[m.key];
  else if (full[m.key] == null && m.key !== conflict) full[m.key] = newClientId();
  if (cur) Object.keys(full).forEach(function (k) { cur[k] = full[k]; });
  else arr.push(full);
  markLocal(table, full[m.key]);
  applyMirrorToState();
  return Promise.resolve(cur || full);
}

function saveConfigList(key, list) { return upsertBy('g_config', 'key', { key: key, value: list }); }

/* ─────────────────────────── כתיבת משתמשים — דורשת רשת (סבב 23) ──────────
   ⚠️ **באג שהתגלה בסבב 23 ותוקן כאן.** `g_users` אינה ב-`PUSH_TABLES`
   (ובצדק — דחיפת-מצב שלה הייתה כותבת סיסמאות ריקות, כי `password` מוסר
   מהמראה), אבל `saveUser`/`pass-save`/`user-toggle` קראו ל-`insert`/`update`
   **המקומיים**. התוצאה: משתמש שנוצר או סיסמה ששונתה **לא הגיעו לענן
   לעולם**, נשארו מסומנים ⏳ לנצח, ומכיוון ש-`mergeRows` נותנת לרשומה
   מסומנת לנצח את הניצחון — הם גם **הסתירו לצמיתות** את השורה האמיתית
   שבענן. התיעוד תמיד אמר «כתיבות משתמשים דורשות רשת»; מעכשיו הקוד באמת
   עושה זאת.

   הכתיבה היא ישירה ל-Supabase, ורק אחריה נכנסת למראה — **בלי `pendMark`**:
   מה שכבר בענן אינו ממתין לכלום. אין רשת ⇒ נכשל ברעש, ולא «נשמר». */
function writeUser(id, row) {
  if (!sb || !navigator.onLine) return Promise.reject(new Error(MSG_OFF_USER_WRITE));
  var body = Object.assign({}, row);
  body.updated_at = nowISO();
  if (id == null) {
    if (body.id == null) body.id = newClientId();
    if (!body.created_at) body.created_at = nowISO();
  } else {
    body.id = id;
  }
  // ⚠️ **`upsert` רק ליצירה, `update` לעריכה — ולא להחליף ביניהם.**
  // `username`/`password`/`full_name` הם `not null` (0001), ו-Postgres בודק
  // `NOT NULL` על השורה המועמדת **לפני** שהתנגשות המפתח מפעילה את
  // `ON CONFLICT`. כלומר `upsert` עם אובייקט חלקי — למשל שינוי סיסמה
  // שמכיל רק `password` — היה נופל על «null value violates not-null»
  // במקום לעדכן. היצירה כן משתמשת ב-`upsert`: השורה שם מלאה, וה-`id`
  // נוצר בצד הלקוח, ולכן ניסיון חוזר אחרי תשובה שאבדה ברשת אידמפוטנטי.
  function send(obj) {
    var q = (id == null)
      ? sb.from('g_users').upsert(obj, { onConflict: 'id' })
      : sb.from('g_users').update(obj).eq('id', id);
    return withTimeout(q.select())
      .then(function (res) { if (res && res.error) throw res.error; return res; });
  }
  return send(body)
    .catch(function (e) {
      // נפילה-חזרה לחלון שבין דחיפת הקוד להרצת `0003_pass_fp.sql`: בלי זה
      // **כל** שמירת משתמש הייתה נכשלת עד שהעמודות ייווצרו. המשתמש נשמר,
      // והכניסה האופליין שלו תיפתח כשתיווצר לו טביעה בשינוי הסיסמה הבא.
      if (!gIsMissingFpCol(e)) throw e;
      var b2 = Object.assign({}, body);
      delete b2.pass_salt; delete b2.pass_fp;
      return send(b2).then(function (r) { r._noFp = true; return r; });
    })
    .then(function (res) {
      // ⛔ סבב 26: דרך הנתיב החלקי של מראת המשתמשים, כלומר אותו
      //    `usersSanitize` — ולכן `password` אינו נכנס למראה גם כאן.
      //    **אין `markLocal`** — מה שכבר בענן אינו ממתין לכלום.
      var saved = (res && Array.isArray(res.data) && res.data[0]) || body;
      usersCacheSave(saved);
      applyMirrorToState();
      // ⭐ סבב 51 — `g_users` היא אחת משבע הטבלאות שנמשכות, ולכן גם כתיבה
      //    אליה חייבת לקדם את החותמת. ⛔ אחרת משתמש חדש (סבב 51) לא היה
      //    מגיע למכשיר אחר עד לשינוי נתונים אחר לגמרי.
      plTouch();
      // "ללא טביעה" משני מקורות: העמודות עדיין לא קיימות (`_noFp`), או
      // שהגזירה עצמה נכשלה ולכן `pass_fp` נכתב `null` לצד סיסמה חדשה.
      var noFp = !!(res && res._noFp) ||
        (body.password != null && Object.prototype.hasOwnProperty.call(body, 'pass_fp') && !body.pass_fp);
      return { noFp: noFp };
    });
}

// גוזרת טביעה לסיסמה חדשה ומחזירה את שדות הכתיבה.
// ⛔ **כישלון גזירה מאפס את שני השדות ולא רק מדלג על הכתיבה** (סבב 23) — טביעה ישנה
//    שנשארת הייתה ממשיכה לפתוח את הכניסה האופליין עם הסיסמה **הקודמת**,
//    לנצח — כלומר שינוי סיסמה שאינו משנה כלום מבחינת מי שמחזיק את המכשיר.
/* ⛔ נתיב-החזרה של הסיסמה הגלויה (סבב 40) — `g_users.password` היא
   `NOT NULL` במסד, ולכן קוד שיפסיק לכתוב אליה **לפני** שהמיגרציה רצה
   יפיל כל יצירת משתמש. הדגל הוא אותו דפוס בדיוק כמו דגלי נתיב-החזרה
   ביומן: כל עוד הוא `true` העמודה עדיין נכתבת, וכיבויו הוא הצעד שאחרי
   `migrations/0007`. ⛔ **האימות כבר אינו נשען עליה בשום מסלול** — היא
   נכתבת ואינה נקראת, וזה מה שהופך את המחיקה לבטוחה. */
var G_PLAINTEXT_LEGACY_WRITE = true;

function passFields(pass) {
  return gMakePassFp(pass).then(function (made) {
    var out = made ? { pass_salt: made.salt, pass_fp: made.fp }
                   : { pass_salt: null, pass_fp: null };
    if (G_PLAINTEXT_LEGACY_WRITE) out.password = pass;
    return out;
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   דחיפת-מצב (סבב 12 שלב 3) — מה שמקומי-וחדש-יותר עולה לענן
   ══════════════════════════════════════════════════════════════════════════
   התור היוצא הוחלף בדחיפת-מצב, השיטה המוכחת בשלוש האחיות. היא פשוטה יותר
   וחסינה יותר: **אין פריט שיכול "להיתקע" לבדו.** בתור, פעולה אחת שנכשלה
   כשל תוכן חסמה את כל מה שאחריה (FIFO) או הפכה ל-`dead` ונשארה תלויה;
   בדחיפת-מצב כל רשומה עומדת בפני עצמה, וכל סנכרון מתקן את מה שחסר.
   ══════════════════════════════════════════════════════════════════════════ */
// ⛔ `g_users` **אינה נדחפת לעולם** (סבב 12 שלב 3) — המראה מסירה ממנה את `password`
//    (`strip`), ודחיפת-מצב שלה הייתה כותבת סיסמאות ריקות לכל המשתמשים.
//    כתיבות משתמשים דורשות רשת — ר' `writeUser` והפרק ב-CLAUDE.md.
var PUSH_TABLES = ['g_donors', 'g_pledges', 'g_txns', 'g_tasks', 'g_targets', 'g_config'];

function rowPendingKey(t, row) { return pendRowKey(t, row[tableMeta(t).key]); }

// מה צריך לעלות: אין מקבילה בענן, מקומי חדש יותר, **או עדיין מסומן ⏳**.
// הסעיף השלישי אינו ייתור — ר' ההערה ב-mergeRows על הטריגר שדורס updated_at.
function dirtyRows(t, remoteByKey) {
  var m = tableMeta(t);
  return (MIRROR[t] || []).filter(function (l) {
    var k = String(l[m.key]);
    if (k === 'undefined' || k === 'null') return false;
    var r = remoteByKey[k];
    return !r || rowTs(l) > rowTs(r) || pendHas(pendRowKey(t, l[m.key]));
  });
}

function pushRow(t, row) {
  var m = tableMeta(t);
  return withTimeout(sb.from(t).upsert(row, { onConflict: m.conflict || m.key }))
    .then(function (res) { if (res && res.error) throw res.error; return true; });
}

// דוחפת טבלה אחת. כישלון ברשומה אחת אינו עוצר את השאר: אין כאן תלות סדר
// בין רשומות של אותה טבלה, והסדר בין הטבלאות (תורמים לפני התחייבויות
// ותנועות) נשמר ע"י סדר `PUSH_TABLES` — הוא מה ששומר על המפתח הזר.
function pushTable(t, remoteByKey) {
  var rows = dirtyRows(t, remoteByKey);
  if (!rows.length) return Promise.resolve([]);
  // ⭐ סבב 51 — «באמת נכתב משהו לענן» נמדד כאן: שורה שנדחפה בהצלחה מקדמת
  //    את החותמת. ⛔ בלי הקידום (סבב 51) הדחיפה נשארת בלתי-נראית לכל
  //    מכשיר אחר לנצח — הם מושכים רק כשהיא מתקדמת.
  var wrote = false;
  var still = [], i = 0;
  function step() {
    if (i >= rows.length) return Promise.resolve(still);
    var row = rows[i++], pk = rowPendingKey(t, row);
    return pushRow(t, row).then(function () {
      pendClear(pk);
      wrote = true;
      return step();
    }, function (e) {
      // כשל רשת אינו ראיה לכלום ⇒ נשאר מסומן וננסה שוב. כשל סמכותי
      // (ולידציה, מפתח זר, הרשאה) יחזור על עצמו לנצח, ולכן הסימון יורד
      // כדי לא להבטיח שליחה חוזרת שלא תקרה.
      console.warn('[push] ' + t, e && (e.message || e));
      if (isNetErr(e)) still.push(pk); else pendFailed(pk);
      return step();
    });
  }
  return step().then(function (res) { if (wrote) plTouch(); return res; });
}

function pushDirty(remote) {
  if (!sb || !navigator.onLine) return Promise.resolve([]);
  var acc = [], i = 0;
  function step() {
    if (i >= PUSH_TABLES.length) return Promise.resolve(acc);
    var t = PUSH_TABLES[i++];
    return pushTable(t, remote[t] || {}).then(function (still) {
      acc = acc.concat(still);
      return step();
    });
  }
  return step();
}

/* ── ניקוי חד-פעמי של סימוני ⏳ על `g_users` (סבב 23) ──────────────────────
   ⚠️ **סימונים שלא ניתן לקיים אינם "בטוחים" — הם מזיקים.** עד סבב 23
   `saveUser`/`pass-save`/`user-toggle` קראו ל-`insert`/`update` המקומיים
   וסימנו ⏳, אבל `g_users` אינה ב-`PUSH_TABLES` — כלומר הסימון הבטיח
   שליחה חוזרת **שלא תקרה לעולם**. גרוע מזה: `mergeRows` נותנת לרשומה
   מסומנת לנצח את הניצחון במיזוג, ולכן הרשומה המקומית הייתה **מסתירה
   לצמיתות** את השורה האמיתית שבענן — כולל את הטביעה שסבב 23 מביא.

   הניקוי נכון ולא מאבד נתון: הכתיבות ההן אכן לא הגיעו לענן, ומעכשיו
   `writeUser` הוא המסלול היחיד והוא דורש רשת. המשיכה הראשונה אחרי
   הניקוי מחזירה את מצב הענן. הפעולה נרשמת ביומן — סימון שנעלם בשקט הוא
   בדיוק מה שמודול ה-⏳ בא למנוע. */
function migrateUserPend() {
  var m, keys = [];
  try { m = pendAll(); } catch (e) { return 0; }
  Object.keys(m || {}).forEach(function (k) {
    if (k.indexOf('g_users:') === 0) keys.push(k);
  });
  if (!keys.length) return 0;
  pendClearMany(keys);
  try { lsLog('users-pend-clear', keys.length + ' סימוני ⏳ על משתמשים נוקו — כתיבת משתמש דורשת רשת', 0); } catch (e) { }
  console.warn('[users] נוקו ' + keys.length + ' סימוני ⏳ שלא היה מי שידחוף');
  return keys.length;
}

/* ------------------------------------------------------------- משיכה */
// מחזירה `{ok, remote}` — `remote` היא מפת הענן פר-טבלה, והיא מה שמאפשר
// לדחיפה שאחריה לדעת מה מקומי-וחדש-יותר.
function syncPull() {
  if (_pulling || !sb) return Promise.resolve({ ok: false, remote: {} });
  _pulling = true;
  var remoteMaps = {};
  return Promise.all(TABLES.map(function (m) {
    // ⚠️ בלי `.eq('deleted', false)` — חייבים גם את ה-tombstones, אחרת מחיקה
    //    שנעשתה במכשיר אחר לא תגיע לכאן לעולם. הסינון ב-`liveRows()`.
    return withTimeout(sb.from(m.t).select('*'))
      .then(function (res) { return { m: m, res: res }; },
            function (e) { return { m: m, res: { error: e } }; });
  })).then(function (list) {
    var errs = [];
    list.forEach(function (x) {
      if (!x.res || x.res.error || !Array.isArray(x.res.data)) { errs.push(x.m.t); return; }
      var rows = stripRows(x.m.t, x.res.data);
      hwNoteCloud(MIRROR_PREFIX + x.m.t, rows);   // ראיה עננית לשער הדיסק (סבב 35)
      var map = {};
      rows.forEach(function (r) { map[String(r[x.m.key])] = r; });
      remoteMaps[x.m.t] = map;
      var merged = mergeRows(MIRROR[x.m.t], rows, x.m.key,
        function (k) { return pendHas(pendRowKey(x.m.t, k)); });
      // סבב 26: מראת המשתמשים נשמרת דרך **הנתיב המלא** של המודול שלה,
      // אותו מסנן בדיוק שמשמש את הנתיב החלקי. ר' `usersSanitize`.
      if (x.m.t === 'g_users') usersCacheSaveAll(merged);
      else { MIRROR[x.m.t] = merged; mirrorSave(x.m.t); }
    });
    applyMirrorToState();
    if (!errs.length) {
      _lastPullOk = Date.now();
      // ⛔ הגיבוי היומי **אינו** נתלה כאן (סבב 30, השלמה) — הניסוח הראשון
      //    תלה אותו במשיכה מלאה שהצליחה, כלומר בפעילות סנכרון. נקודת
      //    ההפעלה היא `bkBoot()` ב-`start()`. ⚠️ ריקון תור היומן כן נשאר:
      //    הוא ריקון חוזר, וכאן יש ראיה טרייה שהרשת עובדת.
      try { logFlush(); } catch (eB) { }
      // עֵד הפינוי: כל מה שגילו קטן מהמשיכה המלאה המוצלחת האחרונה, **וכשהתור
      // ריק**, כבר נמצא בענן. שני התנאים נבדקים ב-LS_CFG.
      lsSet(SYNCED_KEY, String(_lastPullOk));
      if (_netWarned) { _netWarned = false; toast(MSG_SYNC_BACK, 'ok'); }
    } else {
      console.warn('[sync] נכשלו:', errs.join(', '));
      if (!_netWarned) {
        _netWarned = true;
        toast('⚠️ טעינת הנתונים נכשלה (' + errs.join(', ') + ') — המוצג עלול להיות לא מעודכן', 'bad');
      }
    }
    return { ok: !errs.length, remote: remoteMaps };
  }).catch(function (e) {
    console.warn('[sync]', e);
    return { ok: false, remote: {} };
  }).then(function (r) { _pulling = false; syncBarRender(); return r; });
}

// ⚠️ **משיכה קודמת לדחיפה** — הפוך מהסדר של התור. בדחיפת-מצב אי אפשר לדעת
// מה "מקומי וחדש יותר" בלי לראות קודם מה יש בענן, ודחיפה עיוורת הייתה
// מחזירה לחיים רשומה שנמחקה במכשיר אחר. `t0` נלקח לפני המשיכה: רשומה
// שנכתבה תוך כדי הסנכרון לא נבדקה ולא נדחפה, ולכן הסימון שלה חייב להישאר.
function syncNow() {
  var t0 = Date.now();
  return syncPull().then(function (res) {
    if (!res.ok) { render(); return false; }
    return pushDirty(res.remote).then(function (still) {
      pendReconcile(still, t0);
      render();
      return true;
    });
  });
}
// הסימונים מחושבים מחדש **רק אחרי משיכה שהצליחה**: זו ראיה ישירה ולא הסקה.
// מה שנכתב אחרי `t0` לא נבדק מול הענן ולכן אינו מנוקה.
function pendReconcile(still, t0) {
  var want = {};
  (still || []).forEach(function (k) { want[k] = 1; });
  pendMarkMany(Object.keys(want));
  var m = pendAll(), gone = [];
  Object.keys(m).forEach(function (k) { if (!want[k] && m[k] < t0) gone.push(k); });
  pendClearMany(gone);
}
function schedulePush() {
  // ⚠️ משפך הכתיבה המקומית היחיד כאן, ולכן זו נקודת הדריכה היחידה של
  //    מודול הניסיון החוזר (סבב 44).
  rtyNote();
  if (_flushTimer) return;
  _flushTimer = setTimeout(function () { _flushTimer = null; syncNow(); }, 400);
}
// ⛔ **אין כאן יותר פולינג שדוחף ואין משיכה מלאה תקופתית** (סבב 51) — עד
//    כאן רץ `setInterval` שמשך את שבע הטבלאות כל עשרים שניות ודחף בכל
//    פעם שהיה משהו ממתין, בלי שום ראיה שמשהו בענן השתנה.
//    מה שמכסה את זה במלואו: הדחיפה **מונעת-האירוע** (`schedulePush()`
//    אחרי כל כתיבה מקומית, ו-`online` כאן), מודול הניסיון החוזר של
//    סבב 44 שנדרך מ-`rtyNote()` ורץ רק כשהתור אינו ריק, והמשיכה
//    המותנית של `plBoot()` — שקוראת שורה אחת ומושכת רק כשהיא התקדמה.
function startSync() {
  if (_syncWired) return;
  _syncWired = true;
  window.addEventListener('online', function () { syncNow(); });
}

// המשתמש חייב לדעת שהוא עובד ללא רשת ושיש פעולות שממתינות — אחרת "נשמר"
// נראה בדיוק כמו "נשמר בענן", וזו בדיוק ההטעיה שהסבב הזה בא למנוע.

/* ══════════════════════════════════════════════════════════════════════════
   נגזרות — כל חישובי הכסף, בזמן ריצה בלבד
   ══════════════════════════════════════════════════════════════════════════
   ⛔ **אין כאן שום סכום שמור, ואין להוסיף.** «נגבה», «נותר» וסטטוס
   התחייבות מחושבים בכל קריאה מ-`state.txns` (נרשם בסבב 27) — אין עמודות `collected` /
   `balance` / `status` בסכימה (כלל ברזל 6 ב-CLAUDE.md). סכום שמור נשמר
   ברגע אחד ומתיישן בכל תנועה שנרשמה במכשיר אחר; החישוב בזמן ריצה תמיד
   מסכים עם הנתונים שעל המסך.
   ══════════════════════════════════════════════════════════════════════════ */
function donorById(id) {
  for (var i = 0; i < state.donors.length; i++) if (state.donors[i].id === id) return state.donors[i];
  return null;
}
// תורם שאינו במצב החי — נמחק רכות, או טרם הגיע במשיכה. מציגים מציין מקום
// ולא מחרוזת ריקה: שורת תנועה בלי שם נראית כמו באג תצוגה, ומסתירה את העובדה
// שהכסף עדיין רשום ומחושב.
function donorName(id) { var d = donorById(id); return d ? d.name : '— תורם שנמחק —'; }
function pledgeById(id) {
  for (var i = 0; i < state.pledges.length; i++) if (state.pledges[i].id === id) return state.pledges[i];
  return null;
}
function txnsOfDonor(id) { return state.txns.filter(function (t) { return t.donor_id === id; }); }
function pledgesOfDonor(id) { return state.pledges.filter(function (p) { return p.donor_id === id; }); }
function collectedForPledge(pid) {
  return sum(state.txns.filter(function (t) { return t.pledge_id === pid; }), function (t) { return t.amount; });
}
// ⚠️ **`EPS` אינו קישוט.** הסכומים הם `numeric(14,2)` שחוזרים כ-float, וסכום
// של כמה תנועות מצטבר לשגיאת ייצוג זעירה. בלי הסבילות, התחייבות שנגבתה
// במלואה הייתה מוצגת «חלקי» בהפרש של אגורה שאינו קיים בכסף עצמו.
function pledgeStatus(p) {
  var c = collectedForPledge(p.id);
  if (c <= EPS) return 'לא בוצע';
  if (c + EPS < num(p.amount)) return 'חלקי';
  return 'בוצע';
}
function statusClass(s) { return s === 'בוצע' ? 'ok' : s === 'חלקי' ? 'warn' : ''; }
function monthTxns(m) { return state.txns.filter(function (t) { return monthOf(t.txn_date) === m; }); }
function targetFor(m) {
  for (var i = 0; i < state.targets.length; i++) if (state.targets[i].month === m) return num(state.targets[i].amount);
  return 0;
}
// ⚠️ **השגריר/המנהל/האחראי הם טקסט חופשי, לא מפתח זר** — הקישור לרשומות
// הוא `g_users.full_name` (ר' «מבנה הנתונים» ב-CLAUDE.md). לכן הרשימה נבנית
// מהמשתמשים **ומהערכים שכבר נרשמו בפועל**: שינוי שם מלא של משתמש אינו
// משנה רשומות היסטוריות, והשם הישן חייב להישאר בורר כדי שלא ייעלם ממנו.
function agentPool() {
  return uniqSorted(
    state.users.map(function (u) { return u.full_name; })
      .concat(state.donors.map(function (d) { return d.agent; }))
      .concat(state.pledges.map(function (p) { return p.agent; }))
      .concat(state.txns.map(function (t) { return t.agent; }))
  );
}
function isOwner() { return state.user && state.user.role === 'owner'; }

function toast(msg, kind) {

function openModal(title, body, foot) {

// אישור כ-Promise: המודאל אינו חוסם, ולכן הפעולה שאחריו חייבת להמתין לו.
// ⚠️ `askResolve` יחיד — אין תמיכה בשני דיאלוגי אישור פתוחים בו-זמנית, וגם
// אין בכך צורך: `#ask` הוא אלמנט יחיד ב-DOM.
var askResolve = null;
function ask(title, text, yesLabel) {
  $('#ask-title').textContent = title;
  $('#ask-body').innerHTML = '<p style="margin:0;color:var(--ink-2)">' + esc(text) + '</p>';

}
function closeAsk(v) {

// ⛔ גם ה-`value` וגם הטקסט עוברים `esc` (נרשם בסבב 27) — ערכי הרשימות (`g_config`) נקבעים
//    ע"י המשתמש במסך ההגדרות, ולכן הם נתוני משתמש לכל דבר.

function datalistHTML(id, options) {

function busy(btn, on) {
  if (!btn) return;
  btn.disabled = !!on;
